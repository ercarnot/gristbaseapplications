<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wargame – Communication de crise</title>
<style>
:root{--bleu:#000091;--bleu2:#1212ff;--rouge:#e1000f;--gris:#f3f4f8;--bord:#d9dbe6;--txt:#161616;--ok:#18753c;--warn:#b34000;--ko:#ce0500}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif;color:var(--txt);background:var(--gris)}
header.hd{background:var(--bleu);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:4px solid var(--rouge)}
.brand{display:flex;align-items:center;gap:12px}
.brand .bar{width:6px;height:38px;background:linear-gradient(var(--bleu2),#fff,var(--rouge))}
.brand small{opacity:.8;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
h1{margin:0;font-size:19px}
h2{font-size:17px;margin:0 0 8px;color:var(--bleu)}
h3{font-size:15px;margin:14px 0 6px}
h4{margin:2px 0 4px;font-size:15px}
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:10px 20px 0;background:#fff;border-bottom:1px solid var(--bord);flex-wrap:wrap}
.tab{border:1px solid var(--bord);border-bottom:none;background:var(--gris);padding:8px 16px;cursor:pointer;font-weight:600;border-radius:6px 6px 0 0;color:#444}
.tab.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:14px;margin-bottom:14px}
.card.sel{border:2px solid var(--bleu);box-shadow:0 0 0 3px #dfe0ff}
.card.inj{border-left:6px solid var(--bleu)}
.card.inj.g2{border-left-color:#e08a00}.card.inj.g3{border-left-color:var(--rouge)}
.card.inj.done{opacity:.72;border-left-color:var(--ok)}
.card.sit{border-left:6px solid var(--bleu)}
.card.sit.old{opacity:.7;padding:8px 14px}
.meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#555;flex-wrap:wrap;margin-bottom:2px}
.tag{background:#e8edff;color:var(--bleu);border-radius:4px;padding:1px 8px;font-weight:600;font-size:12px}
.chip{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12.5px;font-weight:700;background:#fff3;color:#fff}
.chip.warn{background:#ffd;color:var(--warn)}
.cd,.tcd,.chr{font-variant-numeric:tabular-nums;font-weight:700}
.cd.late{color:var(--ko)}
.ok{color:var(--ok);font-weight:700}
.tache{background:#f5f5ff;border-radius:6px;padding:6px 10px;margin:8px 0;font-size:14px}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;padding:8px;border:1px solid #888;border-radius:6px;background:#fff}
textarea{min-height:110px;resize:vertical}
button.btn{background:var(--bleu);color:#fff;border:none;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.btn:hover{background:var(--bleu2)}
button.btn.sec{background:#fff;color:var(--bleu);border:1px solid var(--bleu)}
button.btn.red{background:var(--rouge)}
button.btn.small{padding:4px 10px;font-size:13px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.row .grow{flex:1 1 200px}
.gauge{background:#e6e6ee;border-radius:8px;height:18px;overflow:hidden;margin:4px 0}
.gauge i{display:block;height:100%;background:var(--ok);transition:width .4s}
.gauge.t i{background:#e08a00}.gauge.s i{background:var(--rouge)}
.dice{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.die{background:#fff;border:2px solid var(--bleu);border-radius:10px;padding:8px 14px;text-align:center;min-width:150px}
.die b{display:block;font-size:34px;line-height:1.1;color:var(--bleu)}
.die span{font-size:12.5px;color:#444}
.alert{background:#fff0f0;border:1px solid var(--rouge);border-left:6px solid var(--rouge);padding:10px 12px;border-radius:6px;margin-bottom:12px}
.info{background:#eef;border-left:6px solid var(--bleu);padding:10px 12px;border-radius:6px;margin-bottom:12px}
.ligne{background:#effaf2;border:1px solid #9bd3ac;border-left:6px solid var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--bord);padding:6px 8px;text-align:left;vertical-align:top}
.rate button{margin-right:4px}
.rate .on.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.rate .on.midb{background:#e08a00;color:#fff;border-color:#e08a00}
.rate .on.kob{background:var(--ko);color:#fff;border-color:var(--ko)}
.tl li{margin:3px 0;font-size:14px}
.tl .alerte{color:var(--ko);font-weight:600}
.banner{background:var(--rouge);color:#fff;text-align:center;font-weight:700;letter-spacing:.15em;font-size:12px;padding:2px}
.muted{color:#666;font-size:13px}
.big{font-size:20px;font-weight:700}
.tab .badge{background:var(--rouge);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.tab.on .badge{background:#fff;color:var(--rouge)}
.ptabs{padding:0;background:none;margin-bottom:14px;border-bottom:1px solid var(--bord)}
.strip{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.strip .g{flex:1 1 220px}
.foot{position:fixed;left:10px;bottom:6px;font-size:12px;color:#555;background:#fffd;padding:2px 8px;border-radius:6px;z-index:800}
.foot a{color:var(--bleu);cursor:pointer;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(10,10,60,.62);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:12px;max-width:640px;width:100%;border-top:10px solid var(--rouge);padding:22px 26px;box-shadow:0 20px 60px #0008;animation:pop .25s}
.modal .box.g1{border-top-color:var(--bleu)}.modal .box.g2{border-top-color:#e08a00}
.modal .box h2{font-size:22px;color:var(--rouge);margin:4px 0 8px}
.modal .box.g1 h2{color:var(--bleu)}.modal .box.g2 h2{color:var(--warn)}
.modal .q{font-size:12px;color:#666}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.chatw{position:fixed;right:14px;bottom:14px;z-index:900;width:340px;max-width:calc(100vw - 28px)}
.chatw .tg{width:100%;background:var(--bleu);color:#fff;border:none;border-radius:10px 10px 0 0;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;text-align:left;display:flex;justify-content:space-between}
.chatw.closed .tg{border-radius:10px}
.chatw .badge{background:var(--rouge);color:#fff;border-radius:12px;padding:0 9px;font-size:13px}
.chatw .body{background:#fff;border:1px solid var(--bord);border-top:none;padding:8px}
.chatw .msgs{height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.msg{background:#eef;border-radius:8px;padding:5px 9px;font-size:14px;max-width:92%;align-self:flex-start}
.msg.me{background:#dff3e4;align-self:flex-end}
.msg small{display:block;color:#555;font-size:11.5px}
.chatw textarea{min-height:44px;margin-top:6px}
@media print{
 .chatw,.modal{display:none!important}
 .tabs,header.hd,button,.noprint{display:none!important}
 body{background:#fff}.card{break-inside:avoid;border:1px solid #bbb}
}
</style>
</head>

let GRIST=false;const GM={},gpend={},gwrote={};let gRows={},gtimer=null,gbusy=false,JR=[],gErr='';
function locget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function locset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lraw(k){if(GRIST)return GM[k]||'';return locget(k)}
function lget(k,d){const r=lraw(k);try{return r?JSON.parse(r):d}catch(e){return d}}
function lset(k,v){const s=JSON.stringify(v);if(GRIST){GM[k]=s;gqueue(k,s)}else locset(k,s)}
function gqueue(k,s){gwrote[k]=Date.now();gpend[k]=s;if(!gtimer)gtimer=setTimeout(gflush,350)}
function gerr(e){gErr=(e&&e.message)||String(e);console.error(e)}
async function gflush(){
 gtimer=null;
 if(gbusy){gtimer=setTimeout(gflush,300);return}
 gbusy=true;
 try{
  const keys=Object.keys(gpend),acts=[];
  keys.forEach(k=>{const v=gpend[k];delete gpend[k];
   if(gRows[k])acts.push(['UpdateRecord','WG_Kv',gRows[k].id,{Valeur:v,Maj:gwrote[k]}]);
   else acts.push(['AddRecord','WG_Kv',null,{Cle:k,Valeur:v,Maj:gwrote[k]}])});
  if(acts.length)await grist.docApi.applyUserActions(acts);
  if(keys.some(k=>!gRows[k]))await gfetch();
  gErr='';
 }catch(e){gerr(e)}
 finally{gbusy=false;if(Object.keys(gpend).length&&!gtimer)gtimer=setTimeout(gflush,300)}
}
async function gfetch(){
 const t=await grist.docApi.fetchTable('WG_Kv');
 const seen={},dup=[];
 for(let i=0;i<t.id.length;i++){
  const k=t.Cle[i],m=+t.Maj[i]||0;if(!k)continue;
  if(!seen[k]||m>=seen[k].maj){if(seen[k])dup.push(seen[k].id);seen[k]={id:t.id[i],maj:m,val:t.Valeur[i]}}else dup.push(t.id[i]);
 }
 gRows=seen;
 Object.keys(seen).forEach(k=>{if(gpend[k]!==undefined)return;if(gwrote[k]&&seen[k].maj<gwrote[k])return;GM[k]=seen[k].val||''});
 if(dup.length&&!gbusy){try{await grist.docApi.applyUserActions([['BulkRemoveRecord','WG_Kv',dup]])}catch(e){}}
}
async function gfetchJ(){
 const t=await grist.docApi.fetchTable('WG_Journal');
 const a=[];for(let i=0;i<t.id.length;i++)a.push({t:+t.Quand[i]||0,vue:t.Vue[i]||'',type:t.Type[i]||'',txt:t.Texte[i]||'',auteur:(t.Auteur&&t.Auteur[i])||''});
 JR=a.sort((x,y)=>x.t-y.t);
}
function jrn(type,txt){if(!GRIST)return;try{grist.docApi.applyUserActions([['AddRecord','WG_Journal',null,{Quand:Date.now(),Heure:new Date().toLocaleTimeString('fr-FR'),Vue:view,Type:type,Texte:String(txt).slice(0,400)}]]).catch(gerr)}catch(e){gerr(e)}}

let CH=[];
let chatOpen=false,chatDraft='',chatFrom='MJ',lastCount=-1,lastChat=-1;

function snapshot(){return [KS].concat(VIEWS.map(KP),CHKEYS).map(lraw).join('|')}

const myLabel=()=>view==='mj'?chatFrom:(({strategie:'Stratégie',cod:'COD',presse:'Presse'})[view]+(S.joueurs[view]?' ('+S.joueurs[view]+')':''));
function unseenFor(v){return S.injects.filter(i=>i.dest!=='tous'&&routeOf(i)===v&&!delivery(i)&&!(P[v].seen&&P[v].seen[i.id])).sort((a,b)=>a.t0-b.t0)}

function save(){S.rev=(S.rev||0)+1;lset(KS,S);lastRaw=snapshot()}
function savP(v){lset(KP(v),P[v]);lastRaw=snapshot()}
function log(txt,kind){S.journal.push({t:now(),txt:txt,kind:kind||'mj'})}
const scen=()=>ALL().find(s=>s.id===S.scenarioId)||ALL()[0];
const clk=()=>S.paused&&S.pauseStart?S.pauseStart:now();
const presseActive=()=>!!(S.presseOn||(S.presseAt&&now()>=S.presseAt));
const routeOf=i=>i.dest==='presse'?(presseActive()?'presse':'cod'):i.dest;
function delivery(i){for(const v of VIEWS){const it=P[v].items[i.id];if(it&&it.done)return Object.assign({vue:v},it)}return null}
const isEchu=i=>clk()>i.t0+i.delai*60000;
const weight=i=>1+(isEchu(i)?1:0)+((i.g||1)>=3?1:0);
function openFor(v){return S.injects.filter(i=>i.dest!=='tous'&&routeOf(i)===v&&!delivery(i))}
function loads(){const o={};VIEWS.forEach(v=>{o[v]=openFor(v).reduce((a,i)=>a+weight(i),0)});return o}
function deck(){const s=scen();return genCards(s.vars).concat(s.cartes||[])}

/* ============ Moteur ============ */
function addInject(o,type){
 const i=Object.assign({id:'i'+(S.seq++),type:type,tour:S.tour,t0:clk(),g:1,delai:8,canal:0,tache:''},o);
 S.injects.push(i);
 log(`Inject (${DESTL[i.dest]}) : ${i.titre}`,'inject');
 return i;
}
function startTour(){
 const s=scen(),f=s.fil[S.tour-1];if(!f)return;
 S.situation.push({tour:S.tour,h:f.h,titre:f.titre,faits:f.faits,bilan:f.bilan,t:now()});
 S.tourEnd=clk()+S.tourMinutes*60000;
 log(`Tour ${S.tour} (${f.h}) : ${f.titre}`,'tour');
 const d=Math.max(3,Math.round(S.tourMinutes*0.7));
 addInject({dest:'cod',g:1,delai:d,titre:'Production attendue : '+f.titre,texte:'Bilan : '+f.bilan,tache:f.cod},'fil');
 addInject({dest:'strategie',g:1,delai:d,titre:'Arbitrage attendu : '+f.titre,texte:'Bilan : '+f.bilan,tache:f.strat},'fil');
}
function startExercise(){
 S.running=true;S.tour=1;S.started=now();S.ended=false;
 log('Début de l’exercice','tour');
 startTour();save();tab='pilot';render();
}
function nextTour(){
 const s=scen();
 if(S.tour>=s.fil.length){if(confirm('Dernier tour atteint. Clôturer l’exercice et passer au retex ?')){S.ended=true;S.running=false;log('Fin de l’exercice','tour');save();tab='retex';render()}return}
 S.tour++;startTour();save();render();
}
function resetAll(){
 const keep={scenarioId:S.scenarioId,tourMinutes:S.tourMinutes,presseOn:S.presseOn,joueurs:S.joueurs};
 S=Object.assign(newState(),keep);
 VIEWS.forEach(v=>{P[v]=newProd();savP(v)});
 CHKEYS.forEach(k=>lset(k,[]));CH=[];lastRaw=snapshot();
 save();tab='prep';render();
}
function pickCard(c,level){
 let pool=deck().filter(x=>x.canal===c&&!S.usedCards.includes(x.id));
 if(!pool.length)pool=deck().filter(x=>x.canal===c);
 let sel=pool.filter(x=>x.g===level);
 if(!sel.length)sel=pool.filter(x=>x.g<=level);
 if(!sel.length)sel=pool;
 return sel.length?pickOne(sel):null;
}
function frictionCard(f){
 const fr=frictionsOf(scen().vars);
 const kind=f<=4?'retard':(f===5?'partenaire':'panne');
 const c=pickOne(fr[kind]);
 return Object.assign({id:'FR'+rnd(99999),canal:0,kind:kind},c);
}
const AGG=['Situation stable : pas de fait nouveau','Fait nouveau sur le terrain','Fait nouveau + fuite ou rumeur','Rebond majeur'];
const FRL=f=>f<=2?'Tout fonctionne':(f<=4?'Information en retard ou contradictoire':(f===5?'Un partenaire communique de son côté':'Panne ou indisponibilité'));
function rollDice(){
 const a=rnd(6),c=rnd(6),f=rnd(6);
 const level=a<=2?0:(a<=4?1:(a===5?2:3));
 S.dice={a:a,c:c,f:f,level:level,card:level?pickCard(c,level):null,fr:f>=3?frictionCard(f):null,t:now()};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=A[a.dataset.act];if(f)f(a.dataset,e)});
function onInput(e){
 const t=e.target,b=t.dataset&&t.dataset.bind;if(!b)return;
 const i=b.indexOf(':'),k=b.slice(0,i),id=b.slice(i+1);
 const val=t.type==='checkbox'?t.checked:t.value;
 if(k==='chat'){if(id==='draft')chatDraft=val;else chatFrom=val;return}
 if(k==='item'){const it=P[view].items[id]||(P[view].items[id]={});it.texte=val;savP(view);const c=document.getElementById('cnt-'+id);if(c)c.textContent=val.length}
 else if(k==='ligne'){P.strategie.ligne[id]=val;P.strategie.ligne.dirty=true;savP('strategie')}
 else if(k==='draft'){S.draft=S.draft||{};S.draft[id]=val;save()}
 else if(k==='param'){S[id]=id==='tourMinutes'?Math.max(1,+val||15):(id==='rfDelay'?Math.max(0,+val||0):val);save()}
 else if(k==='joueur'){S.joueurs[id]=val;save()}
 else if(k==='note'){S.notes[id]=S.notes[id]||{};S.notes[id].c=val;save()}
 else if(k==='rf'){P.cod.rf=P.cod.rf||{};P.cod.rf[id]=val;savP('cod')}
 else if(k==='libre'){P[view].libreDraft=P[view].libreDraft||{};P[view].libreDraft[id]=val;savP(view)}
}

$('#imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const o=JSON.parse(r.result);
  if(!o.id||!o.titre||!Array.isArray(o.fil)||!o.vars||!Array.isArray(o.vars.media))throw new Error('Structure inattendue (id, titre, vars.media, fil).');
  const c=lget(KC,[]).filter(x=>x.id!==o.id);c.push(o);lset(KC,c);alert('Scénario « '+o.titre+' » importé.');render();
 }catch(err){alert('Import impossible : '+err.message)}};
 r.readAsText(f);e.target.value='';
});
function download(name,content,type){
 const b=new Blob([content],{type:type+';charset=utf-8'});const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();

function gauge(label,val){
 const pct=Math.min(100,Math.round(val/8*100));const cls=val>=7?'s':(val>=4?'t':'');

 return `<div><div class="row"><b>${esc(label)}</b><span class="muted">charge ${val} — ${txt}</span></div><div class="gauge ${cls}"><i style="width:${pct}%"></i></div></div>`;
}

 return `<div class="card inj g${i.g||1} ${done?'done':''}">
 <div class="meta"><span class="tag">${i.canal?esc(CANAL[i.canal]):'Fil rouge'}</span><span>${hhmm(i.t0)}</span>${done?`<span class="ok">Livré à ${hhmm(it.t)}</span>`:`<span>échéance <span class="cd" data-end="${dl}"></span></span>`}</div>

 :`<textarea id="ta-${i.id}" data-bind="item:${i.id}" placeholder="${esc(fmt)}">${esc(it.texte||'')}</textarea>

function stats(){
 const inj=S.injects.filter(i=>i.dest!=='tous');
 const st={total:inj.length,livres:0,hors:0,non:0,delais:[],ok:0,mid:0,ko:0};
 inj.forEach(i=>{const dv=delivery(i);if(dv){st.livres++;st.delais.push(dv.t-i.t0);if(dv.t>i.t0+i.delai*60000)st.hors++}else st.non++;
  const n=(S.notes[i.id]||{}).n;if(n)st[n]++});
 allLibre().forEach(x=>{const n=(S.notes[x.id]||{}).n;if(n)st[n]++});
 st.moy=st.delais.length?st.delais.reduce((a,b)=>a+b,0)/st.delais.length:0;
 return st;
}
function constats(){
 const c=[],sf=S.satFirst,r1=P.cod.renforts.length?P.cod.renforts[0].t:null,st=stats();
 if(!sf.orange)c.push('Le COD n’a jamais dépassé le seuil « tendu » : la charge a été absorbée, ou le jeu n’était pas assez dense.');
 else{
  c.push(`Seuil « tendu » atteint à ${hhmm(sf.orange)}${sf.rouge?`, seuil « saturé » à ${hhmm(sf.rouge)}`:''}.`);
  if(!r1)c.push(sf.rouge?'Le COD est arrivé à saturation sans jamais demander de renfort : point central du débrief.':'Aucun renfort n’a été demandé.');
  else{const dm=(r1-sf.orange)/60000;c.push(dm<=3?`Renfort demandé ${Math.max(0,dm).toFixed(1)} min après le seuil « tendu » : réflexe adapté.`:`Renfort demandé ${dm.toFixed(1)} min après le seuil « tendu » : plus tôt aurait été plus sûr.`)}
 }
 if(st.hors)c.push(`${st.hors} production(s) livrée(s) hors délai, ${st.non} non livrée(s).`);else if(st.non)c.push(`${st.non} sollicitation(s) restée(s) sans réponse.`);
 if(S.presseAt||S.presseOn)c.push('Un binôme presse a été engagé : observez comment la répartition des rôles a été organisée.');
 if(P.strategie.ligne.publie)c.push(`La stratégie a publié ${P.strategie.ligne.v} version(s) de sa ligne.`);else c.push('La stratégie n’a pas publié de ligne : le COD a travaillé sans cadrage.');
 return c;
}

function derive(){

 if(l.cod>=7&&!S.satFirst.rouge){S.satFirst.rouge=now();log('Seuil « saturé » atteint côté COD','alerte');ch=true}
 if(S.presseAt&&now()>=S.presseAt&&!S.presseLogged){S.presseLogged=true;log('Le binôme presse prend la main','alerte');ch=true}
 if(ch){save();render()}

 chatRead=view?+(locget(KRk())||0):0;
 window.addEventListener('storage',poll);
 setInterval(()=>{poll();derive();tick()},1000);
 lastRaw=snapshot();render();
}
function startLocal(){
 if(started)return;
 GRIST=false;
 view=viewParam||locget('wgcc_role')||'mj';
 reloadAll();startLoops();
}
async function initGrist(){
 try{
  grist.ready({requiredAccess:'full'});
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Grist ne répond pas')),ms))]);
  const tabs=await withTimeout(grist.docApi.listTables(),8000);
  GRIST=true;
  const acts=[];
  if(tabs.indexOf('WG_Kv')<0)acts.push(['AddTable','WG_Kv',[{id:'Cle',type:'Text'},{id:'Valeur',type:'Text'},{id:'Maj',type:'Numeric'}]]);
  if(tabs.indexOf('WG_Journal')<0)acts.push(['AddTable','WG_Journal',[{id:'Quand',type:'Numeric'},{id:'Heure',type:'Text'},{id:'Vue',type:'Text'},{id:'Type',type:'Text'},{id:'Texte',type:'Text'}]]);
  if(acts.length)await grist.docApi.applyUserActions(acts);
  if(tabs.indexOf('WG_Journal')<0){
   try{await grist.docApi.applyUserActions([['AddColumn','WG_Journal','Auteur',{type:'Text',isFormula:false,formula:'user.Name',recalcWhen:1}]])}
   catch(e){try{await grist.docApi.applyUserActions([['AddColumn','WG_Journal','Auteur',{type:'Text'}]])}catch(e2){}}
  }
  await gfetch();
  view=viewParam||locget('wgcc_role')||'';
  reloadAll();startLoops();
  let busy=false,n=0;
  setInterval(async()=>{if(busy)return;busy=true;try{await gfetch();if(view==='mj'&&(n++%4===0)){const c=JR.length;await gfetchJ();if(JR.length!==c&&tab==='retex')render()}poll()}catch(e){gerr(e)}busy=false},1500);
 }catch(e){
  console.error(e);
  if(GRIST){$('#app').innerHTML='<main><div class="alert"><b>Connexion à Grist impossible.</b><br>'+esc(e.message||e)+'<br>Le widget doit avoir un accès complet au document (« Accès complet ») et votre compte doit pouvoir modifier le document.</div></main>'}
  else startLocal();
 }
}
(function init(){
 if(window.grist&&window.grist.docApi){initGrist();return}
 let inFrame=false;try{inFrame=window.top!==window.self}catch(e){inFrame=true}
 if(!inFrame){startLocal();return}
 $('#app').innerHTML='<main><div class="info">Connexion à Grist…</div></main>';
 const s=document.createElement('script');
 s.src='https://docs.getgrist.com/grist-plugin-api.js';
 s.onload=()=>initGrist();
 s.onerror=()=>startLocal();
 document.head.appendChild(s);
 setTimeout(()=>{if(!started&&!GRIST)startLocal()},9000);
})();
})();
</script>
