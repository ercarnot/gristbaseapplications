<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wargame – Communication de crise</title>
<style>
:root{--bleu:#000091;--bleu2:#1212ff;--rouge:#e1000f;--gris:#f3f4f8;--bord:#d9dbe6;--txt:#161616;--ok:#18753c;--warn:#b34000;--ko:#ce0500}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif;color:var(--txt);background:var(--gris)}
header.hd{background:var(--bleu);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:4px solid var(--rouge)}
.brand{display:flex;align-items:center;gap:12px}
.brand .bar{width:6px;height:38px;background:linear-gradient(var(--bleu2),#fff,var(--rouge))}
.brand small{opacity:.8;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
h1{margin:0;font-size:19px}
h2{font-size:17px;margin:0 0 8px;color:var(--bleu)}
h3{font-size:15px;margin:14px 0 6px}
h4{margin:2px 0 4px;font-size:15px}
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:10px 20px 0;background:#fff;border-bottom:1px solid var(--bord);flex-wrap:wrap}
.tab{border:1px solid var(--bord);border-bottom:none;background:var(--gris);padding:8px 16px;cursor:pointer;font-weight:600;border-radius:6px 6px 0 0;color:#444}
.tab.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:14px;margin-bottom:14px}
.card.sel{border:2px solid var(--bleu);box-shadow:0 0 0 3px #dfe0ff}
.card.inj{border-left:6px solid var(--bleu)}
.card.inj.g2{border-left-color:#e08a00}.card.inj.g3{border-left-color:var(--rouge)}
.card.inj.done{opacity:.72;border-left-color:var(--ok)}
.card.sit{border-left:6px solid var(--bleu)}
.card.sit.old{opacity:.7;padding:8px 14px}
.meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#555;flex-wrap:wrap;margin-bottom:2px}
.tag{background:#e8edff;color:var(--bleu);border-radius:4px;padding:1px 8px;font-weight:600;font-size:12px}
.chip{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12.5px;font-weight:700;background:#fff3;color:#fff}
.chip.warn{background:#ffd;color:var(--warn)}
.cd,.tcd,.chr{font-variant-numeric:tabular-nums;font-weight:700}
.cd.late{color:var(--ko)}
.ok{color:var(--ok);font-weight:700}
.tache{background:#f5f5ff;border-radius:6px;padding:6px 10px;margin:8px 0;font-size:14px}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;padding:8px;border:1px solid #888;border-radius:6px;background:#fff}
textarea{min-height:110px;resize:vertical}
button.btn{background:var(--bleu);color:#fff;border:none;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.btn:hover{background:var(--bleu2)}
button.btn.sec{background:#fff;color:var(--bleu);border:1px solid var(--bleu)}
button.btn.red{background:var(--rouge)}
button.btn.small{padding:4px 10px;font-size:13px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.row .grow{flex:1 1 200px}
.gauge{background:#e6e6ee;border-radius:8px;height:18px;overflow:hidden;margin:4px 0}
.gauge i{display:block;height:100%;background:var(--ok);transition:width .4s}
.gauge.t i{background:#e08a00}.gauge.s i{background:var(--rouge)}
.dice{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.die{background:#fff;border:2px solid var(--bleu);border-radius:10px;padding:8px 14px;text-align:center;min-width:150px}
.die b{display:block;font-size:34px;line-height:1.1;color:var(--bleu)}
.die span{font-size:12.5px;color:#444}
.alert{background:#fff0f0;border:1px solid var(--rouge);border-left:6px solid var(--rouge);padding:10px 12px;border-radius:6px;margin-bottom:12px}
.info{background:#eef;border-left:6px solid var(--bleu);padding:10px 12px;border-radius:6px;margin-bottom:12px}
.ligne{background:#effaf2;border:1px solid #9bd3ac;border-left:6px solid var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--bord);padding:6px 8px;text-align:left;vertical-align:top}
.rate button{margin-right:4px}
.rate .on.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.rate .on.midb{background:#e08a00;color:#fff;border-color:#e08a00}
.rate .on.kob{background:var(--ko);color:#fff;border-color:var(--ko)}
.tl li{margin:3px 0;font-size:14px}
.tl .alerte{color:var(--ko);font-weight:600}
.banner{background:var(--rouge);color:#fff;text-align:center;font-weight:700;letter-spacing:.15em;font-size:12px;padding:2px}
.muted{color:#666;font-size:13px}
.big{font-size:20px;font-weight:700}
.tab .badge{background:var(--rouge);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.tab.on .badge{background:#fff;color:var(--rouge)}
.ptabs{padding:0;background:none;margin-bottom:14px;border-bottom:1px solid var(--bord)}
.strip{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.strip .g{flex:1 1 220px}
.foot{position:fixed;left:10px;bottom:6px;font-size:12px;color:#555;background:#fffd;padding:2px 8px;border-radius:6px;z-index:800}
.foot a{color:var(--bleu);cursor:pointer;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(10,10,60,.62);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:12px;max-width:640px;width:100%;border-top:10px solid var(--rouge);padding:22px 26px;box-shadow:0 20px 60px #0008;animation:pop .25s}
.modal .box.g1{border-top-color:var(--bleu)}.modal .box.g2{border-top-color:#e08a00}
.modal .box h2{font-size:22px;color:var(--rouge);margin:4px 0 8px}
.modal .box.g1 h2{color:var(--bleu)}.modal .box.g2 h2{color:var(--warn)}
.modal .q{font-size:12px;color:#666}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.chatw{position:fixed;right:14px;bottom:14px;z-index:900;width:340px;max-width:calc(100vw - 28px)}
.chatw .tg{width:100%;background:var(--bleu);color:#fff;border:none;border-radius:10px 10px 0 0;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;text-align:left;display:flex;justify-content:space-between}
.chatw.closed .tg{border-radius:10px}
.chatw .badge{background:var(--rouge);color:#fff;border-radius:12px;padding:0 9px;font-size:13px}
.chatw .body{background:#fff;border:1px solid var(--bord);border-top:none;padding:8px}
.chatw .msgs{height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.msg{background:#eef;border-radius:8px;padding:5px 9px;font-size:14px;max-width:92%;align-self:flex-start}
.msg.me{background:#dff3e4;align-self:flex-end}
.msg small{display:block;color:#555;font-size:11.5px}
.chatw textarea{min-height:44px;margin-top:6px}
@media print{
 .chatw,.modal{display:none!important}
 .tabs,header.hd,button,.noprint{display:none!important}
 body{background:#fff}.card{break-inside:avoid;border:1px solid #bbb}
}
</style>
</head>

(function(){
'use strict';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const now=()=>Date.now();
const hhmm=t=>t?new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const rnd=n=>1+Math.floor(Math.random()*n);
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const VIEWS=['strategie','cod','presse'];
const KS='wgcc_s',KP=v=>'wgcc_p_'+v,KC='wgcc_custom',KCH='wgcc_chat';
const CANAL=['','Réseaux sociaux','Presse locale','Presse nationale','Élu · parlementaire','Victimes · familles · riverains','Hiérarchie · cabinet'];
const DESTL={cod:'COD',presse:'Presse',strategie:'Stratégie',tous:'Tous'};
const ROLEL={strategie:'Cellule Stratégie',cod:'COD — information presse et public',presse:'Cellule Presse (appui)'};
let GRIST=false;const GM={},gpend={},gwrote={};let gRows={},gtimer=null,gbusy=false,JR=[],gErr='';
function locget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function locset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lraw(k){if(GRIST)return GM[k]||'';return locget(k)}
function lget(k,d){const r=lraw(k);try{return r?JSON.parse(r):d}catch(e){return d}}
function lset(k,v){const s=JSON.stringify(v);if(GRIST){GM[k]=s;gqueue(k,s)}else locset(k,s)}
function gqueue(k,s){gwrote[k]=Date.now();gpend[k]=s;if(!gtimer)gtimer=setTimeout(gflush,350)}
function gerr(e){gErr=(e&&e.message)||String(e);console.error(e)}
async function gflush(){
 gtimer=null;
 if(gbusy){gtimer=setTimeout(gflush,300);return}
 gbusy=true;
 try{
  const keys=Object.keys(gpend),acts=[];
  keys.forEach(k=>{const v=gpend[k];delete gpend[k];
   if(gRows[k])acts.push(['UpdateRecord','WG_Kv',gRows[k].id,{Valeur:v,Maj:gwrote[k]}]);
   else acts.push(['AddRecord','WG_Kv',null,{Cle:k,Valeur:v,Maj:gwrote[k]}])});
  if(acts.length)await grist.docApi.applyUserActions(acts);
  if(keys.some(k=>!gRows[k]))await gfetch();
  gErr='';
 }catch(e){gerr(e)}
 finally{gbusy=false;if(Object.keys(gpend).length&&!gtimer)gtimer=setTimeout(gflush,300)}
}
async function gfetch(){
 const t=await grist.docApi.fetchTable('WG_Kv');
 const seen={},dup=[];
 for(let i=0;i<t.id.length;i++){
  const k=t.Cle[i],m=+t.Maj[i]||0;if(!k)continue;
  if(!seen[k]||m>=seen[k].maj){if(seen[k])dup.push(seen[k].id);seen[k]={id:t.id[i],maj:m,val:t.Valeur[i]}}else dup.push(t.id[i]);
 }
 gRows=seen;
 Object.keys(seen).forEach(k=>{if(gpend[k]!==undefined)return;if(gwrote[k]&&seen[k].maj<gwrote[k])return;GM[k]=seen[k].val||''});
 if(dup.length&&!gbusy){try{await grist.docApi.applyUserActions([['BulkRemoveRecord','WG_Kv',dup]])}catch(e){}}
}
async function gfetchJ(){
 const t=await grist.docApi.fetchTable('WG_Journal');
 const a=[];for(let i=0;i<t.id.length;i++)a.push({t:+t.Quand[i]||0,vue:t.Vue[i]||'',type:t.Type[i]||'',txt:t.Texte[i]||'',auteur:(t.Auteur&&t.Auteur[i])||''});
 JR=a.sort((x,y)=>x.t-y.t);
}
function jrn(type,txt){if(!GRIST)return;try{grist.docApi.applyUserActions([['AddRecord','WG_Journal',null,{Quand:Date.now(),Heure:new Date().toLocaleTimeString('fr-FR'),Vue:view,Type:type,Texte:String(txt).slice(0,400)}]]).catch(gerr)}catch(e){gerr(e)}}

/* ============ Scénarios ============ */
const SCEN=[

 vars:{lieu:'la vallée de l’Ubaye',commune:'Barcelonnette',elu:'le maire de Barcelonnette',service:'le SDIS 04',media:['Haute-Provence Info','La Provence','France Bleu Provence'],nat:'BFMTV',rumeur:'une dizaine de campeurs auraient été emportés par la crue',ecart:'deux disparus selon le SDIS, quatre selon la gendarmerie'},
 briefing:'Il est 14 h 10. Météo-France a placé le département en vigilance rouge « crues » à 11 h. L’Ubaye est en crue depuis midi, un camping est partiellement évacué et la RD900 est coupée à deux endroits. Le COD est activé depuis 13 h 30. Vous conseillez la préfète sur la stratégie de communication.',
 oral:'Il est 14 h 10. Vigilance rouge crues depuis 11 h. L’Ubaye est sortie de son lit, un camping est en cours d’évacuation, la RD900 est coupée. Le COD est activé. Vous avez en face de vous des journalistes qui appellent déjà. Premier tour : vous avez 15 minutes.',
 fil:[
 {h:'H+0',titre:'Vigilance rouge, l’Ubaye déborde',faits:'L’Ubaye a dépassé son niveau historique. Un camping est inondé : 60 campeurs évacués par le SDIS, certains par hélicoptère. La RD900 est coupée à deux endroits.',bilan:'0 victime confirmée · 60 évacués · RD900 coupée',cod:'Premier communiqué : vigilance rouge, consignes (ne pas se déplacer), numéros utiles, point de situation. Un post pour les réseaux sociaux.',strat:'Quels sont les 3 messages prioritaires des deux premières heures ? Qui parle (préfète, directeur de cabinet) et quand ?'},
 {h:'H+20',titre:'Deux personnes disparues',faits:'Deux campeurs sont signalés disparus. Le SDIS engage plongeurs et hélicoptère. Le maire demande à s’exprimer sur les ondes. L’électricité est coupée dans le haut de la vallée.',bilan:'2 disparus · 85 évacués · 1 200 foyers sans électricité',cod:'Point de situation n°2 + post : consignes et numéro d’information du public. Ne pas évoquer les disparus sans validation.',strat:'Faut-il confirmer l’existence de disparus ? Dans quels termes ? Comment s’articuler avec le maire ?'},
 {h:'H+40',titre:'Un corps retrouvé',faits:'Un corps est découvert par les secours. Identification en cours, la famille n’est pas prévenue. Un hélicoptère de chaîne d’information survole la zone. Le parquet de Digne est informé.',bilan:'1 décès (non identifié) · 1 disparu · 90 évacués',cod:'Réponse écrite à la presse sur le décès : ce que l’on dit, ce que l’on ne dit pas, qui peut en parler.',strat:'La famille n’est pas prévenue. Quelle règle fixer pour la communication sur le décès ? Quel rôle pour le procureur ?'},
 {h:'H+60',titre:'Éboulement : 120 personnes isolées',faits:'Un éboulement coupe la RD900 en amont : 120 personnes sont isolées sans électricité. Hébergement d’urgence ouvert au gymnase. Le ministre annonce qu’il suit la situation « heure par heure ».',bilan:'1 décès · 1 disparu · 120 isolés · 90 hébergés',cod:'Communiqué sur les personnes isolées et l’hébergement d’urgence + post d’informations pratiques.',strat:'Le cabinet du ministre demande un point dans 15 minutes. Quelles 10 lignes lui envoyer ? Quelle ligne sur les hébergements ?'},
 {h:'H+80',titre:'Polémique sur l’alerte',faits:'Un élu et des habitants affirment que le camping aurait dû être évacué dès le matin. Une vidéo critiquant les services de l’État circule. Plusieurs médias demandent une conférence de presse.',bilan:'1 décès · 1 disparu · 120 isolés',cod:'Message de réponse à la polémique + déroulé du point presse (qui, quand, quoi).',strat:'Défendre, expliquer ou reconnaître ? Fixer la ligne : chronologie de l’alerte, faits établis, ce que l’on ne dit pas.'},
 {h:'H+100',titre:'Décrue, premier bilan',faits:'La décrue s’amorce. Le disparu est retrouvé sans vie. Les 120 isolés sont ravitaillés par hélicoptère. Le ministre se déplace demain. Les maires demandent la reconnaissance de l’état de catastrophe naturelle.',bilan:'2 décès · 0 disparu · 120 isolés ravitaillés',cod:'Communiqué de fin de phase aiguë : bilan, remerciements, retour à la normale, prochaines étapes.',strat:'Préparer le déplacement du ministre : messages, dispositif presse, hommage. Quelle clôture pour la phase de crise ?'}],
 cartes:[
 {id:'C1',canal:2,g:2,dest:'presse',delai:8,titre:'Le gérant du camping parle',texte:'Le gérant du camping affirme à Haute-Provence Info qu’il n’a reçu « aucune consigne d’évacuation » avant 13 h. Le journaliste vous demande votre réaction avant publication.',tache:'Répondre sur les faits (chronologie de l’alerte) sans polémiquer ni accuser.'},
 {id:'C2',canal:1,g:3,dest:'cod',delai:6,titre:'Fausse photo virale',texte:'Un compte local publie une photo ancienne d’une autre crue légendée « 10 morts au camping ». 3 000 partages en un quart d’heure.',tache:'Démentir sans amplifier, rétablir les faits vérifiés, signaler le contenu.'},

{id:'feu',icone:'🔥',titre:'Feu de forêt en zone périurbaine',niveau:'Intermédiaire',

 oral:'Il est 13 h 55. Mistral fort, risque feux très sévère. Un feu s’est déclaré en lisière d’un lotissement et progresse vite. Les premiers appels de journalistes arrivent. Premier tour : 15 minutes.',

 {h:'H+0',titre:'Départ de feu, mistral',faits:'Feu déclaré vers 13 h 40 en lisière d’un lotissement. Fort mistral : 60 hectares en vingt minutes. Moyens terrestres engagés, deux Canadair demandés.',bilan:'60 ha · 0 victime · 150 habitants confinés',cod:'Communiqué : consignes de confinement ou d’évacuation, ne pas encombrer les routes, numéros utiles. Un post RS.',strat:'Confinement ou évacuation : quel message ? Qui s’exprime en premier, la préfète ou le maire ?'},

 {id:'F1',canal:2,g:2,dest:'presse',delai:8,titre:'Image satellite contradictoire',texte:'Un journaliste a obtenu une image satellite qui laisse penser que le feu est bien plus étendu que votre chiffre. Il publie dans 15 minutes.',tache:'Expliquer l’écart entre surface estimée et surface constatée, sans minimiser.'},

 {id:'F3',canal:1,g:3,dest:'cod',delai:6,titre:'Appel à la mobilisation spontanée',texte:'Un groupe local appelle sur les réseaux à venir « aider » avec des tracteurs-citernes. Des centaines de personnes sont prêtes à se rendre sur place.',tache:'Rédiger un message clair pour dissuader, expliquer le danger pour les secours.'}]},

{id:'car',icone:'🚌',titre:'Accident d’un autocar de touristes',niveau:'Avancé',
 resume:'Autocar de 38 touristes étrangers sorti de route sur la RN85. Bilan lourd, vidéo virale, chauffeur mis en cause, familles et ambassades. Articulation avec le parquet.',
 vars:{lieu:'la RN85 au sud de Digne-les-Bains',commune:'Digne-les-Bains',elu:'le maire de Digne-les-Bains',service:'le SDIS 04',media:['Haute-Provence Info','La Provence','France Bleu Provence'],nat:'franceinfo',rumeur:'le chauffeur aurait été sous l’emprise de l’alcool',ecart:'quatre morts selon le SDIS, six selon la gendarmerie'},
 briefing:'Il est 16 h 20. Un autocar transportant 38 touristes étrangers (néerlandais et belges) a quitté la chaussée sur la RN85 au sud de Digne. Le bilan est encore flou. La route est fermée dans les deux sens. Le COD est activé. Vous conseillez la préfète sur la stratégie de communication.',
 oral:'Il est 16 h 20. Accident d’un autocar de touristes étrangers sur la RN85. Le bilan est flou. Les premiers journalistes appellent, les premières images circulent. Premier tour : 15 minutes.',
 fil:[
 {h:'H+0',titre:'Accident d’un autocar de touristes',faits:'Un autocar de 38 touristes néerlandais et belges a quitté la chaussée. Nombreux blessés, bilan flou. La RN85 est fermée dans les deux sens.',bilan:'Bilan en cours · 38 passagers · RN85 fermée',cod:'Premier communiqué : faits avérés, route coupée, déviations, numéro d’information pour les familles.',strat:'Quel niveau de précision accepter alors que le bilan n’est pas consolidé ? Qui parle ?'},
 {h:'H+20',titre:'Bilan lourd, hôpitaux sollicités',faits:'Bilan provisoire : 4 morts, 19 blessés dont 6 en urgence absolue. Le plan blanc est activé. Une cellule d’urgence médico-psychologique est mise en place.',bilan:'4 morts · 19 blessés (6 UA) · 15 indemnes',cod:'Communiqué n°2 : bilan provisoire, dispositifs d’accueil, numéro d’information des familles.',strat:'Quel ton pour un bilan de décès ? Quelle communication vers les familles à l’étranger ?'},
 {h:'H+40',titre:'Une vidéo de l’accident circule',faits:'Une vidéo tournée par un automobiliste montre l’autocar et des victimes. Elle est reprise par des chaînes d’information. Plusieurs familles l’apprennent ainsi.',bilan:'4 morts · 19 blessés · identification en cours',cod:'Post RS + réponse presse sur la diffusion d’images : appel à la retenue, respect des familles.',strat:'Faut-il demander aux médias de ne pas diffuser ? Qui prévient les familles ? Qui coordonne avec les consulats ?'},
 {h:'H+60',titre:'Le chauffeur mis en cause',faits:'Une source non identifiée affirme que le chauffeur aurait dépassé son temps de conduite et serait sous l’emprise de l’alcool. Le procureur n’a pas encore communiqué.',bilan:'5 morts (un blessé décédé) · 18 blessés',cod:'Réponse écrite à la presse : renvoi au procureur, pas d’éléments d’enquête, empathie.',strat:'Comment tenir la ligne « l’enquête appartient au procureur » face à la pression ? Coordination avec le parquet.'},
 {h:'H+80',titre:'Familles et ambassades',faits:'Les familles arrivent. Les ambassades des Pays-Bas et de Belgique appellent la préfecture. Un collectif de victimes se constitue et demande une réunion publique.',bilan:'5 morts · 18 blessés · 40 proches attendus',cod:'Communiqué sur l’accueil des familles ; message multilingue simple (FR/EN/NL).',strat:'Quelle communication d’accompagnement ? Faut-il un point presse avec le procureur ? Hommage ?'},
 {h:'H+100',titre:'Réouverture, déplacement ministériel',faits:'La RN85 rouvre. L’expertise de l’autocar est lancée. Le ministre des Transports annonce un déplacement et une inspection des autocars touristiques.',bilan:'5 morts · 18 blessés · route rouverte',cod:'Communiqué de fin de phase aiguë : réouverture, hommages, numéro d’information.',strat:'Préparer le déplacement ministériel et le message sur la sécurité des transports ; clôturer la crise.'}],
 cartes:[
 {id:'A1',canal:3,g:3,dest:'presse',delai:6,titre:'Question piège : l’alcool',texte:'Un journaliste national demande, en direct : « Le chauffeur avait-il bu ? Oui ou non ? » Il précise que son confrère local « a la réponse ».',tache:'Répondre sans éléments d’enquête, renvoyer au procureur, rester empathique.'},
 {id:'A2',canal:5,g:3,dest:'cod',delai:6,titre:'Famille mal informée',texte:'Un proche d’un passager, en larmes sur une chaîne, dit avoir appris le décès de sa sœur par un journaliste. Il accuse la préfecture.',tache:'Réponse écrite ou orale : empathie, dispositif d’information des familles, numéro dédié.'},
 {id:'A3',canal:6,g:2,dest:'strategie',delai:8,titre:'Le ministère veut un chiffre',texte:'Le cabinet du ministre veut « le bilan définitif » pour une déclaration dans 20 minutes. Votre bilan n’est pas consolidé.',tache:'Décider ce que vous transmettez et à quelles conditions.'}]}

{id:'neige',icone:'❄️',titre:'Neige collante et coupure généralisée',niveau:'Intermédiaire',
 resume:'Neige collante inhabituelle : lignes arrachées, 8 000 foyers sans électricité, réseau mobile qui tombe. Comment informer quand les canaux habituels sont coupés ? Monoxyde, rumeur de décès de froid, polémique sur l’anticipation.',
 vars:{lieu:'la vallée de la Haute-Combe',commune:'Valcombe',elu:'le maire de Valcombe',service:'le gestionnaire du réseau électrique',media:['Haute-Provence Info','La Provence','France Bleu Provence'],nat:'BFMTV',rumeur:'plusieurs personnes âgées seraient mortes de froid dans des hameaux isolés',ecart:'8 000 foyers privés d’électricité selon le gestionnaire du réseau, 12 000 selon les maires'},
 briefing:'Il est 07 h 30. Un épisode de neige collante, plus abondant que prévu, touche les vallées du nord du département depuis cette nuit (vigilance orange neige-verglas). Des arbres chargés de neige arrachent des lignes électriques. Le COD vient d’être activé. Vous conseillez la préfète sur la stratégie de communication.',
 oral:'Il est 07 h 30. Neige collante dans les vallées du nord, des lignes arrachées, les premières coupures de courant et un réseau mobile qui faiblit. Le COD est activé. Les habitants vont bientôt ne plus pouvoir vous lire. Premier tour : 15 minutes.',
 fil:[
 {h:'H+0',titre:'Neige collante, premières coupures',faits:'Trente centimètres de neige lourde au-dessus de 800 mètres. Des arbres sont tombés sur des lignes électriques et sur six routes départementales. Plusieurs relais de téléphonie fonctionnent sur batterie, avec une autonomie de quelques heures.',bilan:'4 000 foyers sans électricité · 6 routes coupées · réseau mobile fragilisé',cod:'Premier communiqué : consignes (ne pas se déplacer, groupe électrogène uniquement à l’extérieur, numéros utiles). Pensez au lecteur qui n’aura bientôt plus internet.',strat:'Si les canaux numériques tombent, quels relais mobilisez-vous (radio, mairies, gendarmerie, pompiers, affichage) ? Qui prend la parole en premier ?'},
 {h:'H+6 h',titre:'La coupure s’étend, le réseau mobile tombe',faits:'8 000 foyers sont maintenant sans électricité. Trois relais mobiles sont hors service : le téléphone ne passe plus dans la moitié de la vallée. Le gestionnaire du réseau annonce un retour à la normale sous 48 heures, l’opérateur local évoque 24 heures. Un EHPAD fonctionne sur groupe électrogène, avec douze heures d’autonomie.',bilan:'8 000 foyers sans courant · 3 relais mobiles hors service · 1 EHPAD sur groupe électrogène',cod:'Messages courts, lisibles sans internet : une version pour la radio locale et une version à afficher dans les mairies. Point sur les lieux d’accueil et de chauffage.',strat:'Quel calendrier de rétablissement annoncer alors que deux sources divergent ? Quelles priorités affichez-vous (EHPAD, personnes dépendantes à domicile) ?'},
 {h:'H+14 h',titre:'Intoxication au monoxyde, rumeur et polémique',faits:'Un homme de 80 ans est retrouvé mort chez lui : un groupe électrogène fonctionnait dans son garage attenant. Trois autres personnes sont intoxiquées. La rumeur de « morts de froid » circule dans les villages. Des maires accusent l’État de ne pas avoir anticipé et diffusent une vidéo d’habitants en colère.',bilan:'1 décès (monoxyde) · 3 intoxiqués · 8 000 foyers sans courant · rumeur de décès de froid',cod:'Message de prévention sur le monoxyde (groupe électrogène à l’extérieur, ventilation) et rétablissement des faits sur la rumeur, sans l’amplifier.',strat:'Défendre l’anticipation, ou expliquer et reconnaître des difficultés ? Qui répond aux maires, et sur quel canal ? Comment parler d’un décès sans désigner de faute ?'},
 {h:'H+30 h',titre:'Rétablissement progressif et retour d’expérience',faits:'Le courant est rétabli pour 70 % des foyers, des équipes venues d’autres régions renforcent le dépannage. 2 400 foyers restent privés d’électricité, surtout en altitude. Le réseau mobile revient progressivement. Les maires demandent un retour d’expérience public.',bilan:'2 400 foyers encore sans courant · réseau mobile en cours de rétablissement · 1 décès',cod:'Communiqué de fin de phase aiguë : rétablissement par secteurs, aides, numéros utiles, remerciements.',strat:'Quel message de sortie de crise, sans promettre ce que vous ne maîtrisez pas ? Quels enseignements acceptez-vous de reconnaître publiquement ?'}],
 cartes:[
 {id:'N1',canal:5,g:2,dest:'cod',delai:7,titre:'Un village sans aucune information',texte:'Un habitant joint la préfecture depuis le seul endroit où il capte : « On n’a plus rien, personne ne nous dit rien. » Il prévient que son village prépare un rassemblement devant la mairie.',tache:'Rédiger un message de réassurance et prévoir un relais physique (point d’information, affichage).'},
 {id:'N2',canal:2,g:2,dest:'presse',delai:8,titre:'La radio locale veut un porte-parole',texte:'France Bleu Provence demande une autorité à l’antenne dans 15 minutes. C’est le seul média que les habitants reçoivent encore, sur postes à piles.',tache:'Décider qui parle, fixer trois messages. Réponse orale de 1 min 30.'},
 {id:'N3',canal:6,g:2,dest:'strategie',delai:8,titre:'Le cabinet veut un chiffre fiable',texte:'Le cabinet du ministre veut le nombre de foyers privés d’électricité pour une déclaration, alors que les sources divergent.',tache:'Décider ce que vous transmettez : fourchette, source, réserves.'},
 {id:'N4',canal:4,g:3,dest:'strategie',delai:8,titre:'Les maires annoncent chacun une heure',texte:'Trois maires annoncent sur les réseaux sociaux trois heures différentes de rétablissement du courant.',tache:'Réaligner : message commun avec le gestionnaire du réseau, et décider qui le porte.'}]},

{id:'bus',icone:'🚌',titre:'Car scolaire bloqué dans la neige',niveau:'Intermédiaire',
 resume:'Un car de ramassage (31 collégiens) est bloqué sur la route d’un col, à la tombée de la nuit. Parents qui veulent monter, vidéo en direct, rumeur d’enfants blessés, polémique sur la décision de circuler.',
 vars:{lieu:'la route du col de Maraval',commune:'Rochebrune',elu:'le maire de Rochebrune',service:'les services routiers du département',media:['Haute-Provence Info','La Provence','France Bleu Provence'],nat:'franceinfo',rumeur:'plusieurs enfants seraient blessés et sans soins',ecart:'31 enfants à bord selon le transporteur, 38 selon la gendarmerie'},
 briefing:'Il est 16 h 40. La neige est arrivée deux heures plus tôt que prévu. Un car de ramassage scolaire, avec des collégiens à bord, est immobilisé sur la route du col de Maraval. Les familles s’inquiètent, la nuit tombe vers 17 h 30. Le COD est activé. Vous conseillez la préfète sur la stratégie de communication.',
 oral:'Il est 16 h 40. Un car scolaire est bloqué dans la neige sur la route d’un col, avec des collégiens à bord. La nuit tombe bientôt. Les parents appellent déjà la mairie et la préfecture. Premier tour : 15 minutes.',
 fil:[
 {h:'H+0',titre:'Un car scolaire bloqué dans la neige',faits:'Un car transportant 31 collégiens est immobilisé à 4 kilomètres du col, sur une route désormais fermée par la gendarmerie. Le chauffeur est joignable, le chauffage fonctionne. Les enfants sont calmes. Les premiers parents arrivent au barrage.',bilan:'31 enfants à bord · route fermée · aucun blessé signalé',cod:'Premier message : faits avérés, tous les enfants sont en contact avec les secours, numéro unique pour les familles. Aucune promesse d’horaire.',strat:'Quel niveau d’information donner aux parents ? Qui prend la parole (préfète, rectorat, maire) ? Comment éviter de promettre une heure d’arrivée ?'},
 {h:'H+2 h',titre:'Les secours n’arrivent pas, les parents veulent monter',faits:'Un arbre tombé et une congère empêchent les engins de déneigement d’atteindre le car. Deux enfants ont un malaise léger. Un père publie en direct une vidéo depuis un point de vue sur le car et annonce qu’il monte à pied avec d’autres parents. La rumeur d’enfants blessés se répand.',bilan:'31 enfants à bord · 2 malaises légers · accès bloqué · parents en route à pied',cod:'Message aux familles (ne pas monter, lieu d’accueil, point toutes les 30 minutes) et rétablissement des faits sur la rumeur.',strat:'Comment empêcher des parents de prendre des risques sans les braquer ? Où accueillir les familles, et qui coordonne avec le collège et le rectorat ?'},
 {h:'H+4 h',titre:'Évacuation et polémique sur la décision de circuler',faits:'L’évacuation commence par rotations d’engins chenillés. Un enfant est légèrement blessé lors du transfert. Le transporteur déclare à la presse avoir reçu « l’ordre de circuler ». Le rectorat et le conseil départemental se renvoient la responsabilité. Les médias nationaux arrivent au centre d’accueil.',bilan:'20 enfants sur 31 évacués · 1 blessé léger · polémique sur la décision de circuler',cod:'Réponse à la polémique et déroulé d’un point presse au centre d’accueil (qui, quand, quoi).',strat:'Qui a décidé de la circulation du car, et que peut-on affirmer à ce stade ? Comment éviter une guerre des institutions devant les caméras ?'},
 {h:'H+6 h',titre:'Tous les enfants remis aux familles',faits:'Les 31 enfants sont remis à leurs familles à 22 h 30. Une enquête administrative est annoncée. Les parents demandent une réunion publique. Le rectorat propose une cellule d’écoute pour le collège.',bilan:'31 enfants remis aux familles · 1 blessé léger · enquête administrative annoncée',cod:'Communiqué de fin de crise : remerciements, suivi des enfants, cellule d’écoute, numéro d’information.',strat:'Comment organiser la communication d’après-crise (parents, établissement, élus) et clôturer ? Que dire de l’enquête sans préjuger de ses résultats ?'}],
 cartes:[
 {id:'B1',canal:2,g:2,dest:'presse',delai:8,titre:'Le transporteur parle',texte:'Le patron de la société de transport affirme à Haute-Provence Info avoir « appelé la préfecture trois fois » et avoir reçu l’ordre de circuler. Le journaliste vous demande votre réaction avant publication.',tache:'Ne pas contredire par réflexe : s’en tenir aux faits vérifiés (chronologie des décisions), sans mise en cause.'},
 {id:'B2',canal:5,g:3,dest:'cod',delai:6,titre:'Une mère en direct',texte:'Une mère, en larmes sur les réseaux, filme depuis la route barrée : « Personne ne nous dit où est mon fils. » 20 000 vues en vingt minutes.',tache:'Message empathique, numéro dédié, consigne claire sans reproche.'},
 {id:'B3',canal:4,g:2,dest:'strategie',delai:8,titre:'Un parlementaire se rend au centre d’accueil',texte:'Un parlementaire annonce qu’il se rend au centre d’accueil des familles, accompagné de journalistes.',tache:'Décider : accueillir, encadrer ou différer. Préserver la sérénité des familles.'},
 {id:'B4',canal:6,g:2,dest:'strategie',delai:8,titre:'Le rectorat veut un message commun',texte:'Le rectorat veut publier un message aux parents et demande l’accord de la préfecture avant 17 h 30.',tache:'Convenir d’un message commun et du porte-parole.'}]},

{id:'eau',icone:'💧',titre:'Contamination de l’eau potable',niveau:'Intermédiaire',
 resume:'Contamination bactérienne du réseau d’eau potable : douze communes, 9 000 habitants, un EHPAD. Pénurie d’eau en bouteille, deux sources qui divergent sur la durée, rumeur de pollution volontaire, retard d’alerte contesté.',
 vars:{lieu:'la zone concernée par la contamination',commune:'Combeclaire',elu:'le président du syndicat des eaux',service:'l’ARS',media:['Haute-Provence Info','La Provence','France Bleu Provence'],nat:'franceinfo',rumeur:'l’eau aurait été volontairement polluée',ecart:'3 000 habitants concernés selon l’ARS, 9 000 selon le syndicat des eaux'},
 briefing:'Il est 08 h 15. L’ARS a détecté ce matin une contamination bactérienne du réseau d’eau potable du syndicat des eaux de la Combe. Douze communes sont concernées. Le COD est activé. Vous conseillez la préfète sur la stratégie de communication.',
 oral:'Il est 08 h 15. L’eau du robinet est contaminée sur douze communes. L’ARS recommande de ne plus la consommer telle quelle. Les mairies, les écoles et un EHPAD vous appellent. Premier tour : 15 minutes.',
 fil:[
 {h:'H+0',titre:'Contamination bactérienne du réseau',faits:'Des analyses révèlent une contamination bactérienne à la station de pompage. L’ARS recommande de ne pas consommer l’eau du robinet sans l’avoir fait bouillir, ou de boire de l’eau en bouteille. Douze communes sont concernées, dont deux écoles et un EHPAD. Les maires attendent des consignes précises.',bilan:'12 communes · environ 9 000 habitants · 2 écoles et 1 EHPAD concernés',cod:'Communiqué : périmètre exact (liste des communes), consigne sanitaire précise et partagée avec l’ARS, numéros utiles.',strat:'Quel message sanitaire unique, validé avec l’ARS ? Qui porte la parole ? Que dites-vous aux publics fragiles (nourrissons, personnes âgées) ?'},
 {h:'H+3 h',titre:'Pénurie d’eau en bouteille et durées contradictoires',faits:'Les rayons d’eau en bouteille sont vides dans les supermarchés, des files se forment. Douze personnes présentent des symptômes digestifs dans un village. Le syndicat des eaux annonce un retour à la normale en 48 heures, l’ARS évoque cinq jours. L’EHPAD signale un manque d’eau pour les résidents.',bilan:'12 communes · 12 cas digestifs · pénurie d’eau en bouteille · retour estimé 48 h ou 5 jours selon la source',cod:'Message sur les points de distribution d’eau (lieux, horaires, publics prioritaires) et la conduite à tenir en cas de symptômes.',strat:'Quelle durée annoncez-vous, alors que deux sources divergent ? Qui organise la distribution d’eau, avec quels moyens (mairies, sécurité civile, grande distribution) ?'},
 {h:'H+8 h',titre:'Rumeur de pollution volontaire, retard d’alerte',faits:'Une vidéo montre de l’eau trouble dans un village. Une rumeur accuse un éleveur d’avoir déversé du lisier près du captage. 45 personnes sont malades, 3 enfants sont hospitalisés. Un journal révèle que le premier résultat d’analyse était connu 24 heures avant l’alerte.',bilan:'45 cas digestifs · 3 hospitalisations · retard d’alerte contesté · éleveur mis en cause sur les réseaux',cod:'Message de prudence sur les causes (enquête en cours, personne n’est désigné) et sur les symptômes qui doivent conduire à consulter.',strat:'Le délai de 24 heures entre l’analyse et l’alerte : le reconnaître, et comment ? Quelle ligne face aux accusations visant l’éleveur ?'},
 {h:'H+30 h',titre:'Levée partielle des restrictions',faits:'De nouvelles analyses sont conformes dans huit communes, où les restrictions sont levées. Quatre communes restent concernées. Le parquet ouvre une enquête. Les commerçants et la restauration demandent une indemnisation. Les élus réclament un retour d’expérience.',bilan:'8 communes levées · 4 communes concernées · 52 cas · enquête ouverte',cod:'Communiqué de levée par secteur : carte, calendrier, précautions (purge des canalisations).',strat:'Comment éviter un message de fin trop optimiste ? Que dire de l’enquête et d’un éventuel retour d’expérience public ?'}],
 cartes:[
 {id:'E1',canal:1,g:2,dest:'cod',delai:6,titre:'Eau trouble en vidéo hors périmètre',texte:'Une vidéo montre de l’eau trouble dans une commune qui n’est pas dans le périmètre de restriction. Les habitants s’inquiètent et saturent la mairie.',tache:'Vérifier, répondre : périmètre exact, ce que l’on sait, ce que l’on ne sait pas encore.'},
 {id:'E2',canal:5,g:3,dest:'strategie',delai:7,titre:'La directrice de l’EHPAD alerte',texte:'La directrice de l’EHPAD déclare à une radio qu’elle n’a reçu « aucune consigne écrite » et qu’elle manque d’eau pour les résidents.',tache:'Prise en charge immédiate de l’établissement, et décision sur qui répond publiquement.'},
 {id:'E3',canal:2,g:2,dest:'presse',delai:8,titre:'Le courriel interne',texte:'Un journaliste dit détenir un courriel interne montrant que le syndicat avait été alerté la veille. Il publie dans 20 minutes et vous demande de confirmer.',tache:'Ne pas nier ni confirmer ce que vous n’avez pas vérifié ; renvoyer à l’ARS pour la chronologie ; ton factuel.'},
 {id:'E4',canal:4,g:2,dest:'strategie',delai:8,titre:'Le président du syndicat parle seul',texte:'Le président du syndicat des eaux annonce un retour à la normale « ce soir », alors que l’ARS parle de cinq jours.',tache:'Réaligner publiquement et rapidement ; décider du canal et du porte-parole.'}]},

{id:'repas',icone:'🍽️',titre:'Intoxication alimentaire lors d’un repas de village',niveau:'Accessible',
 resume:'Repas annuel des aînés dans une salle des fêtes : 160 convives, des dizaines de malades, un décès. Le traiteur est désigné sur les réseaux, le maire parle de « négligence criminelle ». Présomption d’innocence et prudence sur la cause.',
 vars:{lieu:'la salle des fêtes de Mont-Clar',commune:'Mont-Clar',elu:'le maire de Mont-Clar',service:'l’ARS',media:['Haute-Provence Info','La Provence','France Bleu Provence'],nat:'BFMTV',rumeur:'le traiteur aurait déjà été condamné pour des faits similaires',ecart:'40 malades selon les pompiers, 70 selon la mairie'},
 briefing:'Il est 21 h 00, un samedi soir. Le repas annuel des aînés de Mont-Clar a réuni 160 personnes dans la salle des fêtes. Depuis une heure, des dizaines de convives ont des vomissements. Les pompiers sont sur place. Le COD est activé a minima. Vous conseillez la préfète sur la stratégie de communication.',
 oral:'Il est 21 h. Des dizaines de convives d’un repas associatif sont malades. Les pompiers et le SAMU sont sur place. La presse locale a déjà appelé. Premier tour : 15 minutes.',
 fil:[
 {h:'H+0',titre:'Des dizaines de convives malades',faits:'Vingt-cinq convives sont malades, trois sont évacués vers l’hôpital. Les restes du repas ont été conservés par l’association. L’ARS et la direction départementale de la protection des populations sont informées. Aucune cause n’est établie.',bilan:'25 malades · 160 convives · 3 évacués',cod:'Premier message : faits, numéro d’information, conseil de ne pas consommer les restes du repas. Aucune cause avancée.',strat:'Que dit-on de la cause à ce stade ? Qui parle : le maire, l’ARS, la préfète ?'},
 {h:'H+3 h',titre:'Le traiteur est nommé',faits:'Soixante personnes sont malades, neuf sont hospitalisées, dont deux en réanimation. Le nom du traiteur circule dans la presse locale. L’ARS et la protection des populations ouvrent une enquête sanitaire. L’association organisatrice est sous le choc.',bilan:'60 malades · 9 hospitalisés dont 2 en réanimation · enquête sanitaire ouverte',cod:'Message pour les convives (symptômes, quand consulter, numéro) et point de situation pour la presse.',strat:'Le nom du traiteur circule : le confirmez-vous ? Quelle règle fixez-vous sur la désignation d’une entreprise avant les résultats ?'},
 {h:'H+12 h',titre:'Un décès, une rumeur, un maire qui accuse',faits:'Une convive de 84 ans décède à l’hôpital. La rumeur d’une condamnation passée du traiteur se répand, sa vitrine est dégradée. Plusieurs médias nationaux arrivent. Le maire parle d’une « négligence criminelle » à la radio.',bilan:'1 décès · 75 malades · 11 hospitalisés · traiteur menacé',cod:'Réponse écrite sur le décès (empathie, aucune cause) et appel au calme, avec rappel de la présomption d’innocence.',strat:'Comment protéger le traiteur sans paraître le défendre ? Comment encadrer les propos du maire ? Qui informe la famille avant la presse ?'},

function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.18);setTimeout(()=>{try{a.close()}catch(e){}},400)}catch(e){}}
const myLabel=()=>view==='mj'?chatFrom:(({strategie:'Stratégie',cod:'COD',presse:'Presse'})[view]+(S.joueurs[view]?' ('+S.joueurs[view]+')':''));
function unseenFor(v){return INJ().filter(i=>i.dest!=='tous'&&routeOf(i)===v&&!delivery(i)&&!(P[v].seen&&P[v].seen[i.id])).sort((a,b)=>a.t0-b.t0)}

 if(!S.running||S.ended)return '';

 return `<div class="modal"><div class="box g${i.g||1}"><div class="q">${q.length>1?q.length+' sollicitations en attente — voici la plus ancienne':'Nouvelle sollicitation'}</div>
 <div class="meta"><span class="tag">${esc(typeTag(i))}</span><span>${hhmm(i.t0)}</span><span>échéance <span class="cd" data-end="${i.t0+i.delai*60000}"></span></span></div>

 <textarea id="chat-in" data-bind="chat:draft" placeholder="Message (Entrée pour envoyer)">${esc(chatDraft)}</textarea>

function save(){S.rev=(S.rev||0)+1;lset(KS,S);lastRaw=snapshot()}
function savP(v){lset(KP(v),P[v]);lastRaw=snapshot()}
function log(txt,kind){S.journal.push({t:now(),txt:txt,kind:kind||'mj'})}
const scen=()=>ALL().find(s=>s.id===S.scenarioId)||ALL()[0];
const clk=()=>S.paused&&S.pauseStart?S.pauseStart:now();
const presseActive=()=>!!(S.presseOn||(S.presseAt&&now()>=S.presseAt));
const routeOf=i=>i.dest==='presse'?(presseActive()?'presse':'cod'):i.dest;
const PARTENAIRES=[{nom:'SDIS 04',mod:-1},{nom:'Gendarmerie',mod:0},{nom:'Mairie / maire',mod:-1},{nom:'Cabinet du ministre',mod:1},{nom:'Parquet (procureur)',mod:-2},{nom:'Ambassade / consulat',mod:0},{nom:'Météo-France',mod:0},{nom:'Opérateur (énergie, transport)',mod:0}];
const MODS=[{k:'argu',l:'Demande argumentée et factuelle',v:1},{k:'ton',l:'Ton courtois, respectueux de leur rôle',v:1},{k:'commun',l:'S’appuie sur un intérêt commun',v:1},{k:'contre',l:'Propose une solution (rectificatif conjoint…)',v:1},{k:'exig',l:'Exigence sans explication',v:-1},{k:'tardif',l:'Appel tardif, information déjà relayée',v:-1},{k:'hors',l:'Hors compétence du partenaire',v:-2},{k:'conflit',l:'Tension préexistante',v:-1}];
const NEEDVAL=['Communiqué de presse','Post réseaux sociaux','Message d’alerte','Point de situation'];
const VAL=()=>S.validation!==false;
function resultOf(t){
 if(t<=4)return{etat:'Refus',texte:p=>`${p} : « Non, nous ne pouvons pas donner suite. Ce n’est pas à nous de le faire et nous maintenons notre message. »`};
 if(t<=6)return{etat:'Refus avec alternative',texte:p=>`${p} : « Nous ne retirerons pas le message, mais nous pouvons le compléter par un rectificatif si vous nous transmettez le chiffre à jour. »`};
 if(t<=8)return{etat:'Accord avec délai',texte:p=>`${p} : « D’accord, ce sera fait d’ici une quinzaine de minutes, le temps de valider en interne. »`};
 if(t<=10)return{etat:'Accord rapide',texte:p=>`${p} : « C’est fait, vous le verrez en ligne dans cinq minutes. »`};
 return{etat:'Accord et coordination',texte:p=>`${p} : « Oui, et proposons un message commun : envoyez-nous votre texte, nous le publions en parallèle. »`};
}
function pseudo(){
 const out=[];
 (P.strategie.directives||[]).forEach(d=>out.push({id:'dir-'+d.id,type:'directive',dest:d.to,titre:'Instruction de la stratégie : '+d.titre,texte:d.texte,tache:'Exécuter, puis rendre compte (bouton « Exécutée »).',delai:d.delai||8,g:d.prio||1,canal:0,t0:d.t,tour:d.tour||1,ref:d.ref||''}));
 VIEWS.forEach(v=>(P[v].requetes||[]).forEach(r=>out.push({id:'req-'+r.id,type:'demande',dest:'strategie',titre:'Demande du '+DESTL[v],texte:r.texte,tache:'Donner une instruction à la cellule demandeuse.',delai:6,g:2,canal:0,t0:r.t,tour:r.tour||1,from:v})));
 (P.cod.drafts||[]).forEach(dr=>{if(dr.statut==='soumis')out.push({id:'val-'+dr.id+'#'+(dr.v||0),type:'validation',dest:'strategie',titre:'À valider : '+dr.type,texte:dr.texte,tache:'Valider ou demander des modifications.',delai:5,g:2,canal:0,t0:dr.soumisT||0,tour:1,from:'cod'})});
 Object.keys(P.strategie.valid||{}).forEach(key=>{const id='val-'+key;if(out.some(o=>o.id===id))return;const v=P.strategie.valid[key];out.push({id:id,type:'validation',dest:'strategie',titre:'À valider : '+(v.type||''),texte:v.texte||'',tache:'',delai:5,g:2,canal:0,t0:v.soumisT||v.t,tour:1,from:'cod'})});
 return out;
}
function INJ(){return S.injects.concat(pseudo())}
function typeTag(i){if(i.type==='friction')return 'Imprévu interne';return ({directive:'Instruction',demande:'Demande',validation:'Validation',reponse:'Réponse partenaire'})[i.type]||(i.canal?CANAL[i.canal]:'Fil rouge')}
function dirStatus(d){const id='dir-'+d.id;let seen=null,done=null;VIEWS.forEach(v=>{if(P[v].seen&&P[v].seen[id]&&!seen)seen=P[v].seen[id];const it=P[v].items[id];if(it&&it.done)done=it.t});return{seen:seen,done:done}}
function delivery(i){
 if(i.type==='demande'){const d=(P.strategie.directives||[]).find(x=>x.ref===i.id);if(d)return{vue:'strategie',t:d.t,texte:'Instruction donnée : '+d.texte,type:'Instruction'}}
 if(i.type==='validation'){const v=(P.strategie.valid||{})[i.id.slice(4)];if(v)return{vue:'strategie',t:v.t,texte:(v.etat==='valide'?'Validé':'Modifications demandées')+(v.comm?' : '+v.comm:''),type:'Validation'}}

 for(const v of VIEWS){const it=P[v].items[i.id];if(it&&it.done)return Object.assign({vue:v},it)}
 let best=null;
 VIEWS.forEach(v=>{(P[v].prods||[]).forEach(x=>{if(x.ref===i.id&&(!best||x.t<best.t))best={vue:v,t:x.t,texte:x.texte,type:x.type}})});
 return best;
}
const isEchu=i=>clk()>i.t0+i.delai*60000;
const weight=i=>1+(isEchu(i)?1:0)+((i.g||1)>=3?1:0);
function openFor(v){return INJ().filter(i=>i.dest!=='tous'&&routeOf(i)===v&&!delivery(i))}
function loads(){const o={};VIEWS.forEach(v=>{o[v]=openFor(v).reduce((a,i)=>a+weight(i),0)});return o}
function deck(){const s=scen();return genCards(s.vars).concat(s.cartes||[])}

/* ============ Moteur ============ */
function addInject(o,type){
 const i=Object.assign({id:'i'+(S.seq++),type:type,tour:S.tour,t0:clk(),g:1,delai:8,canal:0,tache:''},o);
 S.injects.push(i);
 log(`Inject (${DESTL[i.dest]}) : ${i.titre}`,'inject');
 return i;
}
function startTour(){
 const s=scen(),f=s.fil[S.tour-1];if(!f)return;
 S.situation.push({tour:S.tour,h:f.h,titre:f.titre,faits:f.faits,bilan:f.bilan,t:now()});
 S.tourEnd=clk()+S.tourMinutes*60000;
 log(`Tour ${S.tour} (${f.h}) : ${f.titre}`,'tour');
 const d=Math.max(3,Math.round(S.tourMinutes*0.7));
 addInject({dest:'cod',g:1,delai:d,titre:'Production attendue : '+f.titre,texte:'Bilan : '+f.bilan,tache:f.cod},'fil');
 addInject({dest:'strategie',g:1,delai:d,titre:'Arbitrage attendu : '+f.titre,texte:'Bilan : '+f.bilan,tache:f.strat},'fil');
}
function startExercise(){
 S.running=true;S.tour=1;S.started=now();S.ended=false;
 log('Début de l’exercice','tour');
 startTour();save();tab='pilot';render();
}
function nextTour(){
 const s=scen();
 if(S.tour>=s.fil.length){if(confirm('Dernier tour atteint. Clôturer l’exercice et passer au retex ?')){S.ended=true;S.running=false;log('Fin de l’exercice','tour');save();tab='retex';render()}return}
 S.tour++;startTour();save();render();
}
function resetAll(){
 const keep={scenarioId:S.scenarioId,tourMinutes:S.tourMinutes,presseOn:S.presseOn,joueurs:S.joueurs};
 S=Object.assign(newState(),keep);
 VIEWS.forEach(v=>{P[v]=newProd();savP(v)});
 CHKEYS.forEach(k=>lset(k,[]));CH=[];lastRaw=snapshot();
 save();tab='prep';render();
}
function pickCard(c,level){
 let pool=deck().filter(x=>x.canal===c&&!S.usedCards.includes(x.id));
 if(!pool.length)pool=deck().filter(x=>x.canal===c);
 let sel=pool.filter(x=>x.g===level);
 if(!sel.length)sel=pool.filter(x=>x.g<=level);
 if(!sel.length)sel=pool;
 return sel.length?pickOne(sel):null;
}
function frictionCard(f){
 const fr=frictionsOf(scen().vars);
 const kind=f<=4?'retard':(f===5?'partenaire':'panne');
 const c=pickOne(fr[kind]);
 return Object.assign({id:'FR'+rnd(99999),canal:0,kind:kind},c);
}
const AGG=['Situation stable : pas de fait nouveau','Fait nouveau sur le terrain','Fait nouveau + fuite ou rumeur','Rebond majeur'];
const FRL=f=>f<=2?'Tout fonctionne':(f<=4?'Information en retard ou contradictoire':(f===5?'Un partenaire communique de son côté':'Panne ou indisponibilité'));
function rollDice(){
 const a=rnd(6),c=rnd(6),f=rnd(6);
 const level=a<=2?0:(a<=4?1:(a===5?2:3));
 S.dice={a:a,c:c,f:f,level:level,card:level?pickCard(c,level):null,fr:f>=3?frictionCard(f):null,t:now()};
 log(`Dés : aggravation ${a} (${AGG[level]}), canal ${c} (${CANAL[c]}), friction ${f} (${FRL(f)})`,'des');
 save();render();
}

function checkScen(o){
 if(!o||typeof o!=='object'||Array.isArray(o))return 'structure invalide.';
 if(!o.id||!/^[\w-]+$/.test(o.id))return 'id manquant ou invalide (lettres, chiffres, tirets).';
 if(!o.titre)return 'titre manquant.';
 if(!o.briefing)return 'briefing manquant.';
 const v=o.vars;if(!v||!Array.isArray(v.media)||v.media.length<3)return 'vars.media doit contenir 3 médias.';
 const miss=['lieu','commune','elu','service','nat','rumeur','ecart'].filter(k=>!v[k]);if(miss.length)return 'vars manquants : '+miss.join(', ')+'.';
 if(!Array.isArray(o.fil)||!o.fil.length)return 'fil (liste des tours) manquant.';
 for(let i=0;i<o.fil.length;i++){const f=o.fil[i]||{};const m=['h','titre','faits','bilan','cod','strat'].filter(k=>!f[k]);if(m.length)return 'tour '+(i+1)+' : champs manquants ('+m.join(', ')+').'}
 if(o.cartes){if(!Array.isArray(o.cartes))return 'cartes doit être une liste.';
  for(const c of o.cartes){
   if(!c||!c.id||!c.titre||!c.texte||!c.tache)return 'carte incomplète ('+((c&&c.id)||'?')+').';
   if(!(c.canal>=1&&c.canal<=6))return 'carte '+c.id+' : canal de 1 à 6.';
   if(['cod','presse','strategie'].indexOf(c.dest)<0)return 'carte '+c.id+' : dest = cod, presse ou strategie.';
   if(!(c.g>=1&&c.g<=3))return 'carte '+c.id+' : g de 1 à 3.';
  }}
 return '';
}
$('#imp').addEventListener('change',e=>{

 Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res({n:f.name,t:r.result});r.onerror=()=>res({n:f.name,t:null});r.readAsText(f)}))).then(list=>{
  const ok=[],ko=[];let c=lget(KC,[]);
  list.forEach(x=>{
   try{
    if(x.t===null)throw new Error('lecture impossible');
    const j=JSON.parse(x.t);const arr=Array.isArray(j)?j:[j];
    arr.forEach(o=>{const m=checkScen(o);if(m)throw new Error(m)});
    arr.forEach(o=>{c=c.filter(y=>y.id!==o.id);c.push(o);ok.push(o.titre)});

  });
  if(ok.length)lset(KC,c);

  render();
 });
});

   <input type="text" id="d-tache" data-bind="draft:tache" placeholder="Ce que l’on attend d’eux" value="${esc(dr.tache||'')}" style="margin-top:6px">
   <div class="row" style="margin-top:6px"><button class="btn" data-act="manual">Injecter</button></div></div>
 </div></div>
 <div class="card"><h2>Tous les injects</h2><table><tr><th>Heure</th><th>Cible</th><th>Titre</th><th>Type</th><th>État</th></tr>${rows}</table></div>`;
}
function allLibre(){let a=[];VIEWS.forEach(v=>{a=a.concat(P[v].libre||[]);(P[v].prods||[]).filter(x=>!x.ref).forEach(x=>a.push({id:x.id,type:x.type,texte:x.texte,t:x.t,vue:v}))});return a.sort((x,y)=>x.t-y.t)}
function rateBtns(id){
 const n=(S.notes[id]||{}).n;
 return `<div class="rate"><button class="btn sec small okb ${n==='ok'?'on':''}" data-act="note" data-id="${id}" data-n="ok">✓ Solide</button><button class="btn sec small midb ${n==='mid'?'on':''}" data-act="note" data-id="${id}" data-n="mid">~ À reprendre</button><button class="btn sec small kob ${n==='ko'?'on':''}" data-act="note" data-id="${id}" data-n="ko">✗ Hors cible</button></div>
 <textarea id="nt-${id}" data-bind="note:${id}" style="min-height:44px;margin-top:4px" placeholder="Commentaire pour le retex">${esc((S.notes[id]||{}).c||'')}</textarea>`;
}
function tabProd(){
 const L=P.strategie.ligne;
 const inj=INJ().filter(i=>i.dest!=='tous').slice().reverse();
 const cards=inj.map(i=>{const dv=delivery(i);return `<div class="card inj g${i.g||1} ${dv?'done':''}"><div class="meta"><span class="tag">${DESTL[routeOf(i)]}</span><span>tour ${i.tour}</span>${(P[routeOf(i)].seen||{})[i.id]?`<span>vu à ${hhmm(P[routeOf(i)].seen[i.id])} (+${mmss(P[routeOf(i)].seen[i.id]-i.t0)})</span>`:(i.dest!=='tous'&&!dv?'<span style="color:var(--ko)">pas encore vu</span>':'')}${dv?`<span class="ok">livré en ${mmss(dv.t-i.t0)}${dv.t>i.t0+i.delai*60000?' (hors délai)':''}</span>`:'<span style="color:var(--ko)">non livré</span>'}</div><h4>${esc(i.titre)}</h4><div class="muted">${esc(i.tache)}</div>${dv?`<div class="card" style="background:#f7f7f7;margin-top:6px">${dv.type?'<b>['+esc(dv.type)+']</b><br>':''}${nl(dv.texte)}</div>`:''}${rateBtns(i.id)}</div>`}).join('');
 const lib=allLibre().map(x=>`<div class="card"><div class="meta"><span class="tag">${esc(x.type)}</span><span>${DESTL[x.vue]} · ${hhmm(x.t)}</span></div><div>${nl(x.texte)}</div>${rateBtns(x.id)}</div>`).join('');
 return `<div class="grid2"><div><h2>Livraisons des joueurs</h2>${cards||'<div class="info">Aucun inject pour l’instant.</div>'}</div>
 <div><div class="card"><h2>Ligne de la stratégie</h2>${L.publie?`<p class="muted">v${L.v} publiée à ${hhmm(L.t)}</p><p><b>Objectif :</b> ${esc(L.objectif)}</p><p><b>Messages :</b><br>${nl(L.messages)}</p><p><b>Cibles :</b> ${esc(L.cibles)}</p><p><b>Prochaine prise de parole :</b> ${esc(L.prochaine)}</p>${rateBtns('ligne')}`:'<span class="muted">Rien de publié.</span>'}</div>
 <h2>Productions d’initiative</h2>${lib||'<div class="info">Aucune production d’initiative.</div>'}</div></div>`;
}
function timeline(){
 const ev=S.journal.map(j=>({t:j.t,txt:j.txt,kind:j.kind}));
 INJ().forEach(i=>{const dv=delivery(i);if(dv)ev.push({t:dv.t,txt:`${DESTL[dv.vue]} livre : ${i.titre}`,kind:'livraison'})});
 allLibre().forEach(x=>ev.push({t:x.t,txt:`${DESTL[x.vue]} publie (initiative) : ${x.type}`,kind:'livraison'}));
 if(P.strategie.ligne.publie)ev.push({t:P.strategie.ligne.t,txt:`Ligne stratégique publiée (v${P.strategie.ligne.v})`,kind:'livraison'});
 (P.strategie.directives||[]).forEach(d=>ev.push({t:d.t,txt:`Stratégie → ${DESTL[d.to]} : instruction « ${d.titre} »`,kind:'livraison'}));
 (P.strategie.appels||[]).forEach(c=>{ev.push({t:c.t,txt:`Stratégie appelle : ${c.partenaire}`,kind:'livraison'});const r=S.appelsRep[c.id];if(r)ev.push({t:r.t,txt:`${c.partenaire} répond : ${r.etat}`,kind:'alerte'})});
 Object.keys(P.strategie.valid||{}).forEach(k=>{const v=P.strategie.valid[k];ev.push({t:v.t,txt:`Validation ${v.etat==='valide'?'accordée':'refusée'} : ${v.type}`,kind:'livraison'})});
 VIEWS.forEach(v=>(P[v].requetes||[]).forEach(r=>ev.push({t:r.t,txt:`${DESTL[v]} sollicite la stratégie`,kind:'alerte'})));
 P.cod.renforts.forEach(r=>ev.push({t:r.t,txt:`COD demande un renfort (${r.type})`,kind:'alerte'}));
 return ev.sort((a,b)=>a.t-b.t);
}
function stats(){
 const inj=INJ().filter(i=>i.dest!=='tous');
 const st={total:inj.length,livres:0,hors:0,non:0,delais:[],ok:0,mid:0,ko:0};
 inj.forEach(i=>{const dv=delivery(i);if(dv){st.livres++;st.delais.push(dv.t-i.t0);if(dv.t>i.t0+i.delai*60000)st.hors++}else st.non++;
  const n=(S.notes[i.id]||{}).n;if(n)st[n]++});
 allLibre().forEach(x=>{const n=(S.notes[x.id]||{}).n;if(n)st[n]++});
 st.moy=st.delais.length?st.delais.reduce((a,b)=>a+b,0)/st.delais.length:0;
 return st;
}
function constats(){
 const c=[],sf=S.satFirst,r1=P.cod.renforts.length?P.cod.renforts[0].t:null,st=stats();
 if(!sf.orange)c.push('Le COD n’a jamais dépassé le seuil « tendu » : la charge a été absorbée, ou le jeu n’était pas assez dense.');
 else{
  c.push(`Seuil « tendu » atteint à ${hhmm(sf.orange)}${sf.rouge?`, seuil « saturé » à ${hhmm(sf.rouge)}`:''}.`);
  if(!r1)c.push(sf.rouge?'Le COD est arrivé à saturation sans jamais demander de renfort : point central du débrief.':'Aucun renfort n’a été demandé.');
  else{const dm=(r1-sf.orange)/60000;c.push(dm<=3?`Renfort demandé ${Math.max(0,dm).toFixed(1)} min après le seuil « tendu » : réflexe adapté.`:`Renfort demandé ${dm.toFixed(1)} min après le seuil « tendu » : plus tôt aurait été plus sûr.`)}
 }
 if(st.hors)c.push(`${st.hors} production(s) livrée(s) hors délai, ${st.non} non livrée(s).`);else if(st.non)c.push(`${st.non} sollicitation(s) restée(s) sans réponse.`);
 if(S.presseAt||S.presseOn)c.push('Un binôme presse a été engagé : observez comment la répartition des rôles a été organisée.');
 if(P.strategie.ligne.publie)c.push(`La stratégie a publié ${P.strategie.ligne.v} version(s) de sa ligne.`);else c.push('La stratégie n’a pas publié de ligne : le COD a travaillé sans cadrage.');
 return c;
}
function coordStats(){
 const ds=P.strategie.directives||[];const rc=[],ex=[];
 ds.forEach(d=>{const s=dirStatus(d);if(s.seen)rc.push(s.seen-d.t);if(s.done)ex.push(s.done-d.t)});
 const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
 const vals=Object.values(P.strategie.valid||{});
 const rq=[];VIEWS.forEach(v=>(P[v].requetes||[]).forEach(r=>{const d=ds.find(x=>x.ref==='req-'+r.id);rq.push(d?d.t-r.t:null)}));
 const ap=P.strategie.appels||[];
 return{dirs:ds.length,exec:ex.length,dExec:avg(ex),vals:vals.length,ok:vals.filter(v=>v.etat==='valide').length,refus:vals.filter(v=>v.etat==='refus').length,dVal:avg(vals.map(v=>v.t-v.soumisT)),req:rq.length,reqOk:rq.filter(x=>x!==null).length,dReq:avg(rq.filter(x=>x!==null)),ap:ap.length,issues:ap.map(c=>c.partenaire+' : '+(S.appelsRep[c.id]?S.appelsRep[c.id].etat:'sans réponse'))};
}
function coordHtml(){
 const c=coordStats();
 return `<div class="card"><h2>Coordination</h2><table>
 <tr><th>Instructions données</th><td>${c.dirs} (exécutées : ${c.exec}, délai moyen ${mmss(c.dExec)})</td></tr>
 <tr><th>Demandes d’arbitrage</th><td>${c.req} (traitées : ${c.reqOk}, délai moyen ${mmss(c.dReq)})</td></tr>
 <tr><th>Validations</th><td>${c.vals} (validées : ${c.ok}, modifications demandées : ${c.refus}, délai moyen ${mmss(c.dVal)})</td></tr>
 <tr><th>Appels aux partenaires</th><td>${c.ap}${c.issues.length?' — '+c.issues.map(esc).join(' · '):''}</td></tr></table></div>`;
}
function retexHtml(s){
 const st=stats(),tl=timeline();
 return `<div class="card"><h2>Chiffres</h2><table><tr><th>Sollicitations</th><td>${st.total}</td><th>Livrées</th><td>${st.livres}</td></tr><tr><th>Hors délai</th><td>${st.hors}</td><th>Non livrées</th><td>${st.non}</td></tr><tr><th>Délai moyen</th><td>${mmss(st.moy)}</td><th>Notation</th><td>✓ ${st.ok} · ~ ${st.mid} · ✗ ${st.ko}</td></tr></table></div>
 ${coordHtml()}
 <div class="card"><h2>Constats automatiques</h2><ul>${constats().map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 ${GRIST&&JR.length?`<div class="card"><h2>Qui a fait quoi (comptes Grist)</h2><table><tr><th>Heure</th><th>Compte</th><th>Poste</th><th>Action</th></tr>${JR.map(j=>`<tr><td>${hhmm(j.t)}</td><td>${esc(j.auteur||'—')}</td><td>${esc(j.vue)}</td><td>${esc(j.type)} ${esc(j.txt)}</td></tr>`).join('')}</table></div>`:''}
 <div class="card"><h2>Chronologie</h2><ul class="tl">${tl.map(e=>`<li class="${e.kind}"><b>${hhmm(e.t)}</b> — ${esc(e.txt)}</li>`).join('')}</ul></div>`;
}
function tabRetex(s){
 return `<div class="row noprint card"><button class="btn" data-act="exportdoc">Exporter pour Word (.doc)</button><button class="btn sec" data-act="print">Imprimer / PDF</button><button class="btn sec" data-act="exportjson">Sauvegarde JSON</button></div>
 <div class="grid2"><div>${retexHtml(s)}</div><div>
  <div class="card"><h2>Questions de retex</h2><ol>
  <li>Quelles décisions avez-vous prises, et pourquoi ?</li><li>Quel a été le moment de bascule ?</li><li>La ligne de la stratégie a-t-elle guidé le COD ? Qu’aurait-il fallu qu’elle contienne ?</li><li>À quel moment auriez-vous dû appeler un appui ? Qu’est-ce qui vous a retenu ?</li><li>Quelle règle ajouter à notre doctrine de crise ?</li></ol></div>
  <div class="card"><h2>Réflexes du COD seul face à la pression</h2><ol>
  <li><b>Mesurer</b> : trois demandes ouvertes, ou une échue, c’est le seuil d’alerte.</li>
  <li><b>Trier</b> : ce qui touche à la sécurité, puis la cohérence, puis le reste.</li>
  <li><b>Annoncer une cadence</b> : « prochain point à H+30 » achète du temps.</li>
  <li><b>Standardiser</b> : un message d’attente déjà validé évite l’improvisation.</li>
  <li><b>Déléguer tôt</b> : presse au binôme, relecture à un tiers. Un renfort inutile coûte peu, un COD saturé coûte une erreur publique.</li>
  <li><b>Remonter</b> : prévenir la stratégie quand la pression change de nature (mise en cause, famille, élu).</li>
  <li><b>Ne pas combler les trous</b> : on ne publie que ce qui est établi et validé.</li></ol></div>
 </div></div>`;

function exportDoc(){
 const s=scen(),st=stats();
 const prods=INJ().filter(i=>i.dest!=='tous').map(i=>{const dv=delivery(i);const n=(S.notes[i.id]||{});return `<h3>${esc(i.titre)} (${DESTL[routeOf(i)]})</h3><p><i>${esc(i.tache)}</i></p><p>${dv?nl(dv.texte)+`<br><small>Livré en ${mmss(dv.t-i.t0)}</small>`:'<b>Non livré</b>'}</p>${n.n?`<p>Appréciation : ${n.n==='ok'?'solide':(n.n==='mid'?'à reprendre':'hors cible')}${n.c?' — '+esc(n.c):''}</p>`:''}`}).join('');
 const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Retex wargame</title></head><body style="font-family:Calibri,Arial"><h1>Retour d’expérience — wargame de communication de crise</h1><p>Scénario : <b>${esc(s.titre)}</b> · ${new Date().toLocaleDateString('fr-FR')}</p>
 <h2>Chiffres</h2><p>Sollicitations : ${st.total} · livrées : ${st.livres} · hors délai : ${st.hors} · non livrées : ${st.non} · délai moyen : ${mmss(st.moy)}</p>
 <h2>Constats</h2><ul>${constats().map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <h2>Chronologie</h2><ul>${timeline().map(e=>`<li>${hhmm(e.t)} — ${esc(e.txt)}</li>`).join('')}</ul>
 <h2>Coordination</h2><p>Instructions : ${coordStats().dirs} · demandes d’arbitrage : ${coordStats().req} · validations : ${coordStats().vals} · appels : ${coordStats().issues.map(esc).join(' ; ')||'aucun'}</p>
 <h2>Échanges de la messagerie</h2><ul>${CH.map(m=>`<li>${hhmm(m.t)} — <b>${esc(m.from)}</b> : ${esc(m.txt)}</li>`).join('')||'<li>Aucun échange.</li>'}</ul>
 <h2>Productions</h2>${prods}
 <h2>Questions de retex</h2><ol><li>Quelles décisions, et pourquoi ?</li><li>Quel moment de bascule ?</li><li>La ligne de la stratégie a-t-elle guidé le COD ?</li><li>Quand appeler un appui ?</li><li>Quelle règle ajouter à la doctrine ?</li></ol></body></html>`;
 download('retex-wargame-'+new Date().toISOString().slice(0,10)+'.doc',html,'application/msword');

/* ============ Rendu, minuteurs, synchronisation ============ */
function render(){
 const act=document.activeElement;
 const aid=act&&act.id,ss=act&&act.selectionStart,se=act&&act.selectionEnd;
 const sc=window.scrollY;
 if(chatOpen&&CH.length&&CH[CH.length-1].t>chatRead){chatRead=CH[CH.length-1].t;locset(KRk(),chatRead)}
 try{
  const isP=VIEWS.indexOf(view)>=0;
  $('#app').innerHTML=!view?pickerHtml():(view==='mj'?renderMJ():(isP?renderPlayer(view):'<main>Vue inconnue</main>'))+(isP?modalHtml(view):'')+(view?chatHtml():'')+footHtml();
  const cnt=isP?unseenFor(view).length:0,lastMsg=CH.length?CH[CH.length-1]:null;
  if(lastCount>=0&&(cnt>lastCount||(lastMsg&&lastChat>=0&&CH.length>lastChat&&lastMsg.v!==view)))beep();
  lastCount=cnt;lastChat=CH.length;
  const mm=document.getElementById('chat-msgs');if(mm)mm.scrollTop=mm.scrollHeight;
 }
 catch(e){$('#app').innerHTML='<main><div class="alert">Erreur d’affichage : '+esc(e.message)+'</div></main>';console.error(e)}
 if(aid){const n=document.getElementById(aid);if(n){n.focus();try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}
 window.scrollTo(0,sc);
 tick();
}
function tick(){
 const c=clk();
 document.querySelectorAll('.cd').forEach(n=>{const r=(+n.dataset.end)-c;n.textContent=r>=0?mmss(r):'échu +'+mmss(-r);n.classList.toggle('late',r<0)});
 document.querySelectorAll('.tcd').forEach(n=>{const r=(+n.dataset.end)-c;n.textContent=r>=0?mmss(r):'+'+mmss(-r)});
 document.querySelectorAll('.chr').forEach(n=>{const e=chronos[n.dataset.id];if(!e){n.textContent='';return}const r=e-now();n.textContent=r>0?mmss(r):'Temps écoulé';n.style.color=r>0?'':'var(--ko)'});
}
function derive(){
 if(view!=='mj'||!S.running||S.paused)return;
 let ch=false;const l=loads();
 if(l.cod>=4&&!S.satFirst.orange){S.satFirst.orange=now();log('Seuil « tendu » atteint côté COD','alerte');ch=true}
 if(l.cod>=7&&!S.satFirst.rouge){S.satFirst.rouge=now();log('Seuil « saturé » atteint côté COD','alerte');ch=true}
 if(S.presseAt&&now()>=S.presseAt&&!S.presseLogged){S.presseLogged=true;log('Le binôme presse prend la main','alerte');ch=true}
 if(ch){save();render()}
}
function poll(){
 const raw=snapshot();
 if(raw!==lastRaw){
  lastRaw=raw;
  S=Object.assign(newState(),lget(KS,{}));
  CH=loadCH();
  VIEWS.forEach(v=>{P[v]=Object.assign(newProd(),lget(KP(v),{}))});
  render();
 }
}
function reloadAll(){
 S=Object.assign(newState(),lget(KS,{}));
 VIEWS.forEach(v=>{P[v]=Object.assign(newProd(),lget(KP(v),{}))});
 CH=loadCH();
}
let started=false;
function startLoops(){
 started=true;
 chatRead=view?+(locget(KRk())||0):0;
 window.addEventListener('storage',poll);
 setInterval(()=>{poll();derive();tick()},1000);
 lastRaw=snapshot();render();
}
function startLocal(){
 if(started)return;
 GRIST=false;
 view=viewParam||locget('wgcc_role')||'mj';
 reloadAll();startLoops();
}
async function initGrist(){
 try{
  grist.ready({requiredAccess:'full'});
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Grist ne répond pas')),ms))]);
  const tabs=await withTimeout(grist.docApi.listTables(),8000);
  GRIST=true;
  const acts=[];
  if(tabs.indexOf('WG_Kv')<0)acts.push(['AddTable','WG_Kv',[{id:'Cle',type:'Text'},{id:'Valeur',type:'Text'},{id:'Maj',type:'Numeric'}]]);
  if(tabs.indexOf('WG_Journal')<0)acts.push(['AddTable','WG_Journal',[{id:'Quand',type:'Numeric'},{id:'Heure',type:'Text'},{id:'Vue',type:'Text'},{id:'Type',type:'Text'},{id:'Texte',type:'Text'}]]);
  if(acts.length)await grist.docApi.applyUserActions(acts);
  if(tabs.indexOf('WG_Journal')<0){
   try{await grist.docApi.applyUserActions([['AddColumn','WG_Journal','Auteur',{type:'Text',isFormula:false,formula:'user.Name',recalcWhen:1}]])}
   catch(e){try{await grist.docApi.applyUserActions([['AddColumn','WG_Journal','Auteur',{type:'Text'}]])}catch(e2){}}
  }
  await gfetch();
  view=viewParam||locget('wgcc_role')||'';
  reloadAll();startLoops();
  let busy=false,n=0;
  setInterval(async()=>{if(busy)return;busy=true;try{await gfetch();if(view==='mj'&&(n++%4===0)){const c=JR.length;await gfetchJ();if(JR.length!==c&&tab==='retex')render()}poll()}catch(e){gerr(e)}busy=false},1500);
 }catch(e){
  console.error(e);
  if(GRIST){$('#app').innerHTML='<main><div class="alert"><b>Connexion à Grist impossible.</b><br>'+esc(e.message||e)+'<br>Le widget doit avoir un accès complet au document (« Accès complet ») et votre compte doit pouvoir modifier le document.</div></main>'}
  else startLocal();
 }
}
(function init(){
 if(window.grist&&window.grist.docApi){initGrist();return}
 let inFrame=false;try{inFrame=window.top!==window.self}catch(e){inFrame=true}
 if(!inFrame){startLocal();return}
 $('#app').innerHTML='<main><div class="info">Connexion à Grist…</div></main>';
 const s=document.createElement('script');
 s.src='https://docs.getgrist.com/grist-plugin-api.js';
 s.onload=()=>initGrist();
 s.onerror=()=>startLocal();
 document.head.appendChild(s);
 setTimeout(()=>{if(!started&&!GRIST)startLocal()},9000);
})();
})();
</script>
