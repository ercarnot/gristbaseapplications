ption": "Ce que l'on fait d'abord, ce qui vient ensuite, ce qui reste en dernier recours.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 32, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "Le moment", "Synonymes": "à ce stade (l'état présent) ; à court terme ; à terme ; dans la durée (soutenu)", "Description": "Situer l'action ou l'information dans le temps.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 33, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La prudence", "Synonymes": "à titre conservatoire (juridique) ; par précaution (courant) ; sous réserve de ; sans préjuger de (soutenu)", "Description": "Avancer sans rien affirmer au-delà de ce qui est établi.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 34, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La justification", "Synonymes": "eu égard à (soutenu) ; au regard de ; compte tenu de (courant) ; à la lumière de", "Description": "Fonder une décision ou un jugement sur un élément précis.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 35, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La nuance", "Synonymes": "sans pour autant ; certes… mais ; à condition que ; sauf à (soutenu)", "Description": "Concéder, conditionner ou opposer pour affiner un propos.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 36, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La conclusion", "Synonymes": "en définitive (soutenu) ; en tout état de cause ; c'est pourquoi ; au total (courant)", "Description": "Refermer un raisonnement et en tirer la suite.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 37, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "Les échanges et la boucle", "Synonymes": "en boucle courte (échanges rapides avec retour) ; en circuit court (peu d'intermédiaires) ; au fil de l'eau (en continu)", "Description": "La vitesse et le sens de circulation de l'information entre acteurs.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 38, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La décision et la validation", "Synonymes": "arbitrer (choisir entre options) ; trancher (mettre fin à l'hésitation) ; entériner (confirmer) ; acter (rendre définitif)", "Description": "Choisir, faire valider et décider vite.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 39, "Theme": "Crise feux de forêt", "Axe": "Phénomène", "Notion": "Le feu", "Synonymes": "l'incendie (le sinistre) ; le sinistre (vue administrative) ; le front de flamme (la ligne qui avance)", "Description": "L'événement lui-même : comment il démarre, avance, se fixe et s'éteint.", "Introduction": "« Déclarer », emprunté au latin declarare (« faire voir clairement ; annoncer officiellement »), signifie d'abord « faire connaître d'une façon manifeste ». L'Académie y range, à l'emploi pronominal, « un incendie se déclara en pleine nuit » et, au figuré, « la maladie s'est enfin déclarée ». « Survenir », du latin supervenire (super, « sur », et venire, « venir »), signifie « se produire de manière inattendue, arriver subitement ».", "Lecture": "Deux images distinctes : se déclarer suppose quelque chose qui existait déjà, couvait, et devient manifeste (le feu qui prend, la maladie qui se révèle) ; survenir présente un événement qui vient s'ajouter de l'extérieur, sans préavis (un accident, une arrivée). C'est une lecture à partir des définitions : je n'ai pas trouvé de source linguistique qui l'énonce comme règle d'usage.", "Sources": "Dictionnaire de l'Académie française, 9e éd., article « déclarer » ; La langue française, article « survenir »."}, {"id": 40, "Theme": "Crise feux de forêt", "Axe": "Phénomène", "Notion": "La zone et le terrain", "Synonymes": "le massif (l'espace boisé) ; le secteur (la portion d'intervention) ; l'interface habitat-forêt (là où l'habitat touche la végétation)", "Description": "Où le feu brûle, et ce que le terrain facilite ou complique.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 41, "Theme": "Crise feux de forêt", "Axe": "Phénomène", "Notion": "Le risque et la vigilance", "Synonymes": "le danger (la menace) ; l'aléa (la probabilité) ; la vigilance (l'état d'alerte)", "Description": "L'évaluation du risque et son évolution.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 42, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "L'intervention", "Synonymes": "l'engagement des secours ; la lutte (l'action contre le feu) ; la surveillance (la durée)", "Description": "Ce que font les équipes : attaquer, tenir, surveiller.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 43, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "La population", "Synonymes": "les habitants ; les riverains ; les personnes évacuées", "Description": "Ce que vit la population et la manière dont on la protège.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 44, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "Les dispositifs et les moyens", "Synonymes": "le dispositif (le plan activé) ; les moyens (les équipes et le matériel) ; les renforts", "Description": "Ce que l'autorité décide et ce qu'elle mobilise.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 45, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "Les dégâts et la reprise", "Synonymes": "les dommages ; le bilan ; la remise en état", "Description": "Le bilan matériel et humain et le temps long de la reconstruction.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 46, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "La prévention", "Synonymes": "l'action en amont ; la culture du risque ; l'obligation de débroussaillement", "Description": "Agir avant la saison : entretenir, réglementer, sensibiliser.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 47, "Theme": "Probité publique", "Axe": "Phénomène", "Notion": "Les faits", "Synonymes": "l'atteinte à la probité (la famille d'infractions) ; le manquement au devoir de probité (l'idée) ; le délit (la qualification pénale)", "Description": "Ce que la loi sanctionne : corruption, trafic d'influence, prise illégale d'intérêts, concussion, détournement, favoritisme.", "Introduction": "« Atteinte » vient du verbe atteindre, du latin attingere, « arriver à, parvenir à ». Dès l'ancien français (vers 1100), le verbe signifie aussi « attaquer, toucher » ; au XIIe siècle, « blesser » ; vers 1165, « convaincre quelqu'un d'une faute », d'où la formule judiciaire « atteint et convaincu de », en usage jusqu'au début du XIXe siècle. « Probité » vient du latin probitas, dérivé de probus, « honnête ».", "Lecture": "Le même verbe a servi pour le coup porté à un corps et pour la faute reconnue par un juge. Parler d'« atteinte à la probité » (comme d'atteinte à l'intégrité d'une personne) transpose donc à un bien moral l'image du coup qui touche. C'est une lecture fondée sur l'histoire du verbe ; les dictionnaires consultés ne l'énoncent pas pour l'expression elle-même.", "Sources": "CNRTL, article « atteindre » (étymologie) ; La langue française, article « probité »."}, {"id": 48, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "L'imputation", "Synonymes": "la mise en cause (le soupçon) ; l'accusation (plus formelle) ; la culpabilité (établie par un juge)", "Description": "Les degrés de responsabilité, du soupçon à la condamnation.", "Introduction": "« Cause » est emprunté au latin causa, qui avait « les deux sens de cause et de procès ». Mettre en cause appartient au vocabulaire judiciaire : « rendre quelqu'un partie au procès », puis, par extension, « l'impliquer dans une affaire ». Même famille : être en cause, mettre hors de cause (innocenter), remettre en cause, en tout état de cause. « Déclarer » relève aussi du droit : « faire connaître une décision par un acte public » (« il fut déclaré coupable »).", "Lecture": "Le vocabulaire de l'imputation est d'abord celui du procès, non celui de l'agression : l'échelle mis en cause, mis en examen, condamné, relaxé suit les étapes de la procédure. Le langage du coup porté (atteinte) concerne plutôt le fait reproché, d'où le lien avec la notion « Les faits ». Cette lecture est la mienne, elle s'appuie sur les définitions de l'Académie.", "Sources": "Dictionnaire de l'Académie française, 9e éd., articles « cause » et « déclarer »."}, {"id": 49, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "La procédure judiciaire", "Synonymes": "l'enquête (parquet) ; l'information judiciaire (juge d'instruction) ; les poursuites", "Description": "Le chemin de la justice, du signalement au jugement.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 50, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "La réaction de l'administration", "Synonymes": "la mesure conservatoire ; la procédure disciplinaire ; la coopération avec la justice", "Description": "Ce que fait l'employeur public face à des faits reprochés, et ce qu'il dit.", "Introduction": "", "Lecture": "", "Sources": ""}, {"id": 51, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "La prévention", "Synonymes": "la déontologie ; le conflit d'intérêts ; le signalement", "Description": "Agir avant : déclarer, se déporter, repérer les risques, recueillir les alertes.", "Introduction": "", "Lecture": "", "Sources": ""}], "tours": [{"id": 1, "Fonction": "Cause", "Courant": "soit parce que… soit parce que…", "Soutenu": "soit que… soit que…", "Regle": "Cause hypothétique : on ignore laquelle est vraie. Subjonctif, et « soit que » répété.", "ExempleCourant": "Le retard s'explique soit parce qu'il manquait des agents, soit parce que l'information est arrivée tard.", "ExempleSoutenu": "Le retard s'explique soit que des agents aient manqué, soit que l'information soit arrivée tard.", "Voisins": "soit que… soit que… ; que ce soit que… ou que…", "Piege": "Ne pas mêler « soit que » et « parce que » dans la même phrase.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 2, "Fonction": "Cause", "Courant": "ce n'est pas parce que… mais parce que…", "Soutenu": "non que… mais…", "Regle": "Écarte une cause pour en poser une autre. « Non que » + subjonctif.", "ExempleCourant": "Ce n'est pas parce que les moyens manquent, mais parce que l'organisation est à revoir.", "ExempleSoutenu": "Non que les moyens fassent défaut : c'est l'organisation qui reste à repenser.", "Voisins": "ce n'est pas que… ; non pas que…", "Piege": "Le verbe après « non que » est au subjonctif.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 3, "Fonction": "Cause", "Courant": "surtout parce que", "Soutenu": "d'autant que", "Regle": "Ajoute une raison qui renforce la précédente. Indicatif.", "ExempleCourant": "Nous devons agir, surtout parce que le risque augmente.", "ExempleSoutenu": "Nous devons agir, d'autant que le risque augmente.", "Voisins": "d'autant plus que ; d'autant mieux que", "Piege": "« D'autant plus… que » accompagne un comparatif : d'autant plus urgent que…", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 4, "Fonction": "Cause", "Courant": "à cause de", "Soutenu": "du fait de · en raison de · par suite de", "Regle": "« À cause de » est négatif ; « du fait de » et « en raison de » sont neutres.", "ExempleCourant": "Les retards sont dus à cause des intempéries.", "ExempleSoutenu": "Les retards résultent des intempéries, en raison de la fermeture de la route.", "Voisins": "par l'effet de ; au motif de", "Piege": "Ne pas écrire « dû à cause de ». « Grâce à » ne s'emploie que pour une cause favorable.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 5, "Fonction": "Cause", "Courant": "parce qu'il n'y a pas de", "Soutenu": "faute de · à défaut de", "Regle": "Cause négative, suivie d'un nom sans article.", "ExempleCourant": "Le projet n'avance pas parce qu'il n'y a pas de crédits.", "ExempleSoutenu": "Faute de crédits, le projet n'avance pas.", "Voisins": "à défaut de ; en l'absence de", "Piege": "Pas d'article derrière « faute de » : faute de moyens, non faute des moyens.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 6, "Fonction": "Cause", "Courant": "comme il sait que… il…", "Soutenu": "sachant que… · se sachant…", "Regle": "Participe présent à valeur causale. Son sujet est celui de la principale.", "ExempleCourant": "Comme elle sait que le risque est élevé, elle renforce la surveillance.", "ExempleSoutenu": "Sachant le risque élevé, elle renforce la surveillance.", "Voisins": "étant donné que ; considérant que", "Piege": "Le sujet du participe doit être celui du verbe principal.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 7, "Fonction": "Négation et réserve", "Courant": "personne ne peut", "Soutenu": "nul ne saurait · on ne saurait", "Regle": "« Saurait » (savoir au conditionnel) a ici le sens de « pourrait ». Pas de « pas ».", "ExempleCourant": "Personne ne peut ignorer la gravité de la situation.", "ExempleSoutenu": "Nul ne saurait ignorer la gravité de la situation.", "Voisins": "nul n'ignore ; chacun sait que", "Piege": "Jamais de « pas » avec « saurait ».", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 8, "Fonction": "Négation et réserve", "Courant": "il est hors de question de", "Soutenu": "il ne saurait être question de", "Regle": "Même tour : « ne saurait » pour « ne peut ».", "ExempleCourant": "Il est hors de question de céder.", "ExempleSoutenu": "Il ne saurait être question de céder.", "Voisins": "il n'est pas envisageable de ; il n'y a pas lieu de", "Piege": "Tournure ferme : l'employer pour un refus net.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 9, "Fonction": "Négation et réserve", "Courant": "on ne peut pas dire que", "Soutenu": "on ne saurait affirmer que", "Regle": "Après une phrase négative, le subjonctif est de rigueur dans la subordonnée.", "ExempleCourant": "On ne peut pas dire que la situation soit réglée.", "ExempleSoutenu": "On ne saurait affirmer que la situation soit réglée.", "Voisins": "on ne saurait prétendre que", "Piege": "Subjonctif obligatoire après la négation : « soit », pas « est ».", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 10, "Fonction": "Négation et réserve", "Courant": "je ne peux pas vous dire si", "Soutenu": "je ne saurais vous dire si", "Regle": "« Ne saurais » à la première personne marque la réserve polie.", "ExempleCourant": "Je ne peux pas vous dire si la décision sera prise.", "ExempleSoutenu": "Je ne saurais vous dire si la décision sera prise.", "Voisins": "je ne suis pas en mesure de dire si", "Piege": "Exprime l'incapacité de répondre, non un refus.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 11, "Fonction": "Négation et réserve", "Courant": "j'insiste beaucoup sur", "Soutenu": "je ne saurais trop insister sur", "Regle": "Litote : on insiste autant que possible.", "ExempleCourant": "J'insiste beaucoup sur la nécessité de signaler.", "   if(table==='Tours'){const have=new Set((cur.Courant||[]).map((c,i)=>c+'|'+cur.Soutenu[i]));toAdd=rows.filter(r=>!have.has(r.Courant+'|'+r.Soutenu));skipped=rows.length-toAdd.length}
  else{const themes=new Set(rows.map(r=>r.Theme)),ids=(cur.id||[]).filter((_,i)=>themes.has(cur.Theme[i]));removed=ids.length;
    if(ids.length)await grist.docApi.applyUserActions([['BulkRemoveRecord',table,ids]])}
  await addRows(table,toAdd);return {added:toAdd.length,removed,skipped}}
async function refreshStatus(){if(!inGrist()){S.status=null;return}
  try{const have=await listTables(),st={};for(const n of Object.keys(SCHEMA)){st[n]=have.includes(n)?((await grist.docApi.fetchTable(n)).id||[]).length:null}S.status=st}catch(e){S.status=null}}
function settingsView(){
  const g=inGrist(),st=S.status,names=Object.keys(SCHEMA),missing=st?names.filter(n=>st[n]===null):names;
  let h=`<div class="box"><h3>État</h3><div class="st"><span>Mode : <b>${S.mode==='grist'?'données Grist':'démonstration (données embarquées)'}</b></span>${st?names.map(n=>`<span>${n} : <b>${st[n]===null?'absente':st[n]+' lignes'}</b></span>`).join(''):`<span>${g?'lecture en cours…':'Hors Grist : aperçu seulement.'}</span>`}</div></div>
  <div class="box"><h3>1. Installer le jeu de données initial</h3><p>Crée les tables <b>Expressions</b>, <b>Notions</b> et <b>Tours</b> si elles n'existent pas, puis y copie les ${DEMO.expr.length} entrées, ${DEMO.notions.length} notions et ${DEMO.tours.length} tours de phrase fournis avec ce widget.</p>
  <button class="btn" data-a="install" ${g&&!S.busy?'':'disabled'}>Créer les tables et installer les données</button></div>
  <div class="box"><h3>2. Ajouter ou mettre à jour un thème</h3><p>Choisissez les fichiers JSON (expressions et notions d'un thème, ou les tours de phrase). Le widget reconnaît le type de chaque fichier. Pour un thème déjà présent, ses lignes sont remplacées ; pour les tours de phrase, seules les fiches nouvelles sont ajoutées.</p>
  <input type="file" id="files" accept=".json,application/json" multiple ${g?'':'disabled'}>
  ${S.pending.length?`<div class="msg">${S.pending.map(p=>p.table?`${esc(p.name)} → ${p.table} · ${p.rows.length} lignes${p.themes.length?' · thème : '+esc(p.themes.join(', ')):''}`:`${esc(p.name)} → fichier non reconnu`).join('\n')}</div><button class="btn" data-a="doimport" ${S.busy?'disabled':''}>Importer ces fichiers</button>`:''}</div>
  <div class="box"><h3>Pour ajouter un nouveau thème</h3><p>Demandez-le à Claude (« ajoute le thème X au dictionnaire des analogies »). Il livre deux fichiers JSON : glissez-les dans le bloc 2. Le thème apparaît aussitôt dans l'index, à sa place alphabétique.</p></div>
  ${S.msg?`<div class="msg">${esc(S.msg)}</div>`:''}`;
  return h}

const PRINT_CSS=`

function exportHtml(style){
  const names=S.notion?[S.notion]:notionsOf(S.theme);
  const intro=N=>N&&N.Introduction?`<div class="intro"><p>${esc(N.Introduction)}</p>${N.Lecture?`<p class="lec"><b>Lecture</b>${esc(N.Lecture)}</p>`:''}${N.Sources?`<p class="src"><b>Sources</b>${esc(N.Sources)}</p>`:''}</div>`:'';
  let body='';
  names.forEach(nm=>{
    const N=D.notions.find(n=>n.Theme===S.theme&&n.Notion===nm)||{Notion:nm,Description:'',Synonymes:''};
    const rows=D.expr.filter(e=>e.Theme===S.theme&&e.Notion===nm&&(S.reg==='tous'||e.Registre===S.reg));
    const g={};rows.forEach(r=>(g[r.Role]=g[r.Role]||[]).push(r));
    if(style==='A'){
      body+=`<section class="sec"><div class="top"><div class="kick">${esc(S.theme)}</div><h1>${esc(N.Notion)}</h1><p class="desc">${esc(N.Description)}</p><p class="syn"><b>Syn.</b> ${esc(N.Synonymes)}</p></div>${intro(N)}<div class="cols">`;
      Object.keys(g).forEach(role=>{body+=`<h3>${esc(role)}</h3>`;g[role].forEach(r=>{body+=`<div class="en"><p><b>${esc(r.Entree)}</b><span class="nt">${esc(r.Nature)}</span>${r.Registre==='soutenu'?'<span class="tg">[sout.]</span>':''}${r.Marque?`<span class="tg pej">[${esc(r.Marque)}]</span>`:''} ${esc(r.Sens)}</p><p><span class="sq">■</span> <i>« ${esc(r.Exemple)} »</i></p>${r.Voisins?`<p class="sm"><b class="sq">→</b> ${esc(r.Voisins)}</p>`:''}${r.Remarque?`<p class="sm mu"><b>Rem.</b> ${esc(r.Remarque)}</p>`:''}${r.Renvois?`<p class="sm mu"><b>Voir aussi</b> ${esc(r.Renvois)}</p>`:''}</div>`})});
      body+='</div></section>';
    }else{
      body+=`<section class="sec"><div class="band"><div><div class="kick">${esc(S.theme)}</div><h1>${esc(N.Notion)}</h1></div><div class="meta">${rows.length} entrées</div></div><p class="desc">${esc(N.Description)}</p><p class="syn"><b>Syn.</b> ${esc(N.Synonymes)}</p>${intro(N)}`;
      Object.keys(g).forEach(role=>{body+=`<h3>${esc(role)}</h3>`;g[role].forEach(r=>{body+=`<div class="fi"><div class="mn"><p><b class="hd">${esc(r.Entree)}</b><span class="nt">${esc(r.Nature)}</span><span class="pill${r.Registre==='soutenu'?' s':''}">${r.Registre==='soutenu'?'Soutenu':'Courant'}</span></p><p>${esc(r.Sens)}</p><p class="ex">« ${esc(r.Exemple)} »</p>${r.Amorce?`<p class="am"><b>Amorce</b> <i>${esc(r.Amorce)}</i></p>`:''}${r.Voisins?`<p class="sm"><b class="ac" style="color:var(--ac)">→</b> ${esc(r.Voisins)}</p>`:''}${r.Remarque?`<p class="sm mu"><b>Rem.</b> ${esc(r.Remarque)}</p>`:''}${r.Renvois?`<p class="sm mu"><b>Voir aussi</b> ${esc(r.Renvois)}</p>`:''}</div><div class="notes">Notes</div></div>`})});
      body+='</section>';
    }});
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(S.theme)}${S.notion?' – '+esc(S.notion):''}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap"><style>${PRINT_CSS}${style==='A'?CSS_A:CSS_B}</style></head><body>${body}</body></html>`;
}
function exportPdf(style){
  const html=exportHtml(style),w=window.open('','_blank');
  if(w){w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},900)}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=(S.notion||S.theme)+'-'+style+'.html';a.click();alert("La fenêtre d'impression a été bloquée : ouvrez le fichier téléchargé, puis imprimez-le en PDF (Ctrl+P).")}}
function toursView(){
  const q=norm(S.q),T=D.tours||[],fns=[...new Set(T.map(x=>x.Fonction))];
  let list=T.filter(x=>(!S.fn||x.Fonction===S.fn)&&(!S.niv||String(x.Niveau)===S.niv));
  if(q)list=list.filter(x=>norm([x.Courant,x.Soutenu,x.Regle,x.ExempleCourant,x.ExempleSoutenu,x.Voisins,x.Piege,x.Fonction].join(' ')).includes(q));
  let h=`<p class="mu" style="margin:0;font:17px/1.5 'Source Serif 4',Georgia,serif"><i>Un même propos, deux tours de phrase : à gauche la construction courante, à droite son équivalent soutenu.</i></p>
  <div><div class="lab">Fonction</div><div class="tabs" style="flex-wrap:wrap"><button class="pill" aria-pressed="${!S.fn}" data-a="fn" data-v="">Toutes</button>${fns.map(f=>`<button class="pill" aria-pressed="${S.fn===f}" data-a="fn" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div></div>
  <div><div class="lab">Niveau</div><div class="tabs"><button class="pill" aria-pressed="${!S.niv}" data-a="niv" data-v="">Tous</button>${[1,2,3].map(n=>`<button class="pill" aria-pressed="${S.niv===String(n)}" data-a="niv" data-v="${n}">${NIV[n][0].toUpperCase()+NIV[n].slice(1)}</button>`).join('')}</div></div>`;
  if(!list.length)return h+`<p class="empty">Aucun tour de phrase ne correspond.</p>`;
  let last='';
  list.forEach(x=>{if(x.Fonction!==last){if(last)h+='</div>';h+=`<h3 class="fnh">${esc(x.Fonction)}</h3><div class="tour-box">`;last=x.Fonction}
    h+=`<div class="tr"><div class="c"><div class="lab">Courant</div><p class="big">${esc(x.Courant)}</p><p class="ex">« ${esc(x.ExempleCourant)} »</p></div>
    <div class="s"><div class="lab">Soutenu · ${esc(NIV[x.Niveau]||'')}</div><p class="big"><b>${esc(x.Soutenu)}</b></p><p class="ex">« ${esc(x.ExempleSoutenu)} »</p>
    ${x.Regle?`<p class="sm"><b class="ac">Règle</b> ${esc(x.Regle)}</p>`:''}${x.Piege?`<p class="sm mu"><b>Attention</b> ${esc(x.Piege)}</p>`:''}${x.Voisins?`<p class="sm"><b class="ac">→</b> ${esc(x.Voisins)}</p>`:''}</div></div>`});
  return h+`</div><div class="foot">${list.length} tour(s) de phrase</div>`;
}
function render(){
  const app=document.getElementById('app'),a=document.activeElement,hadQ=a&&a.id==='q',pos=hadQ?a.selectionStart:0;
  let h=`<header><div class="kick">Dictionnaire des analogies</div><h1>Le mot juste, en cours de phrase</h1></header>
  <div class="top"><div class="tabs"><button class="tab" aria-pressed="${S.tab==='index'}" data-a="tab" data-v="index">Index des thèmes</button><button class="tab" aria-pressed="${S.tab==='entries'}" data-a="tab" data-v="entries">Entrées</button><button class="tab" aria-pressed="${S.tab==='tours'}" data-a="tab" data-v="tours">Tours de phrase</button><button class="tab" aria-pressed="${S.tab==='settings'}" data-a="tab" data-v="settings">Paramètres</button></div>
  <div class="grow"><div class="lab">Chercher un mot, un verbe, une idée</div><input id="q" type="search" value="${esc(S.q)}" placeholder="feuilletonner, circonscrire, en amont…"></div></div>`;
  if(S.tab==='settings'){h+=settingsView()}
  else if(S.tab==='tours'){h+=toursView()}
  else if(S.tab==='index'&&!S.q){
    h+=`<div class="grid">${themes().map(([t,n])=>`<button class="theme" data-a="theme" data-v="${esc(t)}"><b>${esc(t)}</b><span>${n} entrées</span></button>`).join('')}</div>`;
  } else {
    const q=norm(S.q),searching=!!q;
    let list=D.expr.filter(e=>S.reg==='tous'||e.Registre===S.reg);
    if(searching)list=list.filter(e=>norm([e.Entree,e.Sens,e.Exemple,e.Voisins,e.Remarque,e.Notion,e.Theme].join(' ')).includes(q));
    else list=list.filter(e=>e.Theme===S.theme&&(!S.notion||e.Notion===S.notion));
    h+=`<div class="top"><div><div class="lab">Registre</div><div class="tabs">${['tous','courant','soutenu'].map(r=>`<button class="pill" aria-pressed="${S.reg===r}" data-a="reg" data-v="${r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}<button class="pill am" aria-pressed="${S.am}" data-a="am">${S.am?'Amorces affichées':'Afficher les amorces'}</button></div></div>${(!q&&S.theme)?`<div><div class="lab">Exporter ${S.notion?'la notion':'le thème'} en PDF</div><div class="tabs"><button class="pill" data-a="exp" data-v="A">A · Dictionnaire</button><button class="pill" data-a="exp" data-v="B">B · Fiche d'étude</button></div></div>`:''}</div>`;
    if(!searching&&!S.theme){h+=`<p class="empty">Choisissez un thème dans l'index.</p>`}
    else{
    h+=`<div class="crumb"><a data-a="tab" data-v="index">Index</a>${searching?' › Résultats de recherche':` › <a data-a="theme" data-v="${esc(S.theme)}">${esc(S.theme)}</a>${S.notion?' › '+esc(S.notion):''}`}</div><div class="cols">`;
    if(!searching){h+=`<nav><div class="lab">Notion</div><button aria-pressed="${!S.notion}" data-a="notion" data-v="">Toutes <small>${D.expr.filter(e=>e.Theme===S.theme).length}</small></button>${(()=>{let g='',o='';notionsOf(S.theme).forEach(n=>{const x=D.expr.find(e=>e.Theme===S.theme&&e.Notion===n).Axe||'';if(x&&x!==g){o+=`<div class="lab" style="margin-top:10px">${esc(x)}</div>`;g=x}o+=`<button aria-pressed="${S.notion===n}" data-a="notion" data-v="${esc(n)}">${esc(n)}<small>${D.expr.filter(e=>e.Theme===S.theme&&e.Notion===n).length}</small></button>`});return o})()}</nav>`}
    h+=`<main>`;
    if(!searching&&S.notion){const N=D.notions.find(n=>n.Theme===S.theme&&n.Notion===S.notion);
      if(N)h+=`<div class="head"><h2>${esc(N.Notion)}</h2><p class="mu"><i>${esc(N.Description)}</i></p><p><b class="ac">Syn.</b> ${esc(N.Synonymes)}</p>${N.Introduction?`<div class="intro"><p>${esc(N.Introduction)}</p>${N.Lecture?`<p class="lec"><b>Lecture</b>${esc(N.Lecture)}</p>`:''}${N.Sources?`<p class="src"><b>Sources</b>${esc(N.Sources)}</p>`:''}</div>`:''}</div>`}
    else if(!searching)h+=`<div class="head"><h2>${esc(S.theme)}</h2></div>`;
    else h+=`<div class="head"><p class="mu">${list.length} résultat(s) pour « ${esc(S.q)} » dans tous les thèmes.</p></div>`;
    if(!list.length)h+=`<p class="empty" style="margin-top:20px">Aucune entrée. Essayez un autre mot ou assouplissez le registre.</p>`;
    let last='';
    list.forEach(e=>{const key=searching?e.Theme+' › '+e.Notion:e.Role;if(key!==last){h+=`<h3 class="sec">${esc(key)}</h3>`;last=key}h+=entry(e)});
    h+=`<div class="foot">${list.length} entrée(s)</div></main></div>`}
  }
  app.innerHTML=h;
  if(hadQ){const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='tab'){S.tab=v;S.q='';if(v==='entries'&&!S.theme){const t=themes();S.theme=t[0]&&t[0][0]}}
  if(a==='theme'){S.theme=v;S.notion=null;S.tab='entries';S.q=''}
  if(a==='notion')S.notion=v||null;
  if(a==='reg')S.reg=v;
  if(a==='fn')S.fn=v;
  if(a==='exp'){return exportPdf(v)}
  if(a==='install'){return runInstall()}
  if(a==='doimport'){return runImport()}
  if(a==='tab'&&v==='settings')refreshStatus().then(render);
  if(a==='niv')S.niv=v;
  if(a==='am')S.am=!S.am;
  render()});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;if(S.q&&S.tab==='index')S.tab='entries';render()}});
document.addEventListener('change',async ev=>{if(ev.target.id!=='files')return;S.pending=[];
  for(const f of ev.target.files){try{const rows=JSON.parse(await f.text());const tb=Array.isArray(rows)?detect(rows):null;
    S.pending.push({name:f.name,table:tb,rows:tb?rows:[],themes:tb&&tb!=='Tours'?[...new Set(rows.map(r=>r.Theme))]:[]})}catch(e){S.pending.push({name:f.name,table:null,rows:[]})}}
  render()});
async function runInstall(){S.busy=true;S.msg='Installation en cours…';render();
  try{const c=await ensureTables();let out=c?c+' table(s) créée(s).':'Tables déjà présentes.';
    for(const [tb,rows] of [['Expressions',DEMO.expr],['Notions',DEMO.notions],['Tours',DEMO.tours]]){const r=await importRows(tb,rows);out+='\n'+tb+' : '+r.added+' ajoutées'+(r.removed?', '+r.removed+' remplacées':'')+(r.skipped?', '+r.skipped+' déjà présentes':'')}
    S.msg=out}catch(e){S.msg='Erreur : '+(e.message||e)}
  S.busy=false;await refreshStatus();await refresh();render()}
async function runImport(){S.busy=true;S.msg='Import en cours…';render();
  try{await ensureTables();let out='';
    for(const p of S.pending){if(!p.table){out+=p.name+' : ignoré (type non reconnu)\n';continue}const r=await importRows(p.table,p.rows);out+=p.name+' → '+p.table+' : '+r.added+' ajoutées'+(r.removed?', '+r.removed+' remplacées':'')+(r.skipped?', '+r.skipped+' déjà présentes':'')+'\n'}
    S.msg=out.trim();S.pending=[]}catch(e){S.msg='Erreur : '+(e.message||e)}
  S.busy=false;await refreshStatus();await refresh();render()}
async function refresh(){
  try{if(inGrist()){
      const [e,n]=await Promise.all([grist.docApi.fetchTable('Expressions'),grist.docApi.fetchTable('Notions')]);
      let tours=[];try{tours=cols2rows(await grist.docApi.fetchTable('Tours'))}catch(_){}
      const ex=cols2rows(e);if(ex.length){D={expr:ex,notions:cols2rows(n),tours};S.mode='grist';return}}
  }catch(err){}
  D=DEMO;S.mode='demo'}
async function load(){if(inGrist())grist.ready({requiredAccess:'full'});await refresh();if(inGrist()&&S.mode==='demo'){S.tab='settings';await refreshStatus()}render()}
load();
