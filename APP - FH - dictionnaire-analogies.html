ence.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 39, "Fonction": "Conséquence et contraste", "Courant": "d'un côté… mais de l'autre", "Soutenu": "autant… autant…", "Regle": "Contraste entre deux faits symétriques.", "ExempleCourant": "Le premier volet fait consensus, mais le second divise beaucoup.", "ExempleSoutenu": "Autant le premier volet fait consensus, autant le second divise.", "Voisins": "si… en revanche ; tandis que", "Piege": "Les deux propositions sont symétriques et de poids équivalent.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 40, "Fonction": "Relative et subjonctif en tête", "Courant": "même si la solution est imparfaite, personne ne le conteste", "Soutenu": "que la solution soit imparfaite, nul ne le conteste", "Regle": "« Que » + subjonctif en tête : concession ; la principale reprend l'idée par un pronom.", "ExempleCourant": "Même si la solution est imparfaite, personne ne le conteste.", "ExempleSoutenu": "Que la solution soit imparfaite, nul ne le conteste.", "Voisins": "qu'elle soit… ou non", "Piege": "Le « le » de la principale reprend le groupe en tête.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 41, "Fonction": "Relative et subjonctif en tête", "Courant": "le directeur de l'association, qui a confirmé", "Soutenu": "…, lequel a confirmé", "Regle": "« Lequel, laquelle » lève l'ambiguïté sur l'antécédent.", "ExempleCourant": "Le maire a rencontré le directeur de l'association, qui a confirmé l'information.", "ExempleSoutenu": "Le maire a rencontré le directeur de l'association, lequel a confirmé l'information.", "Voisins": "laquelle ; auquel ; duquel", "Piege": "Ne pas en abuser : l'effet devient lourd.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}], "themes": [{"Theme": "Probité publique", "Introduction": "Les mots de la morale. « Probité » vient du latin probitas, dérivé de probus, « honnête ». « Intégrité » vient d'integer, « entier », formé de in- (« non ») et de la racine de tangere (« toucher ») : est intègre ce qui n'a pas été touché.\n\nLes mots du coup. « Atteinte » vient du verbe atteindre, issu du latin attingere, lui-même « refait sur tangere » : le verbe signifie d'abord « arriver à, parvenir à ». Dès l'ancien français (vers 1100), il veut dire aussi « attaquer, toucher » ; au XIIe siècle, « blesser » ; vers 1165, « convaincre quelqu'un d'une faute », d'où la formule judiciaire « atteint et convaincu de », en usage jusqu'au début du XIXe siècle. Atteinte et intégrité appartiennent ainsi à la même famille latine, celle du toucher : l'atteinte à l'intégrité touche ce qui devait rester intact.\n\nLes mots du procès. « Cause » vient du latin causa, qui avait « les deux sens de cause et de procès ». De là mettre en cause (« rendre quelqu'un partie au procès », puis « l'impliquer dans une affaire »), être en cause, mettre hors de cause, remettre en cause. « Accuser » vient de accusare, formé de ad et de causa : « appeler à rendre compte, porter plainte ». Accusation et cause sont donc de la même famille, et c'est le procès qui les relie. « Imputer » vient d'imputare (in- et putare, « compter, régler un compte ») : imputer, c'est porter en compte. « Condamner » vient de condemnare, de damnare, lui-même dérivé de damnum, « dommage, perte, amende ».\n\nLes mots de la faute. « Corrompre » vient de corrumpere (com- et rumpere, « briser ») : le sens premier est « détruire, gâter », puis, au figuré, « séduire, soudoyer ». « Influence » vient d'influere, « couler dans » ; le mot a d'abord désigné, en astrologie, la force qui coule des astres sur le destin des hommes.", "Lecture": "Trois familles d'images se superposent. Le toucher (atteinte, intégrité) dit ce qui est lésé : on commet une atteinte. Le procès et le compte (cause, accuser, imputer) disent comment les faits sont attribués : on met en cause, on impute. La rupture et l'écoulement (corrompre, influence) disent le mécanisme de la faute : on corrompt, on abuse de son influence. Retenir l'image derrière chaque mot aide à choisir le verbe juste, car les verbes de l'imputation ne se mêlent pas à ceux de l'acte. Ce classement est mon interprétation : il s'appuie sur les étymologies citées, mais aucune des sources consultées ne le formule.", "Racines": "probité | latin probitas ← probus | « honnête »\nintégrité | latin integer (in- + racine de tangere) | « non touché, entier »\natteinte | atteindre ← attingere, refait sur tangere | « parvenir à » puis « toucher, blesser »\ncause | latin causa | « cause » et « procès »\naccuser | latin accusare (ad + causa) | « appeler à rendre compte »\nimputer | latin imputare (in- + putare) | « porter en compte »\ncondamner | latin condemnare ← damnare ← damnum | « dommage, perte, amende »\ncorrompre | latin corrumpere (com- + rumpere) | « briser, gâter »\ninfluence | latin influere (in- + fluere) | « couler dans »", "Sources": "CNRTL, article « atteindre » ; Dictionnaire de l'Académie française, 9e éd., articles « cause » et « déclarer » ; La langue française, article « probité » ; Online Etymology Dictionary, articles « accuse », « corrupt », « influence », « integrity », « condemn », « impute »."}, {"Theme": "Médias", "Introduction": "Les mots de l'entre-deux. « Média » est, à l'origine, le pluriel du latin medium, « milieu ». En anglais, medium prend vers 1600 le sens d'« agence intermédiaire » ; media, « journaux, radio, télévision », est attesté en 1927, peut-être abrégé de mass-media (1923, vocabulaire publicitaire).\n\nLes mots de la chose en cause. « Sujet » vient de subjectus, « soumis », participe de subjicere, « placer dessous ». « Affaire » vient de la locution à faire (ad et facere) : vers 1300, « ce qu'on a à faire, les occupations ordinaires ». « Dossier » vient du bas latin dorsarium, de dorsum, « dos » : un paquet de papiers est rapproché d'un dos.\n\nLes mots de la recherche. « Enquête » vient du latin inquisita, participe de inquirere, substantivé au Moyen Âge sous les formes inquaesita, inquesta ; l'ancien français enqueste est attesté vers 1170. « Contradictoire » vient du bas latin contradictorius.", "Lecture": "Les mots du thème disent la place de celui qui parle : le média est l'intermédiaire entre le fait et le public ; le sujet est ce qui est placé sous le regard ; l'affaire est « ce qu'il y a à faire », puis ce dont on parle ; le dossier est ce qui est classé. Choisir entre « affaire » et « dossier » revient à choisir son point de vue. Ce classement est mon interprétation : les sources consultées ne datent pas le sens polémique d'« affaire » et ne le formulent pas ainsi.", "Racines": "média | latin medium | « milieu »\nsujet | latin subjectus ← subjicere | « soumis », « placer dessous »\naffaire | à faire (ad + facere) | « ce qu'on a à faire »\ndossier | bas latin dorsarium ← dorsum | « dos », liasse de papiers\nenquête | latin inquisita ← inquirere | enqueste (vers 1170)\ncontradictoire | bas latin contradictorius | qui contredit", "Sources": "Online Etymology Dictionary, article « media » ; Online Etymology Dictionary, article « affair » ; La langue française, article « sujet » ; La langue française, article « dossier » ; La langue française, article « enquête » ; La langue française, article « contradictoire »."}, {"Theme": "Communication de crise", "Introduction": "Les mots du tri. « Crise » vient du latin médiéval crisis, du grec krisis, « jugement », de krinein, « séparer, juger ». Chez Hippocrate et Galien, c'est le point de bascule d'une maladie, qui annonce la guérison ou la mort ; le sens figuré de « situation décisive » est attesté en anglais dans les années 1620.\n\nLes mots de la circulation. « Rumeur » vient du latin rumor, « bruit, clameur », aussi « propos commun ». « Informer » vient d'informare, « donner forme à » (in- et formare, de forma, « forme »), au figuré « former, instruire » ; le sens « rapporter des faits » est attesté à la fin du XIVe siècle (en anglais).\n\nLes mots du collectif. « Population » vient du latin tardif populationem, « un peuple, une multitude », dérivé de populus. « Coordonner » repose sur un verbe du latin médiéval signifiant « mettre en ordre », formé de co- (« ensemble ») et d'une racine signifiant « rang ».", "Lecture": "Trois images : la crise est un moment de tri, la rumeur un bruit qui court, l'information un contenu mis en forme. La communication de crise travaille entre ces trois pôles : décider dans le tri, répondre au bruit, donner forme aux éléments. Ce classement est mon interprétation, fondée sur les étymologies citées ; aucune source consultée ne le formule.", "Racines": "crise | grec krisis ← krinein | « jugement », « séparer, juger »\nrumeur | latin rumor | « bruit, clameur »\ninformation | latin informare | « donner forme à »\npopulation | latin tardif populationem ← populus | « un peuple, une multitude »\ncoordonner | latin médiéval (co- + « rang ») | « mettre en ordre, au même rang »", "Sources": "La langue française, article « crise » ; Online Etymology Dictionary, article « crisis » ; La langue française, article « rumeur » ; Online Etymology Dictionary, article « rumor » ; Online Etymology Dictionary, article « inform » ; Online Etymology Dictionary, article « population » ; Online Etymology Dictionary, article « coordinate »."}, {"Theme": "Crise sanitaire", "Introduction": "Les mots du peuple et du foyer. « Épidémie » vient du grec epidêmia, de epi (« sur, parmi ») et dêmos (« peuple, district ») : l'adjectif signifie d'abord « commun à tout un peuple ». « Foyer » vient du latin focarius, « de feu », dérivé de focus.\n\nLes mots de la veille. « Surveillance » est formé de sur- et de veiller, du latin vigilare. L'Online Etymology Dictionary note que le mot semble entré en anglais à l'époque de la Terreur : en mars 1793, la Convention ordonne des comités de surveillance dans chaque municipalité.\n\nLes mots du danger. « Risque » : selon La langue française, du latin resecum, de resecare, « couper », « rocher escarpé, écueil » ; l'Online Etymology Dictionary juge l'origine incertaine. « Danger » vient du bas latin dominarium, « domination ». « Menace » vient du latin minaciae, lié à minae ; minari signifiait à l'origine « être saillant ».\n\nLes mots de la mesure. « Mesure » vient du latin mensura, de metiri, « mesurer », d'abord « modération ». « Filière » est formé de fil et du suffixe -ière : en 1640, des « filliers de fer, servans à tirer le fil d'archal ».", "Lecture": "Une crise sanitaire emprunte ses images à des univers voisins : le feu (foyer), le peuple (épidémie), la veille (surveillance), la mer et les écueils (risque), la domination (danger), la mesure comme modération. Retenir ces images aide à choisir le mot juste : le risque se rencontre, le danger s'impose, la menace avance. Ce classement est mon interprétation ; l'origine de « risque » est discutée.", "Racines": "épidémie | grec epidêmia (epi + dêmos) | « sur le peuple »\nfoyer | latin focarius ← focus | « de feu »\nsurveillance | sur- + veiller ← vigilare | « veiller au-dessus »\nrisque | italien risco ← resecum (?) | « écueil » ; origine discutée\ndanger | bas latin dominarium | « domination »\nmenace | latin minaciae ← minae | minari : « être saillant »\nmesure | latin mensura ← metiri | « modération »\nfilière | fil + -ière | outil pour tirer le fil", "Sources": "Online Etymology Dictionary, article « epidemic » ; La langue française, article « foyer » ; Online Etymology Dictionary, article « surveillance » ; La langue française, article « risque » ; Online Etymology Dictionary, article « risk » ; La langue française, article « danger » ; La langue française, article « menace » ; Online Etymology Dictionary, article « measure » ; La langue française, article « filière »."}, {"Theme": "Lutte contre le narcotrafic", "Introduction": "Les mots du commerce. « Trafic » est attesté en français en 1339 au sens de « commerce » ; il viendrait de l'italien traffico, de trafficare. « Réseau » vient du latin retiolum, diminutif de rete, « filet ». « Filière » est formé de fil et du suffixe -ière. « Flux » vient du latin fluxus, « écoulement », de fluere, « couler ».\n\nLes mots du jeu et de la balance. « Enjeu » est composé de en et de jeu. « Bilan » vient de l'italien bilancio, du latin bilanx, « balance à deux plateaux ». « Évaluer » est formé en français sur évaluation, de é- et valuer, du latin valere, « valoir ».\n\nLes mots du lieu et de l'action. « Territoire » vient du latin territorium, « terre autour d'une ville », de terra ; l'hypothèse d'un lien avec terrere, « effrayer », reste incertaine. « Intervenir » vient d'intervenire (inter et venire). « Prévention » vient de praevenire, « venir avant ». « Acteur » vient d'actor, de agere, « pousser devant soi ». « Dispositif » est daté de 1615.\n\nLes mots de la loi. « Loi » vient du latin lex, que les étymologistes latins rattachent à ligare, « lier » ; « cadre » vient du latin quadrum, « carré ».", "Lecture": "Le vocabulaire de la lutte emprunte à trois registres : le commerce et ses images (trafic, réseau, flux, filière), le jeu et la balance (enjeu, bilan, évaluer), l'espace et l'action (territoire, intervenir, prévenir). Cela explique des couples de mots qui semblent naturels : on démantèle un réseau, on tarit un flux, on tient un territoire. Ce classement est mon interprétation, fondée sur les étymologies citées ; aucune source consultée ne le formule.", "Racines": "trafic | italien traffico (1339 : « commerce ») | échange\nréseau | latin retiolum ← rete | « filet »\nflux | latin fluxus ← fluere | « écoulement »\nenjeu | en + jeu | ce qui est en jeu\nbilan | italien bilancio ← bilanx | « balance à deux plateaux »\nterritoire | latin territorium ← terra | « terre autour d'une ville »\nintervenir | latin intervenire | « venir entre »\nprévention | latin praevenire | « venir avant »\nacteur | latin actor ← agere | « celui qui agit »\nloi / cadre | lex (← ligare ?) / quadrum | « lier » / « carré »", "Sources": "La langue française, article « trafic » ; La langue française, article « réseau » ; La langue française, article « filière » ; La langue française, article « flux » ; La langue française, article « enjeu » ; La langue française, article « bilan » ; Online Etymology Dictionary, article « evaluate » ; Online Etymology Dictionary, article « territory » ; Online Etymology Dictionary, article « intervene » ; La langue française, article « prévention » ; Online Etymology Dictionary, article « actor » ; La langue française, article « dispositif » ; La langue française, article « loi » ; La langue française, article « cadre »."}, {"Theme": "Articulations et formules de méthode", "Introduction": "Les mots de l'ordre et du moment. « Priorité » vient du latin médiéval prioritas, de prior, « le premier » ; le sens « ce qui exige d'être traité d'abord » date du XXe siècle. « Moment » vient du latin momentum, contraction de movimentum, « mouvement ».\n\nLes mots de la prudence et de la raison. « Prudence » vient du latin prudentia, de prudens ; au XIIIe siècle, « sagesse ». « Justifier » vient d'iustificare, « rendre juste ». « Nuance » est dérivé du verbe nuer avec le suffixe -ance.\n\nLes mots de la coupe et de la clôture. « Décision » vient de decisio, de decidere (de- et caedere, « couper »). « Trancher » est attesté vers 1100, d'origine incertaine. « Arbitrer » est dérivé de arbitre (1274). « Conclure » vient de concludere, « enfermer » (com- et claudere, « fermer »).", "Lecture": "Ces mots de méthode viennent de gestes concrets : couper (décider, trancher), enfermer (conclure), rendre juste (justifier), avancer (moment, étape). Ils disent comment on organise une pensée ou une action : on ordonne, on justifie, on tranche, on clôt. Ce classement est mon interprétation ; les sources consultées ne le formulent pas, et « nuance » n'a ici qu'une étymologie très courte.", "Racines": "priorité | latin prioritas ← prior | « le premier »\nmoment | latin momentum ← movimentum | « mouvement »\nprudence | latin prudentia ← prudens | « sagesse » (XIIIe s.)\njustifier | latin iustificare | « rendre juste »\nnuance | nuer + -ance | —\ndécision | latin decisio ← decidere | « couper »\ntrancher | vieux français tranchier (vers 1100) | origine incertaine\nconclure | latin concludere | « enfermer »", "Sources": "Online Etymology Dictionary, article « priority » ; La langue française, article « moment » ; La langue française, article « prudence » ; Online Etymology Dictionary, article « justify » ; La langue française, article « nuance » ; Online Etymology Dictionary, article « decision » ; La langue française, article « trancher » ; La langue française, article « arbitrer » ; Online Etymology Dictionary, article « conclude »."}, {"Theme": "Crise feux de forêt", "Introduction": "Les mots du feu. « Feu » vient du latin focus, qui a supplanté le latin classique ignis à l'époque impériale ; le mot est attesté au XIIe siècle. « Foyer » vient de focarius, « de feu », dérivé de focus. « Incendie » vient du latin incendium, de incendere, « brûler », composé de in et d'un verbe lié à candere, « être blanc, brillant, très chaud ».\n\nLes mots du mal. « Sinistre » vient du latin sinister, « qui est à gauche », d'où « préjudiciable » selon des croyances antiques. « Dégât » est formé de dé-, à sens augmentatif, et de l'ancien français gast ; degast (début XIIIe siècle) vient de degaster, « ravager ».\n\nLes mots de la veille. « Vigilance » vient du latin vigilantia, de vigilans. « Alerte » vient de l'italien all'erta, « vers la hauteur » (erta, « poste de guet »), du latin erigere. « Massif » est composé de masse et du suffixe -if (1480).\n\nLes mots de l'événement. « Déclarer », emprunté au latin declarare, « faire voir clairement », signifie d'abord « faire connaître d'une façon manifeste » ; l'Académie y range « un incendie se déclara en pleine nuit ». « Survenir » vient de supervenire (super et venire) : « se produire de manière inattendue ».", "Lecture": "Le vocabulaire du feu mêle plusieurs images : le foyer (le lieu où le feu se concentre), le mauvais présage (sinistre, « à gauche »), le poste de guet (alerte, vigilance), et deux verbes qui disent l'apparition (se déclarer, ce qui couvait devient manifeste ; survenir, ce qui arrive du dehors). Ce classement est mon interprétation ; aucune source consultée ne l'énonce comme règle d'usage.", "Racines": "feu | latin focus (XIIe s.) | a supplanté ignis\nfoyer | latin focarius ← focus | « de feu »\nincendie | latin incendium ← incendere | « brûler »\nsinistre | latin sinister | « qui est à gauche »\ndégât | dé- + gast (degast, XIIIe s.) | « ravager »\nvigilance | latin vigilantia ← vigilans | veille\nalerte | italien all'erta | « vers la hauteur » (guet)\nmassif | masse + -if (1480) | bloc\ndéclarer | latin declarare | « faire voir clairement »\nsurvenir | latin supervenire | « venir sur »", "Sources": "La langue française, article « feu » ; La langue française, article « foyer » ; La langue française, article « incendie » ; La langue française, article « sinistre » ; La langue française, article « dégât » ; La langue française, article « vigilance » ; Online Etymology Dictionary, article « alert » ; La langue française, article « massif » ; Dictionnaire de l'Académie française, 9e éd., article « déclarer » ; La langue française, article « survenir »."}, {"Theme": "Lire et qualifier une situation", "Introduction": "Les mots de l'analyse. « Analyse » vient du grec analusis, « fait de défaire, de délier », de analuein (ana-, « en haut, en arrière, à travers », et lusis, « dénouement »). « Qualifier » vient du latin médiéval qualificare, de qualis et facere : « donner une qualité à ». « Conclure » vient de concludere, « enfermer ».\n\nLes mots de la pesée. « Examiner » vient du latin examinare, « tester ; peser », de examen, moyen de peser. « Explorer » vient du latin explorare, d'un terme de chasseurs selon une hypothèse jugée « non improbable ». « Justifier » vient d'iustificare, « rendre juste ».\n\nLes mots du signe et de l'attribution. « Symptôme » vient du grec symptôma, « ce qui arrive » (syn-, « ensemble », et piptein, « tomber ») ; le sens général de « signe » est attesté dès les années 1610. « Imputer » vient d'imputare, « porter en compte ». « Mobiliser » vient de mobile, du latin mobilis, de movere.\n\nLes mots du cadre et de la règle. « Cadre » vient du latin quadrum, « carré ». « Règle » vient du latin regula, « règle, équerre, loi », de regere, « régir ».", "Lecture": "Les verbes de l'analyste empruntent leurs images à des gestes concrets : défaire (analyser), peser (examiner), chasser (explorer), compter (imputer), tracer droit (règle), borner (cadre), mettre en mouvement (mobiliser). Retenir ces gestes aide à choisir le verbe : peser n'est pas chercher, compter n'est pas désigner. Ce classement est mon interprétation ; aucune source consultée ne le formule.", "Racines": "analyse | grec analusis ← analuein | « délier »\nqualifier | latin médiéval qualificare | « donner une qualité »\nexaminer | latin examinare ← examen | « peser »\nexplorer | latin explorare | chasse (hypothèse)\njustifier | latin iustificare | « rendre juste »\nsymptôme | grec symptôma ← sympiptein | « ce qui arrive avec »\nimputer | latin imputare | « porter en compte »\nmobiliser | mobile ← latin mobilis | « mouvoir »\ncadre | latin quadrum | « carré »\nrègle | latin regula ← regere | « équerre, loi »", "Sources": "Online Etymology Dictionary, article « analysis » ; Online Etymology Dictionary, article « qualify » ; Online Etymology Dictionary, article « examine » ; Online Etymology Dictionary, article « explore » ; Online Etymology Dictionary, article « justify » ; Online Etymology Dictionary, article « symptom » ; Online Etymology Dictionary, article « impute » ; Online Etymology Dictionary, article « mobilize » ; La langue française, article « cadre » ; La langue française, article « règle »."}]};
const EXPR_TABLE='Expressions', NOTION_TABLE='Notions';
let D={expr:[],notions:[],tours:[],themes:[]};
const S={mode:'demo',status:null,pending:[],msg:'',busy:false,tab:'index',theme:null,notion:null,q:'',reg:'tous',am:false,fn:'',niv:''};
const NIV={1:'usuel',2:'écrit soigné',3:'littéraire'};
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cols2rows=t=>{const k=Object.keys(t).filter(x=>x!=='manualSort');const n=(t.id||[]).length;return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(c=>[c,t[c][i]])))};
function themes(){const m={};D.expr.forEach(e=>m[e.Theme]=(m[e.Theme]||0)+1);
  return Object.keys(m).sort((a,b)=>norm(a).localeCompare(norm(b),'fr')).map(t=>[t,m[t]])}
function notionsOf(t){const seen=[];D.expr.filter(e=>e.Theme===t).forEach(e=>{if(!seen.includes(e.Notion))seen.push(e.Notion)});return seen}
function entry(e){return `<article><p><b>${esc(e.Entree)}</b>${e.Acception>1||D.expr.some(x=>x!==e&&x.Entree===e.Entree&&x.Notion===e.Notion)?`<sup><b>${esc(e.Acception)}</b></sup>`:''}<span class="nt">${esc(e.Nature)}</span>${e.Registre==='soutenu'?'<span class="tg">[sout.]</span>':''}${e.Marque?`<span class="tg" style="color:var(--pej)">[${esc(e.Marque)}]</span>`:''}<span style="margin-left:10px">${esc(e.Sens)}</span></p>
<p><span class="ac">■</span> <i>« ${esc(e.Exemple)} »</i></p>
${S.am&&e.Amorce?`<p class="sm mu"><b class="ac" style="font-weight:600">Amorce</b> <i>${esc(e.Amorce)}</i></p>`:''}
${e.Voisins?`<p class="sm"><b class="ac">→</b> ${esc(e.Voisins)}</p>`:''}
${e.Remarque?`<p class="sm mu"><b>Rem.</b> ${esc(e.Remarque)}</p>`:''}
${e.Renvois?`<p class="sm mu"><b>Voir aussi</b> ${esc(e.Renvois)}</p>`:''}</article>`}
const SCHEMA={
Expressions:[['Ref','Int'],['Theme','Text'],['Axe','Text'],['Notion','Text'],['Role','Text'],['Entree','Text'],['Nature','Text'],['Acception','Int'],['Registre','Text'],['Marque','Text'],['Intensite','Int'],['Sens','Text'],['Amorce','Text'],['Exemple','Text'],['Voisins','Text'],['Remarque','Text'],['Renvois','Text'],['Statut','Text'],['Source','Text']],
Notions:[['Ref','Int'],['Theme','Text'],['Axe','Text'],['Notion','Text'],['Synonymes','Text'],['Description','Text'],['Introduction','Text'],['Lecture','Text'],['Sources','Text']],
Themes:[['Theme','Text'],['Introduction','Text'],['Lecture','Text'],['Racines','Text'],['Sources','Text']],
Tours:[['Ref','Int'],['Fonction','Text'],['Courant','Text'],['Soutenu','Text'],['Regle','Text'],['ExempleCourant','Text'],['ExempleSoutenu','Text'],['Voisins','Text'],['Piege','Text'],['Niveau','Int'],['Statut','Text'],['Source','Text']]};
const inGrist=()=>!!(window.grist&&window.parent!==window);
function detect(rows){const r=rows[0]||{};if('Racines' in r||('Theme' in r&&'Introduction' in r&&!('Notion' in r)))return'Themes';if('Entree' in r)return'Expressions';if('Synonymes' in r)return'Notions';if('Fonction' in r&&'Soutenu' in r)return'Tours';return null}
function normRow(table,r){const o={};SCHEMA[table].forEach(([c,ty])=>{let v=c==='Ref'?(r.Ref??r.id):r[c];if(ty==='Int')v=Number.isFinite(+v)?+v:0;else v=v==null?'':String(v);o[c]=v});return o}
async function listTables(){const l=await grist.docApi.listTables();return l.map(x=>typeof x==='string'?x:(x.id||x.tableId||String(x)))}
async function ensureTables(){const have=await listTables(),acts=[];
  Object.keys(SCHEMA).forEach(n=>{if(!have.includes(n))acts.push(['AddTable',n,SCHEMA[n].map(([id,type])=>({id,type}))])});
  for(const n of Object.keys(SCHEMA)){if(!have.includes(n))continue;const cur=await grist.docApi.fetchTable(n);
    SCHEMA[n].forEach(([id,type])=>{if(!(id in cur))acts.push(['AddColumn',n,id,{type}])})}
  if(acts.length)await grist.docApi.applyUserActions(acts);return acts.length}
async function addRows(table,rows){for(let i=0;i<rows.length;i+=400){const ch=rows.slice(i,i+400),cv={};
  SCHEMA[table].forEach(([c])=>cv[c]=ch.map(r=>r[c]));
  await grist.docApi.applyUserActions([['BulkAddRecord',table,ch.map(()=>null),cv]])}}
async function importRows(table,raw){if(!raw.length)return{added:0,removed:0,skipped:0};const rows=raw.map(r=>normRow(table,r));const cur=await grist.docApi.fetchTable(table);let removed=0,skipped=0,toAdd=rows;
  if(table==='Tours'){const have=new Set((cur.Courant||[]).map((c,i)=>c+'|'+cur.Soutenu[i]));toAdd=rows.filter(r=>!have.has(r.Courant+'|'+r.Soutenu));skipped=rows.length-toAdd.length}
  else{const themes=new Set(rows.map(r=>r.Theme)),ids=(cur.id||[]).filter((_,i)=>themes.has(cur.Theme[i]));removed=ids.length;
    if(ids.length)await grist.docApi.applyUserActions([['BulkRemoveRecord',table,ids]])}
  await addRows(table,toAdd);return {added:toAdd.length,removed,skipped}}
async function refreshStatus(){if(!inGrist()){S.status=null;return}
  try{const have=await listTables(),st={};for(const n of Object.keys(SCHEMA)){st[n]=have.includes(n)?((await grist.docApi.fetchTable(n)).id||[]).length:null}S.status=st}catch(e){S.status=null}}
function settingsView(){

function exportPdf(style){
  const html=exportHtml(style),w=window.open('','_blank');

function themeInfo(th){return (D.themes||[]).find(x=>x.Theme===th)||null}
function parseRac(s){return String(s||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.length>=2&&a[0])}
function paras(s){return String(s||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)}
function racTable(T,cls){const r=parseRac(T&&T.Racines);return r.length?`<table class="${cls||'rac'}"><thead><tr><th>Mot</th><th>Origine</th><th>Image</th></tr></thead><tbody>${r.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}
function coverView(){const T=themeInfo(S.theme);
  return `<div class="cover"><div class="kick">Dictionnaire des analogies</div><h2>${esc(S.theme)}</h2>${T?paras(T.Introduction).map(p=>`<p>${introPara(p)}</p>`).join('')+racTable(T)+(T.Lecture?`<div class="intro"><p class="lec"><b>Lecture</b>${esc(T.Lecture)}</p>${T.Sources?`<p class="src"><b>Sources</b>${esc(T.Sources)}</p>`:''}</div>`:''):''}</div>`}
function introPara(p){const m=p.match(/^([^.]{3,40}\.)\s([\s\S]*)$/);return m&&/^Les mots /.test(m[1])?`<b class="lead">${esc(m[1])}</b> ${esc(m[2])}`:esc(p)}
function toursView(){
  const q=norm(S.q),T=D.tours||[],fns=[...new Set(T.map(x=>x.Fonction))];
  let list=T.filter(x=>(!S.fn||x.Fonction===S.fn)&&(!S.niv||String(x.Niveau)===S.niv));
  if(q)list=list.filter(x=>norm([x.Courant,x.Soutenu,x.Regle,x.ExempleCourant,x.ExempleSoutenu,x.Voisins,x.Piege,x.Fonction].join(' ')).includes(q));
  let h=`<p class="mu" style="margin:0;font:17px/1.5 'Source Serif 4',Georgia,serif"><i>Un même propos, deux tours de phrase : à gauche la construction courante, à droite son équivalent soutenu.</i></p>
  <div><div class="lab">Fonction</div><div class="tabs" style="flex-wrap:wrap"><button class="pill" aria-pressed="${!S.fn}" data-a="fn" data-v="">Toutes</button>${fns.map(f=>`<button class="pill" aria-pressed="${S.fn===f}" data-a="fn" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div></div>
  <div><div class="lab">Niveau</div><div class="tabs"><button class="pill" aria-pressed="${!S.niv}" data-a="niv" data-v="">Tous</button>${[1,2,3].map(n=>`<button class="pill" aria-pressed="${S.niv===String(n)}" data-a="niv" data-v="${n}">${NIV[n][0].toUpperCase()+NIV[n].slice(1)}</button>`).join('')}</div></div>`;
  if(!list.length)return h+`<p class="empty">Aucun tour de phrase ne correspond.</p>`;
  let last='';
  list.forEach(x=>{if(x.Fonction!==last){if(last)h+='</div>';h+=`<h3 class="fnh">${esc(x.Fonction)}</h3><div class="tour-box">`;last=x.Fonction}
    h+=`<div class="tr"><div class="c"><div class="lab">Courant</div><p class="big">${esc(x.Courant)}</p><p class="ex">« ${esc(x.ExempleCourant)} »</p></div>
    <div class="s"><div class="lab">Soutenu · ${esc(NIV[x.Niveau]||'')}</div><p class="big"><b>${esc(x.Soutenu)}</b></p><p class="ex">« ${esc(x.ExempleSoutenu)} »</p>
    ${x.Regle?`<p class="sm"><b class="ac">Règle</b> ${esc(x.Regle)}</p>`:''}${x.Piege?`<p class="sm mu"><b>Attention</b> ${esc(x.Piege)}</p>`:''}${x.Voisins?`<p class="sm"><b class="ac">→</b> ${esc(x.Voisins)}</p>`:''}</div></div>`});
  return h+`</div><div class="foot">${list.length} tour(s) de phrase</div>`;
}
function render(){
  const app=document.getElementById('app'),a=document.activeElement,hadQ=a&&a.id==='q',pos=hadQ?a.selectionStart:0;
  let h=`<header><div class="kick">Dictionnaire des analogies</div><h1>Le mot juste, en cours de phrase</h1></header>
  <div class="top"><div class="tabs"><button class="tab" aria-pressed="${S.tab==='index'}" data-a="tab" data-v="index">Index des thèmes</button><button class="tab" aria-pressed="${S.tab==='entries'}" data-a="tab" data-v="entries">Entrées</button><button class="tab" aria-pressed="${S.tab==='tours'}" data-a="tab" data-v="tours">Tours de phrase</button><button class="tab" aria-pressed="${S.tab==='settings'}" data-a="tab" data-v="settings">Paramètres</button></div>
  <div class="grow"><div class="lab">Chercher un mot, un verbe, une idée</div><input id="q" type="search" value="${esc(S.q)}" placeholder="feuilletonner, circonscrire, en amont…"></div></div>`;
  if(S.tab==='settings'){h+=settingsView()}
  else if(S.tab==='tours'){h+=toursView()}
  else if(S.tab==='index'&&!S.q){
    h+=`<div class="grid">${themes().map(([t,n])=>`<button class="theme" data-a="theme" data-v="${esc(t)}"><b>${esc(t)}</b><span>${n} entrées</span></button>`).join('')}</div>`;
  } else {
    const q=norm(S.q),searching=!!q;
    let list=D.expr.filter(e=>S.reg==='tous'||e.Registre===S.reg);
    if(searching)list=list.filter(e=>norm([e.Entree,e.Sens,e.Exemple,e.Voisins,e.Remarque,e.Notion,e.Theme].join(' ')).includes(q));
    else list=list.filter(e=>e.Theme===S.theme&&(!S.notion||e.Notion===S.notion));
    h+=`<div class="top"><div><div class="lab">Registre</div><div class="tabs">${['tous','courant','soutenu'].map(r=>`<button class="pill" aria-pressed="${S.reg===r}" data-a="reg" data-v="${r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}<button class="pill am" aria-pressed="${S.am}" data-a="am">${S.am?'Amorces affichées':'Afficher les amorces'}</button></div></div>${(!q&&S.theme)?`<div><div class="lab">Exporter ${S.notion?'la notion':'le thème'} en PDF</div><div class="tabs"><button class="pill" data-a="exp" data-v="A">A · Dictionnaire</button><button class="pill" data-a="exp" data-v="B">B · Fiche d'étude</button></div></div>`:''}</div>`;
    if(!searching&&!S.theme){h+=`<p class="empty">Choisissez un thème dans l'index.</p>`}
    else{
    h+=`<div class="crumb"><a data-a="tab" data-v="index">Index</a>${searching?' › Résultats de recherche':` › <a data-a="theme" data-v="${esc(S.theme)}">${esc(S.theme)}</a>${S.notion?' › '+esc(S.notion):''}`}</div><div class="cols">`;
    if(!searching){h+=`<nav><div class="lab">Notion</div><button aria-pressed="${!S.notion}" data-a="notion" data-v="">Toutes <small>${D.expr.filter(e=>e.Theme===S.theme).length}</small></button>${(()=>{let g='',o='';notionsOf(S.theme).forEach(n=>{const x=D.expr.find(e=>e.Theme===S.theme&&e.Notion===n).Axe||'';if(x&&x!==g){o+=`<div class="lab" style="margin-top:10px">${esc(x)}</div>`;g=x}o+=`<button aria-pressed="${S.notion===n}" data-a="notion" data-v="${esc(n)}">${esc(n)}<small>${D.expr.filter(e=>e.Theme===S.theme&&e.Notion===n).length}</small></button>`});return o})()}</nav>`}
    h+=`<main>`;
    if(!searching&&S.notion){const N=D.notions.find(n=>n.Theme===S.theme&&n.Notion===S.notion);
      if(N)h+=`<div class="head"><h2>${esc(N.Notion)}</h2><p class="mu"><i>${esc(N.Description)}</i></p><p><b class="ac">Syn.</b> ${esc(N.Synonymes)}</p>${N.Introduction?`<div class="intro"><p>${esc(N.Introduction)}</p>${N.Lecture?`<p class="lec"><b>Lecture</b>${esc(N.Lecture)}</p>`:''}${N.Sources?`<p class="src"><b>Sources</b>${esc(N.Sources)}</p>`:''}</div>`:''}</div>`}
    else if(!searching)h+=coverView();
    else h+=`<div class="head"><p class="mu">${list.length} résultat(s) pour « ${esc(S.q)} » dans tous les thèmes.</p></div>`;
    if(!list.length)h+=`<p class="empty" style="margin-top:20px">Aucune entrée. Essayez un autre mot ou assouplissez le registre.</p>`;
    let last='';
    list.forEach(e=>{const key=searching?e.Theme+' › '+e.Notion:e.Role;if(key!==last){h+=`<h3 class="sec">${esc(key)}</h3>`;last=key}h+=entry(e)});
    h+=`<div class="foot">${list.length} entrée(s)</div></main></div>`}
  }
  app.innerHTML=h;
  if(hadQ){const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;

document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;if(S.q&&S.tab==='index')S.tab='entries';render()}});
document.addEventListener('change',async ev=>{if(ev.target.id!=='files')return;S.pending=[];
  for(const f of ev.target.files){try{const rows=JSON.parse(await f.text());const tb=Array.isArray(rows)?detect(rows):null;
    S.pending.push({name:f.name,table:tb,rows:tb?rows:[],themes:tb&&tb!=='Tours'?[...new Set(rows.map(r=>r.Theme))]:[]})}catch(e){S.pending.push({name:f.name,table:null,rows:[]})}}
  render()});
async function runInstall(){S.busy=true;S.msg='Installation en cours…';render();
  try{const c=await ensureTables();let out=c?c+' table(s) créée(s).':'Tables déjà présentes.';
    for(const [tb,rows] of [['Expressions',DEMO.expr],['Notions',DEMO.notions],['Tours',DEMO.tours],['Themes',DEMO.themes||[]]]){const r=await importRows(tb,rows);out+='\n'+tb+' : '+r.added+' ajoutées'+(r.removed?', '+r.removed+' remplacées':'')+(r.skipped?', '+r.skipped+' déjà présentes':'')}
    S.msg=out}catch(e){S.msg='Erreur : '+(e.message||e)}
  S.busy=false;await refreshStatus();await refresh();render()}
async function runImport(){S.busy=true;S.msg='Import en cours…';render();
  try{await ensureTables();let out='';
    for(const p of S.pending){if(!p.table){out+=p.name+' : ignoré (type non reconnu)\n';continue}const r=await importRows(p.table,p.rows);out+=p.name+' → '+p.table+' : '+r.added+' ajoutées'+(r.removed?', '+r.removed+' remplacées':'')+(r.skipped?', '+r.skipped+' déjà présentes':'')+'\n'}
    S.msg=out.trim();S.pending=[]}catch(e){S.msg='Erreur : '+(e.message||e)}
  S.busy=false;await refreshStatus();await refresh();render()}
async function refresh(){
  try{if(inGrist()){
      const [e,n]=await Promise.all([grist.docApi.fetchTable('Expressions'),grist.docApi.fetchTable('Notions')]);
      let tours=[],themes=[];try{tours=cols2rows(await grist.docApi.fetchTable('Tours'))}catch(_){}try{themes=cols2rows(await grist.docApi.fetchTable('Themes'))}catch(_){}
      const ex=cols2rows(e);if(ex.length){D={expr:ex,notions:cols2rows(n),tours,themes};S.mode='grist';return}}
  }catch(err){}
  D=Object.assign({themes:[]},DEMO);S.mode='demo'}
async function load(){if(inGrist())grist.ready({requiredAccess:'full'});await refresh();if(inGrist()&&S.mode==='demo'){S.tab='settings';await refreshStatus()}render()}
load();
</script></body></html>
