<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fiche EDL</title>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.2.4/build/index.umd.js"></script>
<style>
  :root{
    --border:#e2e0d8; --border-strong:#c9c6ba; --text-primary:#22221f; --text-secondary:#65645d;
    --text-muted:#8f8d82; --surface-1:#f7f6f2; --surface-2:#ffffff; --radius:8px;
    --bg-accent:#e6f1fb; --text-accent:#0c447c; --bg-success:#eaf3de; --text-success:#27500a;
    --bg-warning:#faeeda; --text-warning:#854f0b; --bg-gray:#f1efe8; --text-gray:#444441;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,"Segoe UI",Arial,sans-serif; background:var(--surface-1); margin:0; padding:16px; color:var(--text-primary); font-size:14px;}
  #init-banner{background:var(--bg-warning); color:var(--text-warning); padding:10px 14px; border-radius:var(--radius); margin-bottom:12px; display:none; font-size:13px;}
  #init-banner button{margin-left:8px;}
  .card{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:20px 24px; max-width:680px; margin:0 auto;}
  .top-row{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  select, input[type=text], textarea{
    font-family:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:6px; background:#fff;
  }
  button{
    font-family:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--border-strong); border-radius:6px;
    background:#fff; cursor:pointer;
  }
  button:hover{background:var(--surface-1);}
  button.primary{background:#0c447c; color:#fff; border:none;}
  button.primary:hover{background:#0a3a69;}
  button.ghost-add{border:1px dashed var(--border-strong); color:var(--text-muted); width:100%; text-align:left; margin-top:4px;}
  .header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .theme-label{font-size:12px; color:var(--text-secondary); margin:0 0 2px;}
  .titre-label{font-size:18px; font-weight:600; margin:0;}
  .badge{font-size:11px; padding:3px 10px; border-radius:6px; white-space:nowrap; font-weight:500;}
  .badge.brouillon{background:var(--bg-gray); color:var(--text-gray);}
  .badge.propose{background:var(--bg-warning); color:var(--text-warning);}
  .badge.valide{background:var(--bg-success); color:var(--text-success);}
  .modif-banner{display:flex; gap:6px; align-items:center; background:var(--bg-warning); color:var(--text-warning);
    font-size:12px; padding:6px 10px; border-radius:6px; margin-bottom:8px;}
  .meta-line{font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:14px;}
  .rubrique{margin-bottom:16px;}
  .rubrique h3{font-size:14px; font-weight:600; margin:0 0 6px;}
  .subtitle{font-size:12px; font-weight:600; color:var(--text-secondary); margin:8px 0 2px 4px; padding:2px 4px; border-radius:4px; outline:none;}
  .subtitle:focus{background:#fff; box-shadow:0 0 0 2px #0c447c33; color:var(--text-primary);}
  .add-subtitle-btn{display:block; border:none; background:none; color:var(--text-muted); font-size:11px;
    margin:6px 0 2px 4px; padding:2px 4px; cursor:pointer; opacity:0; transition:opacity .1s;}
  .rubrique:hover .add-subtitle-btn{opacity:1;}
  .add-subtitle-btn:hover{color:var(--text-accent); text-decoration:underline;}
  .subtitle-input{font-size:12px; font-weight:600; margin:8px 0 2px 4px; padding:2px 4px; border:1px solid var(--border-strong); border-radius:4px; width:200px;}
  .item-row{display:flex; gap:8px; padding:5px 6px; border-radius:6px; align-items:flex-start;}
  .item-row.chiffre{background:var(--bg-accent);}
  .item-row:hover{background:var(--surface-1);}
  .item-row.chiffre:hover{background:#dbe9f8;}
  .item-row .handle{color:var(--text-muted); font-size:12px; padding-top:3px; cursor:grab;}
  .indent-controls{display:flex; gap:2px; opacity:0; transition:opacity .1s;}
  .item-row:hover .indent-controls{opacity:1;}
  .indent-controls button{padding:1px 5px; font-size:11px; line-height:1.4;}
  .indent-controls button:disabled{opacity:.3; cursor:default;}
  .item-text{flex:1; font-size:14px; line-height:1.5; padding:1px 4px; border-radius:4px; outline:none;}
  .item-text:focus{background:#fff; box-shadow:0 0 0 2px #0c447c33;}
  .item-text.niveau-1{margin-left:4px;}
  .item-text.niveau-2{margin-left:20px;}
  .connector{color:var(--text-muted); font-size:13px; padding-top:2px; user-select:none;}
  .connector.niveau-1{margin-left:12px;}
  .connector.niveau-2{margin-left:28px;}
  .type-tag{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-secondary);
    background:var(--surface-1); border:1px solid var(--border); padding:2px 6px; border-radius:4px;
    white-space:nowrap; margin-top:2px; align-self:flex-start;}
  .type-select{font-size:11px; padding:1px 3px; border:1px solid var(--border-strong); border-radius:4px; background:#fff;}
  .item-actions{display:flex; gap:4px; opacity:0; transition:opacity .1s; padding-top:1px; align-items:center;}
  .item-row:hover .item-actions{opacity:1;}
  .item-actions button{padding:2px 6px; font-size:11px;}
  .star{color:#0c447c; font-size:13px; padding-top:3px;}
  .add-form{display:none; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .add-form.open{display:flex;}
  .add-form textarea{flex:1; min-width:220px; min-height:36px;}
  footer{display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--border); padding-top:14px; margin-top:6px;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--text-muted);}
  .modal-overlay{position:fixed; inset:0; background:rgba(30,29,26,0.45); display:flex;
    align-items:center; justify-content:center; z-index:1000;}
  .modal-box{background:#fff; border-radius:12px; width:min(720px, 92vw); max-height:85vh;
    display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.25);}
  .modal-header{display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px; border-bottom:1px solid var(--border); font-weight:600;}
  .modal-header button{border:none; background:none; font-size:16px; padding:2px 6px; cursor:pointer;}
  #synthese-modal-textarea{flex:1; min-height:400px; margin:16px 18px; padding:12px; font-size:14px;
    line-height:1.6; font-family:inherit; border:1px solid var(--border-strong); border-radius:8px; resize:vertical;}
  .modal-footer{display:flex; justify-content:space-between; align-items:center;
    padding:12px 18px; border-top:1px solid var(--border);}
  .modal-hint{font-size:12px; color:var(--text-muted);}
</style>
</head>
<body>

<div id="init-banner"></div>
<div id="app"></div>

<div id="synthese-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeSyntheseModal(false)">
  <div class="modal-box">
    <div class="modal-header">
      <span id="synthese-modal-title">Synthèse du rapport source</span>
      <button onclick="closeSyntheseModal(true)" title="Fermer">✕</button>
    </div>
    <textarea id="synthese-modal-textarea" placeholder="Collez ici le texte intégral de la synthèse…"></textarea>
    <div class="modal-footer">
      <span class="modal-hint">Enregistrement automatique à la fermeture</span>
      <button class="primary" onclick="closeSyntheseModal(true)">Fermer et enregistrer</button>
    </div>
  </div>
</div>

<script>
const RUBRIQUES = ["Message clé", "Contexte", "Actions", "Résultats", "Freins", "Perspectives", "Focus"];
const RUBRIQUE_LABELS = {
  "Message clé": "Message clé",
  "Contexte": "Contexte",
  "Actions": "Actions mises en place",
  "Résultats": "Résultats",
  "Freins": "Freins",
  "Perspectives": "Perspectives",
  "Focus": "Focus"
};
const STATUT_CHOICES = ["Brouillon", "Proposé", "Validé"];
const TYPE_INFO_CHOICES = ["Chiffre", "Évolution", "Alerte", "Action", "Citation", "Objectif"];

let state = {
  services: [],
  fiches: [],
  items: [],
  currentFicheId: null,
  currentUserEmail: null, // sélection manuelle pour ce prototype
};

// ---------------------------------------------------------------
// INITIALISATION GRIST
// ---------------------------------------------------------------
grist.ready({ requiredAccess: 'full' });

async function boot() {
  await ensureSchema();
  await loadAll();
  render();
}
boot();

async function ensureSchema() {
  const existing = await grist.docApi.listTables();
  const actions = [];

  if (!existing.includes('Services')) {
    actions.push(['AddTable', 'Services', [
      { id: 'Email', type: 'Text' },
      { id: 'Nom', type: 'Text' },
      { id: 'Service', type: 'Text' },
    ]]);
  }
  if (!existing.includes('Fiches')) {
    actions.push(['AddTable', 'Fiches', [
      { id: 'Theme', type: 'Text' },
      { id: 'Titre', type: 'Text' },
      { id: 'Service_responsable', type: 'Ref:Services' },
      { id: 'Statut', type: 'Choice', widgetOptions: JSON.stringify({ choices: STATUT_CHOICES }) },
      { id: 'Date_validation', type: 'DateTime' },
      { id: 'Valide_par', type: 'Ref:Services' },
      { id: 'Synthese_texte', type: 'Text' },
    ]]);
  }
  if (!existing.includes('Items')) {
    actions.push(['AddTable', 'Items', [
      { id: 'Fiche', type: 'Ref:Fiches' },
      { id: 'Rubrique', type: 'Choice', widgetOptions: JSON.stringify({ choices: RUBRIQUES }) },
      { id: 'Sous_titre', type: 'Text' },
      { id: 'Ordre', type: 'Int' },
      { id: 'Niveau', type: 'Int' },
      { id: 'Texte', type: 'Text' },
      { id: 'Chiffre_cle', type: 'Bool' },
      { id: 'Type_info', type: 'Choice', widgetOptions: JSON.stringify({ choices: TYPE_INFO_CHOICES }) },
      { id: 'Auteur', type: 'Ref:Services' },
      { id: 'Date_modif', type: 'DateTime' },
      { id: 'Origine', type: 'Text' },
    ]]);
  }

  if (actions.length) {
    showInitBanner('Création des tables manquantes en cours…');
    await grist.docApi.applyUserActions(actions);
    showInitBanner('Tables créées : ' + actions.map(a => a[1]).join(', '), true);
  }

  // Synchronise la liste des choix (utile si les tables existaient deja
  // avant l'ajout de "Message cle", ou si RUBRIQUES/STATUT_CHOICES evolue)
  if (existing.includes('Items')) {
    // Ajoute la colonne Type_info si elle n'existe pas encore (documents crees avant cette version)
    await grist.docApi.applyUserActions([
      ['AddColumn', 'Items', 'Type_info', { type: 'Choice', widgetOptions: JSON.stringify({ choices: TYPE_INFO_CHOICES }) }]
    ]).catch(() => {}); // ignore si la colonne existe deja
    await grist.docApi.applyUserActions([
      ['ModifyColumn', 'Items', 'Rubrique', { widgetOptions: JSON.stringify({ choices: RUBRIQUES }) }]
    ]).catch(() => {}); // silencieux si la colonne n'existe pas encore sous cette forme
    await grist.docApi.applyUserActions([
      ['ModifyColumn', 'Items', 'Type_info', { widgetOptions: JSON.stringify({ choices: TYPE_INFO_CHOICES }) }]
    ]).catch(() => {});
  }
  if (existing.includes('Fiches')) {
    await grist.docApi.applyUserActions([
      ['ModifyColumn', 'Fiches', 'Statut', { widgetOptions: JSON.stringify({ choices: STATUT_CHOICES }) }]
    ]).catch(() => {});
    await grist.docApi.applyUserActions([
      ['AddColumn', 'Fiches', 'Synthese_texte', { type: 'Text' }]
    ]).catch(() => {}); // ignore si la colonne existe deja
  }
}

function showInitBanner(msg, autoHide) {
  const el = document.getElementById('init-banner');
  el.style.display = 'block';
  el.textContent = msg;
  if (autoHide) setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function loadAll() {
  const [services, fiches, items] = await Promise.all([
    grist.docApi.fetchTable('Services'),
    grist.docApi.fetchTable('Fiches'),
    grist.docApi.fetchTable('Items'),
  ]);
  state.services = toRecords(services);
  state.fiches = toRecords(fiches);
  state.items = toRecords(items);
  if (!state.currentFicheId && state.fiches.length) {
    state.currentFicheId = state.fiches[0].id;
  }
}

// Grist fetchTable renvoie des colonnes en arrays parallèles -> on les remet en objets
function toRecords(table) {
  const ids = table.id || [];
  const out = [];
  for (let i = 0; i < ids.length; i++) {
    const rec = { id: ids[i] };
    for (const col in table) {
      if (col === 'id') continue;
      rec[col] = table[col][i];
    }
    out.push(rec);
  }
  return out;
}

// ---------------------------------------------------------------
// RENDU
// ---------------------------------------------------------------
function serviceName(refId) {
  const s = state.services.find(s => s.id === refId);
  return s ? (s.Service || s.Nom || s.Email) : '—';
}

function render() {
  const app = document.getElementById('app');

  if (!state.fiches.length) {
    app.innerHTML = `<div class="card empty-state">
      Aucune fiche pour l'instant.<br>
      <button class="primary" style="margin-top:12px" onclick="createFiche()">Créer une première fiche</button>
    </div>`;
    return;
  }

  const fiche = state.fiches.find(f => f.id === state.currentFicheId) || state.fiches[0];
  const items = state.items.filter(i => i.Fiche === fiche.id).sort((a, b) => (a.Ordre || 0) - (b.Ordre || 0));

  const modifieeDepuisValidation = fiche.Statut === 'Validé' && fiche.Date_validation &&
    items.some(i => i.Date_modif && i.Date_modif > fiche.Date_validation);

  const statutClass = fiche.Statut === 'Validé' ? 'valide' : fiche.Statut === 'Proposé' ? 'propose' : 'brouillon';

  let html = `<div class="card">`;

  html += `<div class="top-row">
    <label style="font-size:12px; color:var(--text-secondary);">Fiche :</label>
    <select onchange="switchFiche(this.value)">
      ${state.fiches.map(f => `<option value="${f.id}" ${f.id === fiche.id ? 'selected' : ''}>${esc(f.Theme)} — ${esc(f.Titre)}</option>`).join('')}
    </select>
    <button onclick="createFiche()">+ Nouvelle fiche</button>
    <button onclick="document.getElementById('import-file').click()">⭱ Importer des fiches (JSON)</button>
    <input type="file" id="import-file" accept="application/json" style="display:none" onchange="handleImportFile(this)">
    <span style="flex:1"></span>
    <label style="font-size:12px; color:var(--text-secondary);">Vous êtes :</label>
    <select onchange="state.currentUserEmail=this.value">
      <option value="">— sélectionner —</option>
      ${state.services.map(s => `<option value="${s.id}" ${state.currentUserEmail === s.id ? 'selected' : ''}>${esc(s.Nom || s.Email)} (${esc(s.Service)})</option>`).join('')}
    </select>
    <button onclick="openServiceAdmin()">Gérer services</button>
  </div>`;

  html += `<div class="header">
    <div>
      <p class="theme-label">${esc(fiche.Theme)}</p>
      <p class="titre-label">${esc(fiche.Titre)}</p>
    </div>
    <div style="display:flex; gap:6px; align-items:flex-start;">
      <button title="${fiche.Synthese_texte ? 'Voir la synthèse complète' : 'Ajouter la synthèse complète du rapport source'}"
        onclick="openSyntheseModal(${fiche.id})">📄 ${fiche.Synthese_texte ? 'Synthèse' : '+ Synthèse'}</button>
      <span class="badge ${statutClass}">${esc(fiche.Statut || 'Brouillon')}</span>
    </div>
  </div>`;

  if (modifieeDepuisValidation) {
    html += `<div class="modif-banner">⚠ Modifiée depuis validation</div>`;
  }

  html += `<div class="meta-line">Service responsable : ${esc(serviceName(fiche.Service_responsable))}
    ${fiche.Date_validation ? ' · Validée le ' + fmtDate(fiche.Date_validation) + (fiche.Valide_par ? ' par ' + esc(serviceName(fiche.Valide_par)) : '') : ''}
  </div>`;

  for (const rub of RUBRIQUES) {
    const rubItems = items.filter(i => i.Rubrique === rub);
    html += `<div class="rubrique" data-rubrique="${rub}">
      <h3>${RUBRIQUE_LABELS[rub]}</h3>
      <div class="sortable-zone" data-rubrique="${rub}">`;

    for (const group of groupBySousTitre(rubItems)) {
      const ids = group.items.map(i => i.id).join(',');
      if (group.key) {
        html += `<p class="subtitle" contenteditable="true" spellcheck="false"
          data-item-ids="${ids}"
          onblur="saveSubtitle(this)"
          onkeydown="handleSubtitleKeydown(event, this)">${esc(group.key)}</p>`;
      } else {
        html += `<button class="add-subtitle-btn" data-item-ids="${ids}" onclick="startAddSubtitle(this)">+ ajouter un sous-titre</button>`;
      }
      for (const it of group.items) html += renderItemRow(it);
    }
    html += `</div>`;
    html += `<button class="ghost-add" onclick="toggleAddForm(this)">+ Ajouter un item</button>
      <div class="add-form">
        <textarea placeholder="Texte de l'item…"></textarea>
        <input type="text" placeholder="Sous-titre (optionnel)" style="width:160px">
        <button class="primary" onclick="submitAddItem(this, '${fiche.id}', '${rub}')">Ajouter</button>
      </div>`;
    html += `</div>`;
  }

  html += `<footer>`;
  html += `<button onclick="exportFicheWord(${fiche.id})">⭳ Exporter (.docx)</button>`;
  if (fiche.Statut === 'Brouillon' || !fiche.Statut) {
    html += `<button onclick="setStatut(${fiche.id}, 'Proposé')">Proposer pour validation</button>`;
  }
  if (fiche.Statut === 'Proposé') {
    html += `<button onclick="setStatut(${fiche.id}, 'Brouillon')">Renvoyer en brouillon</button>`;
    html += `<button class="primary" onclick="setStatut(${fiche.id}, 'Validé')">Valider la fiche</button>`;
  }
  if (fiche.Statut === 'Validé' && modifieeDepuisValidation) {
    html += `<button class="primary" onclick="setStatut(${fiche.id}, 'Validé')">Revalider la fiche</button>`;
  }
  html += `</footer>`;

  html += `</div>`;
  app.innerHTML = html;

  // activer le glisser-déposer sur chaque rubrique — meme "groupe" partagé
  // pour autoriser le passage d'un item d'une catégorie à une autre
  document.querySelectorAll('.sortable-zone').forEach(zone => {
    Sortable.create(zone, {
      group: { name: 'edl-items', pull: true, put: true },
      handle: '.handle',
      draggable: '.item-row',
      animation: 150,
      onEnd: async (evt) => {
        const fromRub = evt.from.dataset.rubrique;
        const toRub = evt.to.dataset.rubrique;
        const movedId = parseInt(evt.item.dataset.id);
        const actions = [];

        // renumérote l'ordre dans la zone de destination
        Array.from(evt.to.querySelectorAll('.item-row')).forEach((row, idx) => {
          actions.push(['UpdateRecord', 'Items', parseInt(row.dataset.id), { Ordre: (idx + 1) * 10 }]);
        });

        if (fromRub !== toRub) {
          // l'item change de catégorie : on met à jour sa Rubrique...
          actions.push(['UpdateRecord', 'Items', movedId, {
            Rubrique: toRub, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null
          }]);
          // ...et on renumérote aussi la zone d'origine, qui a perdu un item
          Array.from(evt.from.querySelectorAll('.item-row')).forEach((row, idx) => {
            actions.push(['UpdateRecord', 'Items', parseInt(row.dataset.id), { Ordre: (idx + 1) * 10 }]);
          });
        }

        await grist.docApi.applyUserActions(actions);
        await loadAll();
        render();
      }
    });
  });
}

// Regroupe une liste d'items (déjà triés par Ordre) en tronçons consécutifs
// partageant le même Sous_titre — un sous-titre reste ainsi toujours attaché
// physiquement aux items qui le suivent, y compris après un glisser-déposer.
function groupBySousTitre(sortedItems) {
  const groups = [];
  let current = null;
  for (const it of sortedItems) {
    const key = it.Sous_titre || '';
    if (!current || current.key !== key) {
      current = { key, items: [] };
      groups.push(current);
    }
    current.items.push(it);
  }
  return groups;
}

async function saveSubtitle(el) {
  const ids = el.dataset.itemIds.split(',').map(Number);
  const first = state.items.find(i => i.id === ids[0]);
  if (!first) return;
  const newValue = el.textContent.trim();
  if (newValue === (first.Sous_titre || '')) return; // rien n'a change
  const actions = ids.map(id => ['UpdateRecord', 'Items', id, {
    Sous_titre: newValue, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null
  }]);
  await grist.docApi.applyUserActions(actions);
  await loadAll();
  render();
}

function handleSubtitleKeydown(event, el) {
  if (event.key === 'Enter') {
    event.preventDefault();
    el.blur();
  }
}

function startAddSubtitle(btn) {
  const ids = btn.dataset.itemIds;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subtitle-input';
  input.placeholder = 'Nom du sous-titre…';
  input.onblur = () => commitNewSubtitle(input, ids);
  input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } };
  btn.replaceWith(input);
  input.focus();
}

async function commitNewSubtitle(input, idsStr) {
  const value = input.value.trim();
  if (!value) { render(); return; } // rien tape : on annule simplement, pas d'appel Grist
  const ids = idsStr.split(',').map(Number);
  const actions = ids.map(id => ['UpdateRecord', 'Items', id, {
    Sous_titre: value, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null
  }]);
  await grist.docApi.applyUserActions(actions);
  await loadAll();
  render();
}

// Sous-titre au niveau d'un seul item, quelle que soit sa position dans son groupe —
// complète le contrôle par groupe ci-dessus pour les cas où un item isolé
// à l'intérieur d'un lot d'items "sans sous-titre" doit recevoir le sien en propre.
function editItemSubtitle(itemId) {
  const it = state.items.find(i => i.id === itemId);
  if (!it) return;
  const value = prompt('Sous-titre pour cet item (laisser vide pour le retirer) :', it.Sous_titre || '');
  if (value === null) return; // annulé
  const trimmed = value.trim();
  if (trimmed === (it.Sous_titre || '')) return;
  grist.docApi.applyUserActions([
    ['UpdateRecord', 'Items', itemId, { Sous_titre: trimmed, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null }]
  ]).then(async () => { await loadAll(); render(); });
}

function renderItemRow(it) {
  const niveauClass = it.Niveau ? `niveau-${it.Niveau}` : '';
  const connector = it.Niveau >= 1 ? `<span class="connector ${niveauClass}">↳</span>` : '';
  const typeTag = it.Type_info ? `<span class="type-tag">${esc(it.Type_info)}</span>` : '';
  return `<div class="item-row ${it.Chiffre_cle ? 'chiffre' : ''}" data-id="${it.id}">
    <span class="handle" title="Glisser pour réordonner ou changer de rubrique">⠿</span>
    <span class="indent-controls">
      <button title="Diminuer le retrait" ${!it.Niveau ? 'disabled' : ''} onclick="changeNiveau(${it.id}, -1)">«</button>
      <button title="Augmenter le retrait (mettre en second plan)" ${it.Niveau >= 2 ? 'disabled' : ''} onclick="changeNiveau(${it.id}, 1)">»</button>
    </span>
    ${it.Chiffre_cle ? '<span class="star">★</span>' : ''}
    ${connector}
    ${typeTag}
    <div class="item-text ${niveauClass}" contenteditable="true" spellcheck="false"
      data-id="${it.id}"
      onblur="saveItemText(this)"
      onkeydown="handleItemKeydown(event, this)">${mdToHtml(it.Texte)}</div>
    <span class="item-actions">
      <button title="Gras (ou Ctrl+B) — sélectionnez du texte d'abord" onmousedown="event.preventDefault()" onclick="applyBold(${it.id})"><b>B</b></button>
      <button title="Ajouter/modifier le sous-titre de cet item" onclick="editItemSubtitle(${it.id})">🏷</button>
      <select class="type-select" title="Cartouche" onchange="setTypeInfo(${it.id}, this.value)">
        <option value="" ${!it.Type_info ? 'selected' : ''}>—</option>
        ${TYPE_INFO_CHOICES.map(t => `<option value="${t}" ${it.Type_info === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
      <button title="Marquer/démarquer comme chiffre clé" onclick="toggleChiffreCle(${it.id}, ${!it.Chiffre_cle})">${it.Chiffre_cle ? '☆' : '★'}</button>
      <button title="Supprimer" onclick="deleteItem(${it.id})">✕</button>
    </span>
  </div>`;
}

// ACTIONS

// ---------------------------------------------------------------
// SYNTHÈSE COMPLÈTE (texte intégral, en boîte modale)
// ---------------------------------------------------------------
let syntheseModalFicheId = null;

function openSyntheseModal(ficheId) {
  const fiche = state.fiches.find(f => f.id === ficheId);
  if (!fiche) return;
  syntheseModalFicheId = ficheId;
  document.getElementById('synthese-modal-title').textContent = `Synthèse — ${fiche.Titre}`;
  document.getElementById('synthese-modal-textarea').value = fiche.Synthese_texte || '';
  document.getElementById('synthese-modal').style.display = 'flex';
}

async function closeSyntheseModal(save) {
  const modal = document.getElementById('synthese-modal');
  if (!save) { modal.style.display = 'none'; syntheseModalFicheId = null; return; }

  const ficheId = syntheseModalFicheId;
  const newText = document.getElementById('synthese-modal-textarea').value;
  modal.style.display = 'none';
  syntheseModalFicheId = null;
  if (ficheId === null) return;

  const fiche = state.fiches.find(f => f.id === ficheId);
  if (!fiche || newText === (fiche.Synthese_texte || '')) return; // rien n'a change

  await grist.docApi.applyUserActions([
    ['UpdateRecord', 'Fiches', ficheId, { Synthese_texte: newText }]
  ]);
  await loadAll();
  render();
}

function switchFiche(id) {
  state.currentFicheId = parseInt(id);
  render();
}

function toggleAddForm(btn) {
  const form = btn.nextElementSibling;
  form.classList.toggle('open');
}

async function submitAddItem(btn, ficheId, rubrique) {
  const form = btn.parentElement;
  const textarea = form.querySelector('textarea');
  const subInput = form.querySelector('input');
  const texte = textarea.value.trim();
  if (!texte) return;

  const rubItems = state.items.filter(i => i.Fiche == ficheId && i.Rubrique === rubrique);
  const maxOrdre = rubItems.length ? Math.max(...rubItems.map(i => i.Ordre || 0)) : 0;

  await grist.docApi.applyUserActions([
    ['AddRecord', 'Items', null, {
      Fiche: parseInt(ficheId),
      Rubrique: rubrique,
      Sous_titre: subInput.value.trim(),
      Ordre: maxOrdre + 10,
      Niveau: 0,
      Texte: texte,
      Chiffre_cle: false,
      Auteur: state.currentUserEmail || null,
      Date_modif: Date.now() / 1000,
      Origine: 'Saisie service',
    }]
  ]);
  textarea.value = '';
  subInput.value = '';
  await loadAll();
  render();
}

async function saveItemText(el) {
  const id = parseInt(el.dataset.id);
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  const newText = htmlToMd(el.innerHTML);
  if (!newText) {
    el.innerHTML = mdToHtml(it.Texte); // on ne vide jamais un item par accident
    return;
  }
  if (newText === it.Texte) return; // rien n'a change, pas d'appel inutile
  it.Texte = newText; // mise a jour optimiste locale
  await grist.docApi.applyUserActions([
    ['UpdateRecord', 'Items', id, { Texte: newText, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null }]
  ]);
  await loadAll();
  render();
}

function applyBold(itemId) {
  const el = document.querySelector(`.item-text[data-id="${itemId}"]`);
  if (!el) return;
  el.focus();
  document.execCommand('bold');
}

function handleItemKeydown(event, el) {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'b') {
    event.preventDefault();
    document.execCommand('bold');
    return;
  }
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    el.blur(); // declenche saveItemText ; Maj+Entree autorise un saut de ligne dans l'item
  }
}

async function changeNiveau(itemId, delta) {
  const it = state.items.find(i => i.id === itemId);
  if (!it) return;
  const newNiveau = Math.max(0, Math.min(2, (it.Niveau || 0) + delta));
  if (newNiveau === it.Niveau) return;
  await grist.docApi.applyUserActions([
    ['UpdateRecord', 'Items', itemId, { Niveau: newNiveau, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null }]
  ]);
  await loadAll();
  render();
}

async function toggleChiffreCle(itemId, value) {
  await grist.docApi.applyUserActions([
    ['UpdateRecord', 'Items', itemId, { Chiffre_cle: value, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null }]
  ]);
  await loadAll();
  render();
}

async function setTypeInfo(itemId, value) {
  await grist.docApi.applyUserActions([
    ['UpdateRecord', 'Items', itemId, { Type_info: value, Date_modif: Date.now() / 1000, Auteur: state.currentUserEmail || null }]
  ]);
  await loadAll();
  render();
}

async function deleteItem(itemId) {
  if (!confirm('Supprimer cet item ?')) return;
  await grist.docApi.applyUserActions([['RemoveRecord', 'Items', itemId]]);
  await loadAll();
  render();
}

async function setStatut(ficheId, statut) {
  const fields = { Statut: statut };
  if (statut === 'Validé') {
    fields.Date_validation = Date.now() / 1000;
    fields.Valide_par = state.currentUserEmail || null;
  }
  await grist.docApi.applyUserActions([['UpdateRecord', 'Fiches', ficheId, fields]]);
  await loadAll();
  render();
}

async function createFiche() {
  const theme = prompt('Thème général (ex. Sécurité) :');
  if (!theme) return;
  const titre = prompt('Titre de la fiche :');
  if (!titre) return;
  const res = await grist.docApi.applyUserActions([
    ['AddRecord', 'Fiches', null, { Theme: theme.trim(), Titre: titre.trim(), Statut: 'Brouillon' }]
  ]);
  await loadAll();
  state.currentFicheId = res.retValues[0];
  render();
}

async function openServiceAdmin() {
  const nom = prompt('Nom de la personne à ajouter à l\'annuaire Services :');
  if (!nom) return;
  const service = prompt('Service (ex. DDT, Gendarmerie) :');
  const email = prompt('Email de connexion (optionnel) :') || '';
  await grist.docApi.applyUserActions([
    ['AddRecord', 'Services', null, { Nom: nom.trim(), Service: (service || '').trim(), Email: email.trim() }]
  ]);
  await loadAll();
  render();
}

// ---------------------------------------------------------------
// IMPORT DE FICHES (JSON)
// ---------------------------------------------------------------
function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert("Fichier JSON invalide : " + err.message);
      input.value = '';
      return;
    }
    await importFiches(data);
    input.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

async function importFiches(fichesData) {
  if (!Array.isArray(fichesData)) {
    alert("Format inattendu : le fichier doit contenir une liste de fiches.");
    return;
  }

  let createdFiches = 0, updatedFiches = 0, addedItems = 0, skippedItems = 0;

  try {
    for (const fc of fichesData) {
      let fiche = state.fiches.find(f => f.Theme === fc.Theme && f.Titre === fc.Titre);
      let ficheId;

      if (fiche) {
        // La fiche existe déjà : on va y AJOUTER les nouveaux items plutôt que l'ignorer
        ficheId = fiche.id;
        updatedFiches++;
      } else {
        const res = await grist.docApi.applyUserActions([
          ['AddRecord', 'Fiches', null, {
            Theme: fc.Theme || '',
            Titre: fc.Titre || '',
            Statut: fc.Statut || 'Brouillon',
          }]
        ]);
        ficheId = res.retValues[0];
        createdFiches++;
        state.fiches.push({ id: ficheId, Theme: fc.Theme, Titre: fc.Titre, Statut: fc.Statut || 'Brouillon' });
      }

      const items = fc.items || [];
      if (!items.length) continue;

      // Protection anti-doublon : un item avec le même texte dans la même rubrique
      // de cette fiche est considéré déjà présent et n'est pas réinséré. Permet de
      // réimporter le même fichier sans risque, et de compléter une fiche existante.
      const existingItemsForFiche = state.items.filter(i => i.Fiche === ficheId);
      const existingTexts = {};
      const maxOrdreParRubrique = {};
      for (const it of existingItemsForFiche) {
        (existingTexts[it.Rubrique] = existingTexts[it.Rubrique] || new Set()).add((it.Texte || '').trim());
        maxOrdreParRubrique[it.Rubrique] = Math.max(maxOrdreParRubrique[it.Rubrique] || 0, it.Ordre || 0);
      }

      const bulkActions = [];
      for (const it of items) {
        const rub = it.Rubrique || 'Contexte';
        const texte = (it.Texte || '').trim();
        if (existingTexts[rub]?.has(texte)) { skippedItems++; continue; }
        maxOrdreParRubrique[rub] = (maxOrdreParRubrique[rub] || 0) + 10;
        bulkActions.push(['AddRecord', 'Items', null, {
          Fiche: ficheId,
          Rubrique: rub,
          Sous_titre: it.Sous_titre || '',
          Ordre: maxOrdreParRubrique[rub],
          Niveau: it.Niveau || 0,
          Texte: texte,
          Chiffre_cle: !!it.Chiffre_cle,
          Type_info: it.Type_info || '',
          Auteur: state.currentUserEmail || null,
          Origine: it.Origine || 'Import',
          Date_modif: Date.now() / 1000,
        }]);
        (existingTexts[rub] = existingTexts[rub] || new Set()).add(texte); // évite les doublons internes au même import
      }
      if (bulkActions.length) {
        // applyUserActions accepte plusieurs actions dans le meme appel
        await grist.docApi.applyUserActions(bulkActions);
        addedItems += bulkActions.length;
      }
    }
  } catch (err) {
    console.error('Erreur import fiches :', err);
    alert("L'import a échoué en cours de route : " + (err && err.message ? err.message : err) +
      "\n\nCe qui a déjà été ajouté avant l'erreur reste en place (" + createdFiches + " fiche(s) créée(s), " +
      addedItems + " item(s) ajouté(s) jusqu'ici). Corrigez la cause indiquée puis réimportez le même fichier : " +
      "la protection anti-doublon évite les répétitions.");
    await loadAll();
    render();
    return;
  }

  showInitBanner(
    `Import terminé : ${createdFiches} fiche(s) créée(s), ${updatedFiches} fiche(s) complétée(s), ${addedItems} item(s) ajouté(s), ${skippedItems} déjà présent(s) ignoré(s).`,
    false
  );
  await loadAll();
  render();
}

// ---------------------------------------------------------------
// EXPORT WORD (.docx) — génération 100% côté navigateur, via docx.js
// ---------------------------------------------------------------
async function exportFicheWord(ficheId) {
  if (!window.docx) {
    alert("La bibliothèque d'export Word n'a pas pu se charger (connexion réseau ?). Réessayez dans quelques secondes.");
    return;
  }
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
    WidthType, AlignmentType, HeadingLevel, ShadingType, BorderStyle } = window.docx;

  const NAVY = '0C447C';
  const LIGHTBLUE = 'E6F1FB';

  const fiche = state.fiches.find(f => f.id === ficheId);
  if (!fiche) return;
  const items = state.items.filter(i => i.Fiche === ficheId).sort((a, b) => (a.Ordre || 0) - (b.Ordre || 0));

  const children = [];

  // Cartouche titre (tableau bordé à une cellule, comme les fiches d'origine)
  children.push(new Table({
    width: { size: 9000, type: WidthType.DXA },
    rows: [new TableRow({
      children: [new TableCell({
        margins: { top: 150, bottom: 150, left: 150, right: 150 },
        children: [
          new Paragraph({
            alignment: AlignmentType.CENTER, spacing: { after: 60 },
            children: [new TextRun({ text: (fiche.Theme || '').toUpperCase(), bold: true, size: 28, color: NAVY })]
          }),
          new Paragraph({
            alignment: AlignmentType.CENTER,
            children: [new TextRun({ text: fiche.Titre || '', size: 24 })]
          }),
        ],
      })],
    })],
  }));
  children.push(new Paragraph({ text: '', spacing: { after: 200 } }));

  // Message clé : mis en avant dans un encadré, comme le premier repère visuel de la fiche
  const messageItems = items.filter(i => i.Rubrique === 'Message clé');
  if (messageItems.length) {
    const msgParagraphs = messageItems.map(it => new Paragraph({
      spacing: { after: 80 },
      children: parseBoldSegments(it.Texte).filter(s => s.texte).map(seg =>
        new TextRun({ text: seg.texte, bold: true, size: 26, color: NAVY })
      ),
    }));
    children.push(new Table({
      width: { size: 9000, type: WidthType.DXA },
      rows: [new TableRow({
        children: [new TableCell({
          shading: { type: ShadingType.CLEAR, color: 'auto', fill: LIGHTBLUE },
          margins: { top: 160, bottom: 160, left: 220, right: 220 },
          children: msgParagraphs,
        })],
      })],
    }));
    children.push(new Paragraph({ text: '', spacing: { after: 200 } }));
  }

  for (const rub of RUBRIQUES) {
    if (rub === 'Message clé') continue; // déjà traité ci-dessus, mis en avant
    const rubItems = items.filter(i => i.Rubrique === rub);
    if (!rubItems.length) continue;

    children.push(new Paragraph({
      children: [new TextRun({ text: RUBRIQUE_LABELS[rub], bold: true, size: 27, color: NAVY })],
      spacing: { before: 260, after: 140 },
      border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: LIGHTBLUE, space: 4 } },
    }));

    let lastSousTitre;
    for (const it of rubItems) {
      if (it.Sous_titre && it.Sous_titre !== lastSousTitre) {
        children.push(new Paragraph({
          children: [new TextRun({ text: it.Sous_titre, bold: true, italics: true, size: 22 })],
          spacing: { before: 120, after: 70 }
        }));
      }
      lastSousTitre = it.Sous_titre || undefined; // se réinitialise dès qu'un item sans sous-titre s'intercale

      const runs = [];
      if (it.Chiffre_cle) runs.push(new TextRun({ text: '★ ', bold: true, color: NAVY }));
      if (it.Type_info) runs.push(new TextRun({ text: it.Type_info + '  ', smallCaps: true, italics: true, color: '767570', size: 20 }));
      for (const seg of parseBoldSegments(it.Texte)) {
        if (!seg.texte) continue;
        runs.push(new TextRun({ text: seg.texte, bold: seg.gras, size: 23 }));
      }
      children.push(new Paragraph({
        children: runs,
        bullet: { level: it.Niveau || 0 },
        spacing: { after: 100, line: 300 },
        shading: it.Chiffre_cle ? { type: ShadingType.CLEAR, color: 'auto', fill: LIGHTBLUE } : undefined,
      }));
    }
  }

  const doc = new Document({
    styles: {
      default: {
        document: {
          run: { font: 'Calibri', size: 23 },
          paragraph: { spacing: { line: 300, lineRule: 'auto' } },
        },
      },
    },
    sections: [{ properties: {}, children }],
  });
  const blob = await Packer.toBlob(doc);

  const dateLabel = new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  const filename = `EDL - ${fiche.Theme} - ${fiche.Titre} - version ${dateLabel}.docx`.replace(/[\\/:*?"<>|]/g, '-');

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------
// UTILITAIRES
// ---------------------------------------------------------------
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Le texte est stocké en clair avec des marqueurs **gras** façon markdown-lite
// (permet de garder Texte lisible dans Grist et de le réutiliser tel quel à l'export Word)
function mdToHtml(text) {
  let html = esc(text || '');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function htmlToMd(html) {
  let s = html;
  s = s.replace(/<div>/gi, '\n').replace(/<\/div>/gi, '');
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<\/?(strong|b)>/gi, '**');
  s = s.replace(/<[^>]+>/g, ''); // retire toute autre balise residuelle
  const ta = document.createElement('textarea');
  ta.innerHTML = s;
  s = ta.value;
  return s.replace(/\n{3,}/g, '\n\n').trim();
}

// Découpe "texte **gras** texte" en segments {texte, gras} pour l'export Word
function parseBoldSegments(text) {
  const segments = [];
  const parts = (text || '').split(/\*\*(.+?)\*\*/g);
  parts.forEach((part, idx) => {
    if (part === '') return;
    segments.push({ texte: part, gras: idx % 2 === 1 });
  });
  return segments.length ? segments : [{ texte: text || '', gras: false }];
}

function fmtDate(unixSeconds) {
  if (!unixSeconds) return '';
  const d = new Date(unixSeconds * 1000);
  return d.toLocaleDateString('fr-FR');
}
