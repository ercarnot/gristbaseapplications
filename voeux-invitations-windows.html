<script>

const SCHEMA={
 Invites:[C('Categorie','Text','Catégorie'),C('Civilite','Text','Civilité'),C('Prenom','Text','Prénom'),C('Nom','Text','Nom'),

 Parametres:[C('Cle','Text','Clé'),C('Valeur','Text','Valeur')]
};
const DEF={
 titre:'Cérémonie des vœux 2027',titreListe:'Liste des invités vœux protocolaires 2027',
 dateCeremonie:'',lieu:'',dateLimite:'',lienFormulaire:'',jauge:'',
 expediteur:'',destinataireVisible:'',delaiRelance:'0',tailleLot:'0',adresseTest:'',
 emailNotif:'pref-voeux@alpes-de-haute-provence.gouv.fr',notifJusqua:'0',pubFormInit:'',
 objetInvitation:'Invitation – Cérémonie des vœux 2027',

 introInvitation:'Madame la Préfète des Alpes-de-Haute-Provence a le plaisir de vous convier à',
 introRelance:'Nous n’avons pas encore reçu votre réponse à l’invitation à',
 texteBouton:'Répondre à l’invitation',
 signature:'Le cabinet de la Préfète',
 couleur:'#000091',imgEntete:'',imgCarton:'',imgLogo:'',enteteNom:'Préfète des Alpes-de-Haute-Provence',lieuEdition:'Digne-les-Bains',
 pied:'Préfecture des Alpes-de-Haute-Provence – Cabinet de la Préfète\n8 rue du Docteur Romieu – 04000 Digne-les-Bains\nwww.alpes-de-haute-provence.gouv.fr'
};

const UI={step:'liste',rsub:'traiter',q:'',fcat:'',fstat:'',dup:false,pending:null,pendingNotif:null,att:{invitation:null,relance:null},jq:'',printHtml:'',printName:'',incAll:false,val:null,syncInfo:''};

/* ----------------------------- utilitaires ----------------------------- */
const $=(s,r)=>(r||document).querySelector(s);
const s_=v=>v==null?'':String(v);

const norm=v=>s_(v).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');

const fmtD=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s_(v));return m?m[3]+'/'+m[2]+'/'+m[1]:s_(v);};

/* ----------------------------- Grist : accès données ----------------------------- */
async function fetchRows(t){
  const d=await grist.docApi.fetchTable(t);const ids=d.id||[];const rows=[];
  for(let i=0;i<ids.length;i++){const o={id:ids[i]};for(const k in d){if(k!=='id'&&k!=='manualSort')o[k]=d[k][i];}rows.push(o);}
  return rows;
}

async function ensureSchema(){
  const tables=await grist.docApi.listTables();
  let existing={};
  try{
    const mt=await grist.docApi.fetchTable('_grist_Tables'),mc=await grist.docApi.fetchTable('_grist_Tables_column');
    const byId={};mt.id.forEach((id,i)=>byId[id]=mt.tableId[i]);
    mc.id.forEach((id,i)=>{const t=byId[mc.parentId[i]];if(t)(existing[t]=existing[t]||new Set()).add(mc.colId[i]);});
  }catch(e){existing={};}
  const actions=[];
  for(const [t,cols] of Object.entries(SCHEMA)){
    if(!tables.includes(t))actions.push(['AddTable',t,cols.map(spec)]);
    else if(existing[t])for(const c of cols)if(!existing[t].has(c.id))actions.push(['AddColumn',t,c.id,spec(c)]);
  }
  if(actions.length)await grist.docApi.applyUserActions(actions);
  return actions.length;
}

/* ----------------------------- logique métier ----------------------------- */
function status(i){
  if(i.Reponse==='Présent')return i.ListeAttente?'attente':'present';
  if(i.Reponse==='Excusé')return i.RepresentePar?'represente':'excuse';
  if(!i.DateInvitation)return emails(i.Email).length?'ainviter':'sansmail';
  return (i.NbRelances>0)?'relance':'invite';
}
function persons(i){const st=status(i);if(st==='present')return 1+(+i.NbAccompagnants||0);if(st==='represente')return 1;return 0;}
const answered=i=>i.Reponse==='Présent'||i.Reponse==='Excusé';
function catRank(n){const k=S.cat.findIndex(c=>c.Nom===n);return k<0?9999:k;}
function sortedInv(list){
  return (list||S.inv).slice().sort((a,b)=>catRank(a.Categorie)-catRank(b.Categorie)||s_(a.Categorie).localeCompare(s_(b.Categorie),'fr')||((a.Rang||1e9)-(b.Rang||1e9))||s_(a.Nom).localeCompare(s_(b.Nom),'fr')||s_(a.Prenom).localeCompare(s_(b.Prenom),'fr'));
}
function stats(){
  const per={};let T={n:0,aInviter:0,sansMail:0,invites:0,rep:0,pres:0,exc:0,sans:0,att:0};
  const row=c=>per[c]||(per[c]={n:0,rep:0,pres:0,exc:0,sans:0});
  S.inv.forEach(i=>{
    const r=row(s_(i.Categorie)||'(sans catégorie)'),st=status(i);
    r.n++;T.n++;
    if(st==='ainviter')T.aInviter++;if(st==='sansmail')T.sansMail++;
    if(i.DateInvitation)T.invites++;
    if(answered(i)){r.rep++;T.rep++;}
    if(st==='present'){const p=persons(i);r.pres+=p;T.pres+=p;}
    if(st==='represente'){r.pres+=1;T.pres+=1;r.exc++;T.exc++;}
    if(st==='excuse'){r.exc++;T.exc++;}
    if(st==='attente')T.att++;
    if(st==='invite'||st==='relance'){r.sans++;T.sans++;}
  });
  const cats=Object.keys(per).sort((a,b)=>catRank(a)-catRank(b)||a.localeCompare(b,'fr'));
  return {per,cats,T};
}
/* Doublons : même nom + prénom (probable) / même adresse e-mail (parfois normal : boîte partagée) */
const nameKey=o=>norm(o.Nom)&&norm(o.Prenom)?norm(o.Nom)+'|'+norm(o.Prenom):'';
function dupGroups(){
  const byE={},byN={};
  S.inv.forEach(i=>{emails(i.Email).forEach(e=>(byE[e]=byE[e]||[]).push(i));const k=nameKey(i);if(k)(byN[k]=byN[k]||[]).push(i);});
  const nameG=Object.values(byN).filter(a=>a.length>1);
  const inName=new Set(nameG.flat().map(i=>i.id));
  const seen=new Set(),mailG=[];
  Object.values(byE).filter(a=>a.length>1).forEach(a=>{const key=a.map(i=>i.id).sort().join(',');if(seen.has(key))return;seen.add(key);if(a.every(i=>inName.has(i.id))&&a.map(nameKey).every((k,_,arr)=>k===arr[0]))return;mailG.push(a);});
  return {nameG,mailG};
}
function dupSet(){const g=dupGroups();return new Set([...g.nameG.flat(),...g.mailG.flat()].map(i=>i.id));}
function eligible(type){
  const p=P();
  if(type==='invitation'){
    return S.inv.filter(i=>emails(i.Email).length&&!answered(i)&&(UI.incAll||!i.DateInvitation));
  }
  const delai=+p.delaiRelance||0,lim=new Date();lim.setDate(lim.getDate()-delai);
  return S.inv.filter(i=>emails(i.Email).length&&i.DateInvitation&&!answered(i)&&(!delai||new Date((i.DateRelance||i.DateInvitation)+'T00:00:00')<=lim));
}

/* ---- Réponses du formulaire : règles ----
   1. Une personne = une fiche = UNE réponse active : la plus récente (même adresse e-mail). Les précédentes restent en historique.
   2. Si elle change d'avis, la fiche est mise à jour et marquée « a modifié sa réponse » (jusqu'à ce que l'administrateur clique sur « Vu »).
   3. Si ce qu'elle a saisi (nom, catégorie, adresse) ne correspond pas à la base : la réponse attend la validation de l'administrateur. */
function normPres(v){v=norm(v);if(!v)return '';if(/nepourrai|pas|non|excus|regret|absent|indisponible/.test(v))return 'Excusé';if(/present|oui|serai|participe|viendrai|confirme|ok/.test(v))return 'Présent';return '';}
function respDate(r){return r.RecuLe?new Date(r.RecuLe*1000).toISOString().slice(0,10):todayIso();}
function respFields(r){
  const p=normPres(r.Presence);
  return {Reponse:p,NbAccompagnants:p==='Présent'?(+r.NbAccompagnants||0):0,Accompagnants:p==='Présent'?s_(r.Accompagnants):'',RepresentePar:p==='Excusé'?s_(r.RepresentePar):'',SourceReponse:'Formulaire',DateReponse:respDate(r)};
}
const emailKey=r=>emails(r.Email)[0]||'';
function findInviteByEmail(e){e=s_(e).trim().toLowerCase();if(!e)return null;return S.inv.find(i=>emails(i.Email).includes(e))||null;}
function nameMatch(r,inv){
  const ln=norm(r.Nom),fn=norm(r.Prenom),iln=norm(inv.Nom),ifn=norm(inv.Prenom);
  if(!ln||!iln)return false;
  const lastOk=ln===iln||(ln.length>=4&&iln.includes(ln))||(iln.length>=4&&ln.includes(iln));
  const firstOk=!fn||!ifn||fn===ifn||(fn.length>=3&&ifn.startsWith(fn))||(ifn.length>=3&&fn.startsWith(ifn));
  return lastOk&&firstOk;
}
function laterExists(r){const k=emailKey(r);if(!k)return false;return S.rep.some(x=>x.id>r.id&&x.Invite!==-1&&emailKey(x)===k);}
function checkResponse(r){
  const e=emailKey(r);let inv=e?findInviteByEmail(e):null;const reasons=[];
  const hasId=!!(norm(r.Nom)||norm(r.Prenom));
  if(inv){
    if(hasId&&!nameMatch(r,inv))reasons.push('Le nom saisi ne correspond pas à celui de la base ('+fullName(inv)+')');
    const cat=s_(r.Categorie);
    if(cat&&cat!==AUTRE&&norm(cat)!==norm(inv.Categorie))reasons.push('Catégorie différente : « '+cat+' » au lieu de « '+s_(inv.Categorie)+' »');
  }else{
    if(hasId){const c=S.inv.filter(i=>nameMatch(r,i));if(c.length)inv=c[0];}
    reasons.push(inv?'Adresse e-mail inconnue, mais cette personne existe dans la base':(e?'Nouvelle personne : absente de la base':'Adresse e-mail absente ou invalide'));
  }
  return {inv,reasons,auto:!!inv&&reasons.length===0};
}
function repState(r){
  if(r.Invite===-1)return {k:'ign',t:'Rejetée'};
  if(laterExists(r))return {k:'old',t:'Remplacée par une réponse plus récente'};
  const inv=r.Invite>0?S.inv.find(i=>i.id===r.Invite):null;
  if(inv)return {k:'ok',t:'Intégrée → '+dispName(inv)};
  if(!normPres(r.Presence))return {k:'bad',t:'Réponse non reconnue',c:checkResponse(r)};
  const c=checkResponse(r);
  return {k:'val',t:'À valider',c};
}
const pendingReps=()=>S.rep.filter(r=>{const k=repState(r).k;return k==='val'||k==='bad';});
function applyActions(r,inv,extra){
  const f=Object.assign(respFields(r),extra||{});
  if(answered(inv)&&(inv.Reponse!==f.Reponse||(+inv.NbAccompagnants||0)!==f.NbAccompagnants||s_(inv.RepresentePar)!==f.RepresentePar))f.ReponseModifiee=true;
  const e=emailKey(r);if(e&&!emails(inv.Email).includes(e))f.Email=(s_(inv.Email).trim()?s_(inv.Email).trim()+' ; ':'')+e;
  if(!inv.Fonction1&&r.Fonction)f.Fonction1=r.Fonction;
  if(!inv.Prenom&&r.Prenom)f.Prenom=r.Prenom;if(!inv.Nom&&r.Nom)f.Nom=r.Nom;
  Object.assign(inv,f);r.Traitee=true;r.Invite=inv.id;
  return [['UpdateRecord','Invites',inv.id,f],['UpdateRecord','Reponses',r.id,{Traitee:true,Invite:inv.id}]];
}
async function syncReponses(){
  const todo=S.rep.filter(r=>repState(r).k==='val').sort((a,b)=>a.id-b.id);
  const acts=[];let n=0;
  for(const r of todo){const c=checkResponse(r);if(!c.auto)continue;acts.push(...applyActions(r,c.inv));n++;}
  if(acts.length)await act(acts);
  return n;
}
async function mergeInvites(keepId,dropIds){
  const keep=S.inv.find(i=>i.id===keepId);const acts=[];const f={};
  ['Categorie','Civilite','Prenom','Nom','Fonction1','Fonction2','Fonction3','Adresse1','Adresse2','CP','Ville','NotesProtocole','Accompagnants','RepresentePar'].forEach(k=>{if(!s_(keep[k]).trim()){for(const id of dropIds){const d=S.inv.find(i=>i.id===id);if(d&&s_(d[k]).trim()){f[k]=d[k];break;}}}});
  const em=emails(keep.Email);dropIds.forEach(id=>{const d=S.inv.find(i=>i.id===id);emails(d.Email).forEach(e=>{if(!em.includes(e))em.push(e);});});
  f.Email=em.join(' ; ');
  let best=answered(keep)?keep:null;dropIds.forEach(id=>{const d=S.inv.find(i=>i.id===id);if(answered(d)&&(!best||s_(d.DateReponse)>s_(best.DateReponse)))best=d;});
  if(best&&best!==keep)['Reponse','NbAccompagnants','Accompagnants','RepresentePar','SourceReponse','DateReponse'].forEach(k=>f[k]=best[k]);
  dropIds.forEach(id=>{const d=S.inv.find(i=>i.id===id);if(d.DateInvitation&&(!keep.DateInvitation||d.DateInvitation<keep.DateInvitation))f.DateInvitation=d.DateInvitation;if((+d.NbRelances||0)>(+keep.NbRelances||0))f.NbRelances=d.NbRelances;if(d.ListeAttente&&keep.ListeAttente)f.ListeAttente=true;});
  acts.push(['UpdateRecord','Invites',keepId,f]);
  S.rep.filter(r=>dropIds.includes(r.Invite)).forEach(r=>acts.push(['UpdateRecord','Reponses',r.id,{Invite:keepId}]));
  dropIds.forEach(id=>acts.push(['RemoveRecord','Invites',id]));
  await act(acts);await loadAll();
}
async function refresh(silent){

  }catch(e){console.error(e);toast('Erreur de chargement : '+(e.message||e),true);}
  busy=false;render();
}


/* ----------------------------- Excel (ExcelJS) ----------------------------- */
function loadScript(src,ms){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;const t=setTimeout(()=>{s.remove();rej(new Error('délai dépassé'));},ms||8000);s.onload=()=>{clearTimeout(t);res();};s.onerror=()=>{clearTimeout(t);s.remove();rej(new Error('introuvable'));};document.head.appendChild(s);});}
async function loadExcelJS(){
  if(window.ExcelJS)return window.ExcelJS;
  for(const u of EXCELJS_URLS){try{await loadScript(u);if(window.ExcelJS)return window.ExcelJS;}catch(e){}}
  throw new Error('Bibliothèque ExcelJS inaccessible (déposez exceljs.min.js à côté du widget ou autorisez cdn.jsdelivr.net)');
}
function cellText(v){
  if(v==null)return '';
  if(typeof v==='object'){
    if(v.richText)return v.richText.map(x=>x.text).join('');
    if(v.text!=null)return typeof v.text==='object'?cellText(v.text):String(v.text);
    if(v.result!=null)return String(v.result);
    if(v.hyperlink)return String(v.hyperlink).replace(/^mailto:/,'');
    if(v instanceof Date)return v.toISOString().slice(0,10);
    return '';
  }
  return String(v);
}
const clean=v=>cellText(v).replace(/\s+/g,' ').trim();
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}

const IMPORT_MAP={categorie:'Categorie',civilite:'Civilite',prenom:'Prenom',nom:'Nom',fonction1:'Fonction1',fonction2:'Fonction2',fonction3:'Fonction3',adresse1:'Adresse1',adresse2:'Adresse2',cp:'CP',ville:'Ville',email:'Email',mail:'Email',courriel:'Email',reponse:'Reponse'};
async function parseExcel(file){
  const EJ=await loadExcelJS();const wb=new EJ.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const ws=wb.worksheets.find(w=>norm(w.name)==='listecomplete')||wb.worksheets[0];
  let hdrRow=0,cols={};
  for(let r=1;r<=Math.min(6,ws.rowCount);r++){
    const m={};ws.getRow(r).eachCell((c,ci)=>{const k=IMPORT_MAP[norm(clean(c.value))];if(k&&!m[k])m[k]=ci;});
    if(m.Nom&&m.Categorie){hdrRow=r;cols=m;break;}
  }
  if(!hdrRow)throw new Error('En-têtes « Catégorie » et « NOM » introuvables dans la feuille « '+ws.name+' ».');
  const out=[];
  for(let r=hdrRow+1;r<=ws.rowCount;r++){
    const row=ws.getRow(r);const o={};let content=0;
    for(const [k,ci] of Object.entries(cols)){const v=row.getCell(ci).value;o[k]=k==='Reponse'?(typeof v==='number'?v:clean(v)):clean(v);if(k!=='Categorie'&&o[k]!==''&&o[k]!=null)content++;}
    if(!content)continue; // ligne vide (ou total)
    if(!o.Nom&&!o.Prenom&&!o.Email&&!o.Fonction1)continue;
    out.push(o);
  }
  return {rows:out,sheet:ws.name};
}
function importReponse(v){
  if(v===''||v==null)return {};
  if(typeof v==='number')return v>0?{Reponse:'Présent',NbAccompagnants:Math.max(0,Math.round(v)-1)}:{};
  const n=norm(v);if(/^(1|oui|present|presente|ok|x)/.test(n))return {Reponse:'Présent'};if(/^(non|excuse|absent)/.test(n))return {Reponse:'Excusé'};return {};
}
function planImport(rows){
  /* Rapprochement avec la base existante : nom + prénom d'abord ; l'e-mail seul ne sert que si la ligne n'a pas de nom complet
     (une adresse peut être partagée par plusieurs personnes : mairie, cabinet…). Aucune ligne du fichier n'est écartée. */
  const plan={add:[],upd:[],dupRows:0,noCat:0};const idxE={},idxN={};
  S.inv.forEach(i=>{emails(i.Email).forEach(e=>(idxE[e]=idxE[e]||[]).push(i));const k=nameKey(i);if(k)(idxN[k]=idxN[k]||[]).push(i);});
  const seenN={},seenE={};
  rows.forEach(r=>{
    const em=emails(r.Email),k=nameKey(r);
    if(!r.Categorie)plan.noCat++;
    if((k&&seenN[k])||em.some(e=>seenE[e]))plan.dupRows++;
    if(k)seenN[k]=1;em.forEach(e=>seenE[e]=1);
    let ex=null;
    if(k&&idxN[k])ex=idxN[k].find(i=>emails(i.Email).some(e=>em.includes(e)))||idxN[k][0];
    else if(!k){for(const e of em){const c=idxE[e];if(c&&c.length===1){ex=c[0];break;}}}
    if(ex)plan.upd.push({inv:ex,row:r});else plan.add.push({row:r});
  });
  return plan;
}
async function applyImport(plan){
  const acts=[];const fields=['Categorie','Civilite','Prenom','Nom','Fonction1','Fonction2','Fonction3','Adresse1','Adresse2','CP','Ville','Email'];
  plan.upd.forEach(({inv,row})=>{const f={};fields.forEach(k=>{if(row[k]!==''&&row[k]!=null&&row[k]!==inv[k])f[k]=row[k];});
    if(!answered(inv)){const rr=importReponse(row.Reponse);if(rr.Reponse){Object.assign(f,rr,{SourceReponse:'Import Excel',DateReponse:todayIso()});}}
    if(Object.keys(f).length)acts.push(['UpdateRecord','Invites',inv.id,f]);});
  if(plan.add.length){
    const cols={};[...fields,'Reponse','NbAccompagnants','SourceReponse','DateReponse'].forEach(k=>cols[k]=[]);
    plan.add.forEach(({row})=>{fields.forEach(k=>cols[k].push(row[k]||''));const rr=importReponse(row.Reponse);cols.Reponse.push(rr.Reponse||'');cols.NbAccompagnants.push(rr.NbAccompagnants||0);cols.SourceReponse.push(rr.Reponse?'Import Excel':'');cols.DateReponse.push(rr.Reponse?todayIso():'');});
    acts.push(['BulkAddRecord','Invites',plan.add.map(()=>null),cols]);
  }
  if(acts.length)await act(acts);
  await loadAll();await ensureCategories();await syncReponses();
}

function u8b64(str){const b=new TextEncoder().encode(str);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin);}

}

  let out='',line=name+': ';
  list.forEach((a,i)=>{const tok=a+(i<list.length-1?',':'');if(line.length+tok.length>76&&line.trim().length>name.length+1){out+=line.replace(/ $/,'')+'\r\n';line=' ';}line+=tok+' ';});

function mime(type,boundary,parts){return 'Content-Type: '+type+'; boundary="'+boundary+'"\r\n\r\n'+parts.map(x=>'--'+boundary+'\r\n'+x).join('\r\n')+'\r\n--'+boundary+'--\r\n';}
function buildEml(type,addrs,attach){
  const p=P(),m=buildMail(type,false),id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const subject=type==='relance'?p.objetRelance:p.objetInvitation;
  const alt=mime('multipart/alternative','alt_'+id,[
    'Content-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap76(u8b64(m.text)),
    'Content-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap76(u8b64(m.html))]);
  const relParts=[alt.replace(/^/,'')];
  [['imgEntete','entete@voeux'],['imgCarton','carton@voeux']].forEach(([k,cid])=>{const d=dataUri(p[k]);if(d&&m.html.includes('cid:'+cid)){const ext=d.mime.split('/')[1].replace('jpeg','jpg');
    relParts.push('Content-Type: '+d.mime+'; name="'+cid.split('@')[0]+'.'+ext+'"\r\nContent-Transfer-Encoding: base64\r\nContent-ID: <'+cid+'>\r\nContent-Disposition: inline; filename="'+cid.split('@')[0]+'.'+ext+'"\r\n\r\n'+wrap76(d.b64));}});
  let body=relParts.length>1?mime('multipart/related','rel_'+id,relParts):alt;

  }

  if(p.expediteur)head.push('From: '+p.expediteur);

function readFileB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:file.name,type:file.type,b64:String(r.result).split(',')[1]});r.onerror=rej;r.readAsDataURL(file);});}

document.addEventListener('click',async ev=>{
  const t=ev.target;
  const mn=t.closest('[data-menu]'),ma=t.closest('[data-ma]');
  if(ma){ev.stopPropagation();const a=ma.dataset.ma;UI.menu=null;
    if(a.startsWith('step:')){UI.step=a.slice(5);render();}
    else if(a==='file'){render();const f=$('#fimp');if(f)f.click();else{UI.step='liste';render();$('#fimp').click();}}
    else if(a){const b=document.createElement('button');b.dataset.act=a;b.style.display='none';document.body.appendChild(b);b.click();b.remove();render();}
    else render();
    return;}
  if(mn&&!t.closest('.drop')){UI.menu=UI.menu===mn.dataset.menu?null:mn.dataset.menu;render();return;}
  if(UI.menu&&!ma){UI.menu=null;render();}
  const sel=t.closest('[data-selinv]');if(sel){UI.sel=+sel.dataset.selinv;invRows();detail();return;}
  const fc=t.closest('[data-fcat]');if(fc){UI.fcat=fc.dataset.fcat;UI.quick='';rListe($('#wbody'));return;}
  const qk=t.closest('[data-quick]');if(qk){UI.quick=UI.quick===qk.dataset.quick?'':qk.dataset.quick;UI.fcat='';rListe($('#wbody'));return;}
  const ds=t.closest('[data-dsave]');
  if(ds){try{const id=+ds.dataset.dsave,f={};document.querySelectorAll('#det [data-d]').forEach(el=>{f[el.dataset.d]=el.type==='number'?(+el.value||0):el.value.trim();});
    const old=S.inv.find(x=>x.id===id);
    if(f.Reponse&&(old.Reponse!==f.Reponse||!old.DateReponse)){f.DateReponse=todayIso();f.SourceReponse=old.SourceReponse||'Saisie manuelle';}
    if(!f.Reponse){f.NbAccompagnants=0;f.RepresentePar='';f.DateReponse='';}
    if(f.Reponse==='Présent')f.RepresentePar='';if(f.Reponse==='Excusé')f.NbAccompagnants=0;
    await updInv(id,f);render();toast('Fiche enregistrée');}catch(e){toast('Erreur : '+(e.message||e),true);}}
});

async function saveInvite(id){
  const f={};document.querySelectorAll('#modal [data-f]').forEach(el=>{const k=el.dataset.f;f[k]=el.type==='checkbox'?el.checked:(el.type==='number'?(el.value===''?0:+el.value):el.value.trim());});
  if(!id){const dup=S.inv.find(i=>nameKey(i)&&nameKey(i)===nameKey(f));if(dup&&!openInvite.force){openInvite.force=true;toast('Une personne de ce nom existe déjà ('+dispName(dup)+'). Cliquez encore sur « Enregistrer » pour créer quand même un doublon.',true);return;}}
  openInvite.force=false;
  if(f.Reponse&&!f.SourceReponse)f.SourceReponse='Saisie manuelle';
  const old=id?S.inv.find(x=>x.id===id):null;
  if(f.Reponse&&(!old||old.Reponse!==f.Reponse||!old.DateReponse))f.DateReponse=todayIso();
  if(!f.Reponse){f.NbAccompagnants=0;f.Accompagnants='';f.RepresentePar='';f.DateReponse='';}
  if(f.Reponse==='Présent')f.RepresentePar='';if(f.Reponse==='Excusé'){f.NbAccompagnants=0;f.Accompagnants='';}
  if(id){await act([['UpdateRecord','Invites',id,f]]);}else{await act([['AddRecord','Invites',null,f]]);}
  await loadAll();await ensureCategories();closeModal();render();toast('Fiche enregistrée');
}

   '<h3>À qui rattacher cette réponse ?</h3><div class="row"><div style="flex:1;min-width:240px">'+(cand?'✔ <b>'+esc(dispName(cand))+'</b> ('+esc(cand.Categorie)+')':'<b>Nouvelle personne</b> (elle sera ajoutée à la liste)')+'</div><input id="vsearch" type="search" placeholder="🔍 Choisir une autre personne de la liste…" style="min-width:260px">'+(cand?'<button class="b sec sm" data-vnew="1">C’est une nouvelle personne</button>':'')+'</div><div id="vres"></div>'+
   (dupWarn?'<div class="warn">⚠ Une personne portant ce nom existe déjà dans la liste. Évitez de créer un doublon : cherchez-la ci-dessus.</div>':'')+
   '<h3>Catégorie à enregistrer</h3><div class="row"><select id="vcat"><option value="">— à choisir —</option>'+S.cat.map(x=>'<option'+(defCat===x.Nom?' selected':'')+' value="'+esc(x.Nom)+'">'+esc(x.Nom)+'</option>').join('')+'</select><span class="small muted">'+(declared?'La personne a choisi : « '+esc(declared)+' ».':'')+'</span></div>'+
   '<div class="row" style="margin-top:16px"><button class="b vert" data-act="v-accept" style="font-size:16px">✔ Accepter'+(cand?' et rattacher à '+esc(fullName(cand)):' et ajouter à la liste')+'</button><button class="b red" data-act="v-reject">✖ Rejeter cette réponse</button><button class="b sec" data-act="close">Annuler</button></div>');
}
async function acceptValidate(){
  const v=UI.val,r=S.rep.find(x=>x.id===v.rid);saveValState();
  const cand=v.cand?S.inv.find(i=>i.id===v.cand):null;
  if(!normPres(r.Presence)){
    if(!v.pres){toast('Indiquez d’abord si la personne vient ou non.',true);return;}
    const lbl=v.pres==='Présent'?PRES_OUI:PRES_NON;await act([['UpdateRecord','Reponses',r.id,{Presence:lbl}]]);r.Presence=lbl;
  }
  const cat=v.cat||'';
  if(cand){await act(applyActions(r,cand,cat?{Categorie:cat}:{}));}
  else{
    if(!cat){toast('Choisissez la catégorie de cette nouvelle personne.',true);return;}
    const f=Object.assign({Categorie:cat,Prenom:s_(r.Prenom),Nom:s_(r.Nom),Fonction1:s_(r.Fonction),Email:emailKey(r)||s_(r.Email).trim(),Remarques:'Inscrit via le formulaire'},respFields(r));
    const res=await act([['AddRecord','Invites',null,f]]);let id=res&&res.retValues&&res.retValues[0];
    await loadAll();if(!id){const m=findInviteByEmail(f.Email);id=m&&m.id;}
    if(id)await act([['UpdateRecord','Reponses',r.id,{Traitee:true,Invite:id}]]);
  }
  await loadAll();await ensureCategories();closeModal();render();toast('Réponse enregistrée');
}

/* ----------------------------- Événements ----------------------------- */
const CLICK_SEL='[data-step],[data-rsub],[data-act],[data-edit],[data-gen],[data-gen-test],[data-prev],[data-doc],[data-catup],[data-catdn],[data-delimg],[data-valid],[data-vpick],[data-vnew],[data-pickfiche],[data-seen],[data-redo],[data-keep]';
document.addEventListener('click',async ev=>{
  const t=ev.target.closest(CLICK_SEL);if(!t)return;
  try{
    if(t.dataset.step){UI.step=t.dataset.step;if(t.dataset.rsub)UI.rsub=t.dataset.rsub;render();window.scrollTo(0,0);if(t.tagName==='A')ev.preventDefault();return;}
    if(t.dataset.rsub){UI.rsub=t.dataset.rsub;render();return;}
    if(t.dataset.edit){openInvite(+t.dataset.edit);return;}
    if(t.dataset.gen){await generate(t.dataset.gen,false);return;}
    if(t.dataset.genTest){await generate(t.dataset.genTest,true);return;}
    if(t.dataset.prev){const m=buildMail(t.dataset.prev,true);modal('<h2>Aperçu – '+(t.dataset.prev==='relance'?'relance':'invitation')+'</h2><iframe style="width:100%;height:560px;border:1px solid #ddd" srcdoc="'+esc(m.html)+'"></iframe><div class="row"><button class="b" data-act="close">Fermer</button></div>');return;}
    if(t.dataset.doc){
      const m=t.dataset.doc,cat=($(m==='amont'?'#docCatAmont':'#docCatAval')||{}).value||'';
      showPrint(docPrefete(m,m==='aval'&&$('#onlyPres')&&$('#onlyPres').checked,m==='amont'?(+($('#nbBlank')||{}).value||0):0,cat),'Liste_Prefete_'+m+(cat?'_'+norm(cat).slice(0,24):'')+'_'+todayIso()+'.html',(m==='aval'?'Réponses':'Invités')+(cat?' – '+cat:' par catégorie'));return;}
    if(t.dataset.delimg){await setPar(t.dataset.delimg,'');render();return;}
    if(t.dataset.catup||t.dataset.catdn){
      const id=+(t.dataset.catup||t.dataset.catdn),k=S.cat.findIndex(c=>c.id===id),k2=t.dataset.catup?k-1:k+1;if(k<0||k2<0||k2>=S.cat.length)return;
      const a=S.cat[k],b=S.cat[k2];const oa=a.Ordre,ob=b.Ordre;
      await act([['UpdateRecord','Categories',a.id,{Ordre:ob===oa?ob+(t.dataset.catup?-1:1):ob}],['UpdateRecord','Categories',b.id,{Ordre:oa}]]);
      S.cat=(await fetchRows('Categories')).sort((x,y)=>(x.Ordre||0)-(y.Ordre||0)||x.id-y.id);render();return;}
    if(t.dataset.valid){openValidate(+t.dataset.valid);return;}
    if(t.dataset.vpick){saveValState();UI.val.cand=+t.dataset.vpick;UI.val.cat=undefined;renderValidate();return;}
    if(t.dataset.vnew){saveValState();UI.val.cand=0;UI.val.cat=undefined;renderValidate();return;}
    if(t.dataset.pickfiche){closeModal();openInvite(+t.dataset.pickfiche);return;}
    if(t.dataset.seen){await updInv(+t.dataset.seen,{ReponseModifiee:false});render();return;}
    if(t.dataset.redo){const r=S.rep.find(x=>x.id===+t.dataset.redo);await act([['UpdateRecord','Reponses',r.id,{Traitee:false,Invite:0}]]);r.Traitee=false;r.Invite=0;await syncReponses();render();toast('Réponse retraitée');return;}
    if(t.dataset.keep){const keep=+t.dataset.keep,drop=t.dataset.drop.split(',').map(Number);await mergeInvites(keep,drop);toast('Fiches fusionnées');openDups();render();return;}
    switch(t.dataset.act){
      case 'refresh':ev.preventDefault();await refresh();break;
      case 'close':closeModal();break;
      case 'new':openInvite(null);break;
      case 'dups':openDups();break;
      case 'note':openNote();break;
      case 'save-inv':await saveInvite(t.dataset.id?+t.dataset.id:null);break;
      case 'del-ask':modal('<h2>Supprimer cette personne ?</h2><p>Cette action est définitive.</p><div class="row"><button class="b red" data-act="del-ok" data-id="'+t.dataset.id+'">Oui, supprimer</button><button class="b sec" data-act="close">Non</button></div>');break;
      case 'del-ok':await act([['RemoveRecord','Invites',+t.dataset.id]]);await loadAll();closeModal();render();toast('Personne supprimée');break;
      case 'confirm-sent':await confirmSent();break;
      case 'cancel-sent':UI.pending=null;render();break;
      case 'v-accept':await acceptValidate();break;
      case 'v-reject':{const v=UI.val;await act([['UpdateRecord','Reponses',v.rid,{Traitee:true,Invite:-1}]]);const r=S.rep.find(x=>x.id===v.rid);r.Traitee=true;r.Invite=-1;closeModal();render();toast('Réponse rejetée');break;}
      case 'notif':{const reps=newReps();if(!reps.length)break;download(new Blob([buildDigestEml(reps)],{type:'message/rfc822'}),'Notification_reponses_'+todayIso()+'.eml');UI.pendingNotif={max:Math.max(...reps.map(r=>r.id))};render();break;}
      case 'notif-ok':await setPar('notifJusqua',String(UI.pendingNotif.max));UI.pendingNotif=null;render();toast('Notification enregistrée');break;
      case 'notif-cancel':UI.pendingNotif=null;render();break;
      case 'syncform':{const n=await syncFormChoices();toast('Liste du formulaire mise à jour ('+n+' choix)');break;}
      case 'xlsx':try{await exportXlsx();toast('Fichier Excel généré');}catch(e){toast(e.message,true);}break;
      case 'emarg':showPrint(docEmargement(),'Emargement_'+todayIso()+'.html','Liste d’émargement');break;
      case 'pl-close':$('#printLayer').style.display='none';break;
      case 'pl-print':try{$('#plFrame').contentWindow.focus();$('#plFrame').contentWindow.print();}catch(e){toast('Impression bloquée : téléchargez le fichier .html et imprimez-le depuis le navigateur.',true);}break;
      case 'pl-dl':download(new Blob([UI.printHtml],{type:'text/html'}),UI.printName);break;
      case 'imp-ok':{const plan=UI.impPlan;closeModal();toast('Import en cours…');await applyImport(plan);render();toast('Import terminé : '+plan.add.length+' ajout(s), '+plan.upd.length+' mise(s) à jour');break;}
    }
  }catch(e){console.error(e);toast('Erreur : '+(e.message||e),true);}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){UI.q=t.value;invRows();}
  else if(t.id==='jq'){UI.jq=t.value;const pos=t.selectionStart;rJourJ($('#wbody'));const n=$('#jq');n.focus();n.setSelectionRange(pos,pos);}
  else if(t.id==='vsearch'){
    const q=norm(t.value),box=$('#vres'),L=q.length<2?[]:S.inv.filter(i=>norm(i.Nom+' '+i.Prenom+' '+i.Email).includes(q)).slice(0,8);
    box.innerHTML=L.map(i=>'<button class="b sec sm" style="margin:2px" data-vpick="'+i.id+'">'+esc(dispName(i))+' <span class="muted">('+esc(i.Categorie)+')</span></button>').join('');
  }
  else if(t.id==='nsearch'){
    const q=norm(t.value),box=$('#nres'),L=q.length<2?[]:S.inv.filter(i=>norm(i.Nom+' '+i.Prenom).includes(q)).slice(0,10);
    box.innerHTML=L.map(i=>'<div class="row" style="border-top:1px solid #eee"><div style="flex:1"><b>'+esc(dispName(i))+'</b> — '+esc(i.Categorie)+'<br><span class="small muted">'+esc(fonctions(i))+'</span></div>'+badge(i)+'<button class="b" data-pickfiche="'+i.id+'">Noter sa réponse</button></div>').join('')||(q.length>=2?'<p class="muted">Personne ne porte ce nom dans la liste.</p>':'');
  }
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  try{
    if(t.id==='fcat'){UI.fcat=t.value;invRows();}
    else if(t.id==='fstat'){UI.fstat=t.value;invRows();}
    else if(t.id==='fdup'){UI.dup=t.checked;invRows();}
    else if(t.id==='incAll'){UI.incAll=t.checked;render();}
    else if(t.dataset.arr){await updInv(+t.dataset.arr,{Arrive:t.checked});rJourJ($('#wbody'));}
    else if(t.dataset.par){await setPar(t.dataset.par,t.value.trim());if(t.dataset.par==='titre')render();}
    else if(t.dataset.pub){const c=S.cat.find(x=>x.id===+t.dataset.pub);c.PubForm=t.checked;await act([['UpdateRecord','Categories',c.id,{PubForm:t.checked}]]);await syncFormChoices();toast('Liste du formulaire mise à jour');}
    else if(t.dataset.catname){
      const c=S.cat.find(x=>x.id===+t.dataset.catname),nv=t.value.trim();if(!nv||nv===c.Nom)return;
      const acts=S.inv.filter(i=>s_(i.Categorie)===c.Nom).map(i=>['UpdateRecord','Invites',i.id,{Categorie:nv}]);
      const other=S.cat.find(x=>x.Nom===nv&&x.id!==c.id);
      if(other)acts.push(['RemoveRecord','Categories',c.id]);else acts.push(['UpdateRecord','Categories',c.id,{Nom:nv}]);
      await act(acts);await loadAll();render();await syncFormChoices();toast(other?'Catégories fusionnées':'Catégorie renommée');
    }
    else if(t.dataset.att){UI.att[t.dataset.att]=t.files[0]||null;}
    else if(t.dataset.img){const f=t.files[0];if(f){const d=await readImage(f,1200);await setPar(t.dataset.img,d);render();toast('Image enregistrée');}}
    else if(t.id==='fimp'){
      const f=t.files[0];t.value='';if(!f)return;toast('Lecture du fichier…');
      const {rows,sheet}=await parseExcel(f);const plan=planImport(rows);UI.impPlan=plan;
      const cats=new Set(rows.map(r=>r.Categorie).filter(Boolean));
      modal('<h2>Charger « '+esc(f.name)+' »</h2><p>Feuille lue : <b>'+esc(sheet)+'</b> — '+rows.length+' ligne(s) avec contenu, '+cats.size+' catégorie(s).</p>'+
       (plan.dupRows?'<div class="warn"><b>'+plan.dupRows+' ligne(s)</b> semblent en doublon dans le fichier (même nom + prénom ou même e-mail). Elles sont importées quand même ; repérez-les ensuite avec « Vérifier et fusionner ».</div>':'')+(plan.noCat?'<div class="warn"><b>'+plan.noCat+' ligne(s) sans catégorie</b> : elles apparaîtront sous « (sans catégorie) ».</div>':'')+
       '<div class="okbox"><b>'+plan.add.length+'</b> nouvelle(s) personne(s) seront ajoutée(s).<br><b>'+plan.upd.length+'</b> personne(s) déjà présentes (même nom et prénom) seront mises à jour (coordonnées et catégorie ; les réponses déjà enregistrées sont conservées).</div>'+
       '<div class="row"><button class="b" data-act="imp-ok">Lancer le chargement</button><button class="b sec" data-act="close">Annuler</button></div>');
    }
  }catch(e){console.error(e);toast('Erreur : '+(e.message||e),true);}
});

/* ----------------------------- Démarrage ----------------------------- */
(async function init(){
  try{
    grist.ready({requiredAccess:'full'});
    const n=await ensureSchema();
    await refresh(true);
    if(n)toast('Tables créées dans le document Grist ('+n+' opération(s))');
    setInterval(()=>{if(document.visibilityState==='visible'&&$('#modalBg').style.display!=='flex'&&$('#printLayer').style.display!=='flex'&&!/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||''))refresh(true);},60000);
  }catch(e){console.error(e);$('#wbody').innerHTML='<div class="warn"><b>Impossible d’initialiser le widget.</b><br>'+esc(e.message||e)+'<br>Vérifiez que le widget est ajouté à une vue Grist avec l’accès « Accès complet au document ».</div>';}
})();
</script>
</body>
</html>
