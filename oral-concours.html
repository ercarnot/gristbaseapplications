  $('tDigits').textContent = fmt(shown);
  $('tBar').style.width = Math.max(0, Math.min(100, rem/DURATION*100)) + '%';
  box.classList.toggle('warn', rem <= DURATION*0.2 && rem > 0);
  box.classList.toggle('over', rem <= 0);
  $('tState').textContent = rem<=0 ? 'Temps écoulé — concluez.' : running ? 'Chrono en cours' : (el>0 ? 'En pause' : 'Prêt : 1 min 30');
  const b = $('btnTimer'); if(b) b.textContent = running ? '⏸ Pause' : (el>0 ? '▶ Reprendre' : '▶ Démarrer le chrono');
}

/* ============ Navigation pas à pas et auto-évaluation ============ */
function leave(){
  if (S && S.idx>=0 && S.idx<S.steps.length){ const e=Math.round(elapsed()); if(e>0 || S.times[S.idx]==null) S.times[S.idx]=e; }
  stopTimer();
}
function go(n){
  leave();
  if (n >= S.steps.length){ S.idx = S.steps.length; S.done = true; render(); saveSession(); return; }
  S.done = false; S.idx = Math.max(-1, n); S.showPistes = false;
  if (S.idx>=0) markSeen(S.steps[S.idx]);
  render();
  if (S.idx>=0 && settings.auto) startTimer();
}
const next = () => { if(!S || S.done) return; go(S.idx+1); };
const prev = () => { if(!S || S.idx<=-1) return; if (S.done){ S.done=false; go(S.steps.length-1); } else go(S.idx-1); };

function markSeen(step){
  if (step.counted) return; step.counted = true;
  const q = step.q;
  step.base = {boite:q.boite, note:q.note, prochaine:q.prochaine};
  q.nb += 1; q.dernier = today();
  persistQuestion(q);
}
function rate(note){
  if (!S || S.idx<0 || S.done) return;
  const step = S.steps[S.idx], q = step.q, base = step.base || {boite:q.boite, note:q.note};
  let boite;
  if (note==='ratee') boite = 0;
  else if (note==='a_revoir') boite = 1;
  else boite = Math.min(Math.max((base.note ? base.boite : 0)+1, 2), 4);
  q.boite = boite; q.note = note; q.prochaine = addDays(today(), INTERVALS[boite]);
  S.ratings[S.idx] = note;
  persistQuestion(q);
  renderRating(); renderTabs();
}
function renderRating(){
  const cur = S && S.ratings[S.idx];
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('sel', b.dataset.n===cur));
}
function counts(){
  const c = {acquise:0, a_revoir:0, ratee:0, none:0};
  S.steps.forEach((_,i)=>{ const r=S.ratings[i]; if(r) c[r]++; else c.none++; });
  return c;
}
async function saveSession(){
  if (S.saved) return; S.saved = true;
  const c = counts();
  const detail = S.steps.map((st,i)=>({onglet:st.key, question:st.q.question, secondes:S.times[i]??null, note:S.ratings[i]||null}));
  const total = Object.values(S.times).reduce((a,b)=>a+(b||0),0);
  const row = {Date:new Date().toISOString(), Ordre:S.order.join(' > '), Duree_totale:total, Detail:JSON.stringify(detail), Mode:S.mode,
    Nb_acquises:c.acquise, Nb_a_revoir:c.a_revoir, Nb_ratees:c.ratee, Nb_non_evaluees:c.none};
  if (!inGrist){
    demoSessions.push(row); try{ localStorage.setItem('oralConcoursDemoSessions', JSON.stringify(demoSessions.slice(-50))); }catch(e){}
    return;
  }
  try{
    await grist.docApi.applyUserActions([['AddRecord', T_S, null, row]]);
    setBanner('Séance enregistrée dans la base (table '+T_S+').','info');
  }catch(e){ console.warn(e); }
}

/* ============ Rendu ============ */
function setBanner(txt, kind){
  const b = $('banner'); if(!txt){ b.hidden = true; return; }
  b.hidden = false; b.className = 'banner' + (kind==='info' ? ' info' : ''); b.textContent = txt;
}
function renderTabs(){
  const nav = $('tabs'); nav.replaceChildren();
  S.order.forEach((key, i)=>{
    const steps = S.steps.map((s,idx)=>({s,idx})).filter(x=>x.s.tabIdx===i);
    const cur = S.idx>=0 && S.idx<S.steps.length && S.steps[S.idx].tabIdx===i;
    const done = steps.length>0 && steps.every(x=>S.idx>x.idx || S.done);
    const dots = h('div',{class:'dots'}, steps.map(x=>{
      let c='dot';
      if (S.ratings[x.idx]) c+=' done'+(S.ratings[x.idx]!=='acquise'?' r-'+S.ratings[x.idx]:'');
      else if (S.done || S.idx>x.idx) c+=' done';
      else if (S.idx===x.idx) c+=' now';
      return h('span',{class:c});
    }));
    nav.append(h('button',{class:'tab'+(cur?' current':'')+(done?' done':''), type:'button', onclick:()=>{ if(steps.length) go(steps[0].idx); }},
      h('span',{class:'num',text:'Onglet '+(i+1)}), h('span',{class:'name',text:typeInfo(key).short}), dots));
  });
}
function modeTitle(){
  if (S.mode==='single') return 'Mini-séance : '+typeInfo(S.order[0]).label;
  if (S.mode==='review') return 'Questions à revoir';
  return 'Ordre des onglets tiré au sort';
}
function renderStage(){
  const st = $('stage'); st.replaceChildren();
  const total = S.steps.length;

  if (total === 0){
    if (S.mode==='review'){
      st.append(h('h2',{class:'big',text:'Rien à revoir pour l’instant'}),
        h('p',{text:'Aucune question n’est notée « à revoir » ou « ratée ». Évaluez vos réponses pendant une séance (touches 1, 2, 3) pour alimenter cette liste.'}),
        h('div',{class:'controls'}, h('button',{class:'primary',onclick:()=>{settings.mode='full'; saveSettings(); syncHeader(); newSession();},text:'Lancer une séance complète'})));
    } else {

        h('p',{text:'La base ne contient pas encore de questions actives pour ce choix. Ouvrez « Base & réglages » pour en importer ou en ajouter.'}),
        h('div',{class:'controls'}, h('button',{class:'primary',onclick:()=>openDrawer('base'),text:'Ouvrir la base'})));
    }
    return;
  }

  if (S.idx === -1){   // écran d’ouverture
    const per = {}; S.steps.forEach(s=>per[s.tabIdx]=(per[s.tabIdx]||0)+1);
    const due = QUESTIONS.filter(q=>!q.ecarte && tierOf(q)===0).length;
    st.append(
      h('div',{class:'kicker'}, h('span',{text:'Nouvelle séance'}), h('span',{text:total+' questions · '+fmt(total*DURATION).replace(/^(\d+):(\d+)$/,'$1 min $2')+' de réponses'})),
      h('h2',{class:'big',text:modeTitle()}),
      h('ol',{class:'order'}, S.order.map((k,i)=>h('li',{}, h('span',{class:'n',text:i+1}), h('strong',{text:typeInfo(k).label}), h('span',{class:'c',text:(per[i]||0)+' question'+((per[i]||0)>1?'s':'')})))),
      h('p',{class:'note',text:'1 min 30 par question. Après chaque réponse, comparez-la à la piste (touche N), puis évaluez-vous : 1 acquise, 2 à revoir, 3 ratée. Les questions à revoir reviennent plus souvent.'+(due?' Aujourd’hui, '+due+' question'+(due>1?'s sont':' est')+' à revoir.':'')}),
      h('div',{class:'controls'}, h('button',{class:'primary',onclick:next,text:'Commencer la séance →'}))
    );
    return;
  }

  if (S.done){   // récapitulatif
    const c = counts();
    st.append(h('div',{class:'kicker'}, h('span',{text:'Séance terminée'})), h('h2',{class:'big',text:'Récapitulatif'}),
      h('div',{class:'summary'},

        h('span',{class:'pill a_revoir',text:c.a_revoir+' à revoir'}),
        h('span',{class:'pill ratee',text:c.ratee+' ratée'+(c.ratee>1?'s':'')}),
        h('span',{class:'pill',text:c.none+' non évaluée'+(c.none>1?'s':'')})));
    const tb = h('table',{class:'recap'}, h('thead',{}, h('tr',{}, h('th',{text:'Question'}), h('th',{text:'Évaluation'}), h('th',{text:'Temps'}))));
    const body = h('tbody'); let lastTab = -1, sum = 0;
    S.steps.forEach((s,i)=>{
      if (s.tabIdx!==lastTab){ lastTab=s.tabIdx; body.append(h('tr',{class:'grp'}, h('td',{colspan:3,text:'Onglet '+(s.tabIdx+1)+' — '+typeInfo(s.key).label}))); }
      const t = S.times[i]; if (t) sum += t; const r = S.ratings[i];
      body.append(h('tr',{}, h('td',{text:s.q.question}),
        h('td',{}, h('span',{class:'pill '+(r||''),text:r?NOTE_LABEL[r]:'—'})),
        h('td',{class:'t '+(t==null?'':(t>DURATION?'over-t':'ok-t')), text:t==null?'—':fmt(t)+(t>DURATION?' (dépassé)':'')})));
    });
    tb.append(body);
    st.append(tb, h('p',{class:'note',text:'Temps total de parole : '+fmt(sum)+'.'}),
      h('div',{class:'controls'}, h('button',{onclick:prev,text:'← Revenir à la dernière question'}),
        h('button',{onclick:()=>openDrawer('progress'),text:'Voir la progression'}),
        h('button',{class:'primary',onclick:newSession,text:'Nouvelle séance'})));
    return;
  }

  const s = S.steps[S.idx], inTab = S.steps.filter(x=>x.tabIdx===s.tabIdx).length;
  const nextStep = S.steps[S.idx+1];
  let nextLabel = 'Question suivante →';
  if (!nextStep) nextLabel = 'Terminer la séance ✓';
  else if (nextStep.tabIdx !== s.tabIdx) nextLabel = 'Onglet suivant : '+typeInfo(nextStep.key).short+' →';

  st.append(
    h('div',{class:'kicker'}, h('span',{text:'Onglet '+(s.tabIdx+1)+' / '+S.order.length+' · '+typeInfo(s.key).label}), h('span',{text:'Question '+s.n+' / '+inTab})),
    h('p',{class:'question',text:s.q.question}),
    ...(S.showPistes ? [h('div',{class:'pistes'}, h('small',{text:'Pistes de réponse'}), s.q.piste ? s.q.piste : 'Aucune piste saisie pour cette question.')] : []),
    h('div',{class:'timer',id:'timer'},
      h('div',{class:'digits',id:'tDigits',text:'1:30'}),
      h('div',{class:'barwrap'}, h('div',{class:'bar'}, h('i',{id:'tBar'})), h('div',{class:'tstate',id:'tState'}))),
    h('div',{class:'rate',id:'rate'}, h('span',{class:'ratelabel',text:'Votre réponse'}),
      h('button',{class:'rb acquise','data-n':'acquise',onclick:()=>rate('acquise'),text:'1 · Acquise'}),
      h('button',{class:'rb a_revoir','data-n':'a_revoir',onclick:()=>rate('a_revoir'),text:'2 · À revoir'}),
      h('button',{class:'rb ratee','data-n':'ratee',onclick:()=>rate('ratee'),text:'3 · Ratée'})),
    h('div',{class:'controls'},
      h('button',{onclick:prev,text:'← Précédente',disabled:S.idx<=0}),
      h('button',{class:'primary',id:'btnTimer',onclick:toggleTimer,text:'▶ Démarrer le chrono'}),
      h('button',{onclick:resetTimer,text:'↺ Remise à zéro'}),
      h('button',{onclick:()=>{S.showPistes=!S.showPistes; render();},text:S.showPistes?'Masquer les pistes':'Voir les pistes'}),
      h('button',{class:'primary',onclick:next,text:nextLabel}))
  );
  updateTimerUI(); renderRating();
}
function syncHeader(){

function render(){
  const dj = daysUntil(settings.examDate);

let drawerView = 'progress';
function openDrawer(view){ drawerView = view; $('drawer').hidden = false; if (view==='progress') buildProgress(); else buildBase(); }
function closeDrawer(){ $('drawer').hidden = true; }
function stateCounts(type){
  const act = QUESTIONS.filter(q=>q.type===type && !q.ecarte);
  const c = {total:act.length, acquise:0, a_revoir:0, ratee:0, none:0, due:0};
  act.forEach(q=>{ if(q.note==='acquise') c.acquise++; else if(q.note==='a_revoir') c.a_revoir++; else if(q.note==='ratee') c.ratee++; else c.none++; if(tierOf(q)===0) c.due++; });
  return c;
}
function stackBar(c){
  const t = c.total || 1, w = n => (n/t*100).toFixed(1)+'%';
  return h('div',{class:'stack'}, h('i',{style:'width:'+w(c.acquise)+';background:var(--ok)'}), h('i',{style:'width:'+w(c.a_revoir)+';background:var(--warn)'}), h('i',{style:'width:'+w(c.ratee)+';background:var(--bad)'}));
}
async function loadHistory(){
  if (!inGrist) return demoSessions.slice(-10).reverse();
  try{
    const t = await grist.docApi.fetchTable(T_S);
    const rows = t.id.map((id,i)=>({Date:t.Date[i], Mode:t.Mode?t.Mode[i]:'', Duree_totale:t.Duree_totale[i], Nb_acquises:t.Nb_acquises?t.Nb_acquises[i]:0, Nb_a_revoir:t.Nb_a_revoir?t.Nb_a_revoir[i]:0, Nb_ratees:t.Nb_ratees?t.Nb_ratees[i]:0, Nb_non_evaluees:t.Nb_non_evaluees?t.Nb_non_evaluees[i]:0, id}));

}
async function buildProgress(){
  $('drawerTitle').textContent = 'Progression';
  const b = $('drawerBody'); b.replaceChildren();
  const all = TYPES.map(t=>({t, c:stateCounts(t.key)}));
  const tot = all.reduce((a,x)=>{ for(const k of ['total','acquise','a_revoir','ratee','none','due']) a[k]+=x.c[k]; return a; }, {total:0,acquise:0,a_revoir:0,ratee:0,none:0,due:0});
  const dj = daysUntil(settings.examDate);
  b.append(
    h('p',{class:'note',text:(dj!=null&&dj>=0 ? (dj===0?'L’oral a lieu aujourd’hui. ':'Oral dans '+dj+' jour'+(dj>1?'s':'')+'. ') : '')+tot.acquise+' question'+(tot.acquise>1?'s':'')+' acquise'+(tot.acquise>1?'s':'')+' sur '+tot.total+' ; '+tot.due+' à revoir aujourd’hui.'}),
    h('div',{class:'legend'}, h('span',{},h('b',{style:'background:var(--ok)'}),'Acquises'), h('span',{},h('b',{style:'background:var(--warn)'}),'À revoir'), h('span',{},h('b',{style:'background:var(--bad)'}),'Ratées'), h('span',{},h('b',{style:'background:var(--none)'}),'Non évaluées')),
    ...all.map(({t,c})=>h('div',{class:'pt'}, h('div',{class:'lab'}, h('strong',{text:t.short}), h('span',{text:c.acquise+' / '+c.total+' acquises'+(c.due?' · '+c.due+' à revoir':'')})), stackBar(c))),
    h('h4',{text:'Dernières séances'}));
  const hist = await loadHistory();
  if (!hist.length) b.append(h('p',{class:'note',text:'Aucune séance enregistrée pour l’instant.'}));
  else b.append(h('table',{class:'counts'}, h('thead',{}, h('tr',{}, ['Date','Type','Évaluées','Acquises','Durée'].map(x=>h('th',{text:x})))),
    h('tbody',{}, hist.map(r=>{
      const ev = (r.Nb_acquises||0)+(r.Nb_a_revoir||0)+(r.Nb_ratees||0);
      const pct = ev ? Math.round((r.Nb_acquises||0)/ev*100)+' %' : '—';

      return h('tr',{}, h('td',{text:frDate(r.Date)}), h('td',{text:mode}), h('td',{text:String(ev)}), h('td',{text:pct}), h('td',{text:fmt(r.Duree_totale||0)}));
    }))));
  b.append(h('div',{class:'row'}, h('button',{onclick:()=>openDrawer('base'),text:'Base & réglages'})));
}

    h('h4',{text:'Réglages'}),

    h('label',{}, h('input',{type:'checkbox',id:'sAvoid',checked:settings.avoidSeen||false}), 'Privilégier les questions jamais ou le moins tirées'),
    h('label',{}, 'Questions à revoir par onglet : ', h('select',{id:'sSlots'}, [0,1,2,3].map(n=>h('option',{value:n,selected:settings.reviewSlots===n,text:n+' sur 3'})))),
    h('label',{}, 'Date de l’oral : ', h('input',{type:'date',id:'sExam',value:settings.examDate||''})),

    h('select',{id:'addType'}, TYPES.map(t=>h('option',{value:t.key,text:t.label}))),

    h('div',{class:'msg'+(msg&&msg.err?' err':' okk'),id:'drawMsg',text:msg?msg.t:''})
  );

function say(t, err){ const m=$('drawMsg'); if(m){ m.textContent=t; m.className='msg '+(err?'err':'okk'); } }
async function addRows(rows, bad){
  try{
    const have = new Set(QUESTIONS.map(q=>normQ(q.question)));
    const fresh = [], seen = new Set();
    rows.forEach(r=>{ const k=normQ(r.question); if(have.has(k)||seen.has(k)) return; seen.add(k); fresh.push(r); });
    const dup = rows.length - fresh.length;
    if (fresh.length){
      const col = f=>fresh.map(f);
      await grist.docApi.applyUserActions([['BulkAddRecord', T_Q, fresh.map(()=>null), {
        Type:col(r=>r.type), Question:col(r=>r.question), Piste:col(r=>r.piste), Ecarter:col(()=>false), Nb_tirages:col(()=>0), Dernier_tirage:col(()=>''),
        Boite:col(()=>0), Derniere_note:col(()=>''), Prochaine_revision:col(()=>'')
      }]]);
      await loadQuestions();
    }
    const n = fresh.length;
    buildBase({t:n+' question'+(n>1?'s':'')+' ajoutée'+(n>1?'s':'')+(dup?' ; '+dup+' doublon'+(dup>1?'s':'')+' ignoré'+(dup>1?'s':''):'')+(bad&&bad.length?' ; lignes invalides : '+bad.join(', '):'')+'.'});
  }catch(e){ say('Erreur : '+e.message, true); }
}

$('btnBase').onclick = ()=>openDrawer('base');
$('btnClose').onclick = closeDrawer;
$('drawer').addEventListener('click', e=>{ if(e.target===$('drawer')) closeDrawer(); });
$('btnFs').onclick = toggleFs;
function toggleFs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} }
document.addEventListener('keydown', e=>{
  if (!$('drawer').hidden){ if(e.key==='Escape') closeDrawer(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName)) return;
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toLowerCase(), live = S && S.idx>=0 && !S.done;
  if (k==='arrowright'){ e.preventDefault(); next(); }
  else if (k==='arrowleft'){ e.preventDefault(); prev(); }
  else if (k===' ' || k==='t'){ if(live){ e.preventDefault(); toggleTimer(); } else if(k===' ' && S && S.idx===-1){ e.preventDefault(); next(); } }
  else if (k==='r'){ if(live) resetTimer(); }
  else if (k==='n'){ if(live){ S.showPistes=!S.showPistes; render(); } }
  else if (k==='1'){ if(live) rate('acquise'); }
  else if (k==='2'){ if(live) rate('a_revoir'); }
  else if (k==='3'){ if(live) rate('ratee'); }
  else if (k==='f'){ toggleFs(); }
});

/* ============ Démarrage ============ */
async function init(){
  syncHeader();
  $('stage').append(h('p',{class:'note',text:'Chargement de la base…'}));
  try{
    if (inGrist) grist.ready({requiredAccess:'full'});
    await loadQuestions();
  }catch(e){
    $('stage').replaceChildren(h('h2',{class:'big',text:'Erreur de chargement'}), h('p',{text:String(e.message||e)}),
      h('p',{class:'note',text:'Vérifiez que le widget a l’accès complet au document (niveau d’accès « full »).'}));
    return;
  }
  newSession();
}
init();
</script>
