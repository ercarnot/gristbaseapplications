t j’associe l’équipe à la mise en œuvre pour lui redonner de la prise.\n\nEXPLICATIONS\n1. Je prépare : je connais la décision, ses raisons, ce qui est négociable et ce qui ne l’est pas.\n2. J’annonce moi-même, en réunion, avant que la rumeur ne circule, puis je fais des entretiens individuels pour les agents les plus concernés.\n3. J’écoute les inquiétudes sans les minimiser et je réponds aux questions, y compris par « je ne sais pas encore, je reviens vers vous ».\n4. J’associe l’équipe aux modalités concrètes : planning, répartition, calendrier.\n5. Je fais un point régulier après la mise en place.", "phrase_cle": "J’annonce la décision avec clarté et transparence, j’en explique le sens, et j’associe l’équipe à la mise en œuvre pour lui redonner de la prise.", "plan": "Je prépare · J’annonce moi-même, en · J’écoute les inquiétudes · J’associe l’équipe aux · Je fais un"}, {"type": "Management", "question": "Comment remobilisez-vous une équipe fatiguée après une longue période de crise ?", "piste": "IDÉE MAÎTRESSE\nAprès une crise, je laisse l’équipe récupérer, je reconnais l’effort, et j’accompagne le retour au quotidien, qui est souvent plus difficile qu’on ne le croit.\n\nEXPLICATIONS\n1. Récupérer : repos compensateurs, allègement temporaire de la charge.\n2. Reconnaître : remercier nominativement, valoriser l’engagement auprès de la hiérarchie.\n3. Dire la baisse d’énergie : après l’adrénaline, le quotidien paraît fade ; je le nomme et je laisse chacun l’exprimer.\n4. Faire un retour d’expérience : on y apprend, on corrige, on clôt la crise.\n5. Reconstruire du collectif : un temps convivial, puis des projets motivants.", "phrase_cle": "Après une crise, je laisse l’équipe récupérer, je reconnais l’effort, et j’accompagne le retour au quotidien, qui est souvent plus difficile qu’on ne le croit.", "plan": "Récupérer · Reconnaître · Dire la baisse d’énergie · Faire un retour d’expérience · Reconstruire du collectif"}, {"type": "Management", "question": "Un de vos cadres commet une erreur qui a des conséquences devant le préfet. Comment réagissez-vous ?", "piste": "IDÉE MAÎTRESSE\nJe répare d’abord, je comprends la cause avec mon cadre, je mets un processus pour éviter la répétition, et j’assume ma responsabilité devant le préfet.\n\nEXPLICATIONS\n1. Dans l’urgence : je corrige ce qui peut l’être, avec discrétion, et j’informe le préfet ou le cabinet avec les faits et les mesures prises.\n2. Avec le cadre : un entretien en tête à tête pour comprendre : moyens, compétences, consigne mal comprise, défaut de contrôle.\n3. Le processus : une validation ou un double contrôle, pour qu’une erreur individuelle ne devienne pas une faiblesse collective.\n4. Ma responsabilité : je suis responsable de la production du service. Je ne désigne pas de coupable.\n5. Ensuite : je le soutiens, car on apprend de l’erreur.", "phrase_cle": "Je répare d’abord, je comprends la cause avec mon cadre, je mets un processus pour éviter la répétition, et j’assume ma responsabilité devant le préfet.", "plan": "Dans l’urgence · Avec le cadre · Le processus · Ma responsabilité · Ensuite"}, {"type": "Questions métiers", "question": "Quel est le rôle du préfet en cas de crise majeure sur son département ?", "piste": "IDÉE MAÎTRESSE\nLe préfet est le directeur des opérations de secours : il protège les populations, les biens et l’environnement, mobilise tous les moyens et informe le public.\n\nEXPLICATIONS\n1. Organisation : dispositif ORSEC et centre opérationnel départemental, avec pompiers, forces de sécurité, services de l’État, communication.\n2. Décision : réquisitions, restrictions par arrêté, renforts demandés à la zone de défense.\n3. Les maires : chacun active son plan communal de sauvegarde ; le préfet prend la direction quand la crise dépasse leurs moyens.\n4. Communication : parole unique, information régulière.\n5. Après : accompagnement des sinistrés et retour d’expérience.", "phrase_cle": "Le préfet est le directeur des opérations de secours : il protège les populations, les biens et l’environnement, mobilise tous les moyens et informe le public.", "plan": "Organisation · Décision · Les maires · Communication · Après"}, {"type": "Questions métiers", "question": "Comment le préfet exerce-t-il le contrôle de légalité sur les collectivités ?", "piste": "IDÉE MAÎTRESSE\nLe contrôle de légalité est un contrôle a posteriori, juridique et non d’opportunité : le préfet veille à ce que les actes des collectivités respectent la loi.\n\nEXPLICATIONS\n1. Principe : depuis 1982, les actes sont exécutoires dès leur transmission ; le contrôle intervient ensuite.\n2. Procédure : lettre d’observations pour obtenir le retrait ou la modification de l’acte ; si la collectivité maintient, déféré devant le tribunal administratif, avec possibilité de demander la suspension.\n3. Budget : si le budget n’est pas voté, est en déséquilibre ou omet une dépense obligatoire, le préfet saisit la chambre régionale des comptes, qui propose des mesures.\n4. Esprit : conseil et sécurité juridique, en dialogue avec les élus.", "phrase_cle": "Le contrôle de légalité est un contrôle a posteriori, juridique et non d’opportunité : le préfet veille à ce que les actes des collectivités respectent la loi.", "plan": "Principe · Procédure · Budget · Esprit"}, {"type": "Questions métiers", "question": "Comment un préfet gère-t-il l’ordre public lors d’une manifestation ?", "piste": "IDÉE MAÎTRESSE\nLe préfet concilie deux principes, la liberté de manifester et la préservation de l’ordre public, avec une règle : toute mesure doit être nécessaire et proportionnée.\n\nEXPLICATIONS\n1. En amont : dialogue avec les organisateurs, déclaration, itinéraire, dispositif de sécurité, coordination avec la commune et la police municipale.\n2. Évaluation : renseignement territorial et niveau de risque.\n3. Moyens : forces territoriales, et si besoin forces mobiles (CRS, gendarmerie mobile) demandées à la zone de défense.\n4. Si le risque est avéré : interdiction par arrêté motivé, contrôlée par le juge administratif.\n5. Sur le terrain : consignes claires, retrait des forces mobiles tant qu’il n’y a pas de danger pour les personnes ou les biens, sommations avant toute intervention. Exemple vécu : la manifestation des lycéens.", "phrase_cle": "Le préfet concilie deux principes, la liberté de manifester et la préservation de l’ordre public, avec une règle : toute mesure doit être nécessaire et proportionnée.", "plan": "En amont · Évaluation · Moyens · Si le risque est avéré · Sur le terrain"}, {"type": "Questions métiers", "question": "Quel est le rôle du sous-préfet d’arrondissement ?", "piste": "IDÉE MAÎTRESSE\nLe sous-préfet est le relais de proximité de l’État pour les élus et les habitants, et un acteur d’animation et d’ingénierie des territoires.\n\nEXPLICATIONS\n1. Représentation : il incarne l’État dans l’arrondissement, sous l’autorité du préfet.\n2. Appui aux collectivités : conseil aux élus, accompagnement des projets, mobilisation des financements de l’État (dotations, programmes nationaux).\n3. Coordination : relais des politiques prioritaires, de l’emploi à la sécurité, et gestion de crise de proximité.\n4. Veille : il remonte au préfet les besoins et signaux du terrain.\n\nÀ PERSONNALISER : citer le sous-préfet que vous connaissez.", "phrase_cle": "Le sous-préfet est le relais de proximité de l’État pour les élus et les habitants, et un acteur d’animation et d’ingénierie des territoires.", "plan": "Représentation · Appui aux collectivités · Coordination · Veille"}, {"type": "Questions métiers", "question": "Comment piloteriez-vous un projet de dématérialisation d’une procédure dans votre service ?", "piste": "IDÉE MAÎTRESSE\nUne dématérialisation réussie part de l’usager : on simplifie d’abord la procédure, on l’outille, on la teste, et on garde toujours une voie humaine.\n\nEXPLICATIONS\n1. Choisir : la procédure qui apporte le plus de gain pour l’usager et pour le service.\n2. Simplifier avant de numériser : supprimer pièces et étapes inutiles.\n3. Cadrer : besoins, cahier des charges, outil interne ou prestataire, appui de la direction du numérique du ministère.\n4. Tester avec des usagers et des agents, puis déployer.\n5. Accessibilité : un canal humain pour ceux qui sont éloignés du numérique.\n6. Suivre : délais, taux de dossiers complets, satisfaction.", "phrase_cle": "Une dématérialisation réussie part de l’usager : on simplifie d’abord la procédure, on l’outille, on la teste, et on garde toujours une voie humaine.", "plan": "Choisir · Simplifier avant de numériser · Cadrer · Tester avec des · Accessibilité · Suivre"}, {"type": "Connaissance du ministère", "question": "Comment est organisé le ministère de l’Intérieur ?", "piste": "IDÉE MAÎTRESSE\nLe ministère regroupe quatre grandes missions : la sécurité, la protection des populations, l’action de l’État sur les territoires et les relations avec les collectivités.\n\nEXPLICATIONS\n1. Sécurité : la direction générale de la police nationale et celle de la gendarmerie nationale, avec la délégation à la sécurité routière.\n2. Protection des populations : la direction générale de la sécurité civile et de la gestion des crises.\n3. Étrangers et outre-mer : la direction générale des étrangers en France (immigration, asile, intégration) et la direction générale des outre-mer.\n4. Territoires et collectivités : la direction générale des collectivités locales, et les préfectures qui représentent l’État.\n5. Pilotage : le secrétariat général (support, numérique, ressources humaines), la délégation à l’information et à la communication, et l’inspection générale.\n\nÀ VÉRIFIER : organigramme en vigueur.", "phrase_cle": "Le ministère regroupe quatre grandes missions : la sécurité, la protection des populations, l’action de l’État sur les territoires et les relations avec les collectivités.", "plan": "Sécurité · Protection des populations · Étrangers et outre-mer · Territoires et collectivités · Pilotage"}, {"type": "Connaissance du ministère", "question": "Quelle est la différence entre la police nationale et la gendarmerie nationale ?", "piste": "IDÉE MAÎTRESSE\nDeux forces aux missions convergentes, de statut civil pour l’une et militaire pour l’autre, aux zones d’intervention distinctes, et placées depuis 2009 sous l’autorité du ministre de l’Intérieur.\n\nEXPLICATIONS\n1. Statut : la police nationale est civile ; la gendarmerie est une force armée, au statut militaire.\n2. Zones : la police en zone police, dans les agglomérations ; la gendarmerie en zone gendarmerie, rurale et périurbaine, soit la plus grande partie du territoire.\n3. Missions communes : sécurité du quotidien, ordre public, narcotrafic, police judiciaire.\n4. Rattachement : depuis la loi du 3 août 2009, la gendarmerie est placée sous l’autorité du ministre de l’Intérieur.\n5. Complémentarité : coordination opérationnelle et renforts croisés, sous l’autorité du préfet.\n\nÀ VÉRIFIER : la répartition des compétences avec le ministère des Armées.", "phrase_cle": "Deux forces aux missions convergentes, de statut civil pour l’une et militaire pour l’autre, aux zones d’intervention distinctes, et placées depuis 2009 sous l’autorité du ministre de l’Intérieur.", "plan": "Statut · Zones · Missions communes · Rattachement · Complémentarité"}, {"type": "Connaissance du ministère", "question": "Que contient la loi d’orientation et de programmation du ministère de l’Intérieur, la LOPMI ?", "piste": "IDÉE MAÎTRESSE\nLa LOPMI du 24 janvier 2023 programme, pour 2023-2027, un effort d’environ 15 milliards d’euros supplémentaires pour moderniser les moyens du ministère.\n\nEXPLICATIONS\n1. Effectifs : des créations de postes de policiers et de gendarmes, et de nouvelles brigades de gendarmerie.\n2. Numérique et cybersécurité : outils d’enquête, plainte en ligne, lutte contre la cybercriminalité.\n3. Équipements et immobilier : véhicules, locaux.\n4. Sécurité civile : acquisition de 36 hélicoptères H145.\n5. Cadre : une programmation, donc de la visibilité et des engagements sur cinq ans.\n\nÀ VÉRIFIER : nombres exacts de postes et de brigades, et état d’exécution.", "phrase_cle": "La LOPMI du 24 janvier 2023 programme, pour 2023-2027, un effort d’environ 15 milliards d’euros supplémentaires pour moderniser les moyens du ministère.", "plan": "Effectifs · Numérique et cybersécurité · Équipements et immobilier · Sécurité civile · Cadre"}, {"type": "Connaissance du ministère", "question": "Quel est le rôle des préfectures dans l’organisation des élections ?", "piste": "IDÉE MAÎTRESSE\nLa préfecture est le garant neutre de la régularité des élections : avant, pendant et après le scrutin.\n\nEXPLICATIONS\n1. Avant : réception et vérification des candidatures, propagande officielle, appui aux communes.\n2. Pendant : suivi du scrutin, conseil aux maires, gestion des incidents.\n3. Après : centralisation des résultats, transmission au ministère qui les publie ; la proclamation relève, selon le scrutin, du bureau de vote, d’une commission ou du Conseil constitutionnel.\n4. Contentieux : le préfet peut saisir le tribunal administratif en cas d’irrégularité.\n5. Principe : neutralité absolue.\n\nÀ VÉRIFIER : règles de proclamation selon le scrutin.", "phrase_cle": "La préfecture est le garant neutre de la régularité des élections : avant, pendant et après le scrutin.", "plan": "Avant · Pendant · Après · Contentieux · Principe"}, {"type": "Connaissance du ministère", "question": "Que sont les directions départementales interministérielles et quel est le lien avec le préfet ?", "piste": "IDÉE MAÎTRESSE\nLes DDI sont les services de l’État de proximité, regroupés en 2010 pour offrir un interlocuteur unique et cohérent, et placés sous l’autorité du préfet de département.\n\nEXPLICATIONS\n1. Origine : créées en 2010, elles fusionnent d’anciennes directions de plusieurs ministères (agriculture, équipement, environnement, concurrence, cohésion sociale).\n2. Deux grands pôles : les territoires, avec la DDT ou DDTM (aménagement, agriculture, environnement), et la protection des populations, avec la DDPP (consommation, sécurité sanitaire).\n3. Cohésion sociale et emploi : regroupés en 2021 dans les DDETS, avec ou sans « protection des populations » selon la taille du département.\n4. Lien avec le préfet : il les dirige et leur donne leurs priorités ; les ministères gardent la compétence technique.\n5. Perspective : la réforme « Refonder l’État local » (2025) cherche à clarifier et renforcer cette autorité, pour une action de l’État plus lisible.\n\nÀ VÉRIFIER : l’état de la réforme et les textes adoptés.", "phrase_cle": "Les DDI sont les services de l’État de proximité, regroupés en 2010 pour offrir un interlocuteur unique et cohérent, et placés sous l’autorité du préfet de département.", "plan": "Origine · Deux grands pôles · Cohésion sociale et emploi · Lien avec le préfet · Perspective"}, {"type": "Connaissance du ministère", "question": "Quelles sont les missions de la direction générale des collectivités locales ?", "piste": "IDÉE MAÎTRESSE\nLa DGCL est le pivot entre l’État et les collectivités : elle conçoit les règles, répartit les dotations et accompagne les préfectures.\n\nEXPLICATIONS\n1. Cadre juridique : statut des collectivités, compétences, fonction publique territoriale, élus locaux.\n2. Finances : elle calcule et répartit les concours financiers de l’État, comme la dotation globale de fonctionnement.\n3. Organisation territoriale : projets de réforme de la décentralisation et de l’intercommunalité.\n4. Appui au terrain : elle anime le réseau des préfectures pour le contrôle de légalité et le conseil aux collectivités.\n5. Elle est en lien avec les associations d’élus.\n\nÀ VÉRIFIER : les réformes en cours.", "phrase_cle": "La DGCL est le pivot entre l’État et les collectivités : elle conçoit les règles, répartit les dotations et accompagne les préfectures.", "plan": "Cadre juridique · Finances · Organisation territoriale · Appui au terrain · Elle est en"}, {"type": "Motivation", "question": "Pourquoi souhaitez-vous devenir attaché principal d’administration de l’État ?", "piste": "IDÉE MAÎTRESSE\nJe veux piloter plusieurs services, élargir mon champ d’action publique et conseiller plus directement mes autorités : c’est la suite logique d’un parcours que je prépare depuis plusieurs années.\n\nEXPLICATIONS\n1. Piloter : passer de la direction d’un service à la coordination de plusieurs, en m’appuyant sur des adjoints.\n2. Élargir : une palette plus large de politiques publiques. Ma directrice de cabinet coordonne la sécurité civile, intérieure, routière, la communication et le protocole : cette variété m’attire.\n3. Conseiller : être plus proche de l’autorité pour proposer des analyses et adapter les politiques nationales au territoire.\n4. Ce que j’apporte : le terrain, la gestion de crise, le goût du collectif.", "phrase_cle": "Je veux piloter plusieurs services, élargir mon champ d’action publique et conseiller plus directement mes autorités : c’est la suite logique d’un parcours que je prépare depuis plusieurs années.", "plan": "Piloter · Élargir · Conseiller · Ce que j’apporte"}, {"type": "Motivation", "question": "Quels sont vos points faibles ?", "piste": "IDÉE MAÎTRESSE\nMon point faible : je n’aime pas le conflit. J’ai appris à ne jamais le laisser s’installer, en traitant les tensions tôt et avec un cadre clair.\n\nEXPLICATIONS\n1. Le constat : je préfère la concertation, et je l’ai longtemps privilégiée.\n2. La méthode : un entretien préparé, des faits, un cadre posé, un suivi.\n3. Un exemple : une situation où j’ai dû recadrer un collaborateur, avec un résultat concret.\n4. Le progrès : je n’hésite plus à faire preuve d’autorité quand c’est nécessaire.\n\nÀ PERSONNALISER : l’exemple vécu.", "phrase_cle": "Mon point faible : je n’aime pas le conflit. J’ai appris à ne jamais le laisser s’installer, en traitant les tensions tôt et avec un cadre clair.", "plan": "Le constat · La méthode · Un exemple · Le progrès"}, {"type": "Motivation", "question": "Quelle est la réalisation professionnelle dont vous êtes le plus fier ?", "piste": "IDÉE MAÎTRESSE\nJe choisis un projet où j’ai joué un rôle personnel clair, avec un résultat mesurable et des effets sur l’équipe ou les usagers.\n\nEXPLICATIONS\n1. Contexte : l’enjeu, le contrat de départ, les contraintes de temps ou de moyens.\n2. Mon rôle : ce que j’ai décidé, organisé, négocié, en disant « je ».\n3. Résultat : un chiffre, un délai gagné, une amélioration pour les usagers.\n4. Enseignement : ce que j’en ai appris, et ce que je referais autrement.\n5. Lien avec le poste visé : cette expérience annonce ce que je ferai comme attaché principal.\n\nÀ PERSONNALISER : prendre un exemple issu de votre dossier RAEP.", "phrase_cle": "Je choisis un projet où j’ai joué un rôle personnel clair, avec un résultat mesurable et des effets sur l’équipe ou les usagers.", "plan": "Contexte · Mon rôle · Résultat · Enseignement · Lien avec le poste visé"}, {"type": "Actualités", "question": "Que célèbre-t-on en octobre 2026 avec les 80 ans du statut de la fonction publique ?", "piste": "IDÉE MAÎTRESSE\nLa loi du 19 octobre 1946 a créé le premier statut général des fonctionnaires : un cadre commun, protecteur de l’agent et garant de l’intérêt général, qui a été réécrit plusieurs fois depuis.\n\nEXPLICATIONS\n1. Origine : adopté au lendemain de la Libération, sous l’impulsion de Maurice Thorez, pour reconstruire un État républicain avec des agents indépendants du pouvoir politique et recrutés sur leurs compétences.\n2. Étapes : ordonnance de 1959 ; lois de 1983 à 1986, portées par Anicet Le Pors, qui couvrent les trois versants (État, territoriale, hospitalière) ; loi du 6 août 2019 de transformation de la fonction publique ; code général de la fonction publique en vigueur depuis 2022.\n3. Aujourd’hui : la direction générale de l’administration et de la fonction publique a organisé un colloque le 12 octobre 2026 et présentera sa revue stratégique le 19 octobre.\n\nÀ VÉRIFIER : conclusions de la revue stratégique.", "phrase_cle": "La loi du 19 octobre 1946 a créé le premier statut général des fonctionnaires : un cadre commun, protecteur de l’agent et garant de l’intérêt général, qui a été réécrit plusieurs fois depuis.", "plan": "Origine · Étapes · Aujourd’hui"}, {"type": "Actualités", "question": "Quels sont les grands principes du statut général des fonctionnaires ?", "piste": "IDÉE MAÎTRESSE\nLe statut repose sur trois principes : l’égalité d’accès, l’indépendance de l’agent et sa responsabilité, au service de l’intérêt général et de la continuité du service public.\n\nEXPLICATIONS\n1. Égalité : accès par concours, sans discrimination, et égalité de traitement des usagers.\n2. Indépendance : le système de la carrière, avec la séparation du grade, qui appartient à l’agent, et de l’emploi, qui appartient à l’administration. L’agent est protégé des pressions politiques.\n3. Responsabilité : droits (rémunération, dialogue social, protection) mais aussi obligations : dignité, impartialité, probité, neutralité, laïcité, obéissance hiérarchique.\n4. Un équilibre voulu : des garanties en échange de devoirs exigeants.\n\nÀ VÉRIFIER : liste exacte des obligations dans le code général.", "phrase_cle": "Le statut repose sur trois principes : l’égalité d’accès, l’indépendance de l’agent et sa responsabilité, au service de l’intérêt général et de la continuité du service public.", "plan": "Égalité · Indépendance · Responsabilité · Un équilibre voulu"}, {"type": "Actualités", "question": "Pensez-vous que le statut de la fonction publique est encore adapté aujourd’hui ?", "piste": "IDÉE MAÎTRESSE\nLe statut reste pertinent dans ses principes, mais il doit être adapté sur la mobilité, les parcours et l’attractivité : il faut le moderniser, pas y renoncer.\n\nEXPLICATIONS\n1. Ses atouts : la neutralité, l’égalité devant le service public, la continuité de l’État, la protection des agents contre les pressions.\n2. Les défis : crise d’attractivité, vieillissement des agents (près d’un quart auront 60 ans ou plus en 2050 selon la revue stratégique), concurrence du privé, recours croissant aux contractuels.\n3. Les pistes : parcours plus ouverts, mobilité facilitée, rémunérations plus lisibles, dialogue social modernisé.\n4. Ma position : le statut est un outil au service des missions. Il faut l’évaluer à cette aune.\n\nÀ VÉRIFIER : conclusions de la revue du 19 octobre 2026.", "phrase_cle": "Le statut reste pertinent dans ses principes, mais il doit être adapté sur la mobilité, les parcours et l’attractivité : il faut le moderniser, pas y renoncer.", "plan": "Ses atouts · Les défis · Les pistes · Ma position"}, {"type": "Actualités", "question": "Le recours croissant aux contractuels remet-il en cause le statut ?", "piste": "IDÉE MAÎTRESSE\nLes contractuels répondent à de vrais besoins de compétences et de souplesse, mais leur développement doit rester encadré pour ne pas affaiblir le principe d’une fonction publique de carrière.\n\nEXPLICATIONS\n1. Le principe : les emplois permanents sont occupés par des fonctionnaires ; le contrat est une exception prévue par la loi.\n2. Évolution : la loi de 2019 a élargi les cas de recours (contrat de projet, ouverture à de nouveaux emplois de direction).\n3. Intérêt : compétences rares, besoins ponctuels, renforts rapides.\n4. Limites : précarité, inégalité de traitement, risque pour l’indépendance de l’agent et pour la neutralité.\n5. Équilibre : recourir au contrat de façon ciblée, avec des perspectives de CDI et de titularisation.\n\nÀ VÉRIFIER : part actuelle des contractuels, de l’ordre d’un agent sur cinq.", "phrase_cle": "Les contractuels répondent à de vrais besoins de compétences et de souplesse, mais leur développement doit rester encadré pour ne pas affaiblir le principe d’une fonction publique de carrière.", "plan": "Le principe · Évolution · Intérêt · Limites · Équilibre"}, {"type": "Actualités", "question": "Qu’est-ce que la revue stratégique de la fonction publique ?", "piste": "IDÉE MAÎTRESSE\nLa revue stratégique est un exercice de réflexion sur l’avenir de la fonction publique, dont les résultats sont présentés le 19 octobre 2026, jour des 80 ans du statut.\n\nEXPLICATIONS\n1. Lancement : en octobre 2025, à l’occasion du 80e anniversaire de la direction générale de l’administration et de la fonction publique.\n2. Méthode : plus de 50 auditions, contributions d’experts, ateliers territoriaux, trois collèges (organisations syndicales, employeurs publics, jeunes agents).\n3. Contenu : des scénarios plutôt qu’une prédiction. Elle s’interroge sur le périmètre du statut, les voies de recrutement et la mobilité des parcours.\n4. Enjeux : baisse de la population active d’ici 2050, vieillissement, numérique et intelligence artificielle.\n\nÀ VÉRIFIER : restitution du 19 octobre.", "phrase_cle": "La revue stratégique est un exercice de réflexion sur l’avenir de la fonction publique, dont les résultats sont présentés le 19 octobre 2026, jour des 80 ans du statut.", "plan": "Lancement · Méthode · Contenu · Enjeux"}, {"type": "Actualités", "question": "Comment rendre la fonction publique plus attractive pour les jeunes ?", "piste": "IDÉE MAÎTRESSE\nL’attractivité repose sur quatre leviers : le sens de la mission, la rémunération, des parcours évolutifs et une qualité de vie au travail réelle.\n\nEXPLICATIONS\n1. Le sens : faire valoir l’utilité de l’action publique ; stages, apprentissage, immersion avec des équipes.\n2. La rémunération : la rendre plus lisible et plus compétitive en début de carrière.\n3. Les parcours : mobilité entre versants et ministères, évolution rapide, formation.\n4. Les conditions de travail : télétravail, management bienveillant, outils numériques, y compris l’intelligence artificielle, pour alléger les tâches répétitives.\n5. Un exemple local : l’apprentissage dans mon service, qui forme et fait connaître le service public.\n\nÀ PERSONNALISER : citer votre apprentie ou un cas concret.", "phrase_cle": "L’attractivité repose sur quatre leviers : le sens de la mission, la rémunération, des parcours évolutifs et une qualité de vie au travail réelle.", "plan": "Le sens · La rémunération · Les parcours · Les conditions de travail · Un exemple local"}, {"type": "Questions métiers", "question": "Un agent public peut-il refuser d’exécuter un ordre de son supérieur ?", "piste": "IDÉE MAÎTRESSE\nL’agent doit obéir, sauf si l’ordre est manifestement illégal et de nature à compromettre gravement un intérêt public : l’obéissance n’est pas aveugle.\n\nEXPLICATIONS\n1. Le principe : l’obéissance hiérarchique est un devoir de l’agent, qui garantit la cohérence de l’action publique.\n2. L’exception : un ordre manifestement illégal et gravement dommageable pour l’intérêt public. L’agent doit alors refuser, sous peine d’engager sa responsabilité.\n3. En pratique : je demande d’abord à l’agent de m’exposer ses doutes, je vérifie le droit, je confirme ou j’adapte par écrit.\n4. Esprit : un management qui laisse la place à la discussion avant la décision, comme je le pratique.\n\nÀ VÉRIFIER : formulation exacte du code général de la fonction publique.", "phrase_cle": "L’agent doit obéir, sauf si l’ordre est manifestement illégal et de nature à compromettre gravement un intérêt public : l’obéissance n’est pas aveugle.", "plan": "Le principe · L’exception · En pratique · Esprit"}, {"type": "Actualités", "question": "Que prévoit la réforme de la communication de l’État annoncée en août 2026 ?", "piste": "IDÉE MAÎTRESSE\nLa circulaire du Premier ministre de la fin août 2026 recentre la communication de l’État pour la rendre plus cohérente et moins coûteuse, avec un bureau unique dans chaque préfecture.\n\nEXPLICATIONS\n1. Au niveau national : le service d’information du Gouvernement (SIG) est renforcé. Il pilote un plan de communication consolidé sur 23 objectifs interministériels et un budget regroupé dans le programme 129.\n2. Dans chaque ministère : la délégation à l’information et à la communication (DICOM) devient le pôle unique de référence.\n3. Sur les territoires : un bureau unique de la communication de l’État et de ses opérateurs dans chaque préfecture de département, sous l’autorité du préfet.\n4. Objectif financier : une réduction des dépenses, de l’ordre de 30 % selon la presse ; application attendue dès janvier 2027.\n\nÀ VÉRIFIER : calendrier et textes d’application.", "phrase_cle": "La circulaire du Premier ministre de la fin août 2026 recentre la communication de l’État pour la rendre plus cohérente et moins coûteuse, avec un bureau unique dans chaque préfecture.", "plan": "Au niveau national · Dans chaque ministère · Sur les territoires · Objectif financier"}, {"type": "Actualités", "question": "Qu’est-ce que le bureau unique de la communication de l’État en préfecture ?", "piste": "IDÉE MAÎTRESSE\nLe bureau unique est l’interlocuteur unique de la communication de l’État et de ses opérateurs dans le département, placé sous l’autorité du préfet.\n\nEXPLICATIONS\n1. Mission : adapter la stratégie nationale aux enjeux locaux et assurer la cohérence des messages de l’ensemble des services de l’État.\n2. Moyens : un budget annuel d’environ 40 000 euros et des emplois transférés depuis les services déconcentrés et les opérateurs présents dans le département.\n3. Gouvernance : le préfet l’anime ; il s’articule avec le service régional de communication interministérielle et avec le SIG.\n4. Intérêt : une parole de l’État unifiée, la mutualisation des compétences et des économies d’échelle.\n\nÀ VÉRIFIER : périmètre exact et organisation.", "phrase_cle": "Le bureau unique est l’interlocuteur unique de la communication de l’État et de ses opérateurs dans le département, placé sous l’autorité du préfet.", "plan": "Mission · Moyens · Gouvernance · Intérêt"}, {"type": "Actualités", "question": "Pensez-vous que la réforme de la communication de l’État est une bonne chose pour les préfectures ?", "piste": "IDÉE MAÎTRESSE\nC’est une opportunité pour une parole de l’État plus cohérente et plus forte autour du préfet, à condition de lui donner des moyens humains et de préserver la réactivité.\n\nEXPLICATIONS\n1. Les atouts : une parole unique, la mutualisation des compétences, une meilleure visibilité des politiques publiques à l’échelle du département.\n2. Les points de vigilance : des transferts d’emplois mais pas de création de postes, pour une baisse de budget ; la capacité à garder des campagnes de santé publique ou de sujets peu médiatisés ; la double chaîne entre le SIG et le préfet.\n3. Le rôle des préfectures : le préfet doit pouvoir fixer les priorités locales et rester maître de la communication de crise.\n4. Ma conclusion : je soutiens le principe, avec une montée en puissance progressive.\n\nÀ PERSONNALISER : l’impact sur votre service.", "phrase_cle": "C’est une opportunité pour une parole de l’État plus cohérente et plus forte autour du préfet, à condition de lui donner des moyens humains et de préserver la réactivité.", "plan": "Les atouts · Les points de vigilance · Le rôle des préfectures · Ma conclusion"}, {"type": "Management", "question": "Comment mettriez-vous en place un bureau unique de communication dans une préfecture ?", "piste": "IDÉE MAÎTRESSE\nJe traite ce chantier comme un projet de transformation : un cadrage clair avec le préfet, des agents associés dès le départ, et une montée en puissance par étapes.\n\nEXPLICATIONS\n1. Cadrer : périmètre, missions, gouvernance, budget, validation par le préfet et le cabinet.\n2. Cartographier : qui fait quoi aujourd’hui dans la préfecture, les services déconcentrés et les opérateurs ; quelles compétences, quels agents transférés.\n3. Associer : rencontrer les agents, rassurer sur leur place, construire une culture commune.\n4. Organiser : plan de communication annuel, calendrier partagé, outils communs, charte de validation des messages.\n5. Évaluer : des indicateurs, un retour d’expérience à six mois.\n\nÀ PERSONNALISER : appui sur votre expérience du service.", "phrase_cle": "Je traite ce chantier comme un projet de transformation : un cadrage clair avec le préfet, des agents associés dès le départ, et une montée en puissance par étapes.", "plan": "Cadrer · Cartographier · Associer · Organiser · Évaluer"}, {"type": "Actualités", "question": "Comment concilier la communication publique et l’exigence de réduction des dépenses ?", "piste": "IDÉE MAÎTRESSE\nCommuniquer moins cher ne veut pas dire communiquer moins bien : il faut prioriser, mutualiser et mesurer.\n\nEXPLICATIONS\n1. Prioriser : concentrer les moyens sur les campagnes qui changent un comportement ou protègent une population, comme la sécurité routière ou la prévention des feux.\n2. Mutualiser : un seul bureau, des outils communs, des supports réutilisables.\n3. Internaliser : les compétences des agents et les outils numériques, y compris l’intelligence artificielle, plutôt que des prestataires.\n4. Mesurer : l’impact réel de chaque campagne, pour arrêter ce qui ne marche pas.\n5. Vigilance : ne pas sacrifier la communication de crise ni les publics éloignés du numérique.\n\nÀ PERSONNALISER : exemple d’un outil conçu dans votre service.", "phrase_cle": "Communiquer moins cher ne veut pas dire communiquer moins bien : il faut prioriser, mutualiser et mesurer.", "plan": "Prioriser · Mutualiser · Internaliser · Mesurer · Vigilance"}, {"type": "Actualités", "question": "Quelle place pour la communication de crise dans la réforme de la communication de l’État ?", "piste": "IDÉE MAÎTRESSE\nEn crise, le préfet reste le porte-parole de l’État dans le département : la réforme doit renforcer sa capacité à parler vite et d’une seule voix.\n\nEXPLICATIONS\n1. Un acquis : le bureau unique fournit une équipe plus large, avec des compétences complémentaires, mobilisable en cas de crise.\n2. Une exigence : conserver la réactivité, avec des circuits de validation courts, et ne pas dépendre d’un échelon national pour s’exprimer.\n3. Une préparation : exercices, éléments de langage préparés, réseau de communicants des services et des opérateurs.\n4. Un risque : moins de moyens, donc moins de capacité de renfort. Il faudrait anticiper par des conventions et des réseaux.\n\nÀ VÉRIFIER : ce que prévoient les textes d’application sur la crise.", "phrase_cle": "En crise, le préfet reste le porte-parole de l’État dans le département : la réforme doit renforcer sa capacité à parler vite et d’une seule voix.", "plan": "Un acquis · Une exigence · Une préparation · Un risque"}, {"type": "Actualités", "question": "Qu’est-ce que la loi RIPOST ?", "piste": "IDÉE MAÎTRESSE\nLa loi RIPOST, promulguée en août 2026, vise à sanctionner plus vite et plus fortement les nuisances du quotidien et la criminalité organisée.\n\nEXPLICATIONS\n1. Le sigle : Réponses immédiates aux phénomènes troublant l’ordre public, la sécurité et la tranquillité.\n2. Calendrier : présentée en conseil des ministres le 25 mars 2026, adoptée définitivement les 21 et 22 juillet, validée pour l’essentiel par le Conseil constitutionnel le 14 août, promulguée le 18 août.\n3. Trois axes : la délinquance du quotidien (rodéos, free parties, mortiers, protoxyde d’azote), le narcotrafic et la criminalité organisée, l’adaptation des moyens des forces de sécurité (drones, vidéo algorithmique).\n4. Un texte large, qui multiplie les infractions et les amendes.\n\nÀ VÉRIFIER : dates et mesures détaillées.", "phrase_cle": "La loi RIPOST, promulguée en août 2026, vise à sanctionner plus vite et plus fortement les nuisances du quotidien et la criminalité organisée.", "plan": "Le sigle · Calendrier · Trois axes · Un texte large"}, {"type": "Actualités", "question": "Quels nouveaux pouvoirs la loi RIPOST donne-t-elle au préfet ?", "piste": "IDÉE MAÎTRESSE\nLa loi RIPOST donne au préfet des moyens d’action administratifs plus rapides, mais le Conseil constitutionnel en a encadré certains.\n\nEXPLICATIONS\n1. Pyrotechnie : ordonner de se dessaisir de stocks de mortiers d’artifice en cas de risque grave.\n2. Supporters violents : interdiction administrative de paraître dans les enceintes sportives.\n3. Rodéos : interdire la conduite dès la constatation des faits.\n4. Occupations illicites : évacuation par la force publique, sans passer par le juge, de certains locaux, avec la réserve du Conseil constitutionnel que le dispositif ne s’applique pas si l’occupant y a établi son domicile.\n5. Drones : autorisation en urgence, avec une durée encadrée. La fermeture administrative de commerces d’explosifs a été censurée.\n\nÀ VÉRIFIER : version finale après la décision du Conseil.", "phrase_cle": "La loi RIPOST donne au préfet des moyens d’action administratifs plus rapides, mais le Conseil constitutionnel en a encadré certains.", "plan": "Pyrotechnie · Supporters violents · Rodéos · Occupations illicites · Drones"}, {"type": "Actualités", "question": "Que change la loi RIPOST pour les free parties ?", "piste": "IDÉE MAÎTRESSE\nLa loi durcit l’encadrement des free parties : un seuil de déclaration abaissé et des sanctions renforcées, pour des événements dangereux et peu contrôlables.\n\nEXPLICATIONS\n1. Le seuil : la déclaration en préfecture est obligatoire dès 250 participants, contre 500 auparavant.\n2. Les sanctions : l’organisation d’un rassemblement non déclaré devient un délit, et la participation peut être sanctionnée par une amende forfaitaire.\n3. Les enjeux : sécurité des participants, nuisances pour les riverains, risques sanitaires et liés aux stupéfiants.\n4. Le rôle du préfet : interdiction par arrêté, mobilisation des forces de sécurité, dialogue avec les maires et les organisateurs.\n\nÀ VÉRIFIER : montants des peines selon les sources.", "phrase_cle": "La loi durcit l’encadrement des free parties : un seuil de déclaration abaissé et des sanctions renforcées, pour des événements dangereux et peu contrôlables.", "plan": "Le seuil · Les sanctions · Les enjeux · Le rôle du préfet"}, {"type": "Actualités", "question": "Que prévoit la loi RIPOST sur le protoxyde d’azote ?", "piste": "IDÉE MAÎTRESSE\nLa loi interdit la vente et la détention de protoxyde d’azote par les particuliers à partir du 1er février 2027 et crée de nouveaux délits, face à une pratique dangereuse pour la santé et la route.\n\nEXPLICATIONS\n1. Les interdictions : vente, détention et transport par les particuliers, quelle que soit la quantité, à partir du 1er février 2027.\n2. Les délits : inhalation hors cadre médical, provocation à l’usage détourné, conduite sous l’effet du gaz.\n3. Les commerces : fermeture administrative possible en cas de manquement.\n4. Les raisons : accidents de la route, atteintes neurologiques graves, usage massif chez les jeunes.\n5. Le Conseil constitutionnel a validé les sanctions relatives à cet usage détourné.\n\nÀ VÉRIFIER : détail des peines et décrets d’application.", "phrase_cle": "La loi interdit la vente et la détention de protoxyde d’azote par les particuliers à partir du 1er février 2027 et crée de nouveaux délits, face à une pratique dangereuse pour la santé et la route.", "plan": "Les interdictions · Les délits · Les commerces · Les raisons · Le Conseil constitutionnel"}, {"type": "Actualités", "question": "Pensez-vous que la loi RIPOST porte atteinte aux libertés publiques ?", "piste": "IDÉE MAÎTRESSE\nLa loi renforce la réponse pénale et administrative, et elle a été contrôlée par le Conseil constitutionnel, qui a validé l’essentiel mais censuré certaines dispositions et posé des réserves.\n\nEXPLICATIONS\n1. Les garanties : le Conseil constitutionnel a censuré plusieurs dispositions, dont certaines sur les véhicules, la fermeture de commerces ou l’anonymisation des agents, et posé des réserves d’interprétation.\n2. Vidéo algorithmique : la reconnaissance faciale reste interdite ; l’outil détecte seulement des événements prédéfinis ; l’expérimentation est prolongée jusqu’en 2030.\n3. Les critiques : l’inscription des amendes forfaitaires au casier B2 sans juge, relevée par les avocats pénalistes et le Défenseur des droits.\n4. Ma position : une loi utile pour la tranquillité publique, dont l’application demandera proportionnalité et suivi.\n\nÀ VÉRIFIER : décision n° 2026-915 DC.", "phrase_cle": "La loi renforce la réponse pénale et administrative, et elle a été contrôlée par le Conseil constitutionnel, qui a validé l’essentiel mais censuré certaines dispositions et posé des réserves.", "plan": "Les garanties · Vidéo algorithmique · Les critiques · Ma position"}, {"type": "Actualités", "question": "Que change la loi RIPOST pour les maires ?", "piste": "IDÉE MAÎTRESSE\nPour les maires, la loi RIPOST apporte surtout des outils pour les nuisances du quotidien, avec le préfet comme relais ; l’AMF en attend davantage.\n\nEXPLICATIONS\n1. Gens du voyage : une procédure de mise en demeure simplifiée, des sanctions alourdies pour les installations illicites ; l’AMF demande d’aller plus loin.\n2. Nuisances : rodéos, free parties, mortiers, protoxyde d’azote, avec de nouvelles infractions que la police municipale peut aider à constater.\n3. Le rôle du préfet : il intervient quand le maire le demande ou en cas de risque grave, avec évacuation, interdictions et appui des forces.\n4. Le dialogue : la clé reste l’information des maires et la coordination avec la police municipale.\n\nÀ VÉRIFIER : pouvoirs exacts de la police municipale.", "phrase_cle": "Pour les maires, la loi RIPOST apporte surtout des outils pour les nuisances du quotidien, avec le préfet comme relais ; l’AMF en attend davantage.", "plan": "Gens du voyage · Nuisances · Le rôle du préfet · Le dialogue"}, {"type": "Actualités", "question": "Quel est l’apport de la loi RIPOST dans la lutte contre le narcotrafic ?", "piste": "IDÉE MAÎTRESSE\nLa loi RIPOST complète l’arsenal contre le narcotrafic par des moyens de contrôle et d’enquête accrus, tout en visant aussi les consommateurs.\n\nEXPLICATIONS\n1. Contrôles : identités et fouilles de véhicules sans réquisition judiciaire dans la async function ensureTables(){
  const tables = await grist.docApi.listTables();
  const acts = [];
  if (!tables.includes(T_Q)) acts.push(['AddTable', T_Q, COLS_Q]);
  if (!tables.includes(T_S)) acts.push(['AddTable', T_S, COLS_S]);
  if (acts.length) await grist.docApi.applyUserActions(acts);
  for (const [name, cols] of [[T_Q, COLS_Q], [T_S, COLS_S]]){      // colonnes ajoutées après coup
    const t = await grist.docApi.fetchTable(name);
    const have = new Set(Object.keys(t)), add = [];
    for (const c of cols) if (!have.has(c.id)) add.push(['AddColumn', name, c.id, Object.assign({type:c.type}, c.widgetOptions?{widgetOptions:c.widgetOptions}:{})]);
    if (add.length) await grist.docApi.applyUserActions(add);
  }
}

    demoMode = true; let n = 0; const saved = demoLoad();
    QUESTIONS = DEMO_ITEMS.map(it=>{

      return {id:++n, type:it.type, question:it.question, piste:it.piste, ecarte:false, nb:s.nb||0, dernier:s.dernier||'', boite:s.boite||0, note:s.note||'', prochaine:s.prochaine||'',

  });
}

/* ============ Tirage (révision espacée) ============ */
const isRev = q => q.note==='ratee' || q.note==='a_revoir';
function tierOf(q){
  const td = today();
  if (isRev(q)) return q.prochaine<=td ? 0 : 3;     // à revoir et échu : prioritaire
  if (!q.note) return 1;                            // jamais évaluée
  return q.prochaine<=td ? 2 : 3;                   // acquise, échue ou non
}
function pickQuestions(type, n, reviewOnly){
  let pool = QUESTIONS.filter(q=>q.type===type && !q.ecarte);
  if (reviewOnly) return shuffle(pool.filter(isRev)).sort((a,b)=>a.boite-b.boite).slice(0,n);
  const due = shuffle(pool.filter(q=>tierOf(q)===0)).sort((a,b)=>a.boite-b.boite);
  const slots = Math.min(due.length, Math.round(n*settings.reviewSlots/3));
  const chosen = due.slice(0, slots);
  const rest = shuffle(pool.filter(q=>!chosen.includes(q)));
  const rank = q => tierOf(q)===0 ? 1.5 : tierOf(q);
  rest.sort((a,b)=> (rank(a)-rank(b)) || (settings.avoidSeen ? ((a.nb-b.nb) || (a.dernier<b.dernier?-1:a.dernier>b.dernier?1:0)) : 0));
  return chosen.concat(rest.slice(0, n-chosen.length));
}

let S = null;   // séance
let cur = 'exam';   // vue affichée : 'exam' ou 'repeat'
function newSession(){
  if (settings.mode==='repeat'){ newRepeat(); return; }
  cur = 'exam'; stopTimer(); stopSpeech();
  const mode = settings.mode;
  const keys = mode==='single' ? [settings.singleType] : shuffle(TYPES.map(t=>t.key));
  const per = mode==='single' ? SINGLE_COUNT : PER_TAB;
  let groups = keys.map(k=>({k, picks:pickQuestions(k, per, mode==='review')}));
  const lacks = [];
  if (mode==='review') groups = groups.filter(g=>g.picks.length>0);
  else groups.forEach(g=>{ if (g.picks.length<per) lacks.push({key:g.k, have:g.picks.length, need:per}); });
  const steps = [];
  groups.forEach((g,tabIdx)=>g.picks.forEach((q,i)=>steps.push({tabIdx, key:g.k, q, n:i+1, counted:false, base:null})));
  S = {mode, order:groups.map(g=>g.k), steps, idx:-1, times:{}, ratings:{}, done:false, saved:false, showPistes:false, lacks};
  render();
}

/* ============ Chrono ============ */
let acc = 0, t0 = 0, running = false, ticker = null, beeped = false;
const elapsed = () => acc + (running ? (performance.now()-t0)/1000 : 0);
function startTimer(){ if(running) return; running = true; t0 = performance.now(); ticker = setInterval(tick, 200); updateTimerUI(); }
function pauseTimer(){ if(!running) return; acc += (performance.now()-t0)/1000; running = false; clearInterval(ticker); updateTimerUI(); }
function stopTimer(){ running=false; clearInterval(ticker); acc=0; beeped=false; }
function resetTimer(){ stopTimer(); updateTimerUI(); }
function toggleTimer(){ running ? pauseTimer() : startTimer(); }
function tick(){
  if (!beeped && elapsed() >= DURATION){ beeped = true; beep(); }
  updateTimerUI();
}
function beep(){
  if(!settings.sound) return;
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();

/* ============ Navigation pas à pas et auto-évaluation ============ */
function leave(){
  if (S && S.idx>=0 && S.idx<S.steps.length){ const e=Math.round(elapsed()); if(e>0 || S.times[S.idx]==null) S.times[S.idx]=e; }
  stopTimer();
}
function go(n){
  leave();
  if (n >= S.steps.length){ S.idx = S.steps.length; S.done = true; render(); saveSession(); return; }
  S.done = false; S.idx = Math.max(-1, n); S.showPistes = false;
  if (S.idx>=0) markSeen(S.steps[S.idx]);
  render();
  if (S.idx>=0 && settings.auto) startTimer();
}
const next = () => { if(!S || S.done) return; go(S.idx+1); };
const prev = () => { if(!S || S.idx<=-1) return; if (S.done){ S.done=false; go(S.steps.length-1); } else go(S.idx-1); };

function markSeen(step){
  if (step.counted) return; step.counted = true;
  const q = step.q;
  step.base = {boite:q.boite, note:q.note, prochaine:q.prochaine};
  q.nb += 1; q.dernier = today();
  persistQuestion(q);
}
function rate(note){
  if (!S || S.idx<0 || S.done) return;
  const step = S.steps[S.idx], q = step.q, base = step.base || {boite:q.boite, note:q.note};
  let boite;
  if (note==='ratee') boite = 0;
  else if (note==='a_revoir') boite = 1;
  else boite = Math.min(Math.max((base.note ? base.boite : 0)+1, 2), 4);
  q.boite = boite; q.note = note; q.prochaine = addDays(today(), INTERVALS[boite]);
  S.ratings[S.idx] = note;
  persistQuestion(q);
  renderRating(); renderTabs();
}
function renderRating(){

function counts(){
  const c = {acquise:0, a_revoir:0, ratee:0, none:0};

}
async function saveSession(){
  if (S.saved) return; S.saved = true;
  const c = counts();
  const detail = S.steps.map((st,i)=>({onglet:st.key, question:st.q.question, secondes:S.times[i]??null, note:S.ratings[i]||null}));
  const total = Object.values(S.times).reduce((a,b)=>a+(b||0),0);
  const row = {Date:new Date().toISOString(), Ordre:S.order.join(' > '), Duree_totale:total, Detail:JSON.stringify(detail), Mode:S.mode,
    Nb_acquises:c.acquise, Nb_a_revoir:c.a_revoir, Nb_ratees:c.ratee, Nb_non_evaluees:c.none};
  if (!inGrist){
    demoSessions.push(row); try{ localStorage.setItem('oralConcoursDemoSessions', JSON.stringify(demoSessions.slice(-50))); }catch(e){}
    return;
  }
  try{
    await grist.docApi.applyUserActions([['AddRecord', T_S, null, row]]);
    setBanner('Séance enregistrée dans la base (table '+T_S+').','info');
  }catch(e){ console.warn(e); }
}

  if (!inGrist){ ['btnAdd','btnImp','btnReload'].forEach(id=>$(id).disabled=true); $('drawMsg').textContent='Mode démo : l’écriture dans la base n’est possible que dans Grist.'; }
  $('sAuto').onchange = e=>{settings.auto=e.target.checked; saveSettings();};
  $('sSound').onchange = e=>{settings.sound=e.target.checked; saveSettings();};
  $('sAvoid').onchange = e=>{settings.avoidSeen=e.target.checked; saveSettings();};
  $('sSlots').onchange = e=>{settings.reviewSlots=Number(e.target.value); saveSettings();};
  $('sRCount').onchange = e=>{settings.repeatCount=Number(e.target.value); saveSettings();};
  $('sRTarget').onchange = e=>{settings.repeatTarget=Number(e.target.value); saveSettings();};
  $('sSpeak').onchange = e=>{settings.speak=e.target.checked; saveSettings();};
  $('sExam').onchange = e=>{settings.examDate=e.target.value; saveSettings(); render();};
  $('btnProg2').onclick = ()=>openDrawer('progress');
  $('btnAdd').onclick = async ()=>{
    const q = $('addQ').value.trim(); if(!q) return say('Saisissez le texte de la question.',true);
    await addRows([{type:$('addType').value, question:q, piste:$('addP').value.trim(), phrase:$('addPh').value.trim(), plan:''}]);
  };
  $('btnImp').onclick = async ()=>{
    let arr; try{ arr = JSON.parse($('impJson').value); }catch(e){ return say('JSON invalide : '+e.message, true); }
    if(!Array.isArray(arr)) return say('Le JSON doit être une liste.', true);
    const rows=[], bad=[];
    arr.forEach((r,i)=>{
      const type = typeFromText(r.type||r.Type), q = String(r.question||r.Question||'').trim();
      if(!type||!q) bad.push(i+1); else rows.push({type, question:q, piste:String(r.piste||r.Piste||'').trim(), phrase:String(r.phrase_cle||r.phrase||r.Phrase_cle||'').trim(), plan:String(r.plan||r.Plan||'').trim()});
    });
    if(!rows.length) return say('Aucune ligne valide.', true);
    await addRows(rows, bad, $('impUpd').checked);
  };
  $('btnReload').onclick = async ()=>{ try{ await loadQuestions(); buildBase({t:'Base rechargée ('+QUESTIONS.length+' questions).'}); }catch(e){ say(e.message,true);} };
}
function say(t, err){ const m=$('drawMsg'); if(m){ m.textContent=t; m.className='msg '+(err?'err':'okk'); } }
async function addRows(rows, bad, update){
  try{
    const byKey = new Map(QUESTIONS.map(q=>[normQ(q.question), q]));
    const fresh = [], seen = new Set(), upd = []; let same = 0;
    rows.forEach(r=>{
      const k = normQ(r.question), ex = byKey.get(k);
      if (ex){
        if (update){
          const ch = {};
          if (r.piste && r.piste!==ex.piste) ch.Piste = r.piste;
          if (r.phrase && r.phrase!==ex.phrase) ch.Phrase_cle = r.phrase;
          if (r.plan && r.plan!==ex.plan) ch.Plan = r.plan;
          if (Object.keys(ch).length) upd.push(['UpdateRecord', T_Q, ex.id, ch]); else same++;
        } else same++;
        return;
      }
      if (seen.has(k)){ same++; return; }
      seen.add(k); fresh.push(r);
    });
    const acts = [];
    if (fresh.length){
      const col = f=>fresh.map(f);
      acts.push(['BulkAddRecord', T_Q, fresh.map(()=>null), {
        Type:col(r=>r.type), Question:col(r=>r.question), Piste:col(r=>r.piste), Ecarter:col(()=>false), Nb_tirages:col(()=>0), Dernier_tirage:col(()=>''),
        Boite:col(()=>0), Derniere_note:col(()=>''), Prochaine_revision:col(()=>''),
        Phrase_cle:col(r=>r.phrase||''), Plan:col(r=>r.plan||''), Cle_boite:col(()=>0), Cle_note:col(()=>''), Cle_prochaine:col(()=>''), Cle_nb:col(()=>0)
      }]);
    }
    upd.forEach(u=>acts.push(u));
    if (acts.length){ await grist.docApi.applyUserActions(acts); await loadQuestions(); }
    const n = fresh.length, m = upd.length;
    const parts = [n+' question'+(n>1?'s':'')+' ajoutée'+(n>1?'s':'')];
    if (update) parts.push(m+' mise'+(m>1?'s':'')+' à jour');
    if (same) parts.push(same+' inchangée'+(same>1?'s':'')+' ou doublon'+(same>1?'s':'')+' ignoré'+(same>1?'s':''));
    if (bad && bad.length) parts.push('lignes invalides : '+bad.join(', '));
    buildBase({t:parts.join(' ; ')+'.'});
  }catch(e){ say('Erreur : '+e.message, true); }
}

/* ============ Répétiteur (phrases clés) ============ */
const LEVELS = [
  {name:'Lire et écouter',   tip:'Lisez la phrase à voix haute, en l’écoutant, plusieurs fois.'},
  {name:'Compléter',         tip:'Redites la phrase en retrouvant les mots cachés (cliquez sur un blanc pour vérifier).'},
  {name:'Premières lettres', tip:'Redites la phrase avec les seules initiales comme repères.'},
  {name:'De mémoire',        tip:'La phrase est cachée : dites-la en entier, puis vérifiez.'}
];
let R = null;
function derivePhrase(piste){
  const m = /ID[ÉE]E MA[ÎI]TRESSE\s*\n+([\s\S]*?)(?:\n\s*\n|\n\s*EXPLICATIONS|$)/i.exec(String(piste||''));
  return m ? m[1].replace(/\s+/g,' ').trim() : '';
}
function derivePlan(piste){
  const m = /EXPLICATIONS\s*\n([\s\S]*?)(?:\n\s*\n|$)/i.exec(String(piste||'')); if(!m) return '';
  return m[1].split('\n').map(l=>l.replace(/^\s*\d+\.\s*/,'').trim()).filter(Boolean).map(l=>{
    const i = l.indexOf(':'); const lab = (i>0 && i<=42) ? l.slice(0,i) : l.split(/\s+/).slice(0,3).join(' ');
    return lab.replace(/[.,;]+$/,'').trim();
  }).join(' · ');
}
const phraseOf = q => String(q.phrase||'').trim() || derivePhrase(q.piste);
const planOf   = q => String(q.plan||'').trim()   || derivePlan(q.piste);
function tierCle(q){
  const td = today();
  if (q.cnote==='ratee' || q.cnote==='a_revoir') return q.cprochaine<=td ? 0 : 3;
  if (!q.cnote) return 1;
  return q.cprochaine<=td ? 2 : 3;
}
function pickCards(n, type){
  const pool = QUESTIONS.filter(q=>!q.ecarte && phraseOf(q) && (type==='*' || q.type===type));
  return shuffle(pool).sort((a,b)=>{ const ra=tierCle(a), rb=tierCle(b); return (ra-rb) || (ra===0 ? a.cboite-b.cboite : 0); }).slice(0,n);
}
function newRepeat(){
  stopTimer(); stopSpeech();
  const cards = pickCards(settings.repeatCount, settings.repeatType).map(q=>({q, counted:false, base:null, reps:0}));
  R = {cards, idx:-1, level:0, reps:0, ratings:{}, done:false, saved:false, rev:new Set(), peek:false, hint:false, msg:'', started:Date.now()};
  cur = 'repeat'; render();
}
function stopSpeech(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
function canSpeak(){ return ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance!=='undefined'); }
function speak(text){
  try{
    if(!canSpeak()) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = 0.95;
    const v = (speechSynthesis.getVoices()||[]).find(v=>/^fr/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}
function rGo(n){
  if (!R) return;
  stopSpeech();
  if (n >= R.cards.length){ R.idx = R.cards.length; R.done = true; render(); saveRepeat(); return; }
  R.done = false; R.idx = Math.max(-1, n); R.level = 0; R.reps = 0; R.rev = new Set(); R.peek = false; R.hint = false; R.msg = '';
  if (R.idx >= 0) markSeenCle(R.cards[R.idx]);
  render();
  if (R.idx >= 0 && settings.speak) speak(phraseOf(R.cards[R.idx].q));
}
const rNext = () => { if(R && !R.done) rGo(R.idx+1); };
const rPrev = () => { if(!R || R.idx<=-1) return; if (R.done){ R.done=false; rGo(R.cards.length-1); } else rGo(R.idx-1); };
function setLevel(n){
  if (!R || R.idx<0 || R.done) return;
  R.level = Math.max(0, Math.min(3, n)); R.reps = 0; R.rev = new Set(); R.peek = false; R.msg = ''; render();
}
function rep(){
  if (!R || R.idx<0 || R.done) return;
  R.reps++; R.cards[R.idx].reps++;
  if (R.reps >= settings.repeatTarget){
    if (R.level < 3){ R.level++; R.reps = 0; R.rev = new Set(); R.peek = false; R.msg = 'Bien. Niveau suivant : '+LEVELS[R.level].name+'.'; }
    else R.msg = 'Évaluez-vous maintenant : 1, 2 ou 3.';
  } else R.msg = '';
  render();
}
function markSeenCle(card){
  if (card.counted) return; card.counted = true;
  const q = card.q; card.base = {boite:q.cboite, note:q.cnote};
  q.cnb += 1; persistCle(q);
}
function rateCle(note){
  if (!R || R.idx<0 || R.done) return;
  const card = R.cards[R.idx], q = card.q, base = card.base || {boite:q.cboite, note:q.cnote};
  let boite;
  if (note==='ratee') boite = 0; else if (note==='a_revoir') boite = 1;
  else boite = Math.min(Math.max((base.note ? base.boite : 0)+1, 2), 4);
  q.cboite = boite; q.cnote = note; q.cprochaine = addDays(today(), INTERVALS[boite]);
  R.ratings[R.idx] = note; persistCle(q);
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('sel', b.dataset.n===note));
}
function repeatCounts(){
  const c = {acquise:0, a_revoir:0, ratee:0, none:0};
  R.cards.forEach((_,i)=>{ const r=R.ratings[i]; if(r) c[r]++; else c.none++; });
  return c;
}
async function saveRepeat(){
  if (R.saved) return; R.saved = true;
  const c = repeatCounts();
  const row = {Date:new Date().toISOString(), Ordre:'Répétiteur', Duree_totale:Math.round((Date.now()-R.started)/1000),
    Detail:JSON.stringify(R.cards.map((cd,i)=>({question:cd.q.question, note:R.ratings[i]||null, repetitions:cd.reps}))), Mode:'repeat',
    Nb_acquises:c.acquise, Nb_a_revoir:c.a_revoir, Nb_ratees:c.ratee, Nb_non_evaluees:c.none};
  if (!inGrist){ demoSessions.push(row); try{ localStorage.setItem('oralConcoursDemoSessions', JSON.stringify(demoSessions.slice(-50))); }catch(e){} return; }
  try{ await grist.docApi.applyUserActions([['AddRecord', T_S, null, row]]); setBanner('Série enregistrée dans la base (table '+T_S+').','info'); }catch(e){ console.warn(e); }
}
function maskedPhrase(text, level){
  const toks = text.split(/\s+/).filter(Boolean); let elig = 0;
  const out = [];
  toks.forEach((tk,i)=>{
    const m = /^([^\p{L}\p{N}]*)([\p{L}\p{N}’'\-]+)([\s\S]*)$/u.exec(tk);
    let node;
    if (!m){ node = document.createTextNode(tk); }
    else {
      const pre = m[1], word = m[2], post = m[3];
      let hide = false, shown = '';
      if (level===1){ if (word.length>=5){ elig++; hide = (elig%2===1); shown = '_'.repeat(Math.min(word.length,9)); } }
      else if (level===2){ if (word.length>=3){ hide = true; shown = word[0] + word.slice(1).replace(/[\p{L}\p{N}]/gu,'_'); } }
      if (hide && !R.rev.has(i)){
        node = h('span',{}, pre, h('span',{class:'blank',title:'Cliquer pour voir le mot',onclick:()=>{ R.rev.add(i); render(); }, text:shown}), post);
      } else if (hide){
        node = h('span',{}, pre, h('span',{class:'got',text:word}), post);
      } else node = document.createTextNode(tk);
    }
    if (i>0) out.push(document.createTextNode(' '));
    out.push(node);
  });
  return out;
}
function renderRepeat(st){
  const total = R.cards.length;
  if (total === 0){
    st.append(h('h2',{class:'big',text:'Aucune phrase clé disponible'}),
      h('p',{text:'Aucune question active ne possède de phrase clé (ni de piste commençant par « Idée maîtresse »). Importez des questions avec des pistes, ou renseignez la colonne Phrase_cle dans la table Oral_Questions.'}),
      h('div',{class:'controls'}, h('button',{class:'primary',onclick:()=>openDrawer('base'),text:'Ouvrir la base'})));
    return;
  }
  if (R.idx === -1){
    const due = QUESTIONS.filter(q=>!q.ecarte && phraseOf(q) && tierCle(q)===0).length;
    const poolN = QUESTIONS.filter(q=>!q.ecarte && phraseOf(q)).length;
    st.append(
      h('div',{class:'kicker'}, h('span',{text:'Répétiteur · phrases clés'}), h('span',{text:total+' cartes · '+poolN+' phrases en base'})),
      h('h2',{class:'big',text:'Apprenez vos phrases clés'}),
      h('p',{text:'Pour chaque question, la phrase clé est l’idée maîtresse qui ouvre votre réponse. Chaque carte la fait passer par quatre niveaux : lire et écouter, compléter, premières lettres, de mémoire.'}),
      h('p',{class:'note',text:'Dites la phrase à voix haute à chaque niveau, puis appuyez sur Espace (ou sur « J’ai répété »). Après ' + settings.repeatTarget + ' répétition' + (settings.repeatTarget>1?'s':'') + ', le niveau suivant s’ouvre. À la fin, évaluez-vous : 1 sans regarder, 2 avec hésitation, 3 pas retenue.' + (due?' Aujourd’hui, '+due+' phrase'+(due>1?'s sont':' est')+' à revoir.':'')}),
      h('div',{class:'controls'}, h('button',{class:'primary',onclick:rNext,text:'Commencer la série →'})));
    return;
  }
  if (R.done){
    const c = repeatCounts();
    st.append(h('div',{class:'kicker'}, h('span',{text:'Série terminée'})), h('h2',{class:'big',text:'Récapitulatif du répétiteur'}),
      h('div',{class:'summary'},
        h('span',{class:'pill acquise',text:c.acquise+' sans regarder'}), h('span',{class:'pill a_revoir',text:c.a_revoir+' avec hésitation'}),
        h('span',{class:'pill ratee',text:c.ratee+' pas retenue'+(c.ratee>1?'s':'')}), h('span',{class:'pill',text:c.none+' non évaluée'+(c.none>1?'s':'')})));
    const tb = h('table',{class:'recap'}, h('thead',{}, h('tr',{}, h('th',{text:'Phrase clé'}), h('th',{text:'Évaluation'}), h('th',{text:'Rép.'}))));
    const body = h('tbody');
    R.cards.forEach((cd,i)=>{ const r=R.ratings[i];
      body.append(h('tr',{}, h('td',{}, h('div',{text:phraseOf(cd.q)}), h('div',{class:'note',text:cd.q.question})), h('td',{}, h('span',{class:'pill '+(r||''),text:r?NOTE_LABEL[r]:'—'})), h('td',{class:'t',text:String(cd.reps)}))); });
    tb.append(body);
    st.append(tb, h('div',{class:'controls'}, h('button',{onclick:rPrev,text:'← Revenir à la dernière carte'}), h('button',{onclick:()=>openDrawer('progress'),text:'Voir la progression'}), h('button',{class:'primary',onclick:newSession,text:'Nouvelle série'})));
    return;
  }
  const card = R.cards[R.idx], q = card.q, phrase = phraseOf(q), plan = planOf(q);
  const hidden = R.level===3 && !R.peek;
  const phraseBox = hidden
    ? h('div',{class:'phrase hid'}, h('span',{text:'Phrase cachée : dites-la de mémoire.'}), h('button',{onclick:()=>{R.peek=true; render();},text:'Voir la phrase'}))
    : h('div',{class:'phrase'}, ...maskedPhrase(phrase, R.peek ? 0 : R.level));
  st.append(
    h('div',{class:'kicker'}, h('span',{text:'Répétiteur · '+typeInfo(q.type).label}), h('span',{text:'Carte '+(R.idx+1)+' / '+total})),
    h('p',{class:'question',text:q.question}),
    h('div',{class:'lvls'}, LEVELS.map((l,i)=>h('button',{class:'lvl'+(i===R.level?' on':''),type:'button',onclick:()=>setLevel(i),text:(i)+' · '+l.name}))),
    h('div',{class:'lvltip',text:LEVELS[R.level].tip}),
    phraseBox,
    ...((plan && (R.level<3 || R.hint)) ? [h('div',{class:'plan'}, h('b',{text:'Plan : '}), plan)] : []),
    ...((plan && R.level===3 && !R.hint) ? [h('div',{class:'plan'}, h('button',{onclick:()=>{R.hint=true; render();},text:'Voir le plan (P)'}))] : []),
    h('div',{class:'repbox'},
      h('span',{class:'repcount',text:'Répétitions à ce niveau : '+R.reps+' / '+settings.repeatTarget}),
      h('button',{class:'primary',onclick:rep,text:'✓ J’ai répété (Espace)'}),
      ...(canSpeak() ? [h('button',{onclick:()=>speak(phrase),text:'🔊 Écouter (E)'})] : [])),
    h('div',{class:'rmsg',text:R.msg||''}),
    h('div',{class:'rate',id:'rate'}, h('span',{class:'ratelabel',text:'Votre mémoire'}),
      h('button',{class:'rb acquise','data-n':'acquise',onclick:()=>rateCle('acquise'),text:'1 · Sans regarder'}),
      h('button',{class:'rb a_revoir','data-n':'a_revoir',onclick:()=>rateCle('a_revoir'),text:'2 · Avec hésitation'}),
      h('button',{class:'rb ratee','data-n':'ratee',onclick:()=>rateCle('ratee'),text:'3 · Pas retenue'})),
    h('div',{class:'controls'},
      h('button',{onclick:rPrev,text:'← Précédente',disabled:R.idx<=0}),
      h('button',{onclick:()=>setLevel(R.level-1),text:'Voir davantage (V)',disabled:R.level===0}),
      h('button',{onclick:()=>setLevel(R.level+1),text:'Masquer davantage (M)',disabled:R.level===3}),
      h('button',{class:'primary',onclick:rNext,text:R.idx===total-1?'Terminer la série ✓':'Carte suivante →'})));
  const r = R.ratings[R.idx]; if (r) document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('sel', b.dataset.n===r));
}
function repeatKey(k, e){
  if (!R) return;
  const live = R.idx>=0 && !R.done;
  if (k==='arrowright'){ e.preventDefault(); rNext(); }
  else if (k==='arrowleft'){ e.preventDefault(); rPrev(); }
  else if (k===' '){ e.preventDefault(); if (live) rep(); else if (R.idx===-1) rNext(); }
  else if (k==='e'){ if(live) speak(phraseOf(R.cards[R.idx].q)); }
  else if (k==='m'){ if(live) setLevel(R.level+1); }
  else if (k==='v'){ if(live) setLevel(R.level-1); }
  else if (k==='p'){ if(live){ R.hint=!R.hint; render(); } }
  else if (k==='1'){ if(live) rateCle('acquise'); }
  else if (k==='2'){ if(live) rateCle('a_revoir'); }
  else if (k==='3'){ if(live) rateCle('ratee'); }
  else if (k==='f'){ toggleFs(); }
}
function cleStats(){
  const act = QUESTIONS.filter(q=>!q.ecarte && phraseOf(q));
  const c = {total:act.length, acquise:0, a_revoir:0, ratee:0, none:0, due:0};
  act.forEach(q=>{ if(q.cnote==='acquise') c.acquise++; else if(q.cnote==='a_revoir') c.a_revoir++; else if(q.cnote==='ratee') c.ratee++; else c.none++; if(tierCle(q)===0) c.due++; });
  return c;
}

/* ============ Événements globaux ============ */
$('selMode').onchange = e=>{ settings.mode=e.target.value; saveSettings(); syncHeader(); };
$('selType').onchange = e=>{ if(settings.mode==='repeat') settings.repeatType=e.target.value; else settings.singleType=e.target.value; saveSettings(); };
$('btnNew').onclick = ()=>{ const mid = cur==='repeat' ? (R && R.idx>-1 && !R.done) : (S && S.idx>-1 && !S.done); if(!mid || confirm('Abandonner la séance en cours et en lancer une nouvelle ?')) newSession(); };
$('btnProg').onclick = ()=>openDrawer('progress');
$('btnBase').onclick = ()=>openDrawer('base');
$('btnClose').onclick = closeDrawer;
$('drawer').addEventListener('click', e=>{ if(e.target===$('drawer')) closeDrawer(); });
$('btnFs').onclick = toggleFs;
function toggleFs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} }
document.addEventListener('keydown', e=>{
  if (!$('drawer').hidden){ if(e.key==='Escape') closeDrawer(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName)) return;
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toLowerCase();
  if (cur==='repeat'){ repeatKey(k, e); return; }
  const live = S && S.idx>=0 && !S.done;
  if (k==='arrowright'){ e.preventDefault(); next(); }
  else if (k==='arrowleft'){ e.preventDefault(); prev(); }
  else if (k===' ' || k==='t'){ if(live){ e.preventDefault(); toggleTimer(); } else if(k===' ' && S && S.idx===-1){ e.preventDefault(); next(); } }
  else if (k==='r'){ if(live) resetTimer(); }
  else if (k==='n'){ if(live){ S.showPistes=!S.showPistes; render(); } }
  else if (k==='1'){ if(live) rate('acquise'); }
  else if (k==='2'){ if(live) rate('a_revoir'); }
  else if (k==='3'){ if(live) rate('ratee'); }
  else if (k==='f'){ toggleFs(); }
});

/* ============ Démarrage ============ */
async function init(){
  syncHeader();
  $('stage').append(h('p',{class:'note',text:'Chargement de la base…'}));
  try{
    if (inGrist) grist.ready({requiredAccess:'full'});
    await loadQuestions();
  }catch(e){
    $('stage').replaceChildren(h('h2',{class:'big',text:'Erreur de chargement'}), h('p',{text:String(e.message||e)}),
      h('p',{class:'note',text:'Vérifiez que le widget a l’accès complet au document (niveau d’accès « full »).'}));
    return;
  }
  newSession();
}
init();
