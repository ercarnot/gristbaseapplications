<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oral de concours — Entraînement</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#16213a; --muted:#5b6478; --line:#d9d3c4;
  --accent:#1f3a8a; --accent-soft:#e4e9f8; --warn:#d9822b; --bad:#c0392b; --ok:#2f7d5b; --none:#c9c4b5;
  --serif:Georgia,'Times New Roman',serif; --sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{min-height:100vh;display:flex;flex-direction:column}
button,select{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
select{padding:8px 10px}
button:hover,select:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #8aa0e6;outline-offset:2px}
[hidden]{display:none !important}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px 6px}
.top h1{font-family:var(--serif);font-size:22px;margin:0;letter-spacing:.2px;display:inline}
.top .meta{color:var(--muted);font-size:13px;margin-left:10px}
.top .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{margin:6px 24px;padding:10px 14px;border-radius:8px;background:#fff4e0;border:1px solid #f0cf94;color:#6b4a0c;font-size:14px}
.banner.info{background:var(--accent-soft);border-color:#b9c6ee;color:#1d2f6b}

.tabs{display:flex;gap:6px;padding:8px 24px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{display:flex;flex-direction:column;gap:6px;min-width:150px;padding:10px 14px 9px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:#efeadd;color:var(--muted);cursor:pointer;text-align:left}
.tab .num{font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.tab .name{font-weight:600;font-size:15px;color:inherit}
.tab.current{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 -3px 0 var(--accent) inset}
.tab.done .name::after{content:" ✓";color:var(--ok)}
.tab.empty{opacity:.5}
.dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #a9a393;background:transparent}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.now{background:var(--accent);border-color:var(--accent)}
.dot.r-a_revoir{background:var(--warn);border-color:var(--warn)}
.dot.r-ratee{background:var(--bad);border-color:var(--bad)}

main{flex:1;padding:22px 24px 12px;display:flex;justify-content:center}
.card{width:100%;max-width:960px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 34px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.kicker{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.9px}
.question{font-family:var(--serif);font-size:clamp(24px,3.4vw,38px);line-height:1.28;margin:18px 0 8px;font-weight:600}
.pistes{margin:14px 0 0;padding:14px 18px;background:#faf8f1;border-left:4px solid var(--warn);border-radius:6px;white-space:pre-wrap;font-size:16px}
.pistes small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-size:11px;margin-bottom:4px}

.timer{margin-top:26px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.digits{font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:64px;line-height:1;min-width:170px;font-weight:600}
.barwrap{flex:1;min-width:200px}
.bar{height:12px;border-radius:99px;background:#ece7d8;overflow:hidden}
.bar>i{display:block;height:100%;width:100%;background:var(--ok);transition:width .25s linear,background .3s}
.tstate{margin-top:6px;font-size:13px;color:var(--muted);min-height:18px}
.timer.warn .digits{color:var(--warn)} .timer.warn .bar>i{background:var(--warn)}
.timer.over .digits{color:var(--bad)} .timer.over .bar>i{background:var(--bad)}

.rate{margin-top:22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:16px;border-top:1px dashed var(--line)}
.rate .ratelabel{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.8px;margin-right:4px}
.rb{border-width:2px}
.rb.acquise.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.rb.a_revoir.sel{background:var(--warn);border-color:var(--warn);color:#fff}
.rb.ratee.sel{background:var(--bad);border-color:var(--bad);color:#fff}
.controls{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}

h2.big{font-family:var(--serif);font-size:30px;margin:8px 0 12px}
.order{margin:14px 0 20px;padding:0;list-style:none;display:grid;gap:8px}
.order li{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#faf8f1}
.order .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.order .c{margin-left:auto;color:var(--muted);font-size:13px}
table.recap{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
table.recap th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--line)}
table.recap td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.recap td.t{white-space:nowrap;font-variant-numeric:tabular-nums}
table.recap tr.grp td{background:var(--accent-soft);font-weight:700;color:#1d2f6b}
.over-t{color:var(--bad);font-weight:600} .ok-t{color:var(--ok);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--none)}
.pill.acquise{background:var(--ok)} .pill.a_revoir{background:var(--warn)} .pill.ratee{background:var(--bad)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.note{color:var(--muted);font-size:14px;margin-top:12px}

.keys{padding:8px 24px 16px;color:var(--muted);font-size:12.5px;text-align:center}
kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--card);color:var(--ink)}

#drawer{position:fixed;inset:0;background:rgba(22,33,58,.45);display:flex;justify-content:flex-end;z-index:10}
.panel{width:min(560px,100%);height:100%;background:var(--card);padding:22px 24px;overflow:auto;box-shadow:-6px 0 24px rgba(0,0,0,.15)}
.panel h3{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.panel h4{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
.panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.panel label{display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 0}
.panel textarea,.panel select,.panel input[type=text],.panel input[type=date]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.panel label select,.panel label input[type=date]{width:auto}
.panel textarea{min-height:90px;resize:vertical}
table.counts{width:100%;border-collapse:collapse;font-size:14px}
table.counts th,table.counts td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.counts th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.low{color:var(--bad);font-weight:700}
.msg{margin-top:8px;font-size:14px}
.msg.err{color:var(--bad)} .msg.okk{color:var(--ok)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--none);min-width:120px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pt{margin:10px 0 14px}
.pt .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}

@media (max-width:700px){
  .card{padding:22px 18px} .digits{font-size:48px;min-width:130px} .tab{min-width:128px}
}
.keyphrase{margin:14px 0 0;padding:12px 16px;background:#eef3e6;border-left:4px solid var(--ok);border-radius:6px;font-family:var(--serif);font-size:19px;line-height:1.4}
.keyphrase small{display:block;font-family:var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-size:11px;margin-bottom:4px}
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.lvl{border-width:2px;padding:6px 12px;font-size:14px}
.lvl.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lvltip{color:var(--muted);font-size:14px;min-height:20px}
.phrase{margin:14px 0 6px;padding:20px 24px;background:#faf8f1;border:1px solid var(--line);border-radius:12px;font-family:var(--serif);font-size:clamp(20px,2.6vw,28px);line-height:1.6}
.phrase.hid{color:var(--muted);font-family:var(--sans);font-size:17px;font-style:italic;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.blank{display:inline-block;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;cursor:pointer;letter-spacing:1px}
.got{color:var(--ok);font-weight:600}
.plan{margin:6px 0 0;color:var(--muted);font-size:15px}
.plan b{color:var(--ink)}
.repbox{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.repcount{font-variant-numeric:tabular-nums;font-weight:600;margin-right:6px}
.rmsg{margin-top:8px;color:var(--ok);font-size:14px;min-height:20px}
</style>
</head>
<body>

<header class="top">
  <div><h1>Oral de concours</h1><span class="meta" id="meta"></span></div>
  <div class="actions">
    <select id="selMode" aria-label="Type de séance">
      <option value="full">Séance complète</option>
      <option value="single">Un seul onglet</option>
      <option value="review">Questions à revoir</option>
      <option value="repeat">Répétiteur (phrases clés)</option>
    </select>
    <select id="selType" aria-label="Onglet à travailler" hidden></select>
    <button id="btnNew" title="Nouveau tirage">Nouvelle séance</button>
    <button id="btnProg" title="Tableau de progression">Progression</button>
    <button id="btnBase" title="Questions, réglages, import">Base &amp; réglages</button>
    <button id="btnFs" title="Touche F">Plein écran</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<nav id="tabs" class="tabs" aria-label="Onglets de la séance"></nav>
<main><section id="stage" class="card" aria-live="polite"></section></main>
<footer class="keys" id="keys">
  <kbd>→</kbd> suivante · <kbd>←</kbd> précédente · <kbd>Espace</kbd> ou <kbd>T</kbd> chrono · <kbd>R</kbd> remise à zéro · <kbd>N</kbd> pistes · <kbd>1</kbd> acquise · <kbd>2</kbd> à revoir · <kbd>3</kbd> ratée · <kbd>F</kbd> plein écran
</footer>

<aside id="drawer" hidden>
  <div class="panel" role="dialog" aria-label="Panneau">
    <div class="row" style="justify-content:space-between"><h3 id="drawerTitle"></h3><button id="btnClose">Fermer</button></div>
    <div id="drawerBody"></div>
  </div>
</aside>

<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<script>
'use strict';
/* ============ Constantes ============ */
const TYPES = [
  {key:'Actualités',                label:'Actualités du ministère de l’Intérieur',   short:'Actualités'},
  {key:'Management',                label:'Management',                               short:'Management'},
  {key:'Questions métiers',         label:'Questions métiers',                        short:'Questions métiers'},
  {key:'Connaissance du ministère', label:'Connaissance du ministère de l’Intérieur', short:'Connaissance du ministère'},
  {key:'Motivation',                label:'Motivation',                               short:'Motivation'}
];
const PER_TAB = 3, SINGLE_COUNT = 5, DURATION = 90;   // 3 questions par onglet, 1 min 30
const INTERVALS = [0,1,3,7,14];                        // jours avant révision, selon la « boîte » 0 à 4
const NOTE_LABEL = {acquise:'Acquise', a_revoir:'À revoir', ratee:'Ratée'};
const T_Q = 'Oral_Questions', T_S = 'Oral_Seances';
const inGrist = (typeof grist !== 'undefined') && window.self !== window.top;

const COLS_Q = [
  {id:'Type', type:'Choice', widgetOptions: JSON.stringify({choices: TYPES.map(t=>t.key)})},
  {id:'Question', type:'Text'}, {id:'Piste', type:'Text'}, {id:'Ecarter', type:'Bool'},
  {id:'Nb_tirages', type:'Int'}, {id:'Dernier_tirage', type:'Text'},
  {id:'Boite', type:'Int'}, {id:'Derniere_note', type:'Text'}, {id:'Prochaine_revision', type:'Text'},
  {id:'Phrase_cle', type:'Text'}, {id:'Plan', type:'Text'},
  {id:'Cle_boite', type:'Int'}, {id:'Cle_note', type:'Text'}, {id:'Cle_prochaine', type:'Text'}, {id:'Cle_nb', type:'Int'}
];
const COLS_S = [
  {id:'Date', type:'Text'}, {id:'Ordre', type:'Text'}, {id:'Duree_totale', type:'Int'}, {id:'Detail', type:'Text'},
  {id:'Mode', type:'Text'}, {id:'Nb_acquises', type:'Int'}, {id:'Nb_a_revoir', type:'Int'}, {id:'Nb_ratees', type:'Int'}, {id:'Nb_non_evaluees', type:'Int'}
];

/* ============ Réglages (localStorage, facultatif) ============ */
const settings = {auto:false, sound:true, avoidSeen:true, reviewSlots:1, mode:'full', singleType:TYPES[0].key, examDate:'2026-11-16', repeatCount:10, repeatTarget:2, repeatType:'*', speak:true};
try { Object.assign(settings, JSON.parse(localStorage.getItem('oralConcoursSettings')||'{}')); } catch(e){}
function saveSettings(){ try{ localStorage.setItem('oralConcoursSettings', JSON.stringify(settings)); }catch(e){} }

/* ============ Utilitaires ============ */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (k==='class') e.className = v;
    else if (k==='text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat()) if (c!=null) e.append(c);
  return e;
}
const $ = id => document.getElementById(id);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(s){ const a=Math.abs(s), m=Math.floor(a/60), r=a%60; return (s<0?'+':'')+m+':'+String(r).padStart(2,'0'); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(ds, n){ const [y,m,d]=ds.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function normQ(s){ return norm(s).replace(/\s+/g,' ').trim(); }
function typeFromText(t){
  const n = norm(t);
  if (n.includes('actual')) return 'Actualités';
  if (n.includes('manag')) return 'Management';
  if (n.includes('metier')) return 'Questions métiers';
  if (n.includes('connaiss')) return 'Connaissance du ministère';
  if (n.includes('motiv')) return 'Motivation';
  return null;
}
const typeInfo = key => TYPES.find(t=>t.key===key);
function daysUntil(ds){ if(!ds) return null; const [y,m,d]=ds.split('-').map(Number); const t=new Date(); const a=Date.UTC(y,m-1,d), b=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()); return Math.round((a-b)/86400000); }
function frDate(iso){ const d=new Date(iso); if(isNaN(d)) return String(iso||''); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

/* ============ Couche de données ============ */
let QUESTIONS = [];   // {id,type,question,piste,ecarte,nb,dernier,boite,note,prochaine}
let demoMode = false;
let demoSessions = [];

const DEMO_ITEMS = [{"type": "Actualités", "question": "Quel événement récent concernant le ministère de l’Intérieur vous a le plus marqué, et pourquoi ?", "piste": "IDÉE MAÎTRESSE\nLes feux de forêt m’ont le plus marqué, car ils montrent un changement d’échelle qui oblige l’État à faire évoluer sa doctrine, de l’attaque des feux à la protection des personnes.\n\nEXPLICATIONS\n1. Les faits : environ 72 000 hectares brûlés en 2022 ; en 2025, l’incendie de l’Aude, le plus grand depuis 1949, environ 16 000 à 17 000 hectares en quelques jours.\n2. Ce qui change : intensité, simultanéité, vitesse de propagation.\n3. Les leçons : doctrine d’attaque des feux, aménagement et débroussaillement, protection des personnes (évacuation plutôt que confinement dans certains cas).\n4. Mon expérience : j’ai travaillé sur le retour d’expérience et la prévention dans mon département.\n\nÀ VÉRIFIER : les événements de l’été 2026. À PERSONNALISER : votre contribution.", "phrase_cle": "Les feux de forêt m’ont le plus marqué, car ils montrent un changement d’échelle qui oblige l’État à faire évoluer sa doctrine, de l’attaque des feux à la protection des personnes.", "plan": "Les faits · Ce qui change · Les leçons · Mon expérience"}, {"type": "Actualités", "question": "Un fait divers majeur relance le débat sur la sécurité : que dites-vous à un journaliste ?", "piste": "IDÉE MAÎTRESSE\nJe parle d’abord des victimes et des faits établis, puis de l’action de l’État, sans polémique ni spéculation.\n\nEXPLICATIONS\n1. Compassion et faits vérifiés : je ne dis que ce qui est établi.\n2. Ce qui est fait : mobilisation des forces de sécurité, enquête menée sous l’autorité du procureur. Ce qui relève de la justice, je le lui laisse.\n3. Le temps long : je replace l’événement dans la politique de sécurité menée, avec des chiffres seulement s’ils sont fiables.\n4. Un message clé, répété, d’un ton calme. Jamais de « sans commentaire » : je dis ce que je peux dire, et quand je donnerai la suite.", "phrase_cle": "Je parle d’abord des victimes et des faits établis, puis de l’action de l’État, sans polémique ni spéculation.", "plan": "Compassion et faits vérifiés · Ce qui est fait · Le temps long · Un message clé"}, {"type": "Actualités", "question": "Quelle réforme en cours touche, selon vous, l’organisation des préfectures ?", "piste": "IDÉE MAÎTRESSE\nLe renforcement du préfet comme chef d’orchestre de l’action territoriale de l’État.\n\nEXPLICATIONS\n1. Origine : l’annonce « Refonder l’État local » de juillet 2025, prolongée par un avant-projet de loi de décentralisation début 2026.\n2. Contenu : autorité accrue sur les services et les opérateurs, pouvoir de dérogation étendu, guichet unique pour les subventions des collectivités, substitution possible en cas de carence.\n3. Enjeu : un État plus lisible et plus réactif sur le terrain. Point de vigilance : les moyens et la coordination.\n\nÀ VÉRIFIER avant l’oral : le stade d’examen du texte (adopté, en discussion, amendé).", "phrase_cle": "Le renforcement du préfet comme chef d’orchestre de l’action territoriale de l’État.", "plan": "Origine · Contenu · Enjeu"}, {"type": "Actualités", "question": "Quel sujet d’actualité mobilise le plus les services de l’État dans un département ?", "piste": "IDÉE MAÎTRESSE\nLa gestion des risques et des crises : elle mobilise tous les services en même temps et se joue avant l’événement.\n\nEXPLICATIONS\n1. Les risques : naturels (feux de forêt, inondations), routiers, ordre public. L’actualité en fournit régulièrement.\n2. Les acteurs : police, gendarmerie, pompiers, services techniques, santé, collectivités. Le préfet coordonne.\n3. Ce qui fait la différence : la préparation (plans ORSEC, exercices) et la communication de crise.\n\nÀ PERSONNALISER : appuyez-vous sur un exemple concret que vous connaissez, ce sera plus crédible.", "phrase_cle": "La gestion des risques et des crises : elle mobilise tous les services en même temps et se joue avant l’événement.", "plan": "Les risques · Les acteurs · Ce qui fait la différence"}, {"type": "Management", "question": "Comment réagissez-vous face à un agent qui conteste une décision devant l’équipe ?", "piste": "IDÉE MAÎTRESSE\nJe garde le cadre devant l’équipe, et je traite le fond en tête-à-tête.\n\nEXPLICATIONS\n1. Sur le moment : j’écoute, je rappelle que la décision est prise et pourquoi, et je propose d’en reparler ensuite. Pas de confrontation publique.\n2. En tête-à-tête : je cherche à comprendre l’objection. Elle peut contenir une information utile, et j’ajuste si elle est fondée.\n3. Si l’opposition persiste : la décision est appliquée, je le dis clairement et sans agressivité.\n4. Ce que je protège : l’autorité par la clarté, et la dignité de l’agent.", "phrase_cle": "Je garde le cadre devant l’équipe, et je traite le fond en tête-à-tête.", "plan": "Sur le moment · En tête-à-tête · Si l’opposition persiste · Ce que je protège"}, {"type": "Management", "question": "Décrivez une situation où vous avez dû arbitrer entre deux urgences.", "piste": "IDÉE MAÎTRESSE\nJ’arbitre selon l’impact et l’échéance, et je dis clairement ce qui passe en second.\n\nEXPLICATIONS (à raconter en quatre temps)\n1. Situation : deux demandes urgentes en même temps, avec la même équipe.\n2. Critères : gravité, irréversibilité, échéance, personnes concernées.\n3. Action : je décide vite, je délègue l’une, j’informe les demandeurs de ma décision et du calendrier de la seconde.\n4. Résultat et leçon : les deux sont traitées, et j’ai mis en place un point quotidien pour anticiper.\n\nÀ PERSONNALISER : remplacez par un cas vécu précis, avec un chiffre ou une date.", "phrase_cle": "J’arbitre selon l’impact et l’échéance, et je dis clairement ce qui passe en second.", "plan": ""}, {"type": "Management", "question": "Comment fixez-vous les priorités d’une équipe en sous-effectif ?", "piste": "IDÉE MAÎTRESSE\nFaire moins, mais mieux : je hiérarchise avec l’équipe, je diffère ce qui peut l’être et je protège l’essentiel.\n\nEXPLICATIONS\n1. Je classe les missions : obligatoires, à fort impact, différables.\n2. J’associe l’équipe à ce tri, pour que les priorités soient comprises et partagées.\n3. Je simplifie, je mutualise, j’outille pour gagner du temps.\n4. Je remonte à ma hiérarchie les arbitrages et les risques que cela fait courir.\n5. Je surveille la charge de chacun pour éviter l’épuisement.", "phrase_cle": "Faire moins, mais mieux : je hiérarchise avec l’équipe, je diffère ce qui peut l’être et je protège l’essentiel.", "plan": "Je classe les missions · J’associe l’équipe à · Je simplifie, je · Je remonte à · Je surveille la"}, {"type": "Management", "question": "Comment conduisez-vous un entretien de recadrage ?", "piste": "IDÉE MAÎTRESSE\nUn recadrage est un entretien préparé, factuel et équilibré : je pose le cadre, j’écoute, je construis une solution et je vérifie qu’elle tient.\n\nEXPLICATIONS\n1. Préparer : des faits précis, datés, et un entretien en tête à tête.\n2. Poser le cadre : le problème, la règle ou l’attente non respectée.\n3. Écouter : incompréhension, lacune de compétence, désaccord, difficulté personnelle.\n4. Construire : j’écoute sa proposition, je vérifie qu’elle respecte le cadre.\n5. Contractualiser : engagements précis, revoyure à quinze jours ou un mois.\n6. Tracer et informer : compte rendu écrit, hiérarchie, RH. Si rien ne change, je gradue la réponse.", "phrase_cle": "Un recadrage est un entretien préparé, factuel et équilibré : je pose le cadre, j’écoute, je construis une solution et je vérifie qu’elle tient.", "plan": "Préparer · Poser le cadre · Écouter · Construire · Contractualiser · Tracer et informer"}, {"type": "Questions métiers", "question": "Quel est le rôle du préfet dans la gestion d’une crise ?", "piste": "IDÉE MAÎTRESSE\nLe préfet prend la direction de la crise quand elle dépasse les capacités ou les limites d’une commune : il dirige les opérations, coordonne tous les services et communique.\n\nEXPLICATIONS\n1. Quand : dès que la crise dépasse la commune par son ampleur ou son étendue, ou quand le maire est dépassé.\n2. Opérationnel : directeur des opérations de secours, avec le dispositif ORSEC et le centre opérationnel départemental.\n3. Coordination : secours, forces de sécurité, DDT pour la circulation et les déviations, DREAL pour les risques technologiques.\n4. Communication : parole unique, en lien avec les maires touchés.\n5. Après la crise : retour d’expérience et accompagnement des sinistrés.", "phrase_cle": "Le préfet prend la direction de la crise quand elle dépasse les capacités ou les limites d’une commune : il dirige les opérations, coordonne tous les services et communique.", "plan": "Quand · Opérationnel · Coordination · Communication · Après la crise"}, {"type": "Questions métiers", "question": "Comment organiseriez-vous la communication lors d’un événement grave ?", "piste": "IDÉE MAÎTRESSE\nEn événement grave, la communication poursuit trois buts : protéger la population, informer avec une parole unique, montrer que l’État agit. Je l’organise en cellule dédiée, tout en préservant la continuité du service.\n\nEXPLICATIONS\n1. Stratégie : définie avec le préfet et le directeur de cabinet : messages, porte-parole, rythme.\n2. Protéger : consignes de comportement, alerte de la population (FR-Alert), relais par les maires.\n3. Informer : points réguliers, communiqués, presse, réseaux sociaux, veille des rumeurs.\n4. Organisation de mon service : une partie dans la cellule de crise, une autre sur les affaires courantes, avec renfort selon la cinétique.\n5. Après : retour d’expérience.", "phrase_cle": "En événement grave, la communication poursuit trois buts : protéger la population, informer avec une parole unique, montrer que l’État agit. Je l’organise en cellule dédiée, tout en préservant la continuité du service.", "plan": "Stratégie · Protéger · Informer · Organisation de mon service · Après"}, {"type": "Questions métiers", "question": "Que faites-vous dans la première heure d’une inondation ?", "piste": "IDÉE MAÎTRESSE\nDans la première heure : alerter, protéger, coordonner. La priorité absolue est de sauver des vies.\n\nEXPLICATIONS\n1. J’active la cellule de crise et le centre opérationnel, et je confirme la situation avec les services de prévision et les pompiers.\n2. J’alerte la population et je diffuse les consignes : se mettre à l’abri, éviter les routes. Je décide les premières mesures : fermetures de routes, évacuations.\n3. Je coordonne avec les maires, les forces de l’ordre, les pompiers, les services techniques et les gestionnaires de réseaux.\n4. J’informe l’échelon zonal et national, et j’organise la communication.", "phrase_cle": "Dans la première heure : alerter, protéger, coordonner. La priorité absolue est de sauver des vies.", "plan": "J’active la cellule · J’alerte la population · Je coordonne avec · J’informe l’échelon zonal"}, {"type": "Questions métiers", "question": "Comment articuler police et gendarmerie lors d’un grand rassemblement ?", "piste": "IDÉE MAÎTRESSE\nUn seul pilotage : le préfet fixe les objectifs, et un dispositif unique répartit les rôles selon les zones de compétence.\n\nEXPLICATIONS\n1. Répartition : la police nationale en zone urbaine, la gendarmerie en zone rurale ou périurbaine, selon le lieu du rassemblement.\n2. Un responsable unique de la coordination opérationnelle est désigné, avec un poste de commandement commun et des liaisons directes.\n3. Les interfaces : pompiers, urgences médicales, mairie, organisateurs.\n4. Les renforts (CRS, gendarmerie mobile) sont intégrés au dispositif.\n5. Un retour d’expérience clôt l’opération.", "phrase_cle": "Un seul pilotage : le préfet fixe les objectifs, et un dispositif unique répartit les rôles selon les zones de compétence.", "plan": "Répartition · Un responsable unique · Les interfaces · Les renforts (CRS · Un retour d’expérience"}, {"type": "Connaissance du ministère", "question": "Quelles sont les grandes missions du ministère de l’Intérieur ?", "piste": "IDÉE MAÎTRESSE\nLe ministère remplit quatre missions : la sécurité, la protection des populations, l’action de l’État sur les territoires et les relations avec les collectivités.\n\nEXPLICATIONS\n1. Sécurité : police nationale, gendarmerie nationale, DGSI pour le renseignement intérieur, délégation à la sécurité routière.\n2. Protection des populations : direction générale de la sécurité civile et de la gestion des crises.\n3. Territoires : préfectures, direction générale des étrangers en France, direction générale des outre-mer.\n4. Collectivités : direction générale des collectivités locales.\n5. Fonctions support : secrétariat général, communication.\n\nÀ VÉRIFIER : organigramme en vigueur.", "phrase_cle": "Le ministère remplit quatre missions : la sécurité, la protection des populations, l’action de l’État sur les territoires et les relations avec les collectivités.", "plan": "Sécurité · Protection des populations · Territoires · Collectivités · Fonctions support"}, {"type": "Connaissance du ministère", "question": "Quelle différence entre la police nationale et la gendarmerie nationale ?", "piste": "IDÉE MAÎTRESSE\nDeux forces complémentaires, toutes deux sous l’autorité du ministre de l’Intérieur, qui diffèrent par leur statut et leur territoire.\n\nEXPLICATIONS\n1. La police nationale est une force civile, surtout présente dans les zones urbaines.\n2. La gendarmerie nationale a un statut militaire. Elle est rattachée au ministère de l’Intérieur depuis 2009 et intervient surtout en zone rurale et périurbaine, soit la plus grande partie du territoire.\n3. Chacune a ses spécificités : CRS et police judiciaire côté police, gendarmerie mobile et maillage territorial côté gendarmerie.\n4. Dans le département, le préfet coordonne les deux.", "phrase_cle": "Deux forces complémentaires, toutes deux sous l’autorité du ministre de l’Intérieur, qui diffèrent par leur statut et leur territoire.", "plan": "La police nationale · La gendarmerie nationale · Chacune a ses spécificités · Dans le département"}, {"type": "Connaissance du ministère", "question": "Quel est le rôle d’un sous-préfet d’arrondissement ?", "piste": "IDÉE MAÎTRESSE\nLe sous-préfet est le représentant de l’État de proximité : le bras du préfet et le premier interlocuteur des élus de son arrondissement.\n\nEXPLICATIONS\n1. Il représente le préfet dans l’arrondissement.\n2. Il appuie les collectivités : conseil, ingénierie territoriale, accompagnement de projets.\n3. Il met en œuvre les politiques de l’État au niveau local et anime le réseau des acteurs : maires, intercommunalités, associations, entreprises.\n4. Il gère les situations de crise et de sécurité dans son territoire.", "phrase_cle": "Le sous-préfet est le représentant de l’État de proximité : le bras du préfet et le premier interlocuteur des élus de son arrondissement.", "plan": "Il représente le · Il appuie les collectivités · Il met en · Il gère les"}, {"type": "Connaissance du ministère", "question": "Qu’est-ce que l’administration territoriale de l’État ?", "piste": "IDÉE MAÎTRESSE\nL’administration territoriale de l’État est l’ensemble des services de l’État présents sur le territoire, sous l’autorité du préfet : elle représente tous les ministères et offre une porte d’entrée unique aux usagers, aux entreprises et aux élus.\n\nEXPLICATIONS\n1. Au département : la préfecture, les sous-préfectures et les directions départementales interministérielles.\n2. À la région : le préfet de région, le secrétariat général aux affaires régionales et les directions régionales.\n3. Son rôle : mettre en œuvre les politiques nationales, contrôler la légalité, gérer les crises, accompagner les projets des collectivités.\n4. Autour d’elle : d’autres services de l’État (éducation, finances publiques, forces de sécurité) et des opérateurs comme les ARS.\n5. Évolution : la réforme de l’État local cherche à clarifier et à renforcer l’autorité du préfet.\n\nÀ VÉRIFIER : état de la réforme.", "phrase_cle": "L’administration territoriale de l’État est l’ensemble des services de l’État présents sur le territoire, sous l’autorité du préfet : elle représente tous les ministères et offre une porte d’entrée unique aux usagers, aux entreprises et aux élus.", "plan": "Au département · À la région · Son rôle · Autour d’elle · Évolution"}, {"type": "Motivation", "question": "Pourquoi souhaitez-vous devenir attaché principal ?", "piste": "IDÉE MAÎTRESSE\nJe veux exercer pleinement des responsabilités de cadre : piloter, encadrer et conseiller au service de l’État.\n\nEXPLICATIONS\n1. Mon parcours : entrepreneur dans la production graphique et multimédia, puis Canopé, les collectivités territoriales et enfin la préfecture, où je dirige le service de communication interministérielle.\n2. J’exerce déjà ces responsabilités : encadrer une équipe, conseiller la hiérarchie, concevoir des projets.\n3. Le concours reconnaît et prolonge cet engagement.\n4. Mon moteur : le sens du service public.\n\nÀ PERSONNALISER avec vos mots.", "phrase_cle": "Je veux exercer pleinement des responsabilités de cadre : piloter, encadrer et conseiller au service de l’État.", "plan": "Mon parcours · J’exerce déjà ces responsabilités · Le concours reconnaît · Mon moteur"}, {"type": "Motivation", "question": "Qu’est-ce qui, dans votre parcours, vous prépare à ce poste ?", "piste": "IDÉE MAÎTRESSE\nTrois expériences m’ont préparé à ce poste : le management transversal de projets, le management hiérarchique de services, et le conseil en communication de crise auprès des autorités.\n\nEXPLICATIONS\n1. Management transversal : en mairie, j’ai conduit le projet de relèvement des cérémonies mémorielles avec plusieurs services ; plus tôt, comme adjoint dans un magasin de 2 000 m², j’avais plusieurs départements sous mon autorité.\n2. Management hiérarchique : j’ai dirigé des bureaux dans plusieurs préfectures.\n3. Conseil : depuis plusieurs années, je conseille des préfets et des directeurs de services de l’État sur la communication et l’image, y compris en crise.\n4. Ce que j’en retiens : mobiliser sans autorité hiérarchique, et décider quand il le faut.\n\nÀ PERSONNALISER : un résultat chiffré pour chaque expérience.", "phrase_cle": "Trois expériences m’ont préparé à ce poste : le management transversal de projets, le management hiérarchique de services, et le conseil en communication de crise auprès des autorités.", "plan": "Management transversal · Management hiérarchique · Conseil · Ce que j’en retiens"}, {"type": "Motivation", "question": "Où vous voyez-vous dans cinq ans ?", "piste": "IDÉE MAÎTRESSE\nDans cinq ans, je me vois dirigeant plusieurs services dans une préfecture, toujours proche du terrain et des élus, car plus on monte, plus c’est le management qui compte.\n\nEXPLICATIONS\n1. Court terme : réussir ma prise de poste d’attaché principal et gagner la confiance des équipes.\n2. Moyen terme : piloter plusieurs services et leurs projets, quelle que soit la politique publique : contrôle de légalité, étrangers, fonctions support.\n3. Ma méthode : on devient connaisseur de la matière sans être expert, pour accompagner les chefs de service, et on développe son expertise de management.\n4. Mobilité : j’y suis ouvert, selon les besoins du service.", "phrase_cle": "Dans cinq ans, je me vois dirigeant plusieurs services dans une préfecture, toujours proche du terrain et des élus, car plus on monte, plus c’est le management qui compte.", "plan": "Court terme · Moyen terme · Ma méthode · Mobilité"}, {"type": "Motivation", "question": "Quelle est votre plus grande réussite professionnelle ?", "piste": "IDÉE MAÎTRESSE\nMa plus grande réussite est d’avoir fait de mon service un laboratoire de productivité, avec des outils conçus sur mesure.\n\nEXPLICATIONS (méthode : contexte, action, résultat)\n1. Contexte : des tâches répétitives qui prenaient du temps à l’équipe.\n2. Action : concevoir des outils internes adaptés à nos besoins, en associant l’équipe.\n3. Résultat : gain de temps, productions homogènes, équipe plus autonome.\n\nÀ PERSONNALISER : remplacez par la réussite que vous préférez et chiffrez-la (temps gagné, nombre d’utilisateurs).", "phrase_cle": "Ma plus grande réussite est d’avoir fait de mon service un laboratoire de productivité, avec des outils conçus sur mesure.", "plan": ""}, {"type": "Actualités", "question": "Pensez-vous que le gouvernement n’a pas pris la mesure des incendies de forêt depuis 2022 ?", "piste": "IDÉE MAÎTRESSE\nL’État a pris la mesure du risque et engagé un effort réel, mais les moyens aériens arrivent avec retard et le risque progresse plus vite que les délais.\n\nEXPLICATIONS\n1. Le constat : environ 72 000 hectares brûlés en 2022, record du siècle ; environ 35 000 en 2025, avec l’incendie de l’Aude, le plus grand feu depuis 1949.\n2. La réponse : commande de 36 hélicoptères H145 (loi de programmation de 2023), location d’avions, colonnes de renfort de pompiers, renouvellement des Canadair par 16 DHC-515.\n3. Les limites : les premiers DHC-515 sont attendus vers 2028, et la disponibilité de la flotte actuelle reste fragile.\n4. Mon avis : l’effort est réel, le rythme doit s’accélérer, et la prévention reste le premier levier.\n\nÀ VÉRIFIER : l’état des livraisons d’appareils.", "phrase_cle": "L’État a pris la mesure du risque et engagé un effort réel, mais les moyens aériens arrivent avec retard et le risque progresse plus vite que les délais.", "plan": "Le constat · La réponse · Les limites · Mon avis"}, {"type": "Actualités", "question": "Pensez-vous que la flotte aérienne de la sécurité civile est à la hauteur du risque d’incendie ?", "piste": "IDÉE MAÎTRESSE\nLa flotte est le point de fragilité reconnu : elle ne couvre pas tous les feux simultanés, et son renouvellement prendra encore plusieurs années.\n\nEXPLICATIONS\n1. Constat : environ 12 Canadair vieillissants ; lors de feux simultanés, les moyens ne suffisent pas partout.\n2. Solutions immédiates : location d’aéronefs, appui des appareils européens (solidarité européenne), renforts de pompiers.\n3. Solutions à moyen terme : 16 DHC-515, de De Havilland, premiers vers 2028 ; 36 hélicoptères H145.\n4. Prévention : débroussaillement, interdictions d’accès, surveillance, car neuf feux sur dix ont une origine humaine.\n\nÀ VÉRIFIER : bilan de la saison 2026 et calendrier de livraison.", "phrase_cle": "La flotte est le point de fragilité reconnu : elle ne couvre pas tous les feux simultanés, et son renouvellement prendra encore plusieurs années.", "plan": "Constat · Solutions immédiates · Solutions à moyen terme · Prévention"}, {"type": "Actualités", "question": "Pensez-vous que la prévention est le parent pauvre de la lutte contre les feux de forêt ?", "piste": "IDÉE MAÎTRESSE\nNeuf feux sur dix sont d’origine humaine : la prévention est le premier levier, et elle repose sur la responsabilité de tous.\n\nEXPLICATIONS\n1. L’origine : environ neuf départs de feu sur dix sont d’origine humaine, le plus souvent par imprudence ou accident. La foudre est rare.\n2. Les outils : obligations légales de débroussaillement, renforcées par la loi du 10 juillet 2023 ; interdictions d’accès aux massifs par arrêté préfectoral en période à risque ; surveillance ; sensibilisation.\n3. Le défi : faire appliquer et faire comprendre. Le préfet coordonne avec les maires, l’ONF et les pompiers.\n4. Pas un parent pauvre, mais un travail de long terme, moins visible que les avions.", "phrase_cle": "Neuf feux sur dix sont d’origine humaine : la prévention est le premier levier, et elle repose sur la responsabilité de tous.", "plan": "L’origine · Les outils · Le défi · Pas un parent"}, {"type": "Actualités", "question": "Pensez-vous que l’incendie de l’Aude en 2025 a révélé les limites du dispositif français ?", "piste": "IDÉE MAÎTRESSE\nL’incendie de l’Aude a montré la vitesse nouvelle des feux et la nécessité d’anticiper davantage, plutôt qu’un échec du dispositif.\n\nEXPLICATIONS\n1. Les faits : environ 16 000 à 17 000 hectares brûlés en un peu plus de 48 heures début août 2025, le plus grand feu depuis 1949 ; un mort et 13 blessés selon les premiers bilans.\n2. Ce qu’il montre : des feux plus rapides, dans des territoires moins habitués au risque, avec sécheresse et vent.\n3. Les réponses : anticipation météo, prépositionnement des moyens, retour d’expérience, adaptation des territoires (débroussaillement, urbanisme).\n4. Ma posture : reconnaître les limites, saluer l’engagement des pompiers, tirer les leçons.\n\nÀ VÉRIFIER : conclusions du retour d’expérience.", "phrase_cle": "L’incendie de l’Aude a montré la vitesse nouvelle des feux et la nécessité d’anticiper davantage, plutôt qu’un échec du dispositif.", "plan": "Les faits · Ce qu’il montre · Les réponses · Ma posture"}, {"type": "Actualités", "question": "Pensez-vous que le ministère de l’Intérieur est défaillant dans la lutte contre les violences intrafamiliales ?", "piste": "IDÉE MAÎTRESSE\nLe mot « défaillant » est excessif : la mobilisation est réelle, mais le dispositif reste inégal et la protection des victimes perfectible.\n\nEXPLICATIONS\n1. L’ampleur : 272 400 victimes de violences conjugales enregistrées en 2024, plus du double de 2017 ; 134 homicides au sein du couple (115 en 2023).\n2. L’action : accueil spécialisé dans les commissariats et gendarmeries, intervenants sociaux (480 pour une cible de 600), dispositifs de protection comme le bracelet anti-rapprochement.\n3. Les limites : une victime sur six seulement porte plainte ; maillage insuffisant en zone rurale ; coordination à renforcer, comme le relève l’inspection générale de la justice (novembre 2025).\n4. La lutte repose sur toute la chaîne : forces de sécurité, justice, associations, services sociaux.", "phrase_cle": "Le mot « défaillant » est excessif : la mobilisation est réelle, mais le dispositif reste inégal et la protection des victimes perfectible.", "plan": "L’ampleur · L’action · Les limites · La lutte repose sur toute la chaîne"}, {"type": "Actualités", "question": "Pensez-vous que la hausse des violences intrafamiliales enregistrées est le signe d’un échec de l’État ?", "piste": "IDÉE MAÎTRESSE\nLa hausse des chiffres enregistrés n’est pas, en soi, un échec : elle reflète en partie une meilleure confiance et un meilleur accueil, même si la réalité des violences reste lourde.\n\nEXPLICATIONS\n1. Ce que mesure le chiffre : l’activité des services, c’est-à-dire les plaintes et signalements enregistrés.\n2. Deux lectures possibles : plus de violences, ou plus de victimes qui parlent. Les enquêtes de victimation aident à départager.\n3. Les faits : environ une victime sur six porte plainte ; le chiffre est donc encore sous-estimé.\n4. Conclusion : l’objectif n’est pas de faire baisser les plaintes, mais de protéger et de prévenir.", "phrase_cle": "La hausse des chiffres enregistrés n’est pas, en soi, un échec : elle reflète en partie une meilleure confiance et un meilleur accueil, même si la réalité des violences reste lourde.", "plan": "Ce que mesure le chiffre · Deux lectures possibles · Les faits · Conclusion"}, {"type": "Actualités", "question": "Pensez-vous que les victimes de violences conjugales sont suffisamment protégées lors du dépôt de plainte ?", "piste": "IDÉE MAÎTRESSE\nLe dispositif s’est nettement renforcé, mais la protection reste inégale selon les territoires : il faut un accueil homogène et une chaîne complète avec la justice.\n\nEXPLICATIONS\n1. Les progrès : formation à l’accueil, plateforme en ligne de signalement, plainte possible à l’hôpital, intervenants sociaux dans les commissariats et gendarmeries.\n2. La protection : téléphone grave danger attribué par le procureur, bracelet anti-rapprochement.\n3. Les limites : une victime sur six seulement porte plainte ; maillage inégal en zone rurale ; coordination à renforcer.\n4. La clé : une chaîne complète, police, gendarmerie, justice, associations.\n\nÀ VÉRIFIER : nombre actuel de dispositifs et de bracelets.", "phrase_cle": "Le dispositif s’est nettement renforcé, mais la protection reste inégale selon les territoires : il faut un accueil homogène et une chaîne complète avec la justice.", "plan": "Les progrès · La protection · Les limites · La clé"}, {"type": "Actualités", "question": "Pensez-vous que l’État protège suffisamment les enfants victimes de violences intrafamiliales ?", "piste": "IDÉE MAÎTRESSE\nLes enfants sont les premières victimes des violences familiales hors couple : la réponse doit viser le repérage précoce et l’accueil adapté.\n\nEXPLICATIONS\n1. Les chiffres : 90 000 victimes de violences physiques ou sexuelles dans la famille hors couple en 2024 ; les enfants représentent 75 % des victimes de violences physiques et 96 % des victimes de violences sexuelles.\n2. Les dispositifs : auditions adaptées aux enfants, services spécialisés dans les atteintes aux mineurs.\n3. Les limites : unités d’accueil inégalement réparties (17 tribunaux n’en ont pas) ; le repérage dépend aussi de l’école et de la santé.\n4. Message : la protection de l’enfant est l’affaire de tous, bien au-delà du ministère de l’Intérieur.", "phrase_cle": "Les enfants sont les premières victimes des violences familiales hors couple : la réponse doit viser le repérage précoce et l’accueil adapté.", "plan": "Les chiffres · Les dispositifs · Les limites · Message"}, {"type": "Actualités", "question": "Pensez-vous que le ministère de l’Intérieur est défaillant dans sa politique de lutte contre l’immigration irrégulière ?", "piste": "IDÉE MAÎTRESSE\nJe ne parlerais pas de défaillance : le ministère est volontariste et son activité progresse, mais il se heurte à des obstacles structurels qui dépassent son seul périmètre.\n\nEXPLICATIONS\n1. L’activité : 147 156 interpellations d’étrangers en situation irrégulière en 2024 ; 10 348 retours forcés au 1er septembre 2025, en hausse de 23 %.\n2. Les limites : environ 11 % d’exécution des obligations de quitter le territoire (avec des réserves méthodologiques) ; 38,8 % d’éloignement après rétention.\n3. Les causes : une politique interministérielle, qui dépend des affaires étrangères, de la justice et de l’Europe.\n4. Ma conclusion : l’enjeu est l’efficacité, plus que le volume ; il passe par la coopération avec les pays d’origine et l’application du Pacte européen.\n\nÀ VÉRIFIER : chiffres actualisés et calendrier du Pacte.", "phrase_cle": "Je ne parlerais pas de défaillance : le ministère est volontariste et son activité progresse, mais il se heurte à des obstacles structurels qui dépassent son seul périmètre.", "plan": "L’activité · Les limites · Les causes · Ma conclusion"}, {"type": "Actualités", "question": "Pensez-vous que le faible taux d’exécution des OQTF montre l’impuissance de l’État ?", "piste": "IDÉE MAÎTRESSE\nLe faible taux d’exécution des OQTF ne prouve pas l’impuissance de l’État : il révèle des obstacles juridiques et diplomatiques qu’il ne maîtrise pas seul.\n\nEXPLICATIONS\n1. Le chiffre : environ 11 % d’exécution sur les neuf premiers mois de 2025, avec des réserves méthodologiques.\n2. Juridiques : recours et contentieux fréquents, durée de rétention limitée.\n3. Diplomatiques : laissez-passer consulaires refusés ou tardifs, comme l’Algérie, dont la coopération est suspendue depuis mars 2025.\n4. L’action : nouveaux accords de réadmission, priorité aux profils dangereux.\n5. Le levier est autant diplomatique que policier.\n\nÀ VÉRIFIER : chiffres actualisés.", "phrase_cle": "Le faible taux d’exécution des OQTF ne prouve pas l’impuissance de l’État : il révèle des obstacles juridiques et diplomatiques qu’il ne maîtrise pas seul.", "plan": "Le chiffre · Juridiques · Diplomatiques · L’action · Le levier est"}, {"type": "Actualités", "question": "Pensez-vous que la France devrait privilégier les retours aidés plutôt que les éloignements forcés ?", "piste": "IDÉE MAÎTRESSE\nLes retours aidés sont une voie complémentaire et moins coûteuse, mais ils ne remplacent pas l’éloignement forcé.\n\nEXPLICATIONS\n1. Les chiffres : 6 909 retours aidés en 2024 pour un objectif de 8 000 ; 7 500 prévus en 2025.\n2. L’intérêt : selon la Cour des comptes, un retour aidé coûte environ quatre fois moins cher qu’un éloignement forcé.\n3. Les limites : il repose sur la volonté de la personne et ne convient pas à tous les publics ; l’aide au retour a été temporairement majorée pour certains.\n4. L’équilibre : combiner retours aidés, éloignements forcés et coopération avec les pays d’origine.", "phrase_cle": "Les retours aidés sont une voie complémentaire et moins coûteuse, mais ils ne remplacent pas l’éloignement forcé.", "plan": "Les chiffres · L’intérêt · Les limites · L’équilibre"}, {"type": "Actualités", "question": "Pensez-vous que la France dispose des capacités de rétention nécessaires pour lutter contre l’immigration irrégulière ?", "piste": "IDÉE MAÎTRESSE\nLes capacités de rétention sont un maillon limitant : le plan d’extension à 3 000 places est reporté à 2029, et l’on priorise les personnes les plus dangereuses.\n\nEXPLICATIONS\n1. Le plan : « CRA 3000 », soit 3 000 places de rétention, reporté à 2029 pour des raisons budgétaires.\n2. Les chiffres : 147 156 interpellations d’étrangers en situation irrégulière en 2024 ; 10 348 retours forcés au 1er septembre 2025 ; 38,8 % d’éloignements après rétention en 2024, pour un objectif de 60 %.\n3. La priorisation : mettre en rétention d’abord les profils les plus dangereux.\n4. Mais la capacité n’est pas seule en cause : les laissez-passer consulaires pèsent lourd.\n\nÀ VÉRIFIER : capacité actuelle et base juridique de la priorisation.", "phrase_cle": "Les capacités de rétention sont un maillon limitant : le plan d’extension à 3 000 places est reporté à 2029, et l’on priorise les personnes les plus dangereuses.", "plan": "Le plan · Les chiffres · La priorisation · Mais la capacité n’est pas seule en cause"}, {"type": "Management", "question": "Votre adjoint ne vous respecte pas : que faites-vous ?", "piste": "IDÉE MAÎTRESSE\nJe traite le problème vite, en privé et sur des faits, avant qu’il ne contamine l’équipe.\n\nEXPLICATIONS\n1. Je distingue les faits du ressenti : comportements précis, dates, effets sur le service.\n2. Entretien en tête-à-tête : j’expose les faits, j’écoute sa version. Il peut y avoir un malentendu, un désaccord sur son rôle ou une frustration.\n3. Je clarifie ses missions et mes attentes, et je fixe un point de suivi.\n4. Si cela persiste, je m’appuie sur ma hiérarchie et les ressources humaines.\n5. Ce que je ne fais pas : le recadrer devant l’équipe, ou laisser durer.", "phrase_cle": "Je traite le problème vite, en privé et sur des faits, avant qu’il ne contamine l’équipe.", "plan": "Je distingue les faits du ressenti · Entretien en tête-à-tête · Je clarifie ses · Si cela persiste · Ce que je ne fais pas"}, {"type": "Management", "question": "Un agent vous signale être victime de harcèlement : comment réagissez-vous ?", "piste": "IDÉE MAÎTRESSE\nJ’écoute, je protège l’agent et je déclenche la procédure : je ne traite pas seul.\n\nEXPLICATIONS\n1. J’écoute sans minimiser ni enquêter moi-même, je note les faits et je garantis la confidentialité autant que possible.\n2. Je protège : j’évite tout contact avec la personne mise en cause, en lien avec les ressources humaines. La protection fonctionnelle peut être demandée.\n3. Je signale : j’alerte ma hiérarchie et le dispositif de signalement du ministère. Une enquête administrative peut suivre. Je rends compte à l’agent de la suite donnée.\n4. Je préviens : je reviens sur le climat du service et je rappelle les règles.", "phrase_cle": "J’écoute, je protège l’agent et je déclenche la procédure : je ne traite pas seul.", "plan": "J’écoute sans minimiser · Je protège · Je signale · Je préviens"}, {"type": "Management", "question": "Votre supérieur hiérarchique prend une décision que vous jugez mauvaise : que faites-vous ?", "piste": "IDÉE MAÎTRESSE\nJe dis mon désaccord, en privé et avec des arguments, puis j’applique la décision, sauf si elle est manifestement illégale.\n\nEXPLICATIONS\n1. Je prépare mes arguments : faits, risques, alternative.\n2. Je les expose en tête-à-tête, au bon moment, et je cherche à comprendre ce que je ne vois pas.\n3. Une fois la décision arrêtée, je l’exécute loyalement et je la porte devant mon équipe, sans me désolidariser.\n4. Exception : un ordre manifestement illégal et de nature à compromettre gravement un intérêt public n’a pas à être exécuté (code général de la fonction publique).", "phrase_cle": "Je dis mon désaccord, en privé et avec des arguments, puis j’applique la décision, sauf si elle est manifestement illégale.", "plan": "Je prépare mes arguments · Je les expose · Une fois la · Exception"}, {"type": "Management", "question": "Un agent compétent se démotive et ses résultats baissent : que faites-vous ?", "piste": "IDÉE MAÎTRESSE\nJe cherche d’abord à comprendre la cause avant de choisir ma réponse.\n\nEXPLICATIONS\n1. Entretien individuel : un constat factuel, une question ouverte, de l’écoute. Les causes possibles : surcharge, manque de reconnaissance, difficulté personnelle, perte de sens.\n2. Réponse adaptée : clarifier le rôle, ajuster la charge, reconnaître le travail, proposer un projet ou une formation ; orienter vers les ressources humaines ou la médecine de prévention si nécessaire.\n3. Suivi : objectifs précis et point régulier.\n4. Si rien ne change : un recadrage formalisé, avec les ressources humaines.", "phrase_cle": "Je cherche d’abord à comprendre la cause avant de choisir ma réponse.", "plan": "Entretien individuel · Réponse adaptée · Suivi · Si rien ne change"}, {"type": "Management", "question": "On vous confie un projet à échéance serrée avec peu de moyens : comment procédez-vous ?", "piste": "IDÉE MAÎTRESSE\nJe cadre vite : objectif clair, périmètre limité, jalons et risques identifiés.\n\nEXPLICATIONS\n1. Cadrage : finalité, livrables, échéance, parties prenantes, validation du commanditaire.\n2. Je hiérarchise : l’essentiel d’abord, le reste simplifié ou différé.\n3. Organisation : rôles, jalons, points courts ; je mobilise l’équipe et les partenaires internes.\n4. Risques : j’anticipe les blocages et je préviens le commanditaire tôt si l’échéance est menacée.\n5. Bilan : un retour d’expérience pour capitaliser.", "phrase_cle": "Je cadre vite : objectif clair, périmètre limité, jalons et risques identifiés.", "plan": "Cadrage · Je hiérarchise · Organisation · Risques · Bilan"}, {"type": "Management", "question": "Vous devez conduire une réorganisation que l’équipe accueille mal : comment faites-vous ?", "piste": "IDÉE MAÎTRESSE\nOn conduit un changement par le sens, l’explication et l’association de l’équipe, pas par l’ordre.\n\nEXPLICATIONS\n1. J’explique le pourquoi avant le comment : objectifs, contraintes, ce qui ne change pas.\n2. J’écoute les inquiétudes, individuellement et collectivement, et je repère les relais.\n3. J’associe l’équipe à la mise en œuvre partout où il y a de la marge.\n4. J’accompagne : formation, calendrier réaliste, points d’étape.\n5. Je reconnais les difficultés et je tiens le cap.", "phrase_cle": "On conduit un changement par le sens, l’explication et l’association de l’équipe, pas par l’ordre.", "plan": "J’explique le pourquoi avant le comment · J’écoute les inquiétudes · J’associe l’équipe à · J’accompagne · Je reconnais les"}, {"type": "Questions métiers", "question": "Quel est le rôle d’un service de communication au sein d’une préfecture ?", "piste": "IDÉE MAÎTRESSE\nRendre l’action de l’État lisible, crédible et utile pour les citoyens, les élus et la presse, en appui du préfet.\n\nEXPLICATIONS\n1. Conseil : éclairer le préfet sur la stratégie et le bon moment pour parler.\n2. Production : communiqués, discours, éléments de langage, réseaux sociaux, site internet.\n3. Relations : presse, élus, partenaires, services de l’État.\n4. Événements : déplacements, cérémonies et visites officielles, avec le protocole.\n5. Crise : porte-parole et cellule communication.\n\nÀ ADAPTER à votre cœur de métier.", "phrase_cle": "Rendre l’action de l’État lisible, crédible et utile pour les citoyens, les élus et la presse, en appui du préfet.", "plan": "Conseil · Production · Relations · Événements · Crise"}, {"type": "Questions métiers", "question": "Comment communiquer sur une décision impopulaire de l’État ?", "piste": "IDÉE MAÎTRESSE\nExpliquer le sens, reconnaître la difficulté et dire ce qui est fait, sans se justifier à l’excès.\n\nEXPLICATIONS\n1. J’anticipe : j’informe d’abord les personnes concernées et les élus, avant la presse.\n2. Le message : la décision, son objectif, la règle qui la fonde, ce qu’elle change concrètement.\n3. Le ton : factuel, respectueux, qui reconnaît les difficultés.\n4. Une voix, des supports adaptés, des questions-réponses préparées.\n5. Je suis les réactions, j’ajuste et je corrige les rumeurs.", "phrase_cle": "Expliquer le sens, reconnaître la difficulté et dire ce qui est fait, sans se justifier à l’excès.", "plan": "J’anticipe · Le message · Le ton · Une voix, des · Je suis les"}, {"type": "Questions métiers", "question": "Quelle différence faites-vous entre communication institutionnelle et communication de crise ?", "piste": "IDÉE MAÎTRESSE\nLa communication institutionnelle s’inscrit dans la durée ; la communication de crise répond à l’urgence et à l’incertitude.\n\nEXPLICATIONS\n1. Institutionnelle : elle explique les politiques publiques, valorise l’action, construit la confiance, avec un calendrier maîtrisé.\n2. De crise : elle informe vite, alerte et rassure ; le rythme est imposé par l’événement ; un porte-parole unique, des faits vérifiés.\n3. Le lien : la confiance bâtie en temps normal sert en crise ; les relations avec la presse et les élus se travaillent avant.\n4. Dans les deux cas : cohérence, transparence, fiabilité.", "phrase_cle": "La communication institutionnelle s’inscrit dans la durée ; la communication de crise répond à l’urgence et à l’incertitude.", "plan": "Institutionnelle · De crise · Le lien · Dans les deux cas"}, {"type": "Questions métiers", "question": "Comment préparez-vous la visite officielle d’une autorité dans un département ?", "piste": "IDÉE MAÎTRESSE\nUne visite officielle se prépare comme une opération coordonnée par le cabinet, autour de quatre volets : sécurité, politique, protocole et communication.\n\nEXPLICATIONS\n1. Cadrage : thème, programme avec le cabinet de l’autorité, lieux et interlocuteurs.\n2. Sécurité : officiers de sécurité de l’autorité, police ou gendarmerie, renseignement territorial.\n3. Politique : invitation et association des élus locaux, construction du programme avec eux.\n4. Protocole : scénographie, accueil, placement, déroulé minute par minute.\n5. Communication : presse, réseaux sociaux, éléments de langage.\n6. Pilotage : réunions de coordination, répétition sur place, retour d’expérience.\n\nÀ PERSONNALISER : citer une visite que vous avez organisée.", "phrase_cle": "Une visite officielle se prépare comme une opération coordonnée par le cabinet, autour de quatre volets : sécurité, politique, protocole et communication.", "plan": "Cadrage · Sécurité · Politique · Protocole · Communication · Pilotage"}, {"type": "Questions métiers", "question": "Comment évaluez-vous l’efficacité d’une campagne de communication ?", "piste": "IDÉE MAÎTRESSE\nOn évalue une campagne par rapport à l’objectif fixé au départ : changer un comportement, faire connaître un dispositif, ou valoriser l’action de l’État.\n\nEXPLICATIONS\n1. Définir l’objectif avant la campagne, avec un indicateur et une valeur de départ.\n2. Mesurer la portée : audience, retombées presse, réseaux sociaux. C’est un indicateur utile, mais le plus faible.\n3. Mesurer le résultat : le message a-t-il été compris et retenu ? Enquête, taux de réponse.\n4. Mesurer l’impact : le comportement a-t-il changé ? Exemple vécu : le nombre de candidats, et de bons candidats, pour le recrutement de policiers adjoints ; le nombre de piétons sur le pont de la voie ferrée.\n5. Conclure : coût au regard de l’effet, et ajustement de la campagne suivante.", "phrase_cle": "On évalue une campagne par rapport à l’objectif fixé au départ : changer un comportement, faire connaître un dispositif, ou valoriser l’action de l’État.", "plan": "Définir l’objectif avant · Mesurer la portée · Mesurer le résultat · Mesurer l’impact · Conclure"}, {"type": "Questions métiers", "question": "Une rumeur se propage sur les réseaux sociaux à propos d’une décision de la préfecture : que faites-vous ?", "piste": "IDÉE MAÎTRESSE\nRépondre vite, avec des faits, sur le même canal, sans amplifier la rumeur.\n\nEXPLICATIONS\n1. Je vérifie la source, l’ampleur et le danger.\n2. J’évalue : une rumeur marginale peut ne pas appeler de réponse ; une rumeur dangereuse en exige une rapide.\n3. Je réponds : faits vérifiés, ton calme, sur les réseaux de la préfecture, avec relais des partenaires.\n4. Je surveille et je mets à jour.\n5. Si nécessaire, je signale le contenu à la plateforme, voire j’alerte la justice.", "phrase_cle": "Répondre vite, avec des faits, sur le même canal, sans amplifier la rumeur.", "plan": "Je vérifie la · J’évalue · Je réponds · Je surveille et · Si nécessaire, je"}, {"type": "Connaissance du ministère", "question": "Comment le ministère de l’Intérieur est-il organisé ?", "piste": "IDÉE MAÎTRESSE\nUn ministère organisé autour de grandes directions générales opérationnelles, sous l’autorité du ministre et appuyées par un secrétariat général.\n\nEXPLICATIONS\n1. Sécurité : direction générale de la police nationale, direction générale de la gendarmerie nationale, direction générale de la sécurité intérieure.\n2. Sécurité civile : direction générale de la sécurité civile et de la gestion des crises.\n3. Étrangers et collectivités : direction générale des étrangers en France, direction générale des collectivités locales.\n4. Réseau territorial : préfectures et sous-préfectures.\n5. Fonctions support : le secrétariat général.\n\nÀ VÉRIFIER : l’organigramme et le périmètre actuels.", "phrase_cle": "Un ministère organisé autour de grandes directions générales opérationnelles, sous l’autorité du ministre et appuyées par un secrétariat général.", "plan": "Sécurité · Sécurité civile · Étrangers et collectivités · Réseau territorial · Fonctions support"}, {"type": "Connaissance du ministère", "question": "Qu’est-ce que la LOPMI ?", "piste": "IDÉE MAÎTRESSE\nLa loi d’orientation et de programmation du ministère de l’Intérieur, du 24 janvier 2023, fixe une trajectoire de moyens et de modernisation sur cinq ans.\n\nEXPLICATIONS\n1. Les moyens : environ 15 milliards d’euros supplémentaires sur la période 2023-2027.\n2. Les priorités : plus de présence sur le terrain, numérique et cybersécurité, renforcement de la sécurité civile.\n3. Un exemple concret : la commande de 36 hélicoptères H145 pour la sécurité civile.\n\nÀ VÉRIFIER : le niveau d’exécution et les chiffres exacts.", "phrase_cle": "La loi d’orientation et de programmation du ministère de l’Intérieur, du 24 janvier 2023, fixe une trajectoire de moyens et de modernisation sur cinq ans.", "plan": "Les moyens · Les priorités · Un exemple concret"}, {"type": "Connaissance du ministère", "question": "Quel est le rôle du préfet ?", "piste": "IDÉE MAÎTRESSE\nLe préfet représente l’État dans le département : il garantit l’ordre public, la cohésion et la mise en œuvre des politiques publiques.\n\nEXPLICATIONS\n1. Il représente le Premier ministre et chacun des ministres, et dirige les services de l’État dans le département.\n2. Il assure l’ordre public et la sécurité, y compris la gestion de crise et la protection des populations.\n3. Il contrôle la légalité des actes des collectivités.\n4. Il met en œuvre les politiques publiques et dialogue avec les élus.\n5. L’actualité renforce son rôle de coordination des services et des opérateurs.", "phrase_cle": "Le préfet représente l’État dans le département : il garantit l’ordre public, la cohésion et la mise en œuvre des politiques publiques.", "plan": "Il représente le · Il assure l’ordre · Il contrôle la · Il met en · L’actualité renforce son"}, {"type": "Connaissance du ministère", "question": "En quoi consiste le contrôle de légalité exercé par le préfet ?", "piste": "IDÉE MAÎTRESSE\nLe préfet vérifie que les actes des collectivités respectent la loi, mais seul le juge administratif peut les annuler.\n\nEXPLICATIONS\n1. Le principe : certains actes des collectivités sont transmis au préfet, qui en contrôle la conformité.\n2. Les étapes : des observations, puis, si l’illégalité persiste, la saisine du tribunal administratif (déféré préfectoral).\n3. La garantie : le respect de la libre administration des collectivités.\n4. L’objectif : la sécurité juridique, pas la tutelle.", "phrase_cle": "Le préfet vérifie que les actes des collectivités respectent la loi, mais seul le juge administratif peut les annuler.", "plan": "Le principe · Les étapes · La garantie · L’objectif"}, {"type": "Connaissance du ministère", "question": "Quelle différence entre déconcentration et décentralisation ?", "piste": "IDÉE MAÎTRESSE\nLa déconcentration redistribue le pouvoir au sein de l’État ; la décentralisation le transfère à des collectivités autonomes.\n\nEXPLICATIONS\n1. Déconcentration : l’État confie des pouvoirs à ses représentants locaux (préfet, services). Le pouvoir reste hiérarchique.\n2. Décentralisation : des compétences sont transférées à des collectivités dotées d’une personnalité juridique, d’élus et d’une autonomie (commune, département, région).\n3. Les deux se complètent : le préfet est l’interlocuteur local de l’État face aux collectivités.\n4. Actualité : « Refonder l’État local » et le projet de loi de décentralisation.\n\nÀ VÉRIFIER : l’état du texte.", "phrase_cle": "La déconcentration redistribue le pouvoir au sein de l’État ; la décentralisation le transfère à des collectivités autonomes.", "plan": "Déconcentration · Décentralisation · Les deux se complètent · Actualité"}, {"type": "Motivation", "question": "Pourquoi le ministère de l’Intérieur et pas un autre ministère ?", "piste": "IDÉE MAÎTRESSE\nParce que c’est le ministère où l’État est au plus près des citoyens, dans les moments ordinaires comme dans les crises.\n\nEXPLICATIONS\n1. Le sens : protection des personnes, ordre public, relation avec les élus, présence sur tout le territoire.\n2. La variété : sécurité, gestion de crise, collectivités, communication.\n3. Mon expérience : je le vis déjà en préfecture, avec la communication, les discours et la gestion de crise.\n4. Ce que je veux : y assumer davantage de responsabilités.\n\nÀ PERSONNALISER avec vos mots.", "phrase_cle": "Parce que c’est le ministère où l’État est au plus près des citoyens, dans les moments ordinaires comme dans les crises.", "plan": "Le sens · La variété · Mon expérience · Ce que je veux"}, {"type": "Motivation", "question": "Quelles sont, selon vous, les missions d’un attaché principal ?", "piste": "IDÉE MAÎTRESSE\nUn attaché principal conseille, représente et encadre : trois missions pour porter l’action du service.\n\nEXPLICATIONS\n1. Conseil : éclairer la décision de la hiérarchie, analyser, proposer.\n2. Représentation : porter la parole du service auprès des partenaires, des élus et des usagers.\n3. Management : animer une équipe, conduire des projets, faire évoluer les organisations.\n4. Dimension interministérielle : le corps permet la mobilité entre administrations.", "phrase_cle": "Un attaché principal conseille, représente et encadre : trois missions pour porter l’action du service.", "plan": "Conseil · Représentation · Management · Dimension interministérielle"}, {"type": "Motivation", "question": "Que pensez-vous apporter au ministère de l’Intérieur ?", "piste": "IDÉE MAÎTRESSE\nUn regard transversal et une expérience de terrain, au service de la qualité du service rendu.\n\nEXPLICATIONS\n1. Mon parcours : entreprise, éducation, collectivités, État. Je comprends les contraintes de chacun.\n2. Mes compétences : rédaction, conseil, conduite de projets, formation.\n3. Ma posture : pédagogie, esprit d’innovation, outils internes pour gagner en efficacité.\n4. Ma valeur : un cadre fiable, qui sécurise le décideur.\n\nÀ PERSONNALISER : appuyez chaque point sur un exemple.", "phrase_cle": "Un regard transversal et une expérience de terrain, au service de la qualité du service rendu.", "plan": "Mon parcours · Mes compétences · Ma posture · Ma valeur"}, {"type": "Motivation", "question": "Pourquoi vous et pas un autre candidat ?", "piste": "IDÉE MAÎTRESSE\nParce que je sais conduire une équipe vers un but qui la dépasse, et que j’ai fait mes preuves sur trois terrains : le management, la gestion de crise et l’innovation.\n\nEXPLICATIONS\n1. Management : je dirige un service, j’ai formé et fait grandir une équipe, avec un style fondé sur la formation.\n2. Crise et communication : j’ai conseillé la hiérarchie et préparé des réponses en situation de tension.\n3. Innovation : j’ai conçu des outils internes qui font gagner du temps à toute l’équipe.\n4. Parcours varié : secteur privé, collectivités, État. Je comprends les élus et les agents.\n\nÀ PERSONNALISER : un résultat chiffré pour chaque atout.", "phrase_cle": "Parce que je sais conduire une équipe vers un but qui la dépasse, et que j’ai fait mes preuves sur trois terrains : le management, la gestion de crise et l’innovation.", "plan": "Management · Crise et communication · Innovation · Parcours varié"}, {"type": "Motivation", "question": "Seriez-vous prêt à occuper un poste très éloigné de votre métier actuel ?", "piste": "IDÉE MAÎTRESSE\nOui, car le grade d’attaché principal est un métier de pilotage : on dirige des experts, on n’est plus soi-même l’expert.\n\nEXPLICATIONS\n1. Le rôle change : organiser les missions et la production, faire remonter les analyses, mobiliser les adjoints.\n2. Mon expertise actuelle reste utile, mais ne définit plus mon poste.\n3. Ma méthode : je m’immerge vite dans le sujet, je m’appuie sur mes adjoints et sur les agents, et je me forme.\n4. Un exemple : j’ai déjà dû maîtriser rapidement un domaine nouveau.\n\nÀ PERSONNALISER : choisir l’exemple dans votre parcours.", "phrase_cle": "Oui, car le grade d’attaché principal est un métier de pilotage : on dirige des experts, on n’est plus soi-même l’expert.", "plan": "Le rôle change · Mon expertise actuelle · Ma méthode · Un exemple"}, {"type": "Motivation", "question": "Parlez-moi d’un échec professionnel et de ce que vous en avez appris.", "piste": "IDÉE MAÎTRESSE\nMon échec : quatre années d’activité indépendante que je n’ai pas pu pérenniser. J’en ai tiré une leçon durable : une expertise ne suffit pas, il faut aussi savoir la faire valoir.\n\nEXPLICATIONS\n1. Les faits : j’avais une vraie expertise métier, mais je n’ai pas atteint un revenu décent ni la taille pour déléguer la vente.\n2. La cause : j’ai eu du mal à vendre avec distance un travail que je portais avec mes valeurs.\n3. L’enseignement : pour réussir, il faut être complet : expertise, mais aussi expression, négociation, conviction.\n4. Aujourd’hui : j’applique cette leçon en préfecture, pour organiser un service, évaluer, convaincre une équipe et la mobiliser vers un but qui la dépasse.\n\nÀ PERSONNALISER : un exemple actuel.", "phrase_cle": "Mon échec : quatre années d’activité indépendante que je n’ai pas pu pérenniser. J’en ai tiré une leçon durable : une expertise ne suffit pas, il faut aussi savoir la faire valoir.", "plan": "Les faits · La cause · L’enseignement · Aujourd’hui"}, {"type": "Motivation", "question": "Quelle est votre principale faiblesse professionnelle ?", "piste": "IDÉE MAÎTRESSE\nJe nomme une vraie faiblesse, qui n’est pas rédhibitoire pour le poste, et je montre comment je la compense.\n\nEXPLICATIONS\n1. Je choisis un point réel mais non essentiel : par exemple, la tendance à vouloir tout faire moi-même ou la difficulté à dire non.\n2. Je montre l’effort : outils, délégation, retours de l’équipe.\n3. Je prouve : un exemple récent d’amélioration.\n4. J’évite la fausse faiblesse du type « je suis perfectionniste ».", "phrase_cle": "Je nomme une vraie faiblesse, qui n’est pas rédhibitoire pour le poste, et je montre comment je la compense.", "plan": "Je choisis un · Je montre l’effort · Je prouve · J’évite la fausse"}, {"type": "Actualités", "question": "Faut-il, selon vous, renforcer encore les pouvoirs du préfet ?", "piste": "IDÉE MAÎTRESSE\nUn préfet plus fort peut rendre l’État plus lisible, à condition de préserver l’équilibre avec les élus locaux et le contrôle de la loi.\n\nEXPLICATIONS\n1. Pour : unité de l’État, réactivité en crise, guichet unique pour les collectivités, dérogations pour adapter la règle au terrain.\n2. Contre : risque de concentration, tension avec la libre administration des collectivités, besoin de moyens autant que de pouvoirs.\n3. Ma position : l’autorité doit s’accompagner de transparence (décisions motivées et publiées), de dialogue avec les élus et de moyens.\n4. La condition de réussite : des responsabilités claires.\n\nÀ VÉRIFIER : l’état du texte.", "phrase_cle": "Un préfet plus fort peut rendre l’État plus lisible, à condition de préserver l’équilibre avec les élus locaux et le contrôle de la loi.", "plan": "Pour · Contre · Ma position · La condition de réussite"}, {"type": "Actualités", "question": "Faut-il, selon vous, mieux réguler les réseaux sociaux pour lutter contre la désinformation en situation de crise ?", "piste": "IDÉE MAÎTRESSE\nLes réseaux sociaux obligent l’État à parler plus vite et plus clairement, sans renoncer à la liberté d’expression.\n\nEXPLICATIONS\n1. Le constat : en crise, les rumeurs circulent avant les informations officielles.\n2. La réponse de l’État : une présence sur les réseaux, des messages courts et vérifiés, un démenti rapide, une coopération avec les plateformes pour retirer les contenus illicites, dans le cadre du règlement européen sur les services numériques.\n3. L’équilibre : la régulation vise les contenus illicites, pas l’opinion ; le juge reste le garant.\n4. Le premier rempart : une information officielle rapide et fiable.", "phrase_cle": "Les réseaux sociaux obligent l’État à parler plus vite et plus clairement, sans renoncer à la liberté d’expression.", "plan": "Le constat · La réponse de l’État · L’équilibre · Le premier rempart"}, {"type": "Actualités", "question": "L’intelligence artificielle peut-elle améliorer le service rendu dans les préfectures ?", "piste": "IDÉE MAÎTRESSE\nOui : l’IA apporte un gain de productivité, de qualité et de confort, que l’on réinvestit dans la qualité du service rendu, à condition de garder l’humain aux commandes.\n\nEXPLICATIONS\n1. Productivité : instruire plus de dossiers, plus vite.\n2. Qualité : un temps libéré pour l’analyse, la prospection, la rigueur de l’instruction.\n3. Confort : des agents moins absorbés par les tâches répétitives, comme la mise en forme.\n4. Au final : un meilleur service, par la qualité et les délais.\n5. Garde-fous : l’humain décide, les données sont protégées, les agents sont formés.\n\nÀ PERSONNALISER : un outil conçu dans votre service.", "phrase_cle": "Oui : l’IA apporte un gain de productivité, de qualité et de confort, que l’on réinvestit dans la qualité du service rendu, à condition de garder l’humain aux commandes.", "plan": "Productivité · Qualité · Confort · Au final · Garde-fous"}, {"type": "Management", "question": "Un agent de votre équipe est régulièrement en retard et cela agace ses collègues. Que faites-vous ?", "piste": "IDÉE MAÎTRESSE\nJ’en parle vite, en tête à tête, pour comprendre avant de sanctionner, puis je fixe une règle claire et je suis son application.\n\nEXPLICATIONS\n1. D’abord un entretien individuel et factuel : dates, impact sur l’équipe. J’écoute les raisons, qui peuvent être personnelles ou liées à l’organisation.\n2. Ensuite un cadre : horaires attendus, ajustement possible si la contrainte est légitime (horaires variables, transports), engagement écrit si besoin.\n3. Un point de suivi à quinze jours. Si rien ne change, je m’appuie sur la hiérarchie et les RH, avec la gradation prévue.\n4. Je protège l’équité : la règle vaut pour tous, et j’informe l’équipe que le sujet est traité, sans exposer l’agent.", "phrase_cle": "J’en parle vite, en tête à tête, pour comprendre avant de sanctionner, puis je fixe une règle claire et je suis son application.", "plan": "D’abord un entretien · Ensuite un cadre · Un point de · Je protège l’équité"}, {"type": "Management", "question": "Deux de vos collaborateurs sont en conflit ouvert. Comment intervenez-vous ?", "piste": "IDÉE MAÎTRESSE\nUn conflit ouvert menace la qualité du service, son ambiance et son image : j’interviens vite, je comprends, je cadre, puis j’organise pour limiter l’impact.\n\nEXPLICATIONS\n1. Entretiens individuels : conflit d’organisation ou conflit de personnes ? Ai-je un rôle, par exemple dans la répartition de la charge ?\n2. Si l’origine est professionnelle : je corrige l’organisation, la répartition des tâches, l’information.\n3. Si elle est personnelle : on n’est pas obligé de s’aimer, mais on est obligé de travailler ensemble. Je fixe un cadre : aucun impact sur la qualité du travail, l’ambiance ni l’image du service.\n4. Leviers : organisation des missions, des espaces, télétravail, à condition que l’intérêt du service soit préservé.\n5. Si cela persiste : médiation, RH ; si je soupçonne un harcèlement, signalement.", "phrase_cle": "Un conflit ouvert menace la qualité du service, son ambiance et son image : j’interviens vite, je comprends, je cadre, puis j’organise pour limiter l’impact.", "plan": "Entretiens individuels · Si l’origine est professionnelle · Si elle est personnelle · Leviers · Si cela persiste"}, {"type": "Management", "question": "Vous devez annoncer à votre équipe une réorganisation qu’elle n’a pas souhaitée. Comment procédez-vous ?", "piste": "IDÉE MAÎTRESSE\nJ’annonce la décision avec clarté et transparence, j’en explique le sens, e
