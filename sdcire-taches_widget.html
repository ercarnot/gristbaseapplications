<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDCIRE — Pilotage des tâches</title>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
  :root{
    --bleu-nuit:#1a2440;
    --bleu-nuit-2:#232f52;
    --bleu-accent:#2d5fd9;
    --amande:#f6f7fa;
    --papier:#ffffff;
    --gris-bord:#dfe3ec;
    --gris-txt:#5a6274;
    --encre:#12162a;
    --ok:#1f8a5c;
    --attente:#c98a1c;
    --urgent:#c53d43;
    --annule:#9a9fae;
    --radius:8px;
    --font-ui: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-disp: Georgia, "Times New Roman", serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-ui);background:var(--amande);color:var(--encre);}
  a{color:inherit;}

  /* ---- shell ---- */
  #shell{display:flex;min-height:100vh;}
  nav#side{
    width:220px;flex:none;background:var(--bleu-nuit);color:#e8ebf5;
    display:flex;flex-direction:column;padding:24px 0;
  }
  nav#side .brand{
    font-family:var(--font-disp);font-size:1.15rem;letter-spacing:.02em;
    padding:0 20px 20px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px;
  }
  nav#side .brand small{display:block;font-family:var(--font-ui);font-size:.68rem;color:#a7b0cc;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
  nav#side button.tab{
    all:unset;cursor:pointer;padding:12px 20px;font-size:.92rem;color:#c7cde3;
    border-left:3px solid transparent;
  }
  nav#side button.tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  nav#side button.tab.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--bleu-accent);font-weight:600;}
  nav#side .spacer{flex:1;}
  nav#side .gear{padding:12px 20px;font-size:.85rem;color:#a7b0cc;cursor:pointer;}
  nav#side .gear:hover{color:#fff;}
  nav#side .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}

  main#view{flex:1;padding:28px 36px;max-width:1180px;}
  h1{font-family:var(--font-disp);font-size:1.5rem;margin:0 0 4px 0;}
  .sub{color:var(--gris-txt);font-size:.88rem;margin-bottom:22px;}

  /* ---- cards / layout ---- */
  .card{background:var(--papier);border:1px solid var(--gris-bord);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
  .kpi{background:var(--papier);border:1px solid var(--gris-bord);border-radius:var(--radius);padding:16px 18px;flex:1;min-width:150px;}
  .kpi .num{font-family:var(--font-disp);font-size:1.9rem;line-height:1;}
  .kpi .lbl{color:var(--gris-txt);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}

  /* ---- forms ---- */
  label{display:block;font-size:.78rem;color:var(--gris-txt);margin-bottom:4px;margin-top:10px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--gris-bord);border-radius:6px;font-family:var(--font-ui);font-size:.9rem;background:#fff;
  }
  textarea{resize:vertical;min-height:60px;}
  button.btn{
    all:unset;cursor:pointer;background:var(--bleu-accent);color:#fff;padding:9px 16px;border-radius:6px;font-size:.86rem;font-weight:600;
  }
  button.btn:hover{background:#264fb8;}
  button.btn.secondary{background:#fff;color:var(--bleu-accent);border:1px solid var(--bleu-accent);}
  button.btn.secondary:hover{background:#eef2fd;}
  button.btn.ghost{background:transparent;color:var(--gris-txt);border:1px solid var(--gris-bord);}
  button.btn.danger{background:#fff;color:var(--urgent);border:1px solid var(--urgent);}
  button.btn.small{padding:5px 10px;font-size:.78rem;}

  /* ---- table ---- */
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  th{text-align:left;color:var(--gris-txt);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--gris-bord);}
  td{padding:9px 10px;border-bottom:1px solid #eef0f5;vertical-align:top;}
  tr.overdue td{background:#fdf1f1;}
  tr:hover td{background:#f7f9fd;}

  .chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600;color:#fff;white-space:nowrap;}
  .chip.st-afaire{background:#8a90a3;}
  .chip.st-encours{background:var(--bleu-accent);}
  .chip.st-attente{background:var(--attente);}
  .chip.st-termine{background:var(--ok);}
  .chip.st-annule{background:var(--annule);}
  .chip.pr-urgente{background:var(--urgent);}
  .chip.pr-haute{background:#d97b2a;}
  .chip.pr-normale{background:#8a90a3;}

  .muted{color:var(--gris-txt);}
  .empty{color:var(--gris-txt);font-style:italic;padding:24px 0;text-align:center;}

  /* ---- modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(15,18,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:50;overflow:auto;}
  .modal{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;padding:24px 26px;}
  .modal h2{font-family:var(--font-disp);font-size:1.2rem;margin:0 0 14px 0;}
  .modal .close{float:right;cursor:pointer;color:var(--gris-txt);font-size:1.1rem;}

  .note{border-left:3px solid var(--gris-bord);padding:6px 0 6px 12px;margin-bottom:8px;font-size:.85rem;}
  .note.marquant{border-left-color:var(--attente);background:#fffaf0;}
  .note .meta{color:var(--gris-txt);font-size:.72rem;margin-bottom:2px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:.82rem;}
  .bar-row .lbl{width:170px;flex:none;color:var(--gris-txt);}
  .bar-track{flex:1;background:#eef0f5;border-radius:4px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--bleu-accent);}
  .bar-row .val{width:36px;text-align:right;flex:none;font-weight:600;}

  #toast{position:fixed;bottom:20px;right:20px;background:var(--bleu-nuit);color:#fff;padding:10px 16px;border-radius:6px;font-size:.85rem;opacity:0;transform:translateY(6px);transition:.25s;z-index:99;}
  #toast.show{opacity:1;transform:translateY(0);}

  @media print{
    nav#side, .no-print{display:none !important;}
    main#view{padding:0;max-width:none;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<div id="shell">
  <nav id="side">
    <div class="brand">SDCIRE<small>Pilotage des tâches</small></div>
    <button class="tab" data-tab="dashboard">Tableau de bord</button>
    <button class="tab" data-tab="taches">Tâches</button>
    <button class="tab" data-tab="projets">Projets</button>
    <button class="tab" data-tab="dossiers">Dossiers</button>
    <button class="tab" data-tab="modeles">Modèles</button>
    <button class="tab" data-tab="export3">Export 3 semaines</button>
    <button class="tab" data-tab="film">Film de l'année</button>
    <button class="tab" data-tab="bilansthem">Bilans thématiques</button>
    <button class="tab" data-tab="rapport">Rapport annuel</button>
    <div class="spacer"></div>
    <div class="gear" id="connStatus">● connexion au widget…</div>
    <div class="gear" id="openConfig">⚙ Provisionner les tables Grist</div>
  </nav>
  <main id="view"></main>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   WIDGET GRIST
========================================================= */
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? "#c53d43" : "var(--bleu-nuit)";
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* =========================================================
   API GRIST — via grist-plugin-api.js (widget natif, aucun réseau externe)
========================================================= */
function colSpec(c){
  const spec = { type: c.fields.type };
  if(c.fields.label) spec.label = c.fields.label;
  if(c.fields.widgetOptions) spec.widgetOptions = c.fields.widgetOptions;
  return spec;
}

const GristAPI = {
  async listTables(){
    if(grist.docApi.listTables){
      const tables = await grist.docApi.listTables();
      return tables.map(t=> typeof t === 'string' ? t : t.tableId);
    }
    const meta = await grist.docApi.fetchTable('_grist_Tables');
    return meta.tableId || [];
  },

  async listColumns(tableId){
    const raw = await grist.docApi.fetchTable(tableId);
    return Object.keys(raw).filter(k=>k!=='id');
  },

  async addColumns(tableId, columns){
    const actions = columns.map(c=>['AddColumn', tableId, c.id, colSpec(c)]);
    await grist.docApi.applyUserActions(actions);
  },

  async updateColumns(tableId, columns){
    const actions = columns.map(c=>['ModifyColumn', tableId, c.id, colSpec(c)]);
    await grist.docApi.applyUserActions(actions);
  },

  async createMissingTables(){
    const schema = {
      Dossiers:[
        {id:"Nom", fields:{label:"Nom", type:"Text"}},
        {id:"Categorie", fields:{label:"Categorie", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Déplacements Préfet","Communication de crise","Relation presse","Production éditoriale","Grands dossiers"]})}},
        {id:"Statut", fields:{label:"Statut", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Actif","Clos"]})}}
      ],
      Modeles:[
        {id:"Nom", fields:{label:"Nom", type:"Text"}},
        {id:"Description", fields:{label:"Description", type:"Text"}},
        {id:"CategorieDefaut", fields:{label:"CategorieDefaut", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Déplacements Préfet","Communication de crise","Relation presse","Production éditoriale","Grands dossiers"]})}}
      ],
      Projets:[
        {id:"Nom", fields:{label:"Nom", type:"Text"}},
        {id:"Modele", fields:{label:"Modele", type:"Ref:Modeles"}},
        {id:"Categorie", fields:{label:"Categorie", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Déplacements Préfet","Communication de crise","Relation presse","Production éditoriale","Grands dossiers"]})}},
        {id:"DateReference", fields:{label:"DateReference", type:"Date"}},
        {id:"Agent", fields:{label:"Agent", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Frank HAILI","GRAC Amélie","ROMA Élodie","PICHARD-MISTRAL Clémentine"]})}},
        {id:"Dossier", fields:{label:"Dossier", type:"Ref:Dossiers"}},
        {id:"Statut", fields:{label:"Statut", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Actif","Clos"]})}},
        {id:"Marquant", fields:{label:"Marquant", type:"Bool"}},
        {id:"Bilan", fields:{label:"Bilan", type:"Text"}}
      ],
      Taches:[
        {id:"Titre", fields:{label:"Titre", type:"Text"}},
        {id:"Dossier", fields:{label:"Dossier", type:"Ref:Dossiers"}},
        {id:"Projet", fields:{label:"Projet", type:"Ref:Projets"}},
        {id:"Agent", fields:{label:"Agent", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Frank HAILI","GRAC Amélie","ROMA Élodie","PICHARD-MISTRAL Clémentine"]})}},
        {id:"Statut", fields:{label:"Statut", type:"Choice",
          widgetOptions: JSON.stringify({choices:["À faire","En cours","En attente","Terminé","Annulé"]})}},
        {id:"Priorite", fields:{label:"Priorite", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Normale","Haute","Urgente"]})}},
        {id:"DateEcheance", fields:{label:"DateEcheance", type:"Date"}},
        {id:"DateCreation", fields:{label:"DateCreation", type:"Date"}},
        {id:"DateCloture", fields:{label:"DateCloture", type:"Date"}},
        {id:"TempsEstime", fields:{label:"TempsEstime", type:"Numeric"}},
        {id:"Tags", fields:{label:"Tags", type:"Text"}}
      ],
      ModeleTaches:[
        {id:"Modele", fields:{label:"Modele", type:"Ref:Modeles"}},
        {id:"Titre", fields:{label:"Titre", type:"Text"}},
        {id:"OffsetJours", fields:{label:"OffsetJours", type:"Int"}},
        {id:"Agent", fields:{label:"Agent", type:"Choice",
          widgetOptions: JSON.stringify({choices:["","Frank HAILI","GRAC Amélie","ROMA Élodie","PICHARD-MISTRAL Clémentine"]})}},
        {id:"Priorite", fields:{label:"Priorite", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Normale","Haute","Urgente"]})}},
        {id:"Ordre", fields:{label:"Ordre", type:"Int"}}
      ],
      JournalNotes:[
        {id:"Tache", fields:{label:"Tache", type:"Ref:Taches"}},
        {id:"Date", fields:{label:"Date", type:"Date"}},
        {id:"Contenu", fields:{label:"Contenu", type:"Text"}},
        {id:"Marquant", fields:{label:"Marquant", type:"Bool"}}
      ],
      Indicateurs:[
        {id:"Label", fields:{label:"Label", type:"Text"}},
        {id:"Cible", fields:{label:"Cible", type:"Choice",
          widgetOptions: JSON.stringify({choices:["Taches","Projets"]})}},
        {id:"MotCle", fields:{label:"MotCle", type:"Text"}},
        {id:"Ordre", fields:{label:"Ordre", type:"Int"}}
      ],
      StatsManuelles:[
        {id:"Annee", fields:{label:"Annee", type:"Text"}},
        {id:"ArticlesPresse", fields:{label:"ArticlesPresse", type:"Numeric"}},
        {id:"FollowersFacebook", fields:{label:"FollowersFacebook", type:"Numeric"}},
        {id:"FollowersLinkedin", fields:{label:"FollowersLinkedin", type:"Numeric"}},
        {id:"FollowersTwitter", fields:{label:"FollowersTwitter", type:"Numeric"}},
        {id:"FollowersInstagram", fields:{label:"FollowersInstagram", type:"Numeric"}}
      ],
      BilansThematiques:[
        {id:"Annee", fields:{label:"Annee", type:"Text"}},
        {id:"Categorie", fields:{label:"Categorie", type:"Text"}},
        {id:"Chapeau", fields:{label:"Chapeau", type:"Text"}},
        {id:"ActionsProjets", fields:{label:"ActionsProjets", type:"RefList:Projets"}},
        {id:"FocusProjet", fields:{label:"FocusProjet", type:"Ref:Projets"}},
        {id:"IndicateursSelectionnes", fields:{label:"IndicateursSelectionnes", type:"RefList:Indicateurs"}},
        {id:"ChiffresLibres", fields:{label:"ChiffresLibres", type:"Text"}}
      ],
      Contacts:[
        {id:"Nom", fields:{label:"Nom", type:"Text"}},
        {id:"FonctionOrganisme", fields:{label:"FonctionOrganisme", type:"Text"}},
        {id:"Email", fields:{label:"Email", type:"Text"}},
        {id:"Telephone", fields:{label:"Telephone", type:"Text"}},
        {id:"Projet", fields:{label:"Projet", type:"Ref:Projets"}}
      ]
    };

    const existingTables = await this.listTables();
    const toCreateIds = [];
    const createActions = [];
    const report = [];

    for(const tableId of Object.keys(schema)){
      if(!existingTables.includes(tableId)){
        toCreateIds.push(tableId);
        createActions.push(['AddTable', tableId, schema[tableId].map(c=>({id:c.id, ...colSpec(c)}))]);
      }
    }
    if(createActions.length){
      await grist.docApi.applyUserActions(createActions);
      report.push(`Tables créées : ${toCreateIds.join(", ")}`);
    }

    // Pour les tables déjà existantes, on complète les colonnes manquantes
    const colActions = [];
    for(const tableId of Object.keys(schema)){
      if(toCreateIds.includes(tableId)) continue;
      const existingCols = await this.listColumns(tableId);
      const missingCols = schema[tableId].filter(c=>!existingCols.includes(c.id));
      if(missingCols.length){
        missingCols.forEach(c=>colActions.push(['AddColumn', tableId, c.id, colSpec(c)]));
        report.push(`${tableId} : colonnes ajoutées (${missingCols.map(c=>c.id).join(", ")})`);
      }
    }
    if(colActions.length) await grist.docApi.applyUserActions(colActions);

    try{
      const catCol = schema.Dossiers.find(c=>c.id==="Categorie");
      await grist.docApi.applyUserActions([['ModifyColumn', 'Dossiers', 'Categorie', {widgetOptions: catCol.fields.widgetOptions}]]);
      report.push("Catégories de dossier mises à jour.");
    }catch(e){ /* non bloquant */ }

    // Amorcer des indicateurs par défaut si la table est vide
    try{
      const existingIndics = await this.getRecords("Indicateurs");
      if(existingIndics.length===0){
        const defaults = [
          {Label:"Communiqués de presse", Cible:"Taches", MotCle:"communiqué", Ordre:1},
          {Label:"Demandes presse", Cible:"Taches", MotCle:"demande presse", Ordre:2},
          {Label:"Déplacements préfet", Cible:"Projets", MotCle:"Déplacements Préfet", Ordre:3},
          {Label:"Discours / EDL", Cible:"Taches", MotCle:"discours", Ordre:4},
          {Label:"Interviews", Cible:"Taches", MotCle:"interview", Ordre:5}
        ];
        for(const d of defaults) await this.addRecord("Indicateurs", d);
        report.push("5 indicateurs par défaut créés (modifiables dans le rapport annuel).");
      }
    }catch(e){ /* non bloquant */ }

    return report.length ? report.join(" | ") : "Toutes les tables existent déjà et sont complètes.";
  },

  async getRecords(table){
    const raw = await grist.docApi.fetchTable(table);
    const ids = raw.id || [];
    const fieldNames = Object.keys(raw).filter(k=>k!=='id');
    return ids.map((id, i)=>{
      const fields = {};
      fieldNames.forEach(fn=>{ fields[fn] = raw[fn][i]; });
      return { id, fields };
    });
  },
  async addRecord(table, fields){
    const res = await grist.docApi.applyUserActions([['AddRecord', table, null, fields]]);
    return res.retValues[0];
  },
  async updateRecord(table, id, fields){
    await grist.docApi.applyUserActions([['UpdateRecord', table, id, fields]]);
  },
  async deleteRecord(table, id){
    await grist.docApi.applyUserActions([['RemoveRecord', table, id]]);
  }
};

/* =========================================================
   HELPERS DATES  (Grist stocke les Date en secondes epoch UTC)
========================================================= */
function toGristDate(isoStr){
  if(!isoStr) return null;
  const d = new Date(isoStr + "T00:00:00Z");
  return Math.floor(d.getTime()/1000);
}
function fromGristDate(sec){
  if(sec === null || sec === undefined) return "";
  const d = new Date(sec*1000);
  return d.toISOString().slice(0,10);
}
function fmtDateHuman(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* =========================================================
   ETAT LOCAL (cache)
========================================================= */
const STATE = { dossiers:[], taches:[], notes:[], modeles:[], modeleTaches:[], projets:[], indicateurs:[], statsManuelles:[], bilansThematiques:[], contacts:[], loaded:false };

async function refreshAll(){
  const [dossiers, taches, notes, modeles, modeleTaches, projets, indicateurs, statsManuelles, bilansThematiques, contacts] = await Promise.all([
    GristAPI.getRecords("Dossiers"),
    GristAPI.getRecords("Taches"),
    GristAPI.getRecords("JournalNotes"),
    GristAPI.getRecords("Modeles"),
    GristAPI.getRecords("ModeleTaches"),
    GristAPI.getRecords("Projets"),
    GristAPI.getRecords("Indicateurs"),
    GristAPI.getRecords("StatsManuelles"),
    GristAPI.getRecords("BilansThematiques"),
    GristAPI.getRecords("Contacts")
  ]);
  STATE.dossiers = dossiers;
  STATE.taches = taches;
  STATE.notes = notes;
  STATE.modeles = modeles;
  STATE.modeleTaches = modeleTaches;
  STATE.projets = projets;
  STATE.indicateurs = indicateurs;
  STATE.statsManuelles = statsManuelles;
  STATE.bilansThematiques = bilansThematiques;
  STATE.contacts = contacts;
  STATE.loaded = true;
}
function contactsForProjet(projetId){
  return STATE.contacts.filter(c=>c.fields.Projet===projetId);
}
function asIdArray(v){
  // Grist RefList peut revenir en tableau simple [1,2,3] ou encodé ["L",1,2,3]
  if(!Array.isArray(v)) return [];
  return v[0]==="L" ? v.slice(1) : v;
}
function dossierNom(id){
  const d = STATE.dossiers.find(x=>x.id===id);
  return d ? d.fields.Nom : "—";
}
function projetNom(id){
  const p = STATE.projets.find(x=>x.id===id);
  return p ? p.fields.Nom : "—";
}
function modeleNom(id){
  const m = STATE.modeles.find(x=>x.id===id);
  return m ? m.fields.Nom : "—";
}
function tachesForProjet(projetId){
  return STATE.taches.filter(t=>t.fields.Projet===projetId);
}
function blueprintForModele(modeleId){
  return STATE.modeleTaches.filter(m=>m.fields.Modele===modeleId)
    .sort((a,b)=>(a.fields.Ordre||0)-(b.fields.Ordre||0) || (a.fields.OffsetJours||0)-(b.fields.OffsetJours||0));
}
function notesForTache(tacheId){
  return STATE.notes.filter(n=>n.fields.Tache===tacheId)
    .sort((a,b)=> (b.fields.Date||0) - (a.fields.Date||0));
}
const STATUTS = ["À faire","En cours","En attente","Terminé","Annulé"];
const STATUT_CLASS = {"À faire":"st-afaire","En cours":"st-encours","En attente":"st-attente","Terminé":"st-termine","Annulé":"st-annule"};
const PRIORITE_CLASS = {"Normale":"pr-normale","Haute":"pr-haute","Urgente":"pr-urgente"};
const PRIORITE_ORDER = {"Urgente":0, "Haute":1, "Normale":2};
const AGENTS = ["Frank HAILI","GRAC Amélie","ROMA Élodie","PICHARD-MISTRAL Clémentine"];
const AGENT_INITIALES = {"Frank HAILI":"FH","GRAC Amélie":"AG","ROMA Élodie":"ER","PICHARD-MISTRAL Clémentine":"CPM"};
const AGENT_EMAILS = {
  "Frank HAILI":"frank.haili@alpes-de-haute-provence.gouv.fr",
  "GRAC Amélie":"amelie.grac@alpes-de-haute-provence.gouv.fr",
  "ROMA Élodie":"elodie.roma@alpes-de-haute-provence.gouv.fr",
  "PICHARD-MISTRAL Clémentine":"clementine.pichard-mistral@alpes-de-haute-provence.gouv.fr"
};
function agentInitiales(agent){ return AGENT_INITIALES[agent] || agent || ""; }
const DOSSIER_CATEGORIES = ["Déplacements Préfet","Communication de crise","Relation presse","Production éditoriale","Grands dossiers"];

/* =========================================================
   NAVIGATION
========================================================= */
let currentTab = "dashboard";
document.querySelectorAll('nav#side .tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; render(); });
});
document.getElementById('openConfig').addEventListener('click', provisionTables);

async function render(){
  document.querySelectorAll('nav#side .tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  const view = document.getElementById('view');

  if(!STATE.loaded){
    view.innerHTML = `<p class="empty">Chargement des données depuis Grist…</p>`;
    try{ await refreshAll(); }catch(e){
      view.innerHTML = `<p class="empty">${e.message}</p><div class="card"><button class="btn" onclick="provisionTables()">⚙ Provisionner les tables Grist</button></div>`;
      return;
    }
  }
  if(currentTab==="dashboard") renderDashboard();
  else if(currentTab==="taches") renderTaches();
  else if(currentTab==="projets") renderProjets();
  else if(currentTab==="dossiers") renderDossiers();
  else if(currentTab==="modeles") renderModeles();
  else if(currentTab==="export3") renderExport3();
  else if(currentTab==="film") renderFilmAnnee();
  else if(currentTab==="bilansthem") renderBilansThematiques();
  else if(currentTab==="rapport") renderRapport();
}

/* =========================================================
   TABLEAU DE BORD
========================================================= */
function renderDashboard(){
  const view = document.getElementById('view');
  const taches = STATE.taches;
  const enCours = taches.filter(t=>t.fields.Statut==="En cours").length;
  const enAttente = taches.filter(t=>t.fields.Statut==="En attente").length;
  const aFaire = taches.filter(t=>t.fields.Statut==="À faire").length;
  const today = todayISO();
  const enRetard = taches.filter(t=>{
    const ech = fromGristDate(t.fields.DateEcheance);
    return ech && ech < today && !["Terminé","Annulé"].includes(t.fields.Statut);
  });
  const PRIORITE_ORDER = {"Urgente":0, "Haute":1, "Normale":2};
  enRetard.sort((a,b)=>{
    const pa = PRIORITE_ORDER[a.fields.Priorite] ?? 2;
    const pb = PRIORITE_ORDER[b.fields.Priorite] ?? 2;
    if(pa !== pb) return pa - pb;
    return (a.fields.DateEcheance||0) - (b.fields.DateEcheance||0);
  });

  // croisement agent x dossier (tâches actives uniquement)
  const actives = taches.filter(t=>!["Terminé","Annulé"].includes(t.fields.Statut));
  const parDossier = {};
  actives.forEach(t=>{
    const nom = dossierNom(t.fields.Dossier) || "Sans dossier";
    parDossier[nom] = (parDossier[nom]||0) + 1;
  });
  const maxDossier = Math.max(1, ...Object.values(parDossier));

  const parAgent = {};
  actives.forEach(t=>{
    const a = t.fields.Agent || "Non affecté";
    parAgent[a] = (parAgent[a]||0) + 1;
  });
  const maxAgent = Math.max(1, ...Object.values(parAgent));

  const projetsActifs = STATE.projets.filter(p=>p.fields.Statut!=="Clos").map(p=>{
    const t = tachesForProjet(p.id);
    const termine = t.filter(x=>x.fields.Statut==="Terminé").length;
    return {p, total:t.length, termine};
  }).sort((a,b)=>(a.p.fields.DateReference||0)-(b.p.fields.DateReference||0));

  view.innerHTML = `
    <h1>Tableau de bord</h1>
    <p class="sub">Vue d'ensemble de l'activité du service</p>

    <div class="row" style="margin-bottom:18px;">
      <div class="kpi"><div class="num">${aFaire}</div><div class="lbl">À faire</div></div>
      <div class="kpi"><div class="num">${enCours}</div><div class="lbl">En cours</div></div>
      <div class="kpi"><div class="num">${enAttente}</div><div class="lbl">En attente</div></div>
      <div class="kpi"><div class="num" style="color:var(--urgent)">${enRetard.length}</div><div class="lbl">En retard</div></div>
    </div>

    ${projetsActifs.length ? `
    <div class="card">
      <strong>Projets en cours</strong>
      <div style="margin-top:10px;">
        ${projetsActifs.map(({p,total,termine})=>`
          <div class="bar-row">
            <div class="lbl">${p.fields.Nom} <span class="muted">(${fmtDateHuman(fromGristDate(p.fields.DateReference))})</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${total?termine/total*100:0}%; background:var(--ok)"></div></div>
            <div class="val">${termine}/${total}</div>
          </div>`).join("")}
      </div>
    </div>` : ''}

    <div class="row">
      <div class="col card">
        <strong>Charge par dossier</strong>
        <div style="margin-top:12px;">
          ${Object.entries(parDossier).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
            <div class="bar-row"><div class="lbl">${k}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${v/maxDossier*100}%"></div></div>
              <div class="val">${v}</div></div>`).join("") || '<p class="empty">Aucune tâche active</p>'}
        </div>
      </div>
      <div class="col card">
        <strong>Charge par agent</strong>
        <div style="margin-top:12px;">
          ${Object.entries(parAgent).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
            <div class="bar-row"><div class="lbl">${k}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${v/maxAgent*100}%; background:var(--bleu-nuit-2)"></div></div>
              <div class="val">${v}</div></div>`).join("") || '<p class="empty">Aucune tâche active</p>'}
        </div>
      </div>
    </div>

    <div class="card">
      <strong>Tâches en retard</strong>
      ${enRetard.length===0 ? '<p class="empty">Aucune tâche en retard.</p>' : `
      <table style="margin-top:10px;">
        <tr><th>Titre</th><th>Dossier</th><th>Agent</th><th>Priorité</th><th>Échéance</th><th>Statut</th></tr>
        ${enRetard.map(t=>`<tr class="overdue">
          <td>${t.fields.Titre||""}</td>
          <td>${dossierNom(t.fields.Dossier)}</td>
          <td>${t.fields.Agent||""}</td>
          <td><span class="chip ${PRIORITE_CLASS[t.fields.Priorite]||''}">${t.fields.Priorite||"Normale"}</span></td>
          <td>${fmtDateHuman(fromGristDate(t.fields.DateEcheance))}</td>
          <td><span class="chip ${STATUT_CLASS[t.fields.Statut]||''}">${t.fields.Statut||""}</span></td>
        </tr>`).join("")}
      </table>`}
    </div>
  `;
}

/* =========================================================
   TACHES (liste + édition + notes)
========================================================= */
let tacheFilters = { agent:"", dossier:"", projet:"", statut:"" };

function renderTaches(){
  const view = document.getElementById('view');
  let list = STATE.taches.slice();
  // masquer par défaut les tâches d'un projet clos (consultables via Film de l'année ou en filtrant explicitement ce projet)
  list = list.filter(t=>{
    if(!t.fields.Projet) return true;
    if(String(t.fields.Projet)===tacheFilters.projet) return true;
    const p = STATE.projets.find(x=>x.id===t.fields.Projet);
    return !(p && p.fields.Statut==="Clos");
  });
  if(tacheFilters.agent) list = list.filter(t=>t.fields.Agent===tacheFilters.agent);
  if(tacheFilters.dossier) list = list.filter(t=>String(t.fields.Dossier)===tacheFilters.dossier);
  if(tacheFilters.projet) list = list.filter(t=>String(t.fields.Projet)===tacheFilters.projet);
  if(tacheFilters.statut) list = list.filter(t=>t.fields.Statut===tacheFilters.statut);
  const PRIORITE_ORDER = {"Urgente":0, "Haute":1, "Normale":2};
  list.sort((a,b)=>{
    const pa = PRIORITE_ORDER[a.fields.Priorite] ?? 2;
    const pb = PRIORITE_ORDER[b.fields.Priorite] ?? 2;
    if(pa !== pb) return pa - pb;
    return (a.fields.DateEcheance||9e12) - (b.fields.DateEcheance||9e12);
  });

  const today = todayISO();

  view.innerHTML = `
    <h1>Tâches</h1>
    <p class="sub">Saisie, affectation et suivi</p>

    <div class="card no-print">
      <div class="row" style="align-items:flex-end;">
        <div class="col">
          <label>Filtrer par agent</label>
          <select id="fAgent"><option value="">Tous</option>${AGENTS.map(a=>`<option ${tacheFilters.agent===a?'selected':''}>${a}</option>`).join("")}</select>
        </div>
        <div class="col">
          <label>Filtrer par dossier</label>
          <select id="fDossier"><option value="">Tous</option>${STATE.dossiers.map(d=>`<option value="${d.id}" ${tacheFilters.dossier===String(d.id)?'selected':''}>${d.fields.Nom}</option>`).join("")}</select>
        </div>
        <div class="col">
          <label>Filtrer par projet</label>
          <select id="fProjet"><option value="">Tous (hors projets clos)</option>${STATE.projets.map(p=>`<option value="${p.id}" ${tacheFilters.projet===String(p.id)?'selected':''}>${p.fields.Nom}${p.fields.Statut==='Clos'?' (clos)':''}</option>`).join("")}</select>
        </div>
        <div class="col">
          <label>Filtrer par statut</label>
          <select id="fStatut"><option value="">Tous</option>${STATUTS.map(s=>`<option ${tacheFilters.statut===s?'selected':''}>${s}</option>`).join("")}</select>
        </div>
        <div class="col" style="flex:none;">
          <button class="btn" onclick="openTacheModal()">+ Nouvelle tâche</button>
        </div>
      </div>
    </div>

    <div class="card">
      ${list.length===0 ? '<p class="empty">Aucune tâche pour ces filtres.</p>' : `
      <table>
        <tr><th>Titre</th><th>Projet</th><th>Dossier</th><th>Agent</th><th>Priorité</th><th>Échéance</th><th>Statut</th><th></th></tr>
        ${list.map(t=>{
          const ech = fromGristDate(t.fields.DateEcheance);
          const late = ech && ech<today && !["Terminé","Annulé"].includes(t.fields.Statut);
          return `<tr class="${late?'overdue':''}">
            <td>${t.fields.Titre||""}</td>
            <td>${t.fields.Projet ? `<span class="muted">${projetNom(t.fields.Projet)}</span>` : "—"}</td>
            <td>${dossierNom(t.fields.Dossier)}</td>
            <td>${t.fields.Agent||""}</td>
            <td><span class="chip ${PRIORITE_CLASS[t.fields.Priorite]||''}">${t.fields.Priorite||"Normale"}</span></td>
            <td>${fmtDateHuman(ech)}</td>
            <td><span class="chip ${STATUT_CLASS[t.fields.Statut]||''}">${t.fields.Statut||""}</span></td>
            <td style="white-space:nowrap;">
              <button class="btn small ghost" onclick="openTacheModal(${t.id})">Ouvrir</button>
              <button class="btn small ghost" style="color:var(--urgent);border-color:var(--urgent);" onclick="deleteTacheQuick(${t.id})">✕</button>
            </td>
          </tr>`;
        }).join("")}
      </table>`}
    </div>
  `;
  document.getElementById('fAgent').onchange = e=>{ tacheFilters.agent=e.target.value; renderTaches(); };
  document.getElementById('fDossier').onchange = e=>{ tacheFilters.dossier=e.target.value; renderTaches(); };
  document.getElementById('fProjet').onchange = e=>{ tacheFilters.projet=e.target.value; renderTaches(); };
  document.getElementById('fStatut').onchange = e=>{ tacheFilters.statut=e.target.value; renderTaches(); };
}

async function deleteTacheQuick(id){
  const t = STATE.taches.find(x=>x.id===id);
  if(!t) return;
  if(!confirm(`Supprimer la tâche « ${t.fields.Titre||""} » ?`)) return;
  try{
    await GristAPI.deleteRecord("Taches", id);
    await refreshAll();
    renderTaches();
    toast("Tâche supprimée.");
  }catch(e){ toast(e.message, true); }
}

      </div>
      <div class="row">
        <div class="col">
          <label>Priorité</label>
          <select id="mPriorite">${["Normale","Haute","Urgente"].map(p=>`<option ${f.Priorite===p?'selected':''}>${p}</option>`).join("")}</select>

        <div class="col">
          <label>Date d'échéance</label>
          <input type="date" id="mEcheance" value="${fromGristDate(f.DateEcheance)}">
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>Temps estimé (h)</label>
          <input type="number" id="mTemps" step="0.5" value="${f.TempsEstime||""}">
        </div>
        <div class="col">
          <label>Tags (séparés par des virgules)</label>
          <input type="text" id="mTags" value="${f.Tags||""}">
        </div>
      </div>

      <div style="margin-top:16px; display:flex; gap:10px;">
        <button class="btn" id="mSave">Enregistrer</button>
        ${t ? '<button class="btn ghost" id="mDelete">Supprimer</button>' : ''}
      </div>

      ${t ? `<hr style="margin:18px 0;border:none;border-top:1px solid var(--gris-bord)"><strong>Journal de notes</strong>
        <div id="mNotes" style="margin-top:10px;"></div>
        <textarea id="mNewNote" placeholder="Ajouter une note…"></textarea>
        <button class="btn secondary small" id="mAddNote" style="margin-top:8px;">Ajouter la note</button>` : ''}
    </div>`;
  document.body.appendChild(bg);

  if(t) renderNotesInModal(t.id);

  document.getElementById('mProjet').onchange = (e)=>{
    const echInput = document.getElementById('mEcheance');
    if(!e.target.value){ return; }
    const p = STATE.projets.find(x=>x.id===Number(e.target.value));
    if(p && p.fields.DateReference && !echInput.value){
      echInput.value = fromGristDate(p.fields.DateReference);
    }
  };

  document.getElementById('mSave').onclick = async ()=>{
    const fields = {
      Titre: document.getElementById('mTitre').value,
      Dossier: document.getElementById('mDossier').value ? Number(document.getElementById('mDossier').value) : null,
      Projet: document.getElementById('mProjet').value ? Number(document.getElementById('mProjet').value) : null,
      Agent: document.getElementById('mAgent').value,

      DateEcheance: toGristDate(document.getElementById('mEcheance').value),
      TempsEstime: document.getElementById('mTemps').value ? Number(document.getElementById('mTemps').value) : null,
      Tags: document.getElementById('mTags').value
    };
    try{

    notes.map(n=>`<div class="note ${n.fields.Marquant?'marquant':''}">
      <div class="meta">${fmtDateHuman(fromGristDate(n.fields.Date))} ${n.fields.Marquant?' · ★ marquant':''}</div>
      ${n.fields.Contenu}
    </div>`).join("");
}

      bg.remove();
      renderModeles();
      toast("Modèle enregistré.");
      if(!m) openBlueprintModal(newId);
    }catch(e){ toast(e.message, true); }
  };
  if(m){
    document.getElementById('moDelete').onclick = async ()=>{
      if(!confirm("Supprimer ce modèle et toutes ses tâches-types ? (Les projets déjà générés ne sont pas affectés)")) return;
      try{
        for(const bp of blueprintForModele(m.id)) await GristAPI.deleteRecord("ModeleTaches", bp.id);
        await GristAPI.deleteRecord("Modeles", m.id);
        await refreshAll();
        bg.remove();
        renderModeles();
        toast("Modèle supprimé.");
      }catch(e){ toast(e.message, true); }
    };
  }
}

async function importProjetsJson(file){
  if(!file) return;
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){ toast("Fichier JSON illisible : " + e.message, true); return; }

  if(!Array.isArray(data)){ toast("Le fichier doit contenir un tableau de projets.", true); return; }

  let nbProjets = 0, nbTaches = 0, erreurs = [];
  for(const item of data){
    try{
      const projetId = await GristAPI.addRecord("Projets", {
        Nom: item.nom || "Projet importé",
        Categorie: item.categorie || DOSSIER_CATEGORIES[0],
        DateReference: toGristDate(item.dateReference || todayISO()),
        Agent: item.agent || AGENTS[0],
        Statut: item.statut || "Actif",
        Marquant: !!item.marquant,
        Bilan: item.bilan || ""
      });
      nbProjets++;
      const taches = Array.isArray(item.taches) ? item.taches : [];
      for(const t of taches){
        await GristAPI.addRecord("Taches", {
          Titre: t.titre || "Tâche importée",
          Projet: projetId,
          Agent: t.agent || item.agent || AGENTS[0],
          Statut: t.statut || "Terminé",
          Priorite: t.priorite || "Normale",
          DateEcheance: toGristDate(t.dateEcheance || item.dateReference || todayISO()),
          DateCreation: toGristDate(t.dateEcheance || item.dateReference || todayISO())
        });
        nbTaches++;
      }
    }catch(e){ erreurs.push(`${item.nom||'?'} : ${e.message}`); }
  }

  await refreshAll();
  renderProjets();
  document.getElementById('importProjetsFile').value = "";
  if(erreurs.length) toast(`${nbProjets} projet(s) et ${nbTaches} tâche(s) importés, ${erreurs.length} erreur(s) — voir console.`, true);
  else toast(`${nbProjets} projet(s) et ${nbTaches} tâche(s) importés avec succès.`);
  if(erreurs.length) console.error("Erreurs d'import :", erreurs);
}

/* =========================================================
   FILM DE L'ANNÉE — rétrospective des projets clos
========================================================= */
const MOIS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

function renderFilmAnnee(){
  const view = document.getElementById('view');
  const clos = STATE.projets.filter(p=>p.fields.Statut==="Clos");

  const parAnnee = {};
  clos.forEach(p=>{
    const d = fromGristDate(p.fields.DateReference);
    const annee = d ? d.slice(0,4) : "Sans date";
    (parAnnee[annee] = parAnnee[annee]||[]).push(p);
  });
  const annees = Object.keys(parAnnee).sort().reverse();

  view.innerHTML = `
    <h1>Film de l'année</h1>
    <p class="sub">Rétrospective des projets clôturés, mois par mois — vos temps forts ⭐ ressortent en priorité.</p>
    ${clos.length===0 ? '<div class="card"><p class="empty">Aucun projet clos pour l\'instant. Passez un projet en statut « Clos » depuis l\'onglet Projets pour qu\'il apparaisse ici.</p></div>' :
      annees.map(annee=>{
        const projetsAnnee = parAnnee[annee];
        const parMois = {};
        projetsAnnee.forEach(p=>{
          const d = fromGristDate(p.fields.DateReference);
          const moisIdx = d ? Number(d.slice(5,7))-1 : -1;
          const cle = moisIdx>=0 ? moisIdx : "?";
          (parMois[cle] = parMois[cle]||[]).push(p);
        });
        const moisTries = Object.keys(parMois).sort((a,b)=>Number(b)-Number(a)); // mois le plus récent en premier

        return `
        <h2 style="font-family:Georgia,serif;margin-top:28px;">${annee}</h2>
        ${moisTries.map(moisIdx=>{
          const projets = parMois[moisIdx].sort((a,b)=>(b.fields.DateReference||0)-(a.fields.DateReference||0));
          const libelleMois = moisIdx==="?" ? "Sans date" : MOIS_FR[Number(moisIdx)];
          return `
          <h3 style="margin-top:16px;color:var(--gris-txt);text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;border-bottom:1px solid var(--gris-bord);padding-bottom:4px;">${libelleMois} — ${projets.length} projet(s)</h3>
          ${projets.map(p=>{
            const taches = tachesForProjet(p.id);
            const termine = taches.filter(t=>t.fields.Statut==="Terminé").length;
            return `<div class="card" style="${p.fields.Marquant?'border-color:var(--attente);background:#fffaf0;':''}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                  <strong>${p.fields.Marquant?'⭐ ':''}${p.fields.Nom}</strong>
                  <div class="muted" style="font-size:.82rem;margin-top:2px;">
                    ${fmtDateHuman(fromGristDate(p.fields.DateReference))} · ${p.fields.Agent||""} · <span class="chip" style="background:var(--bleu-nuit-2)">${p.fields.Categorie||""}</span>
                  </div>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn small secondary" onclick="openEditProjetModal(${p.id})">Modifier</button>
                  <button class="btn small ghost" onclick="exportProjetOdt(${p.id})">📄 ODT</button>
                  <button class="btn small ghost" onclick="tacheFilters={agent:'',dossier:'',projet:'${p.id}',statut:''};currentTab='taches';render();">Voir les tâches</button>
                </div>
              </div>
              ${p.fields.Bilan ? `<p class="muted" style="margin-top:8px;font-size:.85rem;">${p.fields.Bilan}</p>` : ''}
              <div class="bar-row" style="margin-top:10px;">
                <div class="lbl">${termine}/${taches.length} tâches terminées</div>
                <div class="bar-track"><div class="bar-fill" style="width:${taches.length?termine/taches.length*100:0}%; background:var(--ok)"></div></div>
              </div>
            </div>`;
          }).join("")}`;
        }).join("")}`;
      }).join("")}
  `;
}

let bilanThemSelection = { annee: String(new Date().getFullYear()), categorie: DOSSIER_CATEGORIES[0] };
let bilanThemChiffresLibres = [];

function renderBilansThematiques(){
  const view = document.getElementById('view');
  const years = Array.from(new Set(STATE.projets.map(p=>{
    const d = fromGristDate(p.fields.DateReference);
    return d ? d.slice(0,4) : null;
  }).filter(Boolean))).sort().reverse();
  if(years.length && !years.includes(bilanThemSelection.annee)) bilanThemSelection.annee = years[0];
  const yearsOpts = years.length ? years : [bilanThemSelection.annee];

  view.innerHTML = `
    <h1>Bilans thématiques</h1>
    <p class="sub">Un bilan par catégorie et par année — actions sélectionnées, focus, chiffres clés et chapeau, prêts à injecter dans le gabarit RASED Thématique.</p>
    <div class="card no-print">
      <div class="row" style="align-items:flex-end;">
        <div class="col">
          <label>Année</label>
          <select id="btYear">${yearsOpts.map(y=>`<option ${bilanThemSelection.annee===y?'selected':''}>${y}</option>`).join("")}</select>
        </div>
        <div class="col">
          <label>Catégorie</label>
          <select id="btCategorie">${DOSSIER_CATEGORIES.map(c=>`<option ${bilanThemSelection.categorie===c?'selected':''}>${c}</option>`).join("")}</select>
        </div>
      </div>
    </div>

  `;
  document.getElementById('btYear').onchange = e=>{ bilanThemSelection.annee=e.target.value; renderBilanThemForm(); };

  renderBilanThemForm();
}

function renderBilanThemForm(){
  const { annee, categorie } = bilanThemSelection;
  const el = document.getElementById('btForm');
  const rec = STATE.bilansThematiques.find(b=>b.fields.Annee===annee && b.fields.Categorie===categorie);
  const f = rec ? rec.fields : {};

  const actionsSelIds = rec ? asIdArray(f.ActionsProjets) : [];
  const focusId = f.FocusProjet || null;
  const indicSelIds = rec ? asIdArray(f.IndicateursSelectionnes) : [];
  bilanThemChiffresLibres = f.ChiffresLibres ? (()=>{ try{ return JSON.parse(f.ChiffresLibres); }catch(e){ return []; } })() : [];

  const candidats = STATE.projets.filter(p=>{
    if(p.fields.Categorie!==categorie) return false;
    const d = fromGristDate(p.fields.DateReference);
    return d && d.slice(0,4)===annee;
  }).sort((a,b)=>(a.fields.DateReference||0)-(b.fields.DateReference||0));

  el.innerHTML = `
    <div class="card">
      <strong>Bloc Actions</strong>
      <p class="sub" style="margin-top:2px;">Cochez 4 à 6 projets à mettre en avant, puis choisissez lequel est le Focus. Le texte repris par défaut est le Bilan du projet.</p>
      ${candidats.length===0 ? '<p class="empty">Aucun projet dans cette catégorie pour cette année.</p>' :
        candidats.map(p=>{
          const taches = tachesForProjet(p.id);
          const termine = taches.filter(t=>t.fields.Statut==="Terminé").length;
          return `<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef0f5;">
            <input type="checkbox" class="btAction" value="${p.id}" style="width:auto;margin-top:4px;" ${actionsSelIds.includes(p.id)?'checked':''}>
            <input type="radio" name="btFocus" class="btFocus" value="${p.id}" style="width:auto;margin-top:4px;" ${focusId===p.id?'checked':''} title="Marquer comme Focus">
            <div style="flex:1;">
              <strong>${p.fields.Nom}</strong> <span class="muted">— ${fmtDateHuman(fromGristDate(p.fields.DateReference))} · ${termine}/${taches.length} tâches · ${p.fields.Agent||""}</span>

        }).join("")}
    </div>

      <strong>Chiffres — indicateurs existants</strong>
      <p class="sub" style="margin-top:2px;">Cochez ceux à afficher pour ce bilan (valeurs calculées pour ${annee}).</p>
      ${STATE.indicateurs.length===0 ? '<p class="empty">Aucun indicateur configuré (onglet Rapport annuel → Gérer les indicateurs).</p>' :

function renderChiffresLibresRows(){
  const el = document.getElementById('btChiffresLibres');
  if(!el) return;
  el.innerHTML = bilanThemChiffresLibres.length===0 ? '<p class="empty">Aucun chiffre libre ajouté.</p>' :

      </div>`).join("");

function syncChiffresLibresFromDom(){
  document.querySelectorAll('.btChiffreLabel').forEach(inp=>{
    const i = Number(inp.dataset.i);
    if(bilanThemChiffresLibres[i]) bilanThemChiffresLibres[i].label = inp.value;
  });
  document.querySelectorAll('.btChiffreValeur').forEach(inp=>{
    const i = Number(inp.dataset.i);
    if(bilanThemChiffresLibres[i]) bilanThemChiffresLibres[i].valeur = inp.value;
  });
}

function removeChiffreLibre(i){
  syncChiffresLibresFromDom();
  bilanThemChiffresLibres.splice(i,1);
  renderChiffresLibresRows();
}

function downloadBilanThematiqueJson(annee, categorie, sel){
  let idCounter = 1;
  const blocs = [];

  const chiffresIndicateurs = sel.indicIds.map(id=>{
    const ind = STATE.indicateurs.find(x=>x.id===id);
    if(!ind) return null;
    return { val: String(countIndicateur(ind, annee)), txt: ind.fields.Label };
  }).filter(Boolean);
  const chiffresLibresItems = sel.chiffresLibres.map(c=>({ val: String(c.valeur), txt: c.label }));
  const tousLesChiffres = [...chiffresIndicateurs, ...chiffresLibresItems];

  if(tousLesChiffres.length){
    blocs.push({
      id: idCounter++,
      type: "chiffres",
      photo: null,
      pageCible: 1,
      items: tousLesChiffres
    });
  }

  sel.actionsIds.forEach(id=>{
    if(id === sel.focusId) return; // le focus est traité à part, plus bas
    const p = STATE.projets.find(x=>x.id===id);
    if(!p) return;
    blocs.push({
      id: idCounter++,
      type: "action",
      pastille: p.fields.Nom,
      sousTitre: "",
      date: fmtDateHuman(fromGristDate(p.fields.DateReference)) || "",
      texte: p.fields.Bilan || "",
      aussi: "",
      photo: null
    });
  });

  if(sel.focusId){
    const p = STATE.projets.find(x=>x.id===sel.focusId);
    if(p){
      blocs.push({
        id: idCounter++,
        type: "focus",
        photo: null,
        titreG: "",
        texteG: "",
        photoG: null,
        titreD: p.fields.Nom,
        texteD: p.fields.Bilan || "",
        photoD: null
      });
    }
  }

  const data = {
    gabarit: "thematique",
    titre: categorie,
    chapeau: sel.chapeau || "",
    blocs
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = categorie.replace(/[\\/:*?"<>|]/g,'-');
  a.download = `Bilan-${safeName}-${annee}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Fichier JSON généré.");
}

function fmtDateDDMM(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
}

function buildExportSections(){
  const todayISOv = todayISO();
  const limiteISO = new Date(Date.now() + 21*24*3600*1000).toISOString().slice(0,10);

  const activeTasks = STATE.taches.filter(t=>{
    const ech = fromGristDate(t.fields.DateEcheance);
    return ech && ech >= todayISOv && ech <= limiteISO && t.fields.Statut!=="Annulé";
  });

  const actionLabel = t => t.fields.Statut==="Terminé"
    ? `✅ <s>${t.fields.Titre}</s>`
    : (t.fields.Statut==="En attente" ? `⏸ ${t.fields.Titre}` : t.fields.Titre);

  const referentsOf = tasks => [...new Set(tasks.map(t=>agentInitiales(t.fields.Agent)).filter(Boolean))].join(" + ");
  const earliestDate = tasks => tasks.map(t=>fromGristDate(t.fields.DateEcheance)).sort()[0];
  const notesOf = tasks => tasks.flatMap(t=>{
    const notes = notesForTache(t.id);
    return notes.length ? [`${t.fields.Titre} : ${notes[0].fields.Contenu}`] : [];
  });

  const sections = [];
  const rowsByCategory = {}; // catégorie -> [rows]
  DOSSIER_CATEGORIES.forEach(c=>rowsByCategory[c]=[]);

  // --- Projets : classés dans la catégorie de leur Dossier rattaché, sinon "Déplacements Préfet" par défaut
  STATE.projets.filter(p=>p.fields.Statut!=="Clos").forEach(p=>{
    const dref = fromGristDate(p.fields.DateReference);
    const tasksInWindow = activeTasks.filter(t=>t.fields.Projet===p.id);
    const dateInWindow = dref && dref>=todayISOv && dref<=limiteISO;
    if(dateInWindow || tasksInWindow.length){
      // Le projet est déclenché (une tâche tombe dans la fenêtre) : on affiche alors TOUTES ses tâches actives,
      // même celles dont l'échéance dépasse les 3 semaines, pour donner une vue complète du projet.
      const toutesTachesProjet = STATE.taches.filter(t=>t.fields.Projet===p.id && t.fields.Statut!=="Annulé")
        .sort((a,b)=>(a.fields.DateEcheance||0)-(b.fields.DateEcheance||0));
      const cat = p.fields.Categorie || "Déplacements Préfet";
      if(!rowsByCategory[cat]) rowsByCategory[cat] = [];
      rowsByCategory[cat].push({
        date: dref || earliestDate(tasksInWindow),
        nom: p.fields.Nom,
        referent: agentInitiales(p.fields.Agent),
        actions: toutesTachesProjet.map(actionLabel),
        observations: notesOf(toutesTachesProjet)
      });
    }
  });

  // --- Dossiers : leurs tâches SANS projet (les tâches avec projet sont déjà représentées via la ligne du projet)
  STATE.dossiers.forEach(d=>{
    const tasksInWindow = activeTasks.filter(t=>t.fields.Dossier===d.id && !t.fields.Projet);
    if(tasksInWindow.length){
      const cat = d.fields.Categorie || "Grands dossiers";
      if(!rowsByCategory[cat]) rowsByCategory[cat] = [];
      rowsByCategory[cat].push({ date: earliestDate(tasksInWindow), nom: d.fields.Nom, referent: referentsOf(tasksInWindow), actions: tasksInWindow.map(actionLabel), observations: notesOf(tasksInWindow) });
    }
  });

  DOSSIER_CATEGORIES.forEach(cat=>{
    const rows = rowsByCategory[cat] || [];
    rows.sort((a,b)=> (a.date||"9999") < (b.date||"9999") ? -1 : 1);
    if(rows.length) sections.push({titre:cat, rows, observation:true});
  });

  // --- Tâches sans dossier ni projet
  const diversTasks = activeTasks.filter(t=>!t.fields.Dossier && !t.fields.Projet);
  if(diversTasks.length){
    sections.push({
      titre:"Autres tâches",
      rows: diversTasks.map(t=>({ date: fromGristDate(t.fields.DateEcheance), nom: actionLabel(t), referent: agentInitiales(t.fields.Agent), actions: [], observations: notesOf([t]) })),
      observation:true
    });
  }

  return { sections, todayISOv, limiteISO };
}

/* =========================================================
   EXPORT ODT (OpenDocument Text) — généré côté navigateur, sans dépendance
========================================================= */
function crc32(bytes){
  let c, crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){
    c = (crc ^ bytes[i]) & 0xFF;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function buildZipBlob(files, mimeType){
  // files: [{name, data: Uint8Array}] — écrit une archive ZIP "stored" (non compressée), valide pour ODT
  const enc = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(f=>{
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);      // version needed
    dv.setUint16(6, 0, true);       // flags
    dv.setUint16(8, 0, true);       // method: stored
    dv.setUint16(10, 0, true);      // mod time
    dv.setUint16(12, 0x21, true);   // mod date
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);   // compressed size
    dv.setUint32(22, size, true);   // uncompressed size
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);      // extra length
    local.set(nameBytes, 30);
    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x21, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length + data.length;
  });

  const centralStart = offset;
  const centralParts2 = centralParts;
  const centralSize = centralParts2.reduce((s,p)=>s+p.length,0);

  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralStart, true);
  edv.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts2, end], {type: mimeType});
}

function xmlEscape(str){
  return String(str||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function odtParas(text){
  return String(text||"").split(/\r?\n/).map(line=>`<text:p text:style-name="Standard">${xmlEscape(line)}</text:p>`).join("");
}

const ODT_MANIFEST = `<?xml version="1.0" encoding="UTF-8"?>
<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2">
  <manifest:file-entry manifest:full-path="/" manifest:version="1.2" manifest:media-type="application/vnd.oasis.opendocument.text"/>

</manifest:manifest>`;

const ODT_STYLES = `<?xml version="1.0" encoding="UTF-8"?>
<office:document-styles xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
  xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0"

function buildOdtMetaXml(nom){
  return `<?xml version="1.0" encoding="UTF-8"?>
<office:document-meta xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
  xmlns:dc="http://purl.org/dc/elements/1.1/" office:version="1.2">

</office:document-meta>`;

function exportProjetOdt(projetId){
  const p = STATE.projets.find(x=>x.id===projetId);
  if(!p) return;
  const taches = tachesForProjet(projetId).sort((a,b)=>(a.fields.DateEcheance||0)-(b.fields.DateEcheance||0));
  const contacts = contactsForProjet(projetId);
  const enc = new TextEncoder();

  const files = [
    {name:"mimetype", data: enc.encode("application/vnd.oasis.opendocument.text")},
    {name:"META-INF/manifest.xml", data: enc.encode(ODT_MANIFEST)},
    {name:"content.xml", data: enc.encode(buildOdtContentXml(p, taches, contacts))},
    {name:"styles.xml", data: enc.encode(ODT_STYLES)},
    {name:"meta.xml", data: enc.encode(buildOdtMetaXml(p.fields.Nom))}
  ];

  const blob = buildZipBlob(files, "application/vnd.oasis.opendocument.text");
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = (p.fields.Nom||"projet").replace(/[\\/:*?"<>|]/g,'-');
  a.download = `Bilan-${safeName}.odt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Fichier ODT généré.");
}

function b64EncodeUnicode(str){
  return btoa(String.fromCharCode(...new TextEncoder().encode(str)));
}

function downloadExportEml(){
  const { sections, todayISOv, limiteISO } = buildExportSections();
  const html = buildExportEmailHtml(sections, todayISOv, limiteISO);
  const subject = `[Planning tâches SDCIRE] - Semaine du ${fmtDateHuman(todayISOv)}`;
  const subjectB64 = b64EncodeUnicode(subject);

  const to = EXPORT_DEST_TO.map(d=>`${d.nom} <${d.email}>`).join(", ");
  const cc = EXPORT_DEST_CC.map(d=>`${d.nom} <${d.email}>`).join(", ");

  const eml = [
    `To: ${to}`,
    `Cc: ${cc}`,
    `Subject: =?UTF-8?B?${subjectB64}?=`,
    `MIME-Version: 1.0`,
    `Content-Type: text/html; charset=utf-8`,
    `Content-Transfer-Encoding: 8bit`,
    ``,
    html
  ].join("\r\n");

  const blob = new Blob([eml], {type:"message/rfc822"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Planning-3-semaines-${todayISOv}.eml`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Email généré — ouvrez-le avec votre client de messagerie.");
}

function countIndicateur(ind, year){
  const motCle = (ind.fields.MotCle||"").toLowerCase();
  if(!motCle) return 0;
  if(ind.fields.Cible==="Projets"){
    return STATE.projets.filter(p=>{
      const d = fromGristDate(p.fields.DateReference);
      return d && d.slice(0,4)===year && (p.fields.Categorie||"").toLowerCase().includes(motCle);
    }).length;
  }
  return STATE.taches.filter(t=>{
    const d = fromGristDate(t.fields.DateCreation) || fromGristDate(t.fields.DateEcheance);
    return d && d.slice(0,4)===year && (t.fields.Titre||"").toLowerCase().includes(motCle);
  }).length;
}

function evolutionHtml(current, previous){
  if(previous===null || previous===undefined || previous==="") return "";
  const delta = current - previous;
  const pct = previous!==0 ? (delta/previous*100) : null;
  const sign = delta>0 ? "+" : "";
  const color = delta>0 ? "var(--ok)" : (delta<0 ? "var(--urgent)" : "var(--gris-txt)");
  return `<span style="color:${color};font-size:.78rem;margin-left:8px;">${sign}${delta}${pct!==null?` (${sign}${pct.toFixed(1)}%)`:''}</span>`;
}

function buildRapportJson(year){
  const inYear = t=>{
    const c = fromGristDate(t.fields.DateCreation);
    return c && c.slice(0,4)===year;
  };
  const taches = STATE.taches.filter(inYear);
  const termine = taches.filter(t=>t.fields.Statut==="Terminé").length;
  const tempsTotal = taches.reduce((s,t)=>s+(t.fields.TempsEstime||0),0);

  const parDossier = {};
  taches.forEach(t=>{ const n=dossierNom(t.fields.Dossier)||"Sans dossier"; parDossier[n]=(parDossier[n]||0)+1; });
  const parAgent = {};
  taches.forEach(t=>{ const a=t.fields.Agent||"Non affecté"; parAgent[a]=(parAgent[a]||0)+1; });

  const indicateurs = STATE.indicateurs.slice().sort((a,b)=>(a.fields.Ordre||0)-(b.fields.Ordre||0)).map(ind=>({
    label: ind.fields.Label,
    valeur: countIndicateur(ind, year)
  }));

  const rec = STATE.statsManuelles.find(s=>s.fields.Annee===year) || {fields:{}};
  const prevRec = STATE.statsManuelles.find(s=>s.fields.Annee===String(Number(year)-1)) || {fields:{}};
  const withEvol = (key)=>{
    const v = rec.fields[key];
    const pv = prevRec.fields[key];
    const out = { valeur: v ?? null };
    if(v!=null && pv!=null){ out.evolution = v - pv; out.evolutionPct = pv!==0 ? Math.round((v-pv)/pv*1000)/10 : null; }
    return out;
  };
  const statistiquesSociales = {
    articlesPresse: withEvol("ArticlesPresse"),
    followersFacebook: withEvol("FollowersFacebook"),
    followersLinkedin: withEvol("FollowersLinkedin"),
    followersTwitter: withEvol("FollowersTwitter"),
    followersInstagram: withEvol("FollowersInstagram")
  };

  const projetsMarquants = STATE.projets.filter(p=>{
    if(!p.fields.Marquant) return false;
    const d = fromGristDate(p.fields.DateReference);
    return d && d.slice(0,4)===year;
  }).sort((a,b)=>(a.fields.DateReference||0)-(b.fields.DateReference||0)).map(p=>{
    const pt = tachesForProjet(p.id);
    return {
      nom: p.fields.Nom,
      categorie: p.fields.Categorie||"",
      date: fromGristDate(p.fields.DateReference),
      agent: p.fields.Agent||"",
      tachesTerminees: pt.filter(t=>t.fields.Statut==="Terminé").length,
      tachesTotal: pt.length,
      bilan: p.fields.Bilan||""
    };
  });

  const projetsClos = STATE.projets.filter(p=>{
    if(p.fields.Statut!=="Clos") return false;
    const d = fromGristDate(p.fields.DateReference);
    return d && d.slice(0,4)===year;
  }).map(p=>({
    nom: p.fields.Nom, categorie: p.fields.Categorie||"", date: fromGristDate(p.fields.DateReference),
    agent: p.fields.Agent||"", marquant: !!p.fields.Marquant, bilan: p.fields.Bilan||""
  }));

  return {
    annee: year,
    service: "SDCIRE",
    genereLe: new Date().toISOString(),
    kpis: { tachesCreees: taches.length, tachesTerminees: termine, tempsEstimeCumuleHeures: tempsTotal },
    repartitionParDossier: parDossier,
    repartitionParAgent: parAgent,
    indicateurs,
    statistiquesSociales,
    projetsPhares: projetsMarquants,
    projetsClos
  };
}

function downloadRapportJson(year){
  const data = buildRapportJson(year);
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Rapport-annuel-${year}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Fichier JSON généré.");
}

function renderStatsManuellesForm(year){
  const el = document.getElementById('statsManuellesForm');
  if(!el) return;
  const rec = STATE.statsManuelles.find(s=>s.fields.Annee===year);
  const prevRec = STATE.statsManuelles.find(s=>s.fields.Annee===String(Number(year)-1));
  const f = rec ? rec.fields : {};
  const pf = prevRec ? prevRec.fields : {};

  const fields = [
    {id:"ArticlesPresse", label:"Articles de presse sur le préfet"},
    {id:"FollowersFacebook", label:"Followers Facebook"},
    {id:"FollowersLinkedin", label:"Followers LinkedIn"},
    {id:"FollowersTwitter", label:"Followers Twitter / X"},
    {id:"FollowersInstagram", label:"Followers Instagram"}
  ];

  el.innerHTML = `
    <div class="row">
      ${fields.map(fld=>`
        <div class="col">
          <label>${fld.label}</label>
          <input type="number" id="sm_${fld.id}" value="${f[fld.id]??''}">
          ${evolutionHtml(f[fld.id], pf[fld.id])}
        </div>`).join("")}
    </div>
    <button class="btn no-print" id="smSave" style="margin-top:12px;">Enregistrer les chiffres ${year}</button>
  `;

  document.getElementById('smSave').onclick = async ()=>{
    const values = {};
    fields.forEach(fld=>{
      const v = document.getElementById(`sm_${fld.id}`).value;
      values[fld.id] = v===''? null : Number(v);
    });
    try{
      if(rec) await GristAPI.updateRecord("StatsManuelles", rec.id, values);
      else await GristAPI.addRecord("StatsManuelles", {Annee: year, ...values});
      await refreshAll();
      renderStatsManuellesForm(year);
      toast(`Chiffres ${year} enregistrés.`);
    }catch(e){ toast(e.message, true); }
  };
}

/* =========================================================
   PROVISIONNEMENT DES TABLES (widget)
========================================================= */
async function provisionTables(){
  const el = document.getElementById('connStatus');
  el.innerHTML = '<span class="status-dot" style="background:#c98a1c"></span>provisionnement en cours…';
  try{
    const res = await GristAPI.createMissingTables();
    toast("✓ " + res);
    STATE.loaded = false;
    await refreshAll();
    el.innerHTML = '<span class="status-dot" style="background:#1f8a5c"></span>connecté';
    render();
  }catch(e){
    el.innerHTML = '<span class="status-dot" style="background:#c53d43"></span>erreur';
    toast("✕ " + e.message, true);
  }
}

/* =========================================================
   INIT — widget Grist natif (grist-plugin-api.js)
========================================================= */
(async function init(){
  const el = document.getElementById('connStatus');
  try{
    await grist.ready({ requiredAccess: 'full' });
    await refreshAll();
    el.innerHTML = '<span class="status-dot" style="background:#1f8a5c"></span>connecté';
  }catch(e){
    el.innerHTML = '<span class="status-dot" style="background:#c53d43"></span>en attente d\'accès';
  }
  render();
})();
</script>
