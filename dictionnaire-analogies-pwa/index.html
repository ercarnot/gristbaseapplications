<style>

@media(max-width:700px){h1{font-size:25px}.top .tabs{flex-wrap:wrap}.tab{padding:0 13px;font-size:14px}main{padding:16px 14px 12px}.wrap{padding-left:12px;padding-right:12px}nav{max-width:none;flex-basis:100%}.btn{min-height:48px}}

au bout du compte", "Remarque": "Clôt un raisonnement après examen.", "Renvois": "", "Statut": "brouillon", "Source": "dictionnaire des analogies, corpus de presse et de discours, 23 octobre 2026"}], "notions": [{"id": 1, "Theme": "Médias", "Axe": "", "Notion": "Le sujet", "Synonymes": "l'affaire (suppose une polémique) ; le dossier (plus neutre, institutionnel) ; l'événement", "Description": "Ce dont parlent les médias : ce qu'ils traitent et ce qui vit dans l'actualité.", "Introduction": "« Sujet » vient du latin subjectus, « soumis, assujetti », participe de subjicere, « placer dessous » (sub-, « sous », et jacere, « jeter »). « Affaire » vient de la locution à faire (latin ad et facere) : vers 1300, « ce qu'on a à faire, les occupations ordinaires ». « Dossier » vient du bas latin dorsarium, dérivé de dorsum, « dos » : un paquet de papiers est rapproché d'un dos, puis le mot désigne l'étiquette collée au dos d'une liasse.", "Lecture": "Trois angles sur la même chose : le sujet est ce qui est placé sous le regard, l'affaire ce qu'il y a à faire, le dossier ce qui est classé. Le choix du mot dit la place de celui qui parle. Interprétation ; les sources ne datent pas le sens polémique d'« affaire ».", "Sources": "La langue française, article « sujet » ; Online Etymology Dictionary, article « affair » ; La langue française, article « dossier »."}, {"id": 2, "Theme": "Médias", "Axe": "", "Notion": "Les médias", "Synonymes": "la presse (l'ensemble, souvent écrite) ; les titres (chaque publication) ; les rédactions (les équipes, la décision éditoriale) ; les chaînes d'information (l'instantané, le direct) ; le paysage médiatique (l'ensemble du champ)", "Description": "Les acteurs : qui traite, relaie, enquête, prend position.", "Introduction": "« Média » est, à l'origine, le pluriel du latin medium, « milieu ». En anglais, medium prend vers 1600 le sens d'« agence intermédiaire » ; media, au sens « journaux, radio, télévision », est attesté en 1927, peut-être abrégé de mass-media (1923, vocabulaire publicitaire).", "Lecture": "Le mot dit une position, celle de l'entre-deux : les médias se placent entre un fait et son public. Lecture à partir de l'étymologie, qui n'en fait pas un jugement.", "Sources": "Online Etymology Dictionary, article « media »."}, {"id": 3, "Theme": "Médias", "Axe": "", "Notion": "L'enquête", "Synonymes": "l'investigation (la démarche, au long cours) ; la révélation (ce qui est publié) ; le dossier (l'ensemble des pièces réunies)", "Description": "Le travail de recherche du journaliste et ce qu'il produit.", "Introduction": "« Enquête » vient du latin inquisita, participe passé féminin de inquirere, substantivé au Moyen Âge sous les formes inquaesita, inquesta ; l'ancien français enqueste est attesté vers 1170. Inquirere est dérivé de quaerere, avec le préfixe in-.", "Lecture": "Journalistes et magistrats emploient le même mot : la presse et la justice partagent une racine, d'où des verbes communs (ouvrir, mener, boucler une enquête). Interprétation.", "Sources": "La langue française, article « enquête »."}, {"id": 4, "Theme": "Médias", "Axe": "", "Notion": "Le contradictoire", "Synonymes": "l'audition de la partie mise en cause ; la version de l'institution ; ≠ le droit de réponse (après publication)", "Description": "Principe déontologique : entendre la partie mise en cause avant de publier.", "Introduction": "« Contradictoire » vient du bas latin contradictorius ; on trouve des formes voisines en provençal, en espagnol et en italien.", "Lecture": "Le mot garde le préfixe de l'opposition (contra-) : le contradictoire est le moment où l'autre partie peut dire le contraire. Interprétation morphologique ; la distinction avec le droit de réponse relève du droit de la presse, non de l'étymologie.", "Sources": "La langue française, article « contradictoire »."}, {"id": 5, "Theme": "Communication de crise", "Axe": "", "Notion": "La crise", "Synonymes": "l'événement (le fait déclencheur) ; la situation (l'état à un instant donné) ; l'épreuve (vue par la population, soutenu)", "Description": "L'événement lui-même et la façon dont l'autorité y fait face.", "Introduction": "« Crise » vient du latin médiéval crisis (manifestation grave d'une maladie), du grec krisis, « jugement », de krinein, « séparer, juger ». Chez Hippocrate et Galien, c'est le point de bascule d'une maladie, qui annonce la guérison ou la mort ; le sens figuré de « situation décisive » est attesté en anglais dans les années 1620.", "Lecture": "À l'origine, la crise est un moment de tri : ce qui se joue se décide dans un sens ou dans l'autre. Le mot garde l'idée d'un point de bascule, que « situation » ou « événement » n'ont pas. Interprétation.", "Sources": "La langue française, article « crise » ; Online Etymology Dictionary, article « crisis »."}, {"id": 6, "Theme": "Communication de crise", "Axe": "", "Notion": "L'information", "Synonymes": "les éléments (ce qui est connu à un instant donné) ; les faits (ce qui est établi) ; le point de situation (l'information datée et formalisée)", "Description": "Ce que l'autorité sait, confirme, dément et actualise.", "Introduction": "« Informer » vient du latin informare, « donner forme à » (in- et formare, de forma, « forme »), et, au figuré, « former, instruire ». Le sens de « rapporter des faits, des nouvelles » est attesté à la fin du XIVe siècle (en anglais).", "Lecture": "Informer, c'est mettre en forme : une information n'existe qu'une fois organisée. Dans une crise, cela fonde la distinction entre éléments (matière brute) et information (matière mise en forme). Interprétation.", "Sources": "Online Etymology Dictionary, article « inform »."}, {"id": 7, "Theme": "Communication de crise", "Axe": "", "Notion": "La rumeur", "Synonymes": "l'information non vérifiée (neutre) ; la désinformation (intention de nuire) ; l'allégation (accusation non prouvée, soutenu)", "Description": "Ce qui circule sans être établi, et la manière d'y répondre.", "Introduction": "« Rumeur » vient du latin rumor, « bruit, clameur », qui désigne aussi le « propos commun, ce qu'on dit » ; l'ancien français rumor signifie « agitation, bruit qui court ».", "Lecture": "La rumeur est d'abord un bruit, avant d'être une information fausse : le mot décrit la circulation avant le contenu. Interprétation.", "Sources": "La langue française, article « rumeur » ; Online Etymology Dictionary, article « rumor »."}, {"id": 8, "Theme": "Communication de crise", "Axe": "", "Notion": "La population", "Synonymes": "les habitants (à l'échelle d'un lieu) ; les riverains (proches de l'événement) ; les administrés (point de vue institutionnel) ; nos concitoyens (soutenu)", "Description": "Ceux qui vivent la crise : ce qu'ils ressentent et la manière dont on les protège.", "Introduction": "« Population » vient du latin tardif populationem, « un peuple, une multitude », dérivé de populus, « peuple ». En anglais, le mot désigne dès les années 1610 l'ensemble des habitants d'un lieu.", "Lecture": "Population est un nom collectif, à la différence de « habitants » ou « riverains », qui nomment des personnes. Passer de l'un à l'autre, c'est changer d'échelle. Interprétation.", "Sources": "Online Etymology Dictionary, article « population »."}, {"id": 9, "Theme": "Communication de crise", "Axe": "", "Notion": "La coordination", "Synonymes": "le pilotage (la direction d'ensemble) ; la concertation (l'échange avant décision) ; la cohérence d'ensemble", "Description": "L'action conjointe de l'État, des communes et des services.", "Introduction": "« Coordonner » repose sur un verbe du latin médiéval signifiant « mettre en ordre », formé de co- (« ensemble ») et d'une racine signifiant « rang ». L'adjectif désigne d'abord, en anglais (années 1640), ce qui est « du même ordre, du même rang » ; le sens « agir ensemble de façon ordonnée » est attesté en 1863.", "Lecture": "Coordonner, c'est mettre au même rang : la coordination ne suppose pas de hiérarchie, ce qui la distingue du pilotage. Interprétation.", "Sources": "Online Etymology Dictionary, article « coordinate »."}, {"id": 10, "Theme": "Communication de crise", "Axe": "", "Notion": "La sortie de crise", "Synonymes": "le retour à la normale ; la reconstruction (dans la durée) ; l'après-crise", "Description": "Le temps long : analyser, reconstruire, restaurer la confiance.", "Introduction": "Le mot « crise » vient du grec krisis, « jugement », de krinein, « séparer, juger ». Il désigne chez Hippocrate et Galien le point de bascule d'une maladie.", "Lecture": "Sortir de la crise suppose que le moment de bascule soit passé : on ne sort pas d'une crise, on sort de ce qu'elle a décidé. Interprétation à partir de l'étymologie.", "Sources": "La langue française, article « crise » ; Online Etymology Dictionary, article « crisis »."}, {"id": 11, "Theme": "Crise sanitaire", "Axe": "", "Notion": "La maladie", "Synonymes": "l'agent pathogène (ce qui la cause) ; l'épizootie (chez les animaux) ; l'épidémie (chez l'homme)", "Description": "L'événement sanitaire lui-même : son apparition, sa progression, son recul.", "Introduction": "« Épidémie » vient du grec epidêmia, formé de epi (« sur, parmi ») et de dêmos (« peuple, district »). L'adjectif signifie d'abord « commun à tout un peuple » ; il s'applique surtout aux maladies, mais ce n'était pas son sens premier. Le nom, au sens de « maladie qui se propage dans une collectivité », est attesté en anglais en 1757.", "Lecture": "Dans épidémie, le mot qui dit la maladie est absent : seule demeure l'idée de ce qui s'abat sur un peuple. Interprétation.", "Sources": "Online Etymology Dictionary, article « epidemic »."}, {"id": 12, "Theme": "Crise sanitaire", "Axe": "", "Notion": "Le foyer et la zone", "Synonymes": "le cluster (usage médiatique) ; la zone touchée ; le périmètre", "Description": "Le lieu de la contamination et l'espace où l'on agit.", "Introduction": "« Foyer » vient du latin focarius, « de feu », dérivé de focus, substantivé en latin vulgaire sous la forme focarium.", "Lecture": "Pour une maladie comme pour un incendie, le foyer est le point où le mal se concentre avant de se propager : l'image est empruntée au feu. Interprétation ; voir aussi le thème Crise feux de forêt.", "Sources": "La langue française, article « foyer »."}, {"id": 13, "Theme": "Crise sanitaire", "Axe": "", "Notion": "La surveillance", "Synonymes": "la veille sanitaire ; le dépistage (action) ; la détection (résultat)", "Description": "Ce qui permet de repérer, signaler et suivre.", "Introduction": "« Surveillance » est formé de sur- et de veiller, du latin vigilare, de vigil, « éveillé ». L'Online Etymology Dictionary note que le mot semble entré en anglais à l'époque de la Terreur : en mars 1793, la Convention ordonne la création de comités de surveillance dans chaque municipalité.", "Lecture": "Surveiller, c'est veiller au-dessus : la surveillance sanitaire reprend l'idée de veille, sans la charge policière que le mot a eue à la Révolution. Interprétation.", "Sources": "Online Etymology Dictionary, article « surveillance »."}, {"id": 14, "Theme": "Crise sanitaire", "Axe": "", "Notion": "Le risque", "Synonymes": "la menace (plus pressante) ; le danger (intrinsèque) ; l'aléa (probabilité)", "Description": "Ce que l'on évalue, qualifie et communique.", "Introduction": "« Risque » est attesté en français au XVIe siècle, de l'italien risco ; selon La langue française, il remonterait au latin resecum, de resecare, « couper » : « rocher escarpé, écueil », puis le risque couru par les marchandises transportées par mer. L'Online Etymology Dictionary juge l'origine « incertaine » ; un rapprochement avec l'arabe rizq, « don fortuit », est aussi proposé. « Danger » vient du bas latin dominarium, « domination » : « être en danger de quelqu'un » signifiait « être sous sa domination ». « Menace » vient du latin minaciae, lié à minae ; attesté en 881 (manatce) ; minari signifiait à l'origine « être saillant ». « Hasard », voisin d'« aléa » dans l'usage, désigne en vieux français un jeu de dés ; son origine est incertaine (« aléa » lui-même n'a pas été documenté ici).", "Lecture": "Quatre images : l'écueil (risque), la domination (danger), la saillie qui avance vers soi (menace), le dé (hasard). Le risque est ce qu'on peut rencontrer, le danger ce qui peut s'imposer, la menace ce qui vient vers nous. Interprétation ; l'origine de risque est discutée.", "Sources": "La langue française, article « risque » ; Online Etymology Dictionary, article « risk » ; La langue française, article « danger » ; La langue française, article « menace » ; Online Etymology Dictionary, article « hazard »."}, {"id": 15, "Theme": "Crise sanitaire", "Axe": "", "Notion": "Les mesures sanitaires", "Synonymes": "le dispositif ; les restrictions ; les prescriptions", "Description": "Ce que l'autorité décide et la manière dont les mesures évoluent.", "Introduction": "« Mesure » vient du latin mensura, de metiri, « mesurer » ; son sens premier est « modération » (vers 1200 en anglais). « Dispositif » est formé sur le radical de disposition et le suffixe -if, daté de 1615.", "Lecture": "Une mesure se règle sur un étalon ; un dispositif est ce qui est disposé. L'un dit la proportion, l'autre l'agencement. Interprétation.", "Sources": "Online Etymology Dictionary, article « measure » ; La langue française, article « dispositif »."}, {"id": 16, "Theme": "Crise sanitaire", "Axe": "", "Notion": "La filière", "Synonymes": "les professionnels concernés ; les éleveurs (ou les exploitants) ; le secteur", "Description": "Ceux qui subissent les conséquences économiques et ce que l'État fait pour eux.", "Introduction": "« Filière » est formé de fil et du suffixe -ière, qui sert à former des noms d'objets permettant de réaliser une fonction ; La langue française cite une déclaration royale de novembre 1640 : « Filliers de fer, servans à tirer le fil d'archal ».", "Lecture": "À l'origine, la filière est un outil d'artisan pour étirer le fil ; le mot a gardé l'image d'une suite continue d'étapes. Interprétation : le passage de l'outil à la chaîne économique n'est pas documenté dans les sources consultées.", "Sources": "La langue française, article « filière »."}, {"id": 17, "Theme": "Lutte contre le narcotrafic", "Axe": "Phénomène", "Notion": "Le trafic", "Synonymes": "le réseau (structure) ; la filière (du producteur au consommateur) ; l'économie souterraine (vue d'ensemble)", "Description": "Ce que fait le trafic : s'organiser, se ramifier, s'adapter.", "Introduction": "« Trafic » est attesté en français en 1339 au sens de « commerce » ; il viendrait de l'italien traffico, de trafficare, « trafiquer ». « Réseau » vient du latin retiolum, diminutif de rete, « filet », par l'ancien français resel.", "Lecture": "Le vocabulaire du trafic est d'abord celui du commerce, et celui du réseau celui du filet : les mots décrivent un échange et une trame avant de décrire un délit. Interprétation.", "Sources": "La langue française, article « trafic » ; La langue française, article « réseau »."}, {"id": 18, "Theme": "Lutte contre le narcotrafic", "Axe": "Phénomène", "Notion": "Le territoire", "Synonymes": "le quartier ; la zone ; l'espace public", "Description": "Ce que subit un lieu sous emprise, et ce que fait l'État pour le reprendre.", "Introduction": "« Territoire » vient du latin territorium, « terre autour d'une ville, domaine », de terra et d'un suffixe de lieu. Certains y voient terrere, « effrayer », ce qui ferait du territoire « un lieu d'où l'on tient les gens à distance » ; l'origine du suffixe n'étant pas expliquée, l'hypothèse reste incertaine.", "Lecture": "Le territoire est de la terre sous une autorité ; dans la lutte contre le trafic, « tenir un territoire » reprend cette idée de domaine contrôlé. Interprétation.", "Sources": "Online Etymology Dictionary, article « territory »."}, {"id": 19, "Theme": "Lutte contre le narcotrafic", "Axe": "Phénomène", "Notion": "Les flux", "Synonymes": "les circuits (produits et argent) ; les cargaisons (marchandise) ; les fonds (argent)", "Description": "La circulation des produits et de l'argent, et la manière de l'entraver.", "Introduction": "« Flux » vient du latin fluxus, « écoulement », du verbe fluere, « couler ».", "Lecture": "L'image est celle du liquide : on parle de flux pour ce qui circule sans s'arrêter (marchandises, argent). Fluere est aussi la racine d'« influence » (influere, « couler dans »). Interprétation.", "Sources": "La langue française, article « flux »."}, {"id": 20, "Theme": "Lutte contre le narcotrafic", "Axe": "Phénomène", "Notion": "La violence", "Synonymes": "les affrontements ; les règlements de comptes ; l'insécurité", "Description": "La montée des violences liées au trafic et la réponse de l'autorité.", "Introduction": "« Violence » vient du latin violentia, « impétuosité, véhémence », qui se rattache à violentus et à violare, « traiter avec violence ». En anglais, le mot désigne la force physique employée pour nuire dès la fin du XIIIe siècle ; il prend le sens d'« intensité » à la fin du XIVe.", "Lecture": "Le mot a d'abord dit la force de ce qui s'élance, avant de dire la blessure infligée. Interprétation.", "Sources": "Online Etymology Dictionary, article « violence »."}, {"id": 21, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "Les enjeux", "Synonymes": "les priorités ; ce qui est en jeu ; les intérêts à protéger", "Description": "Ce que la politique doit protéger et pourquoi elle est prioritaire.", "Introduction": "« Enjeu » est composé de en et de jeu.", "Lecture": "Parler d'enjeux, c'est se placer dans le vocabulaire du jeu : ce qui se joue dépend de ce qu'on a mis en jeu. Interprétation à partir de la composition du mot.", "Sources": "La langue française, article « enjeu »."}, {"id": 22, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "Le cadre légal", "Synonymes": "la loi ; les textes ; le droit applicable", "Description": "Les pouvoirs que la loi accorde, encadre ou durcit.", "Introduction": "« Cadre » vient du latin quadrum, « carré », passé en italien sous la forme quadro. « Loi » vient du latin lex ; les étymologistes latins la rattachent à ligare, « lier », plutôt qu'à legere ; l'origine reste obscure en raison de difficultés de changements de voyelles.", "Lecture": "Deux images : la loi lie, le cadre borne. Le cadre légal dit à la fois la contrainte et la limite. Interprétation.", "Sources": "La langue française, article « cadre » ; La langue française, article « loi »."}, {"id": 23, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "Les dispositifs", "Synonymes": "les mesures ; les plans ; les outils", "Description": "Ce que l'on crée, déploie et fait durer.", "Introduction": "« Dispositif » est formé sur le radical de disposition et le suffixe -if ; le mot est daté de 1615, et la langue française renvoie au verbe disposer. « Moyen » vient du latin medianus, « médian, du milieu », dérivé de medius, « milieu » ; le nom est formé par substantivation de l'adjectif.", "Lecture": "Un dispositif est ce qui est disposé, c'est-à-dire agencé ; un moyen est ce qui se place au milieu, entre l'intention et le résultat. Interprétation.", "Sources": "La langue française, article « dispositif » ; La langue française, article « moyen »."}, {"id": 24, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "Les moyens", "Synonymes": "les ressources ; les effectifs ; les crédits", "Description": "Ce dont les services sont dotés pour agir.", "Introduction": "« Moyen » vient du latin medianus, « médian, du milieu », dérivé de medius, « milieu » ; le nom est formé par substantivation de l'adjectif.", "Lecture": "Le moyen est ce qui se place au milieu, entre l'intention et le résultat ; c'est la même racine, medius, que « média ». Interprétation.", "Sources": "La langue française, article « moyen »."}, {"id": 25, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "Les acteurs", "Synonymes": "les services ; les partenaires ; les intervenants", "Description": "Qui agit, avec qui, sous quelle coordination.", "Introduction": "« Acteur » vient du latin actor, « celui qui agit, qui conduit », de agere, « pousser devant soi ». En anglais, le mot désigne d'abord un intendant, un protecteur (fin du XIVe siècle), puis un demandeur en justice (XVe) ; le sens de comédien est attesté dans les années 1580.", "Lecture": "Le mot réunit deux idées : celui qui fait, celui qui plaide. Dans « les acteurs de la lutte », on retient la première. Interprétation.", "Sources": "Online Etymology Dictionary, article « actor »."}, {"id": 26, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "L'intervention", "Synonymes": "l'action opérationnelle ; l'opération ; la réponse pénale", "Description": "Ce que font les services sur le terrain : enquêter, interpeller, saisir.", "Introduction": "« Intervenir » vient du latin intervenire, de inter (« entre ») et venire (« venir ») ; en latin, le verbe signifiait aussi « se mettre en travers, s'opposer, empêcher ». En anglais, il est d'abord « intercepter » (années 1580), puis « se produire entre » (vers 1600), enfin « s'interposer, jouer les médiateurs » (années 1640).", "Lecture": "Intervenir, c'est venir entre : l'acteur public se place entre le phénomène et la population. Interprétation.", "Sources": "Online Etymology Dictionary, article « intervene »."}, {"id": 27, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "La prévention", "Synonymes": "l'action en amont ; la sensibilisation ; la dissuasion", "Description": "Agir avant que le trafic n'attire : repérer, sensibiliser, accompagner.", "Introduction": "« Prévention » vient, par le provençal, l'espagnol et l'italien, du latin praeventum, supin de praevenire, « prévenir » ; on la rattache aussi à praeventio. Praevenire est formé de prae (« devant ») et de venire (« venir ») : « venir avant, devancer ». En anglais, le sens « empêcher » n'est enregistré qu'à partir des années 1540, après celui d'« agir par anticipation ».", "Lecture": "Prévenir, c'est d'abord venir avant : le sens d'empêcher dérive de celui de devancer. Lecture à partir de l'étymologie.", "Sources": "La langue française, article « prévention » ; Online Etymology Dictionary, article « prevent »."}, {"id": 28, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "L'évaluation", "Synonymes": "le bilan ; les résultats ; les indicateurs", "Description": "Mesurer ce que produit l'action et l'ajuster.", "Introduction": "« Évaluer » est formé en français sur évaluation, de é- (« hors de ») et valuer, du latin valere, « être fort ; avoir de la valeur, valoir » ; le terme est d'abord mathématique. « Bilan » vient de l'italien bilancio, déverbal de bilanciare, « peser, mettre en équilibre », du latin bilanx, « balance à deux plateaux » (bi-, « deux fois », et lanx, « plateau »).", "Lecture": "Évaluer, c'est tirer la valeur ; faire un bilan, c'est peser. Deux gestes voisins, l'un tourné vers la valeur, l'autre vers l'équilibre. Interprétation.", "Sources": "Online Etymology Dictionary, article « evaluate » ; La langue française, article « bilan »."}, {"id": 29, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "La population", "Synonymes": "les habitants ; les riverains ; les consommateurs", "Description": "Ceux qui vivent le trafic : ce qu'ils subissent et la manière dont on les protège.", "Introduction": "« Population » vient du latin tardif populationem, « un peuple, une multitude », dérivé de populus, « peuple ». En anglais, le mot désigne dès les années 1610 l'ensemble des habitants d'un lieu.", "Lecture": "Dans la lutte contre le trafic, « la population » regroupe des publics très différents (habitants, riverains, consommateurs) ; le mot collectif les rassemble en gommant les différences. Interprétation.", "Sources": "Online Etymology Dictionary, article « population »."}, {"id": 30, "Theme": "Lutte contre le narcotrafic", "Axe": "Action publique", "Notion": "Les secteurs exposés", "Synonymes": "les points de passage (ports, aéroports) ; les secteurs sensibles ; les professions concernées", "Description": "Les domaines d'activité que les réseaux cherchent à utiliser, et la manière de s'en prémunir.", "Introduction": "« Secteur » vient du latin sector, « personne qui tranche », dérivé de secare, « couper ».", "Lecture": "Un secteur est une part découpée ; parler de secteurs exposés, c'est découper l'espace ou l'économie en parts, puis désigner celles qu'atteint le risque. Interprétation.", "Sources": "La langue française, article « secteur »."}, {"id": 31, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "L'ordre des priorités", "Synonymes": "en première intention (la réponse initiale) ; dans un premier temps (la première étape) ; avant toute chose (la priorité absolue)", "Description": "Ce que l'on fait d'abord, ce qui vient ensuite, ce qui reste en dernier recours.", "Introduction": "« Priorité » vient du latin médiéval prioritas, de prior, « le premier, le précédent » ; vers 1400, le mot signifie aussi « préséance » en anglais ; le sens « ce qui exige d'être traité d'abord » date du XXe siècle.", "Lecture": "Le mot a d'abord dit le fait d'être avant, dans le temps, avant de dire ce qui doit passer avant, en importance. Interprétation.", "Sources": "Online Etymology Dictionary, article « priority »."}, {"id": 32, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "Le moment", "Synonymes": "à ce stade (l'état présent) ; à court terme ; à terme ; dans la durée (soutenu)", "Description": "Situer l'action ou l'information dans le temps.", "Introduction": "« Moment » vient du latin momentum, contraction de movimentum, « mouvement ».", "Lecture": "Le moment est d'abord un mouvement : le temps est pensé comme une avancée, d'où les « étapes » et les « stades ». Interprétation.", "Sources": "La langue française, article « moment »."}, {"id": 33, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La prudence", "Synonymes": "à titre conservatoire (juridique) ; par précaution (courant) ; sous réserve de ; sans préjuger de (soutenu)", "Description": "Avancer sans rien affirmer au-delà de ce qui est établi.", "Introduction": "« Prudence » vient, par le provençal et l'italien, du latin prudentia, de prudens, « prudent » ; le mot apparaît au XIIIe siècle avec le sens de « sagesse ». « Conservatoire » (adjectif) vient du latin conservatorius.", "Lecture": "À l'origine, la prudence est une sagesse pratique, pas seulement une façon d'éviter l'erreur. « À titre conservatoire » ajoute l'idée de conserver. Interprétation.", "Sources": "La langue française, article « prudence » ; La langue française, article « conservatoire »."}, {"id": 34, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La justification", "Synonymes": "eu égard à (soutenu) ; au regard de ; compte tenu de (courant) ; à la lumière de", "Description": "Fonder une décision ou un jugement sur un élément précis.", "Introduction": "« Justifier » vient du latin tardif iustificare, « agir justement envers ; rendre juste » (iustus et facere). Vers 1300, le mot signifie en anglais « rendre la justice » ; à la fin du XIVe siècle, « montrer que quelque chose est juste ».", "Lecture": "Justifier, c'est rendre juste : le mot porte l'idée que la raison donnée change la valeur de l'acte. Interprétation.", "Sources": "Online Etymology Dictionary, article « justify »."}, {"id": 35, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La nuance", "Synonymes": "sans pour autant ; certes… mais ; à condition que ; sauf à (soutenu)", "Description": "Concéder, conditionner ou opposer pour affiner un propos.", "Introduction": "« Nuance » est dérivé du verbe nuer avec le suffixe -ance.", "Sources": "La langue française, article « nuance » (le dictionnaire ne donne ici que le verbe de base)."}, {"id": 36, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La conclusion", "Synonymes": "en définitive (soutenu) ; en tout état de cause ; c'est pourquoi ; au total (courant)", "Description": "Refermer un raisonnement et en tirer la suite.", "Introduction": "« Conclure » vient du latin concludere, « enfermer » (com-, « ensemble », et claudere, « fermer »). En anglais, il signifie d'abord « l'emporter dans une discussion en réfutant l'adversaire » (début du XIVe siècle), puis « déduire » et « mettre fin » (fin du XIVe).", "Lecture": "Conclure, c'est enfermer : on ferme le raisonnement. Interprétation.", "Sources": "Online Etymology Dictionary, article « conclude »."}, {"id": 37, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "Les échanges et la boucle", "Synonymes": "en boucle courte (échanges rapides avec retour) ; en circuit court (peu d'intermédiaires) ; au fil de l'eau (en continu)", "Description": "La vitesse et le sens de circulation de l'information entre acteurs.", "Introduction": "« Boucle » vient du latin buccula, « mentonnière du casque », diminutif de bucca, « bouche ».", "Lecture": "Le mot a désigné une pièce d'armure avant de désigner un anneau. L'expression « en boucle courte » reprend l'image du retour sur soi, sans lien d'origine avec le casque. Interprétation.", "Sources": "La langue française, article « boucle »."}, {"id": 38, "Theme": "Articulations et formules de méthode", "Axe": "Transversal", "Notion": "La décision et la validation", "Synonymes": "arbitrer (choisir entre options) ; trancher (mettre fin à l'hésitation) ; entériner (confirmer) ; acter (rendre définitif)", "Description": "Choisir, faire valider et décider vite.", "Introduction": "« Décision » vient du latin decisio, de decidere (de-, « à bas », et caedere, « couper »). « Arbitrer » est dérivé de arbitre et du suffixe -er (1274). « Trancher » est attesté en vieux français (tranchier) vers 1100 ; son origine est incertaine, on le rapproche du latin truncare (« couper »), hypothèse contestée.", "Lecture": "Décider et trancher disent la même image, celle de la coupe : la décision met fin à l'hésitation en retranchant des options. Interprétation.", "Sources": "Online Etymology Dictionary, article « decision » ; La langue française, article « arbitrer » ; La langue française, article « trancher »."}, {"id": 39, "Theme": "Crise feux de forêt", "Axe": "Phénomène", "Notion": "Le feu", "Synonymes": "l'incendie (le sinistre) ; le sinistre (vue administrative) ; le front de flamme (la ligne qui avance)", "Description": "L'événement lui-même : comment il démarre, avance, se fixe et s'éteint.", "Introduction": "« Déclarer », emprunté au latin declarare (« faire voir clairement ; annoncer officiellement »), signifie d'abord « faire connaître d'une façon manifeste ». L'Académie y range, à l'emploi pronominal, « un incendie se déclara en pleine nuit » et, au figuré, « la maladie s'est enfin déclarée ». « Survenir », du latin supervenire (super, « sur », et venire, « venir »), signifie « se produire de manière inattendue, arriver subitement ».", "Lecture": "Deux images distinctes : se déclarer suppose quelque chose qui existait déjà, couvait, et devient manifeste (le feu qui prend, la maladie qui se révèle) ; survenir présente un événement qui vient s'ajouter de l'extérieur, sans préavis (un accident, une arrivée). C'est une lecture à partir des définitions : je n'ai pas trouvé de source linguistique qui l'énonce comme règle d'usage.", "Sources": "Dictionnaire de l'Académie française, 9e éd., article « déclarer » ; La langue française, article « survenir »."}, {"id": 40, "Theme": "Crise feux de forêt", "Axe": "Phénomène", "Notion": "La zone et le terrain", "Synonymes": "le massif (l'espace boisé) ; le secteur (la portion d'intervention) ; l'interface habitat-forêt (là où l'habitat touche la végétation)", "Description": "Où le feu brûle, et ce que le terrain facilite ou complique.", "Introduction": "« Massif » est composé de masse et du suffixe -if (1480), du vieux français masseïz, issu d'une forme hypothétique massaticius.", "Lecture": "Le massif est ce qui forme masse : un bloc de relief ou de forêt. Interprétation.", "Sources": "La langue française, article « massif »."}, {"id": 41, "Theme": "Crise feux de forêt", "Axe": "Phénomène", "Notion": "Le risque et la vigilance", "Synonymes": "le danger (la menace) ; l'aléa (la probabilité) ; la vigilance (l'état d'alerte)", "Description": "L'évaluation du risque et son évolution.", "Introduction": "« Vigilance » vient du latin vigilantia, dérivé de vigilans. « Alerte » vient de l'italien all'erta, « vers la hauteur » (erta, « poste de guet »), du latin erigere, « dresser » ; en anglais, « sur le qui-vive » dès les années 1610. Pour « risque », « danger » et « aléa », voir la notion « Le risque » (Crise sanitaire).", "Lecture": "La vigilance est un état de veille, l'alerte la montée à la tour de guet. Interprétation.", "Sources": "La langue française, article « vigilance » ; Online Etymology Dictionary, article « alert »."}, {"id": 42, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "L'intervention", "Synonymes": "l'engagement des secours ; la lutte (l'action contre le feu) ; la surveillance (la durée)", "Description": "Ce que font les équipes : attaquer, tenir, surveiller.", "Introduction": "« Intervenir » vient du latin intervenire, de inter (« entre ») et venire (« venir ») ; en latin, le verbe signifiait aussi « se mettre en travers, s'opposer, empêcher ». En anglais, il est d'abord « intercepter » (années 1580), puis « se produire entre » (vers 1600), enfin « s'interposer, jouer les médiateurs » (années 1640).", "Lecture": "Intervenir, c'est venir entre : l'acteur public se place entre le phénomène et la population. Interprétation.", "Sources": "Online Etymology Dictionary, article « intervene »."}, {"id": 43, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "La population", "Synonymes": "les habitants ; les riverains ; les personnes évacuées", "Description": "Ce que vit la population et la manière dont on la protège.", "Introduction": "« Population » vient du latin tardif populationem, « un peuple, une multitude », dérivé de populus. « Riverain » et « habitant » nomment des personnes, « population » une collectivité.", "Lecture": "En situation de feu, les mots choisis (habitants, riverains, personnes évacuées) situent la personne par son lieu, « population » la fond dans un ensemble. Interprétation.", "Sources": "Online Etymology Dictionary, article « population »."}, {"id": 44, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "Les dispositifs et les moyens", "Synonymes": "le dispositif (le plan activé) ; les moyens (les équipes et le matériel) ; les renforts", "Description": "Ce que l'autorité décide et ce qu'elle mobilise.", "Introduction": "« Dispositif » est formé sur le radical de disposition et le suffixe -if ; le mot est daté de 1615, et la langue française renvoie au verbe disposer. « Moyen » vient du latin medianus, « médian, du milieu », dérivé de medius, « milieu » ; le nom est formé par substantivation de l'adjectif.", "Lecture": "Un dispositif est ce qui est disposé, c'est-à-dire agencé ; un moyen est ce qui se place au milieu, entre l'intention et le résultat. Interprétation.", "Sources": "La langue française, article « dispositif » ; La langue française, article « moyen »."}, {"id": 45, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "Les dégâts et la reprise", "Synonymes": "les dommages ; le bilan ; la remise en état", "Description": "Le bilan matériel et humain et le temps long de la reconstruction.", "Introduction": "« Dégât » est formé du préfixe dé-, à sens augmentatif, et de l'ancien français gast ; degast, attesté début XIIIe siècle, vient du verbe degaster, « ravager », apparenté ou issu du latin devastare. Pour « bilan », voir la notion « L'évaluation » (Lutte contre le narcotrafic).", "Lecture": "Le dégât est ce qui est ravagé, le bilan ce qui est pesé : un mot dit la perte, l'autre le comptage. Interprétation.", "Sources": "La langue française, article « dégât » ; La langue française, article « bilan »."}, {"id": 46, "Theme": "Crise feux de forêt", "Axe": "Action publique", "Notion": "La prévention", "Synonymes": "l'action en amont ; la culture du risque ; l'obligation de débroussaillement", "Description": "Agir avant la saison : entretenir, réglementer, sensibiliser.", "Introduction": "« Prévention » vient, par le provençal, l'espagnol et l'italien, du latin praeventum, supin de praevenire, « prévenir » ; on la rattache aussi à praeventio. Praevenire est formé de prae (« devant ») et de venire (« venir ») : « venir avant, devancer ». En anglais, le sens « empêcher » n'est enregistré qu'à partir des années 1540, après celui d'« agir par anticipation ».", "Lecture": "Prévenir, c'est d'abord venir avant : le sens d'empêcher dérive de celui de devancer. Lecture à partir de l'étymologie.", "Sources": "La langue française, article « prévention » ; Online Etymology Dictionary, article « prevent »."}, {"id": 47, "Theme": "Probité publique", "Axe": "Phénomène", "Notion": "Les faits", "Synonymes": "l'atteinte à la probité (la famille d'infractions) ; le manquement au devoir de probité (l'idée) ; le délit (la qualification pénale)", "Description": "Ce que la loi sanctionne : corruption, trafic d'influence, prise illégale d'intérêts, concussion, détournement, favoritisme.", "Introduction": "« Atteinte » vient du verbe atteindre, du latin attingere, « arriver à, parvenir à ». Dès l'ancien français (vers 1100), le verbe signifie aussi « attaquer, toucher » ; au XIIe siècle, « blesser » ; vers 1165, « convaincre quelqu'un d'une faute », d'où la formule judiciaire « atteint et convaincu de », en usage jusqu'au début du XIXe siècle. « Probité » vient du latin probitas, dérivé de probus, « honnête ».", "Lecture": "Le même verbe a servi pour le coup porté à un corps et pour la faute reconnue par un juge. Parler d'« atteinte à la probité » (comme d'atteinte à l'intégrité d'une personne) transpose donc à un bien moral l'image du coup qui touche. C'est une lecture fondée sur l'histoire du verbe ; les dictionnaires consultés ne l'énoncent pas pour l'expression elle-même.", "Sources": "CNRTL, article « atteindre » (étymologie) ; La langue française, article « probité »."}, {"id": 48, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "L'imputation", "Synonymes": "la mise en cause (le soupçon) ; l'accusation (plus formelle) ; la culpabilité (établie par un juge)", "Description": "Les degrés de responsabilité, du soupçon à la condamnation.", "Introduction": "« Cause » est emprunté au latin causa, qui avait « les deux sens de cause et de procès ». Mettre en cause appartient au vocabulaire judiciaire : « rendre quelqu'un partie au procès », puis, par extension, « l'impliquer dans une affaire ». Même famille : être en cause, mettre hors de cause (innocenter), remettre en cause, en tout état de cause. « Déclarer » relève aussi du droit : « faire connaître une décision par un acte public » (« il fut déclaré coupable »).", "Lecture": "Le vocabulaire de l'imputation est d'abord celui du procès, non celui de l'agression : l'échelle mis en cause, mis en examen, condamné, relaxé suit les étapes de la procédure. Le langage du coup porté (atteinte) concerne plutôt le fait reproché, d'où le lien avec la notion « Les faits ». Cette lecture est la mienne, elle s'appuie sur les définitions de l'Académie.", "Sources": "Dictionnaire de l'Académie française, 9e éd., articles « cause » et « déclarer »."}, {"id": 49, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "La procédure judiciaire", "Synonymes": "l'enquête (parquet) ; l'information judiciaire (juge d'instruction) ; les poursuites", "Description": "Le chemin de la justice, du signalement au jugement.", "Introduction": "« Enquête » vient du latin inquisita, de inquirere ; l'ancien français enqueste est attesté vers 1170. « Cause » vient du latin causa, qui avait les deux sens de cause et de procès.", "Lecture": "Enquête et cause appartiennent au vocabulaire du procès avant d'appartenir à celui de la recherche ou du lien causal. Interprétation.", "Sources": "La langue française, article « enquête » ; Dictionnaire de l'Académie française, 9e éd., article « cause »."}, {"id": 50, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "La réaction de l'administration", "Synonymes": "la mesure conservatoire ; la procédure disciplinaire ; la coopération avec la justice", "Description": "Ce que fait l'employeur public face à des faits reprochés, et ce qu'il dit.", "Introduction": "« Mesure » vient du latin mensura, de metiri, « mesurer » ; son sens premier est « modération ». « Conservatoire » (adjectif) vient du latin conservatorius.", "Lecture": "Une mesure conservatoire conserve en l'état avant que la décision de fond soit prise : c'est ma lecture, les sources consultées ne traitent que de l'origine des mots.", "Sources": "Online Etymology Dictionary, article « measure » ; La langue française, article « conservatoire »."}, {"id": 51, "Theme": "Probité publique", "Axe": "Action publique", "Notion": "La prévention", "Synonymes": "la déontologie ; le conflit d'intérêts ; le signalement", "Description": "Agir avant : déclarer, se déporter, repérer les risques, recueillir les alertes.", "Introduction": "« Prévention » vient, par le provençal, l'espagnol et l'italien, du latin praeventum, supin de praevenire, « prévenir » ; on la rattache aussi à praeventio. Praevenire est formé de prae (« devant ») et de venire (« venir ») : « venir avant, devancer ». En anglais, le sens « empêcher » n'est enregistré qu'à partir des années 1540, après celui d'« agir par anticipation ».", "Lecture": "Prévenir, c'est d'abord venir avant : le sens d'empêcher dérive de celui de devancer. Lecture à partir de l'étymologie.", "Sources": "La langue française, article « prévention » ; Online Etymology Dictionary, article « prevent »."}, {"id": 52, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "L'effet sur un argument", "Synonymes": "disqualifier (écarter) ; discréditer (la source) ; légitimer (fonder) ; occulter (laisser dans l'ombre)", "Description": "Ce qu'un propos, un acte ou une décision fait à une thèse : la renforcer, l'affaiblir, la rendre acceptable ou la rendre inaudible.", "Introduction": "« Qualifier » vient du latin médiéval qualificare, de qualis (« de quelle sorte ? ») et de facere : « donner une qualité à » ; au XVIe siècle, le verbe prend les sens de « restreindre par une réserve » puis de « rendre apte ».", "Lecture": "Disqualifier, c'est retirer la qualité : le verbe ne discute pas l'argument, il lui ôte sa place dans le débat. Interprétation à partir de qualifier.", "Sources": "Online Etymology Dictionary, article « qualify »."}, {"id": 53, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Désigner et mettre en lumière", "Synonymes": "pointer (désigner) ; relever (signaler) ; mettre en évidence (rendre manifeste) ; imputer à (attribuer)", "Description": "Les verbes par lesquels l'analyste attire l'attention sur un élément, un acteur ou une cause.", "Introduction": "« Imputer » vient du latin imputare (in- et putare, « compter ») : porter en compte.", "Lecture": "Désigner, relever, pointer sont des verbes de l'attention ; imputer est le seul qui porte une idée de compte, c'est-à-dire de responsabilité à régler. Interprétation.", "Sources": "Online Etymology Dictionary, article « impute »."}, {"id": 54, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Le rapport à la règle", "Synonymes": "s'affranchir de (se libérer) ; déroger à (faire exception) ; contourner (éluder) ; se conformer à (observer)", "Description": "Comment un acteur se situe par rapport à une règle ou une consigne, vu par celui qui l'analyse, sans qualifier l'infraction elle-même.", "Introduction": "« Règle » vient du latin regula, « règle, équerre, loi », dérivé de regere, « régir ».", "Lecture": "Une règle est d'abord un outil qui trace droit ; s'en écarter, la contourner, l'enfreindre, c'est quitter la ligne. Interprétation.", "Sources": "La langue française, article « règle »."}, {"id": 55, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Les ressources et leur usage", "Synonymes": "mobiliser (rassembler) ; recourir à (faire appel à) ; s'appuyer sur (prendre pour base) ; instrumentaliser (détourner à ses fins)", "Description": "Ce qu'un acteur met en œuvre pour parvenir à ses fins : moyens, appuis, titres, circonstances.", "Introduction": "« Mobiliser » vient du français mobile, du latin mobilis, de movere, « mouvoir » ; il est attesté au sens militaire en 1833 (en anglais), puis « mettre en circulation » en 1846.", "Lecture": "Mobiliser, c'est rendre mobile : mettre en mouvement des ressources qui étaient au repos. Interprétation.", "Sources": "Online Etymology Dictionary, article « mobilize »."}, {"id": 56, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Minimiser ou travestir", "Synonymes": "banaliser (rendre ordinaire) ; relativiser (replacer) ; euphémiser (adoucir) ; faire croire (tromper)", "Description": "Les manières de réduire la gravité d'un fait ou d'en changer l'apparence.", "Introduction": "« Banal » est formé de ban (1247) et du suffixe -al ; la forme bannel est attestée en 1269.", "Sources": "La langue française, article « banal » (la source ne détaille pas le passage du ban au sens d'« ordinaire »)."}, {"id": 57, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Illustrer et qualifier un exemple", "Synonymes": "éloquent (qui parle seul) ; emblématique (qui représente) ; symptomatique (qui signale un mal) ; révélateur (qui montre)", "Description": "Comment on introduit un cas et ce qu'on dit de sa portée : preuve, symbole, symptôme, modèle.", "Introduction": "« Symptôme » vient, par le latin, du grec symptôma, « ce qui arrive, accident, maladie », de sympiptein, « survenir, coïncider » (syn-, « ensemble », et piptein, « tomber ») ; le sens général de « signe de l'existence d'autre chose » est attesté dès les années 1610 (en anglais).", "Lecture": "Symptomatique garde l'image médicale : l'exemple n'est pas seulement un cas, il signale un mal sous-jacent. Interprétation.", "Sources": "Online Etymology Dictionary, article « symptom »."}, {"id": 58, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Interroger le cadrage", "Synonymes": "se reposer sur (s'appuyer) ; privilégier (préférer) ; cantonner à (limiter) ; élargir à (étendre) ; appréhender (saisir)", "Description": "Le choix d'un angle de lecture, et la critique de ce choix quand il laisse d'autres dimensions de côté.", "Introduction": "« Cadre » vient du latin quadrum, « carré », passé en italien sous la forme quadro.", "Lecture": "Parler de cadrage, c'est reprendre l'image du carré qui borne : ce qui est dedans est vu, ce qui reste dehors ne l'est pas. Interprétation.", "Sources": "La langue française, article « cadre »."}, {"id": 59, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Ouvrir sans s'engager", "Synonymes": "envisager (considérer comme possible) ; explorer (ouvrir) ; examiner (évaluer) ; étudier (travailler)", "Description": "Une échelle d'engagement : chaque verbe dit jusqu'où l'on va avant de décider.", "Lecture": "Échelle d'usage, proposée par le dictionnaire à partir des emplois relevés ; aucune source consultée ne l'énonce : envisager reste au stade de l'hypothèse, explorer ouvre sans promettre, examiner évalue, étudier engage un travail. Explorer vient peut-être du monde de la chasse, examiner de celui de la balance : l'un cherche, l'autre pèse. L'échelle d'engagement (envisager, explorer, examiner, étudier) est une interprétation d'usage : aucune source consultée ne la donne.", "Introduction": "« Explorer » vient du latin explorare, d'un terme de chasseurs selon une hypothèse que l'Online Etymology Dictionary juge « non improbable » ; en anglais, le sens est d'abord « examiner, enquêter » (années 1580). « Examiner » vient du latin examinare, « tester ; considérer, peser », de examen, moyen de peser ou d'éprouver.", "Sources": "Online Etymology Dictionary, article « explore » ; Online Etymology Dictionary, article « examine »."}, {"id": 60, "Theme": "Lire et qualifier une situation", "Axe": "Transversal", "Notion": "Conclure", "Synonymes": "il ressort que (se dégage) ; il en résulte que (conséquence) ; tout porte à croire (indices) ; force est de constater (évidence)", "Description": "Les tournures qui amènent la conclusion d'une analyse, avec leur degré de certitude.", "Introduction": "« Conclure » vient du latin concludere, « enfermer » (com- et claudere, « fermer »). « Analyse » vient du grec analusis, « fait de défaire, de délier », de analuein (ana-, « en haut, en arrière, à travers », et lusis, « dénouement »).", "Lecture": "On analyse en dénouant, on conclut en refermant : les deux gestes encadrent le raisonnement. Interprétation.", "Sources": "Online Etymology Dictionary, article « conclude » ; Online Etymology Dictionary, article « analysis »."}], "tours": [{"id": 1, "Fonction": "Cause", "Courant": "soit parce que… soit parce que…", "Soutenu": "soit que… soit que…", "Regle": "Cause hypothétique : on ignore laquelle est vraie. Subjonctif, et « soit que » répété.", "ExempleCourant": "Le retard s'explique soit parce qu'il manquait des agents, soit parce que l'information est arrivée tard.", "ExempleSoutenu": "Le retard s'explique soit que des agents aient manqué, soit que l'information soit arrivée tard.", "Voisins": "soit que… soit que… ; que ce soit que… ou que…", "Piege": "Ne pas mêler « soit que » et « parce que » dans la même phrase.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 2, "Fonction": "Cause", "Courant": "ce n'est pas parce que… mais parce que…", "Soutenu": "non que… mais…", "Regle": "Écarte une cause pour en poser une autre. « Non que » + subjonctif.", "ExempleCourant": "Ce n'est pas parce que les moyens manquent, mais parce que l'organisation est à revoir.", "ExempleSoutenu": "Non que les moyens fassent défaut : c'est l'organisation qui reste à repenser.", "Voisins": "ce n'est pas que… ; non pas que…", "Piege": "Le verbe après « non que » est au subjonctif.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 3, "Fonction": "Cause", "Courant": "surtout parce que", "Soutenu": "d'autant que", "Regle": "Ajoute une raison qui renforce la précédente. Indicatif.", "ExempleCourant": "Nous devons agir, surtout parce que le risque augmente.", "ExempleSoutenu": "Nous devons agir, d'autant que le risque augmente.", "Voisins": "d'autant plus que ; d'autant mieux que", "Piege": "« D'autant plus… que » accompagne un comparatif : d'autant plus urgent que…", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 4, "Fonction": "Cause", "Courant": "à cause de", "Soutenu": "du fait de · en raison de · par suite de", "Regle": "« À cause de » est négatif ; « du fait de » et « en raison de » sont neutres.", "ExempleCourant": "Les retards sont dus à cause des intempéries.", "ExempleSoutenu": "Les retards résultent des intempéries, en raison de la fermeture de la route.", "Voisins": "par l'effet de ; au motif de", "Piege": "Ne pas écrire « dû à cause de ». « Grâce à » ne s'emploie que pour une cause favorable.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 5, "Fonction": "Cause", "Courant": "parce qu'il n'y a pas de", "Soutenu": "faute de · à défaut de", "Regle": "Cause négative, suivie d'un nom sans article.", "ExempleCourant": "Le projet n'avance pas parce qu'il n'y a pas de crédits.", "ExempleSoutenu": "Faute de crédits, le projet n'avance pas.", "Voisins": "à défaut de ; en l'absence de", "Piege": "Pas d'article derrière « faute de » : faute de moyens, non faute des moyens.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 6, "Fonction": "Cause", "Courant": "comme il sait que… il…", "Soutenu": "sachant que… · se sachant…", "Regle": "Participe présent à valeur causale. Son sujet est celui de la principale.", "ExempleCourant": "Comme elle sait que le risque est élevé, elle renforce la surveillance.", "ExempleSoutenu": "Sachant le risque élevé, elle renforce la surveillance.", "Voisins": "étant donné que ; considérant que", "Piege": "Le sujet du participe doit être celui du verbe principal.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 7, "Fonction": "Négation et réserve", "Courant": "personne ne peut", "Soutenu": "nul ne saurait · on ne saurait", "Regle": "« Saurait » (savoir au conditionnel) a ici le sens de « pourrait ». Pas de « pas ».", "ExempleCourant": "Personne ne peut ignorer la gravité de la situation.", "ExempleSoutenu": "Nul ne saurait ignorer la gravité de la situation.", "Voisins": "nul n'ignore ; chacun sait que", "Piege": "Jamais de « pas » avec « saurait ».", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 8, "Fonction": "Négation et réserve", "Courant": "il est hors de question de", "Soutenu": "il ne saurait être question de", "Regle": "Même tour : « ne saurait » pour « ne peut ».", "ExempleCourant": "Il est hors de question de céder.", "ExempleSoutenu": "Il ne saurait être question de céder.", "Voisins": "il n'est pas envisageable de ; il n'y a pas lieu de", "Piege": "Tournure ferme : l'employer pour un refus net.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 9, "Fonction": "Négation et réserve", "Courant": "on ne peut pas dire que", "Soutenu": "on ne saurait affirmer que", "Regle": "Après une phrase négative, le subjonctif est de rigueur dans la subordonnée.", "ExempleCourant": "On ne peut pas dire que la situation soit réglée.", "ExempleSoutenu": "On ne saurait affirmer que la situation soit réglée.", "Voisins": "on ne saurait prétendre que", "Piege": "Subjonctif obligatoire après la négation : « soit », pas « est ».", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 10, "Fonction": "Négation et réserve", "Courant": "je ne peux pas vous dire si", "Soutenu": "je ne saurais vous dire si", "Regle": "« Ne saurais » à la première personne marque la réserve polie.", "ExempleCourant": "Je ne peux pas vous dire si la décision sera prise.", "ExempleSoutenu": "Je ne saurais vous dire si la décision sera prise.", "Voisins": "je ne suis pas en mesure de dire si", "Piege": "Exprime l'incapacité de répondre, non un refus.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 11, "Fonction": "Négation et réserve", "Courant": "j'insiste beaucoup sur", "Soutenu": "je ne saurais trop insister sur", "Regle": "Litote : on insiste autant que possible.", "ExempleCourant": "J'insiste beaucoup sur la nécessité de signaler.", "ExempleSoutenu": "Je ne saurais trop insister sur la nécessité de signaler.", "Voisins": "je ne saurais trop souligner ; on ne soulignera jamais assez", "Piege": "Contresens fréquent : cela signifie « j'insiste beaucoup », non « pas assez ».", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 12, "Fonction": "Négation et réserve", "Courant": "ne… pas du tout", "Soutenu": "nullement · aucunement · en rien", "Regle": "Adverbes de négation forte.", "ExempleCourant": "Ce n'est pas du tout une critique.", "ExempleSoutenu": "Ce n'est nullement une critique.", "Voisins": "en aucune façon ; point (littéraire)", "Piege": "« Nullement » s'emploie sans « pas ».", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 13, "Fonction": "Négation et réserve", "Courant": "je n'ose pas imaginer", "Soutenu": "je n'ose imaginer", "Regle": "Avec cesser, oser, pouvoir, savoir, le « pas » peut tomber.", "ExempleCourant": "Nous n'osons pas penser aux conséquences.", "ExempleSoutenu": "Nous n'osons penser aux conséquences.", "Voisins": "il ne cesse de ; je ne puis que", "Piege": "Seulement avec ces quatre verbes, dans un style soigné.", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 14, "Fonction": "Concession et opposition", "Courant": "même si… (+ imparfait)", "Soutenu": "quand bien même… (+ conditionnel)", "Regle": "« Quand bien même » est suivi du conditionnel.", "ExempleCourant": "Même si les moyens étaient renforcés, la situation resterait fragile.", "ExempleSoutenu": "Quand bien même les moyens seraient renforcés, la situation demeurerait fragile.", "Voisins": "alors même que ; lors même que", "Piege": "Pas d'indicatif après « quand bien même ».", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 15, "Fonction": "Concession et opposition", "Courant": "même s'il est très compétent", "Soutenu": "si compétent qu'il soit · quelque compétent qu'il soit", "Regle": "Concession : « si / quelque + adjectif + que » + subjonctif.", "ExempleCourant": "Même s'il est très compétent, il ne peut tout faire.", "ExempleSoutenu": "Si compétent qu'il soit, il ne peut tout faire.", "Voisins": "tout compétent qu'il est (indicatif)", "Piege": "Avec « quelque », l'adjectif suit directement : quelque habile que soit…", "Niveau": 2, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 16, "Fonction": "Concession et opposition", "Courant": "peu importe que", "Soutenu": "qu'importe que", "Regle": "Exclamation rhétorique + subjonctif.", "ExempleCourant": "Peu importe que la mesure soit impopulaire.", "ExempleSoutenu": "Qu'importe que la mesure soit impopulaire : elle est nécessaire.", "Voisins": "qu'importe si ; peu nous importe que", "Piege": "Tour oratoire : à réserver à un propos assumé.", "Niveau": 3, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 17, "Fonction": "Concession et opposition", "Courant": "bien que", "Soutenu": "quoique", "Regle": "« Quoique » est la forme soutenue de « bien que ». Subjonctif.", "ExempleCourant": "Bien que le risque soit faible, nous restons vigilants.", "ExempleSoutenu": "Quoique le risque soit faible, nous restons vigilants.", "Voisins": "encore que ; si… que", "Piege": "« Quoique » (un mot) = bien que. « Quoi que » (deux mots) = quelle que soit la chose que : quoi qu'il arrive.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 18, "Fonction": "Concession et opposition", "Courant": "malgré", "Soutenu": "en dépit de · nonobstant", "Regle": "« Nonobstant » appartient au registre administratif et juridique.", "ExempleCourant": "Malgré les difficultés, le dispositif a tenu.", "ExempleSoutenu": "En dépit des difficultés, le dispositif a tenu.", "Voisins": "en dépit de ; contre toute attente", "Piege": "« Nonobstant » : écrit administratif seulement.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 19, "Fonction": "Concession et opposition", "Courant": "pourtant · mais quand même", "Soutenu": "il n'en demeure pas moins que · il n'en reste pas moins que", "Regle": "Indicatif ; oppose une réserve à ce qui vient d'être concédé.", "ExempleCourant": "La situation s'améliore, mais il faut quand même rester vigilants.", "ExempleSoutenu": "La situation s'améliore ; il n'en demeure pas moins que la vigilance s'impose.", "Voisins": "toujours est-il que ; cela étant", "Piege": "Suivi de l'indicatif.", "Niveau": 1, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 20, "Fonction": "Concession et opposition", "Courant": "la mesure n'est pas parfaite, mais au moins…", "Soutenu": "si… du moins…", "Regle": "Concession suivie d'une inversion après « du moins ».", "ExempleCourant": "La mesure n'est pas parfaite, mais elle a au moins le mérite d'exister.", "ExempleSoutenu": "Si la mesure n'est pas parfaite, du moins a-t-elle le mérite d'exister.", "Voisins": "sinon… du moins", "Piege": "L'inversion du sujet pronominal est de règle après « du moins ».", "Niveau": 3, "Statut": "brouillon", "Source": "langue écrite soutenue (grammaire du français), conversation du 10 octobre 2026"}, {"id": 21, "Fonction": "Condition et hypothèse", "Courant": "sauf si · à moins que", "Soutenu": "à moins que… ne + subjonctif", "Regle": "Subjonctif, avec « ne » explétif, sans valeur négative.", "ExempleCourant": "Nous interviendrons, sauf si le risque disparaît.", "ExempleSoutenu": "Nous interviendrons, à moins que le risque ne disparaisse.", "Voisins": "sauf à ; à moins de + infinitif", "Piege": "Le « ne » n'est pas une négation : il ne change pas le sens.", "Niveau": 2, "Statut
