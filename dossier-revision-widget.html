/* ==================================================================
   IMPORT D'UNE FICHE DEPUIS UN JSON (produit par Claude en fin de conversation)
   ================================================================== */
function ouvrirImportJSON(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:600px;">
      <button class="modal-close" id="import-close">✕</button>
      <h2>Importer une fiche (JSON)</h2>
      <p class="hint">Collez ici le JSON produit par Claude à la fin d'une conversation de synthèse. Le contenu sera chargé comme brouillon — vous pourrez encore le relire et l'ajuster avant d'enregistrer dans Grist.</p>
      <textarea id="import-json" rows="10" style="width:100%;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px;border:1px solid var(--paper-line);border-radius:4px;" placeholder='{"titre": "...", "theme": "...", "sections": [...], ...}'></textarea>
      <div class="modal-actions">
        <span class="status" id="import-status"></span>
        <button id="import-go">Charger dans le formulaire</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  document.getElementById('import-close').onclick = () => overlay.remove();

  document.getElementById('import-go').addEventListener('click', () => {
    const status = document.getElementById('import-status');
    let data;
    try{
      data = JSON.parse(document.getElementById('import-json').value);
    }catch(e){
      status.textContent = 'JSON invalide : ' + e.message;
      return;
    }
    if(!data.titre || !String(data.titre).trim()){
      status.textContent = 'Le JSON doit contenir au minimum un champ "titre".';
      return;
    }

    const normaliserListe = (liste, cles) => {
      if(!Array.isArray(liste) || !liste.length) return [avecUid(Object.fromEntries(cles.map(c=>[c,''])))];
      return liste.map(item => avecUid(Object.fromEntries(cles.map(c => [c, String(item[c] || '')]))));
    };

    formFiche = {
      titre: String(data.titre || '').trim(),
      theme: String(data.theme || '').trim(),
      date_maj: new Date().toISOString().slice(0,10),
      resume: String(data.resume || '').trim(),
      nature_texte: String(data.nature_texte || '').trim(),
      corpus: String(data.corpus || '').trim(),
      historique_statut: String(data.historique_statut || '').trim(),
      sections: normaliserListe(data.sections, ['titre','contenu','notes']),
      questions: normaliserListe(data.questions, ['question','reponse','notes']),
      ressources: normaliserListe(data.ressources, ['titre','url','notes']),
      quiz: normaliserListe(data.quiz, ['question','reponse','notes']),
    };
    formEditingRowId = null;
    ficheActiveId = null;
    formGroupesOuverts = new Set(['resume','sections','questions','ressources','quiz']);
    formBlocsOuverts = new Set();
    overlay.remove();
    renderSidebar();
    renderFormNouvelleFiche();
  });
}

function ouvrirReglages(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <h2>Noms des tables</h2>
      <p class="hint">Ce widget est connecté au document Grist qui l'héberge — aucune clé API à saisir. Renseignez ici les noms de tables uniquement s'ils diffèrent des noms par défaut.</p>

      <label>Nom des tables (laisser par défaut si non renommées)</label>
      <input type="text" id="cfg-tf" value="${escHtml(cfg.tFiches || 'Fiches')}" placeholder="Table Fiches" style="margin-bottom:6px;">
      <input type="text" id="cfg-ts" value="${escHtml(cfg.tSections || 'Sections')}" placeholder="Table Sections" style="margin-bottom:6px;">
      <input type="text" id="cfg-tq" value="${escHtml(cfg.tQuestions || 'Questions_jury')}" placeholder="Table Questions_jury" style="margin-bottom:6px;">
      <input type="text" id="cfg-tr" value="${escHtml(cfg.tRessources || 'Ressources')}" placeholder="Table Ressources" style="margin-bottom:6px;">
      <input type="text" id="cfg-tz" value="${escHtml(cfg.tQuiz || 'Quiz')}" placeholder="Table Quiz" style="margin-bottom:6px;">
      <input type="text" id="cfg-tp" value="${escHtml(cfg.tPresse || 'Presse')}" placeholder="Table Presse">

      <div class="modal-actions">
        <span class="status" id="modal-status"></span>
        <button id="modal-save">Enregistrer et recharger</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  document.getElementById('modal-close').onclick = () => overlay.remove();
  document.getElementById('modal-save').onclick = async () => {
    cfg = {
      tFiches: document.getElementById('cfg-tf').value.trim() || 'Fiches',
      tSections: document.getElementById('cfg-ts').value.trim() || 'Sections',
      tQuestions: document.getElementById('cfg-tq').value.trim() || 'Questions_jury',
      tRessources: document.getElementById('cfg-tr').value.trim() || 'Ressources',
      tQuiz: document.getElementById('cfg-tz').value.trim() || 'Quiz',
      tPresse: document.getElementById('cfg-tp').value.trim() || 'Presse',
    };
    saveCfg(cfg);
    document.getElementById('modal-status').textContent = 'Rechargement…';
    await chargerDonnees();
    overlay.remove();
  };
}

document.getElementById('btn-settings').addEventListener('click', ouvrirReglages);
document.getElementById('btn-refresh').addEventListener('click', chargerDonnees);
document.getElementById('btn-new').addEventListener('click', ouvrirNouvelleFiche);
document.getElementById('btn-import').addEventListener('click', ouvrirImportJSON);

btnMobileMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  mobileMenu.classList.toggle('open');
});

});
